<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supercards - Painel GOD MODE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #111827; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        /* Scrollbar customizada para o visualizador de JSON */
        pre::-webkit-scrollbar { width: 8px; height: 8px; }
        pre::-webkit-scrollbar-thumb { background: #6b7280; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center">

    <!-- ========================================== -->
    <!-- TELA DE LOGIN -->
    <!-- ========================================== -->
    <div id="login-screen" class="bg-gray-800 p-8 rounded-2xl w-full max-w-sm border-2 border-purple-500 shadow-[0_0_30px_rgba(168,85,247,0.2)] mt-20">
        <h2 class="text-center font-black text-2xl mb-6 text-purple-400 uppercase tracking-widest">Painel Admin</h2>
        <input id="email-admin" type="email" placeholder="E-mail" class="w-full bg-gray-900 p-3 rounded-lg mb-4 border border-gray-600 focus:border-purple-500 outline-none font-bold">
        <input id="senha-admin" type="password" placeholder="Senha" class="w-full bg-gray-900 p-3 rounded-lg mb-6 border border-gray-600 focus:border-purple-500 outline-none font-bold">
        <button id="btn-login" class="w-full bg-purple-600 hover:bg-purple-500 py-3 rounded-lg font-black transition-all uppercase tracking-widest">Acessar Sistema</button>
    </div>

    <!-- ========================================== -->
    <!-- PAINEL DE CONTROLE (Oculto até logar) -->
    <!-- ========================================== -->
    <div id="admin-panel" class="hidden w-full max-w-5xl bg-gray-800 p-6 rounded-2xl border-2 border-purple-500 shadow-2xl relative flex flex-col gap-8">
        
        <header class="border-b border-gray-700 pb-4 flex justify-between items-center">
            <h1 class="text-purple-400 font-black text-3xl uppercase tracking-widest">Controle Central</h1>
            <button onclick="location.reload()" class="text-gray-400 hover:text-red-500 font-bold uppercase text-sm">Desconectar</button>
        </header>

        <!-- MÓDULO 1: ENVIAR MENSAGEM GLOBAL -->
        <div class="bg-gray-900 p-5 rounded-xl border border-gray-700">
            <h2 class="font-black text-lg mb-4 text-blue-400 flex items-center gap-2">📢 Aviso Global</h2>
            <div class="flex gap-3">
                <input id="input-titulo" type="text" placeholder="Título do Aviso" class="w-1/3 bg-gray-800 p-3 rounded border border-gray-600 focus:border-blue-500 outline-none">
                <input id="input-texto" type="text" placeholder="Texto da mensagem..." class="flex-1 bg-gray-800 p-3 rounded border border-gray-600 focus:border-blue-500 outline-none">
                <button id="btn-enviar-msg" class="bg-blue-600 hover:bg-blue-500 px-6 rounded font-black transition-all uppercase">Disparar</button>
            </div>
        </div>

        <!-- MÓDULO 2: BUSCA E EDIÇÃO DE JOGADOR -->
        <div class="bg-gray-900 p-5 rounded-xl border border-gray-700 flex flex-col gap-6">
            
            <div class="flex flex-col gap-2 border-b border-gray-700 pb-6">
                <h2 class="font-black text-lg text-green-400 flex items-center gap-2">🎯 Localizar Jogador</h2>
                <div class="flex gap-3">
                    <input id="input-busca" type="text" placeholder="Digite o NOME EXATO ou o UID do jogador..." class="flex-1 bg-gray-800 p-4 rounded-lg border border-gray-600 focus:border-green-500 outline-none font-bold text-lg">
                    <button id="btn-buscar" class="bg-green-600 hover:bg-green-500 px-8 rounded-lg font-black transition-all uppercase text-lg shadow-lg">Buscar</button>
                </div>
            </div>

            <!-- ÁREA DO JOGADOR (Só aparece após buscar) -->
            <div id="painel-jogador" class="hidden grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <!-- Coluna Esquerda: Edição Rápida -->
                <div class="flex flex-col gap-6">
                    <div class="bg-gray-800 p-4 rounded-lg border border-purple-500/50">
                        <span class="text-gray-400 text-xs font-bold uppercase">Editando:</span>
                        <h3 id="lbl-nome-jogador" class="text-3xl font-black text-purple-300 uppercase truncate">NOME</h3>
                        <span id="lbl-uid-jogador" class="text-gray-500 text-[10px] font-mono">UID</span>
                    </div>

                    <!-- Edição de Valores Base -->
                    <div class="bg-gray-800 p-4 rounded-lg border border-gray-600 grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-xs font-bold text-gray-400 uppercase">Moedas</label>
                            <div class="flex"><input type="number" id="edit-moedas" class="w-full bg-gray-900 p-2 rounded-l border border-gray-600 text-white font-bold"><button onclick="salvarCampo('moedas')" class="bg-yellow-600 px-3 rounded-r font-bold hover:bg-yellow-500">Salvar</button></div>
                        </div>
                        <div>
                            <label class="text-xs font-bold text-gray-400 uppercase">Fragmentos</label>
                            <div class="flex"><input type="number" id="edit-frag" class="w-full bg-gray-900 p-2 rounded-l border border-gray-600 text-white font-bold"><button onclick="salvarCampo('fragmentos')" class="bg-fuchsia-600 px-3 rounded-r font-bold hover:bg-fuchsia-500">Salvar</button></div>
                        </div>
                        <div>
                            <label class="text-xs font-bold text-gray-400 uppercase">Nível</label>
                            <div class="flex"><input type="number" id="edit-nivel" class="w-full bg-gray-900 p-2 rounded-l border border-gray-600 text-white font-bold"><button onclick="salvarCampo('nivel')" class="bg-blue-600 px-3 rounded-r font-bold hover:bg-blue-500">Salvar</button></div>
                        </div>
                        <div>
                            <label class="text-xs font-bold text-gray-400 uppercase">XP Atual</label>
                            <div class="flex"><input type="number" id="edit-xp" class="w-full bg-gray-900 p-2 rounded-l border border-gray-600 text-white font-bold"><button onclick="salvarCampo('xp')" class="bg-cyan-600 px-3 rounded-r font-bold hover:bg-cyan-500">Salvar</button></div>
                        </div>
                    </div>

                    <!-- Gerenciador de Pacotes -->
                    <div class="bg-gray-800 p-4 rounded-lg border border-gray-600">
                        <h4 class="font-black text-sm text-gray-300 uppercase mb-3">📦 Inventário (Pacotes)</h4>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="text-xs font-bold text-gray-400">P. Básico</label>
                                <div class="flex"><input type="number" id="edit-pac-basico" class="w-full bg-gray-900 p-2 rounded-l border border-gray-600 font-bold"><button onclick="salvarNested('inventario.pacoteBasico', 'edit-pac-basico')" class="bg-gray-600 px-3 rounded-r font-bold hover:bg-gray-500">OK</button></div>
                            </div>
                            <div>
                                <label class="text-xs font-bold text-gray-400">P. Premium</label>
                                <div class="flex"><input type="number" id="edit-pac-premium" class="w-full bg-gray-900 p-2 rounded-l border border-gray-600 font-bold"><button onclick="salvarNested('inventario.pacotePremium', 'edit-pac-premium')" class="bg-yellow-600 px-3 rounded-r font-bold hover:bg-yellow-500">OK</button></div>
                            </div>
                        </div>
                    </div>

                    <!-- Injetor de Cartas / Badges -->
                    <div class="bg-gray-800 p-4 rounded-lg border border-gray-600">
                        <h4 class="font-black text-sm text-gray-300 uppercase mb-3">🃏 Forçar Carta na Coleção</h4>
                        <div class="flex gap-2">
                            <input type="text" id="edit-carta-id" placeholder="ID da Carta (Ex: 001)" class="flex-1 bg-gray-900 p-2 rounded border border-gray-600 font-bold text-center">
                            <button onclick="gerenciarArray('cartas', 'edit-carta-id', 'add')" class="bg-green-600 hover:bg-green-500 px-4 rounded font-bold">Dar Carta</button>
                            <button onclick="gerenciarArray('cartas', 'edit-carta-id', 'remove')" class="bg-red-600 hover:bg-red-500 px-4 rounded font-bold">Tirar Carta</button>
                        </div>
                    </div>
                </div>

                <!-- Coluna Direita: Visão Raio-X do Banco (JSON) -->
                <div class="flex flex-col h-full">
                    <h4 class="font-black text-sm text-gray-300 uppercase mb-2 flex justify-between">
                        <span>💾 Raio-X do Banco de Dados</span>
                        <button onclick="carregarJogador(window.currentUserUid)" class="text-blue-400 hover:underline">Atualizar Visão</button>
                    </h4>
                    <pre id="json-viewer" class="bg-black p-4 rounded-lg border border-gray-700 text-green-400 text-xs font-mono overflow-auto flex-1 max-h-[600px] shadow-inner"></pre>
                </div>

            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- SCRIPTS -->
    <!-- ========================================== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, getDoc, updateDoc, arrayUnion, arrayRemove, query, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = { 
          apiKey: "AIzaSyCU3lFTgfrDMaD9jwR7X7ivYPmGQh4VE1g",
          authDomain: "supercards-tcg.firebaseapp.com",
          projectId: "supercards-tcg",
          storageBucket: "supercards-tcg.firebasestorage.app",
          messagingSenderId: "862316380615",
          appId: "1:862316380615:web:b3f28056ebc967673999e2"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // LOGIN COM TRAVA EXCLUSIVA
        const EMAIL_ADMIN_EXCLUSIVO = "adm@adm.com";

        document.getElementById('btn-login').addEventListener('click', async () => {
            const email = document.getElementById('email-admin').value.trim();
            const senha = document.getElementById('senha-admin').value.trim();
            
            if (!email || !senha) return alert("Preencha tudo!");

            // TRAVA DE SEGURANÇA MÁXIMA: Bloqueia qualquer e-mail diferente
            if (email !== EMAIL_ADMIN_EXCLUSIVO) {
                alert("Acesso Negado! Você não é o Administrador Supremo.");
                return;
            }

            try {
                document.getElementById('btn-login').innerText = "Verificando...";
                
                // O Firebase vai verificar se a senha "adm153045" está correta
                await signInWithEmailAndPassword(auth, email, senha);
                
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
            } catch (e) { 
                alert("Senha incorreta ou acesso negado!"); 
                document.getElementById('btn-login').innerText = "Acessar Sistema";
            }
        });
        // ENVIO DE MENSAGEM GLOBAL
        document.getElementById('btn-enviar-msg').addEventListener('click', async () => {
            const titulo = document.getElementById('input-titulo').value.trim();
            const texto = document.getElementById('input-texto').value.trim();
            if (!titulo || !texto) return alert("Preencha título e texto!");

            const btn = document.getElementById('btn-enviar-msg');
            btn.innerText = "Enviando..."; btn.disabled = true;

            try {
                const users = await getDocs(collection(db, "users"));
                const msg = { id: "admin_"+Date.now(), titulo, texto, lida: false, data: new Date().toISOString() };
                users.forEach(async (u) => { await updateDoc(doc(db, "users", u.id), { notificacoes: arrayUnion(msg) }); });
                alert("Aviso enviado para a caixa de correio de todos os jogadores!");
                document.getElementById('input-titulo').value = ''; document.getElementById('input-texto').value = '';
            } catch(e) { alert("Erro ao enviar mensagem."); }
            btn.innerText = "Disparar"; btn.disabled = false;
        });

        // BUSCA INTELIGENTE (Por Nome ou UID)
        document.getElementById('btn-buscar').addEventListener('click', async () => {
            const buscaStr = document.getElementById('input-busca').value.trim();
            if (!buscaStr) return alert("Digite um Nome ou UID!");

            const btn = document.getElementById('btn-buscar');
            btn.innerText = "...";
            
            try {
                let userDoc = null;
                // Se a string for curta, assumimos que é uma busca por Nome. Se for longa, é UID.
                if (buscaStr.length < 20) {
                    const q = query(collection(db, "users"), where("nome", "==", buscaStr));
                    const querySnapshot = await getDocs(q);
                    if (!querySnapshot.empty) { userDoc = querySnapshot.docs[0]; }
                } else {
                    const snap = await getDoc(doc(db, "users", buscaStr));
                    if (snap.exists()) userDoc = snap;
                }

                if (userDoc) {
                    window.currentUserUid = userDoc.id;
                    await window.carregarJogador(userDoc.id);
                    document.getElementById('painel-jogador').classList.remove('hidden');
                } else {
                    alert("Jogador não encontrado! Verifique se o nome está escrito exatamente igual (maiúsculas e minúsculas).");
                    document.getElementById('painel-jogador').classList.add('hidden');
                }
            } catch (error) { alert("Erro ao buscar no banco."); console.error(error); }
            btn.innerText = "Buscar";
        });

        // CARREGA DADOS DO JOGADOR NA TELA
        window.carregarJogador = async (uid) => {
            const snap = await getDoc(doc(db, "users", uid));
            if(!snap.exists()) return;
            const data = snap.data();

            // Preenche os rótulos principais
            document.getElementById('lbl-nome-jogador').innerText = data.nome || "Sem Nome";
            document.getElementById('lbl-uid-jogador').innerText = "UID: " + uid;

            // Preenche os inputs editáveis
            document.getElementById('edit-moedas').value = data.moedas || 0;
            document.getElementById('edit-frag').value = data.fragmentos || 0;
            document.getElementById('edit-nivel').value = data.nivel || 1;
            document.getElementById('edit-xp').value = data.xp || 0;
            
            // Inventário
            document.getElementById('edit-pac-basico').value = (data.inventario && data.inventario.pacoteBasico) || 0;
            document.getElementById('edit-pac-premium').value = (data.inventario && data.inventario.pacotePremium) || 0;

            // Preenche o JSON viewer (Raio-X)
            document.getElementById('json-viewer').innerText = JSON.stringify(data, null, 4);
        };

        // FUNÇÃO DE SALVAR CAMPO BÁSICO (Moedas, Nivel, etc)
        window.salvarCampo = async (campo) => {
            const inputId = `edit-${campo === 'fragmentos' ? 'frag' : campo}`;
            const valor = Number(document.getElementById(inputId).value);
            try {
                await updateDoc(doc(db, "users", window.currentUserUid), { [campo]: valor });
                window.carregarJogador(window.currentUserUid); // Atualiza Raio-X
            } catch(e) { alert("Erro ao salvar " + campo); }
        };

        // FUNÇÃO DE SALVAR CAMPO ANINHADO (inventario.pacoteBasico)
        window.salvarNested = async (caminhoBD, inputId) => {
            const valor = Number(document.getElementById(inputId).value);
            try {
                await updateDoc(doc(db, "users", window.currentUserUid), { [caminhoBD]: valor });
                window.carregarJogador(window.currentUserUid);
            } catch(e) { alert("Erro ao salvar pacote"); }
        };

        // FUNÇÃO DE ADICIONAR/REMOVER ARRAYS (Cartas, Badges)
        window.gerenciarArray = async (campoArray, inputId, acao) => {
            const valorStr = document.getElementById(inputId).value.trim();
            if(!valorStr) return alert("Digite o ID primeiro!");
            
            try {
                const docRef = doc(db, "users", window.currentUserUid);
                if (acao === 'add') {
                    await updateDoc(docRef, { [campoArray]: arrayUnion(valorStr) });
                    alert(`Item ${valorStr} ADICIONADO ao perfil!`);
                } else {
                    await updateDoc(docRef, { [campoArray]: arrayRemove(valorStr) });
                    alert(`Item ${valorStr} REMOVIDO do perfil!`);
                }
                document.getElementById(inputId).value = '';
                window.carregarJogador(window.currentUserUid);
            } catch(e) { alert("Erro ao modificar a coleção."); }
        };
    </script>
</body>
</html>
