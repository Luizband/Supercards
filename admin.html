<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supercards - Painel GOD MODE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #111827; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        pre::-webkit-scrollbar { width: 8px; height: 8px; }
        pre::-webkit-scrollbar-thumb { background: #6b7280; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen p-2 sm:p-4 flex flex-col items-center">

    <div id="login-screen" class="bg-gray-800 p-8 rounded-2xl w-full max-w-sm border-2 border-purple-500 shadow-[0_0_30px_rgba(168,85,247,0.2)] mt-20">
        <h2 class="text-center font-black text-2xl mb-6 text-purple-400 uppercase tracking-widest">Painel Admin</h2>
        <input id="email-admin" type="email" placeholder="E-mail" class="w-full bg-gray-900 p-3 rounded-lg mb-4 border border-gray-600 focus:border-purple-500 outline-none font-bold">
        <input id="senha-admin" type="password" placeholder="Senha" class="w-full bg-gray-900 p-3 rounded-lg mb-6 border border-gray-600 focus:border-purple-500 outline-none font-bold">
        <button id="btn-login" class="w-full bg-purple-600 hover:bg-purple-500 py-3 rounded-lg font-black transition-all uppercase tracking-widest">Acessar Sistema</button>
    </div>

    <div id="admin-panel" class="hidden w-full max-w-5xl bg-gray-800 p-4 sm:p-6 rounded-2xl border-2 border-purple-500 shadow-2xl relative flex flex-col gap-6 sm:gap-8">
        
        <header class="border-b border-gray-700 pb-4 flex flex-col sm:flex-row justify-between items-center gap-3 text-center sm:text-left">
            <h1 class="text-purple-400 font-black text-2xl sm:text-3xl uppercase tracking-widest">Controle Central</h1>
            <button onclick="location.reload()" class="text-gray-400 hover:text-red-500 font-bold uppercase text-sm">Desconectar</button>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- CAIXA 1: STATUS -->
            <div class="bg-gray-900 p-4 sm:p-5 rounded-xl border-2 border-red-900 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div>
                    <h2 class="font-black text-lg text-red-400 flex items-center gap-2">🚨 Status</h2>
                    <p class="text-xs text-gray-400 mt-1">Ligar manutenção expulsa a todos.</p>
                </div>
                <div class="flex sm:flex-col gap-2 w-full sm:w-auto">
                    <button onclick="alternarManutencao(true)" class="flex-1 bg-red-600 hover:bg-red-500 px-4 py-2 rounded font-black uppercase text-[10px] shadow-lg">Trancar</button>
                    <button onclick="alternarManutencao(false)" class="flex-1 bg-green-600 hover:bg-green-500 px-4 py-2 rounded font-black uppercase text-[10px] shadow-lg">Liberar</button>
                </div>
            </div>

            <!-- CAIXA 2: TORNEIOS -->
            <div class="bg-gray-900 p-4 sm:p-5 rounded-xl border-2 border-yellow-700 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div>
                    <h2 class="font-black text-lg text-yellow-400 flex items-center gap-2">🏆 Torneios</h2>
                    <p class="text-xs text-gray-400 mt-1">Gera a tabela (Bots + Contas).</p>
                </div>
                <div class="flex flex-col gap-2 w-full sm:w-auto">
                    <button onclick="gerarTabelaTorneio('brasileirao_01')" id="btn-gerar-torneio" class="w-full bg-yellow-600 hover:bg-yellow-500 text-black px-4 py-2 rounded font-black uppercase text-[10px] shadow-lg transition-transform active:scale-95">1. Iniciar</button>
                    <button onclick="liberarProximaRodada('brasileirao_01')" id="btn-avancar-rodada" class="w-full bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded font-black uppercase text-[10px] shadow-lg transition-transform active:scale-95">2. Liberar Rodada</button>
                </div>
            </div>
        </div>

        <!-- CAIXA 3: BOTS -->
        <div class="bg-gray-900 p-4 sm:p-5 rounded-xl border-2 border-cyan-700 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <h2 class="font-black text-lg text-cyan-400 flex items-center gap-2">🤖 Central de Bots</h2>
                <p class="text-xs text-gray-400 mt-1">Simula resultados entre IA.</p>
            </div>
            <div class="flex flex-wrap gap-2 w-full sm:w-auto justify-stretch sm:justify-end">
                <button onclick="injetarBots()" class="flex-1 sm:flex-none bg-cyan-600 hover:bg-cyan-500 px-3 py-2 rounded font-black uppercase text-[10px] sm:text-xs shadow-lg">Injetar 6</button>
                <button onclick="simularBots()" class="flex-1 sm:flex-none bg-indigo-600 hover:bg-indigo-500 px-3 py-2 rounded font-black uppercase text-[10px] sm:text-xs shadow-lg">Simular</button>
                <button onclick="resetarTorneio()" class="w-full sm:w-auto bg-red-700 hover:bg-red-600 px-3 py-2 rounded font-black uppercase text-[10px] sm:text-xs shadow-lg mt-1 sm:mt-0">Resetar</button>
            </div>
        </div>

        <!-- CAIXA 4: LOCALIZAR JOGADOR -->
        <div class="bg-gray-900 p-4 sm:p-5 rounded-xl border border-gray-700 flex flex-col gap-6">
            
            <div class="flex flex-col gap-3 border-b border-gray-700 pb-6">
                <h2 class="font-black text-lg text-green-400 flex items-center gap-2">🎯 Localizar Jogador</h2>
                <div class="flex flex-col sm:flex-row gap-3">
                    <input id="input-busca" type="text" placeholder="Nome ou UID..." class="w-full sm:flex-1 bg-gray-800 p-3 sm:p-4 rounded-lg border border-gray-600 focus:border-green-500 outline-none font-bold text-sm sm:text-lg">
                    <button id="btn-buscar" class="w-full sm:w-auto bg-green-600 hover:bg-green-500 py-3 sm:px-8 rounded-lg font-black transition-all uppercase text-sm sm:text-lg shadow-lg">Buscar</button>
                </div>
            </div>

            <!-- PAINEL DO JOGADOR ABERTO -->
            <div id="painel-jogador" class="hidden grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="flex flex-col gap-4">
                    
                    <div class="bg-gray-800 p-4 rounded-lg border border-purple-500/50">
                        <span class="text-gray-400 text-xs font-bold uppercase">Editando:</span>
                        <h3 id="lbl-nome-jogador" class="text-2xl sm:text-3xl font-black text-purple-300 uppercase truncate">NOME</h3>
                        <span id="lbl-uid-jogador" class="text-gray-500 text-[10px] font-mono break-all">UID</span>
                    </div>

                    <!-- CAIXA DE EDIÇÃO DE DADOS -->
                    <div class="bg-gray-800 p-4 rounded-lg border border-gray-600 grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="text-[10px] font-bold text-gray-400 uppercase">Moedas</label>
                            <div class="flex"><input type="number" id="edit-moedas" class="w-full bg-gray-900 p-2 rounded-l border border-gray-600 text-white font-bold text-sm"><button onclick="salvarCampo('moedas')" class="bg-yellow-600 px-3 rounded-r font-bold hover:bg-yellow-500 text-xs">Salvar</button></div>
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-gray-400 uppercase">Fragmentos</label>
                            <div class="flex"><input type="number" id="edit-frag" class="w-full bg-gray-900 p-2 rounded-l border border-gray-600 text-white font-bold text-sm"><button onclick="salvarCampo('fragmentos')" class="bg-fuchsia-600 px-3 rounded-r font-bold hover:bg-fuchsia-500 text-xs">Salvar</button></div>
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-gray-400 uppercase">Nível</label>
                            <div class="flex"><input type="number" id="edit-nivel" class="w-full bg-gray-900 p-2 rounded-l border border-gray-600 text-white font-bold text-sm"><button onclick="salvarCampo('nivel')" class="bg-blue-600 px-3 rounded-r font-bold hover:bg-blue-500 text-xs">Salvar</button></div>
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-gray-400 uppercase">XP Atual</label>
                            <div class="flex"><input type="number" id="edit-xp" class="w-full bg-gray-900 p-2 rounded-l border border-gray-600 text-white font-bold text-sm"><button onclick="salvarCampo('xp')" class="bg-cyan-600 px-3 rounded-r font-bold hover:bg-cyan-500 text-xs">Salvar</button></div>
                        </div>
                    </div>

                    <!-- NOVO: INJETAR PACOTES -->
                    <div class="bg-gray-800 p-4 rounded-lg border border-[#bc7bd4]/50 shadow-inner">
                        <h4 class="text-xs font-bold text-gray-400 uppercase mb-3 flex items-center gap-2">🎁 Injetar Pacotes na Conta</h4>
                        <div class="grid grid-cols-2 gap-3">
                            <button onclick="injetarPacote('basico')" class="bg-gray-700 hover:bg-gray-600 text-white font-black py-3 rounded-lg shadow border border-gray-500 text-[10px] sm:text-xs uppercase transition-transform active:scale-95">
                                +1 Básico
                            </button>
                            <button onclick="injetarPacote('premium')" class="bg-[#996600] hover:bg-[#805500] text-white font-black py-3 rounded-lg shadow border border-[#ffd700] text-[10px] sm:text-xs uppercase transition-transform active:scale-95">
                                +1 Premium
                            </button>
                        </div>
                    </div>
                    <div class="bg-gray-800 p-4 rounded-lg border border-red-500/50 shadow-inner">
                        <h4 class="text-xs font-bold text-gray-400 uppercase mb-3 flex items-center gap-2">🧹 Ações de Limpeza</h4>
                        <button onclick="limparNotificacoes()" class="w-full bg-red-700 hover:bg-red-600 text-white font-black py-3 rounded-lg shadow border border-red-500 text-[10px] sm:text-xs uppercase transition-transform active:scale-95">
                            Apagar Todas as Notificações
                        </button>
                    </div>

                </div>

                <div class="flex flex-col h-full mt-4 md:mt-0">
                    <h4 class="font-black text-xs sm:text-sm text-gray-300 uppercase mb-2 flex justify-between items-center">
                        <span>💾 Visão do Banco</span>
                        <button onclick="carregarJogador(window.currentUserUid)" class="text-blue-400 hover:underline text-[10px] sm:text-xs">Atualizar</button>
                    </h4>
                    <pre id="json-viewer" class="bg-black p-4 rounded-lg border border-gray-700 text-green-400 text-[10px] sm:text-xs font-mono overflow-auto flex-1 max-h-[300px] md:max-h-[500px] shadow-inner"></pre>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, getDoc, updateDoc, setDoc, arrayUnion, arrayRemove, query, where, increment } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = { 
          apiKey: "AIzaSyCU3lFTgfrDMaD9jwR7X7ivYPmGQh4VE1g",
          authDomain: "supercards-tcg.firebaseapp.com",
          projectId: "supercards-tcg",
          storageBucket: "supercards-tcg.firebasestorage.app",
          messagingSenderId: "862316380615",
          appId: "1:862316380615:web:b3f28056ebc967673999e2"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        document.getElementById('btn-login').addEventListener('click', async () => {
            const email = document.getElementById('email-admin').value.trim();
            const senha = document.getElementById('senha-admin').value.trim();
            if (!email || !senha) return;
            try {
                document.getElementById('btn-login').innerText = "Verificando...";
                await signInWithEmailAndPassword(auth, email, senha);
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
            } catch (e) { alert("Acesso negado!"); document.getElementById('btn-login').innerText = "Acessar Sistema"; }
        });

        // ==========================================
        // GESTÃO DOS BOTS E TESTES
        // ==========================================
        window.injetarBots = async () => {
            if(!confirm("Criar 6 Bots e inscrevê-los no Brasileirão agora?")) return;
            try {
                for(let i=1; i<=6; i++) {
                    const botId = `bot_0${i}`;
                    await setDoc(doc(db, "users", botId), {
                        nome: `BOT TESTADOR 0${i}`, nomeDisplay: `BOT 0${i}`,
                        fotoPerfil: "fundo_carta.png", nivel: 99, isBot: true
                    }, {merge: true});
                    await updateDoc(doc(db, "torneios", "brasileirao_01"), {
                        inscritos: arrayUnion(botId)
                    });
                }
                alert("✅ 6 Bots Injetados com sucesso! Inscreva suas 2 contas e inicie o torneio.");
            } catch(e) { console.error(e); alert("Erro ao injetar bots."); }
        };

        window.simularBots = async () => {
             try {
                 const tDoc = await getDoc(doc(db, "torneios", "brasileirao_01"));
                 const dados = tDoc.data();
                 const rodada = dados.rodadaAtual;
                 let atualizou = false;
                 
                 dados.rodadas[rodada].confrontos.forEach(jogo => {
                     if(jogo.status !== 'finalizado' && jogo.jogador1.startsWith('bot_') && jogo.jogador2.startsWith('bot_')) {
                         jogo.status = 'finalizado';
                         const r = Math.random();
                         let p1Score = 0, p2Score = 0;

                         if(r < 0.33) {
                             jogo.vencedor = jogo.jogador1;
                             p1Score = Math.floor(Math.random() * 10) + 20; 
                             p2Score = Math.floor(Math.random() * 10) + 5;  
                             dados.classificacao[jogo.jogador1].pontos += 3;
                             dados.classificacao[jogo.jogador1].vitorias += 1;
                             dados.classificacao[jogo.jogador2].derrotas += 1;
                         } else if (r < 0.66) {
                             jogo.vencedor = jogo.jogador2;
                             p2Score = Math.floor(Math.random() * 10) + 20;
                             p1Score = Math.floor(Math.random() * 10) + 5;
                             dados.classificacao[jogo.jogador2].pontos += 3;
                             dados.classificacao[jogo.jogador2].vitorias += 1;
                             dados.classificacao[jogo.jogador1].derrotas += 1;
                         } else {
                             jogo.vencedor = 'empate';
                             p1Score = Math.floor(Math.random() * 5) + 15; 
                             p2Score = p1Score; 
                             dados.classificacao[jogo.jogador1].pontos += 1;
                             dados.classificacao[jogo.jogador1].empates += 1;
                             dados.classificacao[jogo.jogador2].pontos += 1;
                             dados.classificacao[jogo.jogador2].empates += 1;
                         }
                         
                         jogo.placar1 = p1Score;
                         jogo.placar2 = p2Score;
                         dados.classificacao[jogo.jogador1].saldoPontos += p1Score;
                         dados.classificacao[jogo.jogador2].saldoPontos += p2Score;
                         atualizou = true;
                     }
                 });
                 if(atualizou) {
                     await updateDoc(doc(db, "torneios", "brasileirao_01"), {
                         rodadas: dados.rodadas, classificacao: dados.classificacao
                     });
                     alert(`✅ Resultados e Placares da Rodada ${rodada} gerados para os Bots!`);
                 } else { alert("Nenhum jogo entre dois Bots pendente nesta rodada."); }
             } catch(e) { console.error(e); }
        };

        window.resetarTorneio = async () => {
             if(!confirm("🚨 ATENÇÃO! Isso vai apagar a tabela e resetar o Brasileirão inteiro. Certeza?")) return;
             await setDoc(doc(db, "torneios", "brasileirao_01"), {
                 nome: "Brasileirão Supercards", status: "aberto", inscritos: [], maxInscritos: 8
             });
             alert("✅ Torneio Resetado!");
        };

        window.gerarTabelaTorneio = async (idTorneio) => {
            const btn = document.getElementById('btn-gerar-torneio');
            btn.innerText = "PROCESSANDO..."; btn.disabled = true;

            try {
                const docTorneio = await getDoc(doc(db, "torneios", idTorneio));
                if (!docTorneio.exists()) throw new Error("Torneio não encontrado");

                const dados = docTorneio.data();
                const inscritos = dados.inscritos || [];

                if (inscritos.length !== 8) {
                    alert(`O torneio precisa de exatamente 8 inscritos (Você + 7 Bots), mas atualmente tem ${inscritos.length}.`);
                    throw new Error("Número de jogadores inválido");
                }

                if (dados.status !== "aberto") {
                    alert("Este torneio já foi iniciado ou finalizado!");
                    throw new Error("Status inválido");
                }

                let jogadores = [...inscritos].sort(() => Math.random() - 0.5);
                let rodadas = {};
                let numJogadores = jogadores.length;
                let rodadasIda = numJogadores - 1; 

                for (let r = 0; r < rodadasIda; r++) {
                    let confrontosDaRodada = [];
                    for (let i = 0; i < numJogadores / 2; i++) {
                        let p1 = jogadores[i];
                        let p2 = jogadores[numJogadores - 1 - i];
                        confrontosDaRodada.push({ jogador1: p1, jogador2: p2, status: 'pendente', vencedor: null, placar1: 0, placar2: 0 });
                    }
                    rodadas[r + 1] = { finalizada: false, confrontos: confrontosDaRodada };
                    jogadores.splice(1, 0, jogadores.pop());
                }

                for (let r = 1; r <= rodadasIda; r++) {
                    let confrontosVolta = rodadas[r].confrontos.map(jogo => {
                        return { jogador1: jogo.jogador2, jogador2: jogo.jogador1, status: 'pendente', vencedor: null, placar1: 0, placar2: 0 };
                    });
                    rodadas[r + rodadasIda] = { finalizada: false, confrontos: confrontosVolta };
                }

                let tabelaZerada = {};
                inscritos.forEach(uid => {
                    tabelaZerada[uid] = { pontos: 0, vitorias: 0, empates: 0, derrotas: 0, saldoPontos: 0 };
                });

                await updateDoc(doc(db, "torneios", idTorneio), {
                    status: "em_andamento", rodadaAtual: 1, rodadas: rodadas,
                    classificacao: tabelaZerada, iniciadoEm: new Date().toISOString()
                });

                alert("✅ SUCESSO! Tabela gerada, confrontos criados e torneio iniciado.");
            } catch(e) { console.error("Erro:", e); } finally {
                btn.innerText = "1. Iniciar"; btn.disabled = false;
            }
        };

        window.liberarProximaRodada = async (idTorneio) => {
            const btn = document.getElementById('btn-avancar-rodada');
            btn.innerText = "VERIFICANDO..."; btn.disabled = true;

            try {
                const docTorneio = await getDoc(doc(db, "torneios", idTorneio));
                const dados = docTorneio.data();
                if (dados.status !== "em_andamento") throw new Error("Status inválido");

                const rodadaAtual = dados.rodadaAtual;
                const totalRodadas = Object.keys(dados.rodadas).length;

                if (rodadaAtual >= totalRodadas) return alert("O torneio já está na última rodada!");

                const jogosPendentes = dados.rodadas[rodadaAtual].confrontos.filter(jogo => jogo.status !== 'finalizado');
                if (jogosPendentes.length > 0) return alert(`🚨 NÃO PERMITIDO! Faltam ${jogosPendentes.length} jogos para a Rodada ${rodadaAtual} acabar.`);

                await updateDoc(doc(db, "torneios", idTorneio), { rodadaAtual: rodadaAtual + 1 });
                alert(`✅ A Rodada ${rodadaAtual + 1} foi liberada!`);
            } catch(e) {} finally {
                btn.innerText = "2. Liberar Rodada"; btn.disabled = false;
            }
        };

        // ==========================================
        // DADOS DO JOGADOR
        // ==========================================
        document.getElementById('btn-buscar').addEventListener('click', async () => {
            const buscaStr = document.getElementById('input-busca').value.trim().toLowerCase();
            if (!buscaStr) return alert("Digite um Nome ou UID!");

            const btn = document.getElementById('btn-buscar');
            btn.innerText = "Buscando...";
            
            try {
                let userDoc = null;
                if (buscaStr.length < 20) {
                    const querySnapshot = await getDocs(collection(db, "users"));
                    querySnapshot.forEach(doc => {
                        const data = doc.data();
                        const nome = (data.nome || "").toLowerCase();
                        const nomeDisplay = (data.nomeDisplay || "").toLowerCase();
                        if (nome.includes(buscaStr) || nomeDisplay.includes(buscaStr)) {
                            userDoc = doc;
                        }
                    });
                } else {
                    const snap = await getDoc(doc(db, "users", buscaStr));
                    if (snap.exists()) userDoc = snap;
                }

                if (userDoc) {
                    window.currentUserUid = userDoc.id;
                    await window.carregarJogador(userDoc.id);
                    document.getElementById('painel-jogador').classList.remove('hidden');
                } else {
                    alert("Jogador não encontrado!");
                    document.getElementById('painel-jogador').classList.add('hidden');
                }
            } catch (error) { alert("Erro ao buscar no banco."); }
            btn.innerText = "Buscar";
        });

        window.alternarManutencao = async (status) => {
            if(status && !confirm("TEM CERTEZA?")) return;
            await setDoc(doc(db, "sistema", "configuracao"), { emManutencao: status }, { merge: true });
            alert(status ? "⛔ MANUTENÇÃO LIGADA!" : "✅ JOGO LIBERADO!");
        };

        window.carregarJogador = async (uid) => {
            const snap = await getDoc(doc(db, "users", uid));
            if(!snap.exists()) return;
            const data = snap.data();
            document.getElementById('lbl-nome-jogador').innerText = data.nomeDisplay || data.nome || "Sem Nome";
            document.getElementById('lbl-uid-jogador').innerText = "UID: " + uid;
            document.getElementById('edit-moedas').value = data.moedas || 0;
            document.getElementById('edit-frag').value = data.fragmentos || 0;
            document.getElementById('edit-nivel').value = data.nivel || 1;
            document.getElementById('edit-xp').value = data.xp || 0;
            document.getElementById('json-viewer').innerText = JSON.stringify(data, null, 4);
        };

        window.salvarCampo = async (campo) => {
            const inputId = `edit-${campo === 'fragmentos' ? 'frag' : campo}`;
            const valor = Number(document.getElementById(inputId).value);
            await updateDoc(doc(db, "users", window.currentUserUid), { [campo]: valor });
            window.carregarJogador(window.currentUserUid);
        };

        // === NOVA FUNÇÃO DE INJETAR PACOTES ===
        window.injetarPacote = async (tipo) => {
            if (!window.currentUserUid) return alert("Busque um jogador primeiro!");
            
            const btn = event.target;
            const textoOriginal = btn.innerText;
            btn.innerText = "...";
            btn.disabled = true;

            try {
                // Monta o nome exato do campo usando Notação de Ponto
                const campoInventario = tipo === 'basico' ? "inventario.pacoteBasico" : "inventario.pacotePremium";
                
                await updateDoc(doc(db, "users", window.currentUserUid), { 
                    [campoInventario]: increment(1) 
                });
                
                // Atualiza a tela para mostrar que o pacote caiu
                await window.carregarJogador(window.currentUserUid);
                alert(`✅ 1 Pacote ${tipo === 'basico' ? 'Básico' : 'Premium'} injetado com sucesso!`);
                
            } catch (error) {
                console.error(error);
                alert("Erro ao injetar pacote.");
            } finally {
                btn.innerText = textoOriginal;
                btn.disabled = false;
            }
        };

        // === NOVA FUNÇÃO: LIMPAR NOTIFICAÇÕES ===
        window.limparNotificacoes = async () => {
            if (!window.currentUserUid) return alert("Busque um jogador primeiro!");
            
            // Trava de segurança para não clicar sem querer
            if (!confirm("🚨 TEM CERTEZA? Isso vai apagar TODAS as notificações da caixa de entrada deste jogador para liberar espaço no banco. Não pode ser desfeito!")) return;

            const btn = event.target;
            const textoOriginal = btn.innerText;
            btn.innerText = "LIMPANDO...";
            btn.disabled = true;

            try {
                // Substitui a gaveta de notificações do jogador por um array vazio []
                await updateDoc(doc(db, "users", window.currentUserUid), { 
                    notificacoes: [] 
                });
                
                // Atualiza a tela de Raio-X
                await window.carregarJogador(window.currentUserUid);
                alert("✅ Caixa de notificações do jogador foi esvaziada com sucesso!");
                
            } catch (error) {
                console.error(error);
                alert("Erro ao limpar notificações.");
            } finally {
                btn.innerText = textoOriginal;
                btn.disabled = false;
            }
        };

    </script>
</body>
</html>
