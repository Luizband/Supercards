<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supercards - Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(180deg, #7a32a8 0%, #4ade80 100%);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        #toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            width: 90%;
            max-width: 350px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast-msg {
            background: #dca3e8;
            color: #7a32a8;
            border: 3px solid #7a32a8;
            padding: 12px 20px;
            border-radius: 9999px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.3);
            text-align: center;
            font-weight: 900;
            font-size: 0.85rem;
            animation: slideDown 0.3s ease-out;
            pointer-events: auto;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mão do adversário */
        .leque-1 { transform: rotate(-15deg) translateY(10px); }
        .leque-2 { transform: rotate(-5deg) translateY(0px); }
        .leque-3 { transform: rotate(5deg) translateY(0px); }
        .leque-4 { transform: rotate(15deg) translateY(10px); }

        /* Animação das suas cartas */
        .hover-carta { transition: transform 0.2s ease, z-index 0s; }
        .hover-carta:hover { transform: translateY(-20px) scale(1.05); z-index: 50; }
    </style>
</head>
<body class="fixed inset-0 overflow-hidden w-screen h-screen">

    <div id="toast-container"></div>

    <div class="w-full h-full max-w-sm mx-auto relative flex flex-col border-x-2 border-[#dca3e8]/30 shadow-2xl">

        <!-- ================= CABEÇALHO PERSONALIZADO ================= -->
        <div class="absolute top-4 w-[95%] left-1/2 transform -translate-x-1/2 flex items-center justify-between bg-[#dca3e8] rounded-full shadow-lg z-50 h-12">
            
            <!-- Esquerda: Nome do Adversário -->
            <div class="flex-1 text-center truncate px-2">
                <span id="opp-nome" class="text-[#7a32a8] font-black text-[10px] uppercase tracking-wide">BUSCANDO...</span>
            </div>
            
            <!-- Centro: Foto (Círculo Vazado) -->
            <div class="absolute left-1/2 transform -translate-x-1/2 -top-2 w-16 h-16 bg-[#dca3e8] rounded-full flex items-center justify-center shadow-md overflow-hidden z-40 border-2 border-[#bc7bd4]">
                <img id="opp-foto" src="" class="hidden w-full h-full object-cover">
                <span id="opp-foto-placeholder" class="text-[#7a32a8] font-black text-[10px]">FOTO</span>
            </div>
            
            <!-- Direita: Mensagens do Jogo -->
            <div class="flex-1 text-center truncate px-2">
                <span id="msg-jogo" class="text-[#7a32a8] font-black text-[10px] uppercase animate-pulse">AGUARDANDO O PONENTE</span>
            </div>

        </div>

        <!-- ================= ÁREA DO ADVERSÁRIO (TOPO) ================= -->
        <div class="w-full h-[45%] relative z-20 mt-16">

            <!-- Mão do Adversário (Leque Invertido) -->
            <div id="mao-adversario" class="absolute top-4 left-1/2 transform -translate-x-1/2 flex justify-center w-full z-10 pointer-events-none">
                <img src="fundo_carta.png" class="w-16 object-contain leque-1 shadow-md -mr-4 border border-black/20 rounded-md">
                <img src="fundo_carta.png" class="w-16 object-contain leque-2 shadow-md -mr-4 border border-black/20 rounded-md">
                <img src="fundo_carta.png" class="w-16 object-contain shadow-md z-10 border border-black/20 rounded-md">
                <img src="fundo_carta.png" class="w-16 object-contain leque-3 shadow-md -ml-4 border border-black/20 rounded-md">
                <img src="fundo_carta.png" class="w-16 object-contain leque-4 shadow-md -ml-4 border border-black/20 rounded-md">
            </div>

            <!-- Deck do Adversário -->
            <div class="absolute top-[35%] right-4 flex flex-col items-center">
                <img src="fundo_carta.png" class="w-14 object-contain drop-shadow-xl brightness-50 rounded-md">
                <span id="opp-deck-count" class="text-white font-black text-xl -mt-9 drop-shadow-[0_2px_4px_rgba(0,0,0,1)] z-10">15</span>
            </div>

        </div>

        <!-- ================= LOGO CENTRAL ================= -->
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-0">
            <img src="logo.png" class="w-[80%] max-w-[250px] opacity-20 grayscale object-contain drop-shadow-lg">
        </div>

        <!-- ================= ÁREA DO JOGADOR (BASE) ================= -->
        <div class="w-full h-[55%] relative z-20 border-t-2 border-[#dca3e8]/20 backdrop-blur-sm bg-black/10">
            
            <!-- Deck do Jogador -->
            <div class="absolute top-8 left-4 flex flex-col items-center">
                <img src="fundo_carta.png" class="w-14 object-contain drop-shadow-xl brightness-50 rounded-md">
                <span id="player-deck-count" class="text-white font-black text-xl -mt-9 drop-shadow-[0_2px_4px_rgba(0,0,0,1)] z-10">15</span>
            </div>

            <!-- Área de Combate -->
            <div id="arena-combate" class="absolute -top-16 left-1/2 transform -translate-x-1/2 w-full h-32 flex justify-center items-center gap-4 z-40 hidden">
                <!-- Carta do Jogador -->
                <div id="carta-jogada-player" class="w-24 aspect-[2.5/3.5] bg-gray-800 rounded-lg shadow-2xl border-2 border-white transform translate-y-10 transition-transform duration-500"></div>
                <!-- Carta do Adversário -->
                <div id="carta-jogada-opp" class="w-24 aspect-[2.5/3.5] bg-gray-800 rounded-lg shadow-2xl border-2 border-black transform -translate-y-10 transition-transform duration-500"></div>
            </div>

            <!-- Mão do Jogador -->
            <div id="mao-jogador" class="absolute bottom-8 left-0 w-full flex justify-center gap-1 px-2 z-30 h-[100px]">
                <div onclick="abrirZoomCarta('001')" class="w-[19%] max-w-[70px] aspect-[2.5/3.5] bg-gray-800 rounded-md shadow-xl border-2 border-transparent hover:border-[#4ade80] cursor-pointer hover-carta relative">
                    <img src="fundo_carta.png" class="w-full h-full object-cover rounded-sm">
                </div>
                <div onclick="abrirZoomCarta('002')" class="w-[19%] max-w-[70px] aspect-[2.5/3.5] bg-gray-800 rounded-md shadow-xl border-2 border-transparent hover:border-[#4ade80] cursor-pointer hover-carta relative">
                    <img src="fundo_carta.png" class="w-full h-full object-cover rounded-sm">
                </div>
                <div onclick="abrirZoomCarta('003')" class="w-[19%] max-w-[70px] aspect-[2.5/3.5] bg-gray-800 rounded-md shadow-xl border-2 border-transparent hover:border-[#4ade80] cursor-pointer hover-carta relative">
                    <img src="fundo_carta.png" class="w-full h-full object-cover rounded-sm">
                </div>
                <div onclick="abrirZoomCarta('004')" class="w-[19%] max-w-[70px] aspect-[2.5/3.5] bg-gray-800 rounded-md shadow-xl border-2 border-transparent hover:border-[#4ade80] cursor-pointer hover-carta relative">
                    <img src="fundo_carta.png" class="w-full h-full object-cover rounded-sm">
                </div>
                <div onclick="abrirZoomCarta('005')" class="w-[19%] max-w-[70px] aspect-[2.5/3.5] bg-gray-800 rounded-md shadow-xl border-2 border-transparent hover:border-[#4ade80] cursor-pointer hover-carta relative">
                    <img src="fundo_carta.png" class="w-full h-full object-cover rounded-sm">
                </div>
            </div>

        </div>

        <!-- ================= MODAL DE ZOOM E ATAQUE ================= -->
        <div id="modal-zoom" class="hidden fixed inset-0 bg-black/90 z-[100] flex flex-col items-center justify-center p-4 backdrop-blur-md">
            
            <button onclick="fecharZoomCarta()" class="absolute top-4 right-6 text-white font-black text-2xl hover:text-gray-300 transition-colors z-50">X</button>
            
            <h2 id="titulo-acao" class="text-white font-black text-xl text-center uppercase tracking-wider mb-4 drop-shadow-md">ESCOLHA O ATRIBUTO</h2>
            
            <!-- Imagem da carta -->
            <img id="zoom-img" src="fundo_carta.png" alt="Carta" class="w-[65%] max-w-[240px] aspect-[2.5/3.5] object-cover drop-shadow-2xl mb-6 rounded-xl border-4 border-[#bc7bd4]">
            
            <!-- Botões -->
            <div id="painel-atributos" class="grid grid-cols-2 gap-3 w-full max-w-xs">
                <button onclick="confirmarAcao('aura')" class="bg-blue-600 hover:bg-blue-500 text-white font-black text-xs py-3 rounded-lg shadow-lg border-2 border-blue-400 uppercase tracking-widest">
                    AURA
                </button>
                <button onclick="confirmarAcao('fofura')" class="bg-pink-500 hover:bg-pink-400 text-white font-black text-xs py-3 rounded-lg shadow-lg border-2 border-pink-300 uppercase tracking-widest">
                    FOFURA
                </button>
                <button onclick="confirmarAcao('diversao')" class="bg-yellow-500 hover:bg-yellow-400 text-black font-black text-xs py-3 rounded-lg shadow-lg border-2 border-yellow-300 uppercase tracking-widest">
                    DIVERSÃO
                </button>
                <button onclick="confirmarAcao('aleatoriedade')" class="bg-purple-600 hover:bg-purple-500 text-white font-black text-xs py-3 rounded-lg shadow-lg border-2 border-purple-400 uppercase tracking-widest">
                    ALEATORIEDADE
                </button>
            </div>
        </div>

    </div>

    <!-- SCRIPT DE INTERFACE BÁSICA -->
    <script type="module">
        import { INFO_CARTAS } from './cartas.js';

        let cartaFocadaId = null;

        // Função para atualizar a mensagem no cabeçalho
        window.atualizarMensagem = function(texto) {
            const painel = document.getElementById('msg-jogo');
            painel.innerText = texto;
            // Reinicia a animação para chamar atenção
            painel.classList.remove('animate-pulse');
            void painel.offsetWidth; 
            painel.classList.add('animate-pulse');
        };

        window.mostrarToast = function(mensagem) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast-msg';
            toast.innerHTML = mensagem;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s ease';
                setTimeout(() => toast.remove(), 500); 
            }, 3000);
        };

        window.abrirZoomCarta = function(idCarta) {
            cartaFocadaId = idCarta;
            
            if (INFO_CARTAS && INFO_CARTAS[idCarta]) {
                document.getElementById('zoom-img').src = INFO_CARTAS[idCarta].imagem;
            }

            document.getElementById('modal-zoom').classList.remove('hidden');
        };

        window.fecharZoomCarta = function() {
            document.getElementById('modal-zoom').classList.add('hidden');
            cartaFocadaId = null;
        };

        window.confirmarAcao = function(atributo) {
            fecharZoomCarta();
            window.atualizarMensagem(`ATAQUE: ${atributo}`);
        };
    </script>
</body>
</html>
