<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supercards - Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(180deg, #7a32a8 0%, #4ade80 100%);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; width: 90%; max-width: 350px; pointer-events: none; display: flex; flex-direction: column; gap: 10px; }
        .toast-msg { background: #dca3e8; color: #7a32a8; border: 3px solid #7a32a8; padding: 12px 20px; border-radius: 9999px; box-shadow: 0 10px 15px rgba(0,0,0,0.3); text-align: center; font-weight: 900; font-size: 0.85rem; animation: slideDown 0.3s ease-out forwards; pointer-events: auto; }
        @keyframes slideInFromLeft { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideInFromRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes winnerPulse { 0%, 100% { transform: scale(1); box-shadow: 0 0 20px #4ade80; } 50% { transform: scale(1.05); box-shadow: 0 0 35px #4ade80; } }
        .clash-card-container { transition: filter 0.5s ease-in-out, transform 0.5s ease-in-out; }
        .is-loser { filter: brightness(0.4); transform: scale(0.95); }
        .is-winner { animation: winnerPulse 1.5s infinite; border-color: #4ade80 !important; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        .hover-carta { transition: transform 0.2s ease, z-index 0s; }
        .hover-carta:hover { transform: translateY(-30px) scale(1.15); z-index: 50 !important; }
    </style>
</head>
<body class="fixed inset-0 overflow-hidden w-screen h-screen">

    <div id="toast-container"></div>

    <div class="w-full h-full max-w-sm mx-auto relative flex flex-col border-x-2 border-[#dca3e8]/30 shadow-2xl">
        <div class="absolute top-4 w-[95%] max-w-[360px] left-1/2 transform -translate-x-1/2 flex items-center justify-between bg-[#dca3e8] rounded-full shadow-lg z-50 h-12 px-4 border-2 border-[#bc7bd4]">
            <div class="flex-1 flex justify-start items-center overflow-hidden pr-6">
                <span id="opp-nome" class="text-[#7a32a8] font-black text-[11px] uppercase tracking-wide truncate">CARREGANDO...</span>
            </div>
            <div class="absolute left-1/2 transform -translate-x-1/2 -top-3 w-16 h-16 bg-[#dca3e8] rounded-full flex items-center justify-center shadow-md overflow-hidden z-40 border-2 border-[#bc7bd4]">
                <img id="opp-foto" src="" class="hidden w-full h-full object-cover">
                <span id="opp-foto-placeholder" class="text-[#7a32a8] font-black text-[10px]">FOTO</span>
            </div>
            <div class="flex-1 flex justify-end items-center pl-6">
                <button onclick="abrirModalDesistir()" class="bg-red-600 hover:bg-red-700 text-white font-black text-[9px] px-3 py-1.5 rounded-full shadow-md border-2 border-red-800 uppercase tracking-widest transition-transform active:scale-95">DESISTIR</button>
            </div>
        </div>

        <div class="w-full h-[45%] relative z-20 mt-16">
            <div id="mao-adversario" class="absolute top-4 left-1/2 transform -translate-x-1/2 w-full flex justify-center -space-x-4 px-2 z-10 pointer-events-none"></div>
            <div class="absolute bottom-4 right-4 flex flex-col items-center">
                <img src="fundo_carta.png" class="w-14 object-contain drop-shadow-xl brightness-50 rounded-md border border-black">
                <span id="opp-deck-count" class="text-white font-black text-xl -mt-9 drop-shadow-[0_2px_4px_rgba(0,0,0,1)] z-10">0</span>
            </div>
        </div>

        <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-0">
            <img src="logo.png" class="w-[80%] max-w-[250px] opacity-20 grayscale object-contain drop-shadow-lg">
        </div>

        <div class="w-full h-[55%] relative z-20 border-t-2 border-[#dca3e8]/20 backdrop-blur-sm bg-black/10">
            <div class="absolute top-4 left-4 flex flex-col items-center">
                <img src="fundo_carta.png" class="w-14 object-contain drop-shadow-xl brightness-50 rounded-md border border-black">
                <span id="player-deck-count" class="text-white font-black text-xl -mt-9 drop-shadow-[0_2px_4px_rgba(0,0,0,1)] z-10">0</span>
            </div>

            <div id="aviso-atributo" class="absolute top-[20%] left-1/2 transform -translate-x-1/2 flex justify-center z-50 pointer-events-none hidden">
                <span id="aviso-atributo-texto" class="text-white font-black text-sm uppercase tracking-widest animate-pulse drop-shadow-lg bg-black/80 px-6 py-2 rounded-full border border-white/30 text-center shadow-xl"></span>
            </div>

            <div id="arena-combate" class="absolute -top-16 left-1/2 transform -translate-x-1/2 w-full h-32 flex justify-center items-center gap-4 z-40 hidden">
                <div id="carta-jogada-player" class="w-[85px] aspect-[2.5/3.5] bg-gray-800 rounded-lg shadow-2xl border-2 border-white transform translate-y-10 transition-all duration-500"></div>
                <div id="carta-jogada-opp" class="w-[85px] aspect-[2.5/3.5] bg-gray-800 rounded-lg shadow-2xl border-2 border-black transform -translate-y-10 transition-all duration-500"></div>
            </div>
            
            <div id="mao-jogador" class="absolute bottom-20 left-1/2 transform -translate-x-1/2 w-full flex justify-center -space-x-6 px-2 z-30"></div>
        </div>

        <!-- MODAIS DA ARENA -->
        <div id="modal-zoom" class="hidden fixed inset-0 bg-black/90 z-[100] flex flex-col items-center justify-center p-4 backdrop-blur-md">
            <button onclick="fecharZoomCarta()" class="absolute top-4 right-6 text-white font-black text-2xl hover:text-gray-300 transition-colors z-50">X</button>
            <h2 id="titulo-acao" class="text-white font-black text-xl text-center uppercase tracking-wider mb-4 drop-shadow-md">AÇÃO DA CARTA</h2>
            <img id="zoom-img" src="fundo_carta.png" class="w-[65%] max-w-[240px] aspect-[2.5/3.5] object-cover drop-shadow-2xl mb-6 rounded-xl border-4 border-[#bc7bd4]">
            
            <div id="painel-atributos" class="grid grid-cols-2 gap-3 w-full max-w-xs hidden">
                <button onclick="confirmarAcao('aura')" class="bg-blue-600 hover:bg-blue-500 text-white font-black text-xs py-3 rounded-lg shadow-lg border-2 border-blue-400 uppercase tracking-widest">AURA</button>
                <button onclick="confirmarAcao('fofura')" class="bg-pink-500 hover:bg-pink-400 text-white font-black text-xs py-3 rounded-lg shadow-lg border-2 border-pink-300 uppercase tracking-widest">FOFURA</button>
                <button onclick="confirmarAcao('diversao')" class="bg-yellow-500 hover:bg-yellow-400 text-black font-black text-xs py-3 rounded-lg shadow-lg border-2 border-yellow-300 uppercase tracking-widest">DIVERSÃO</button>
                <button onclick="confirmarAcao('aleatoriedade')" class="bg-purple-600 hover:bg-purple-500 text-white font-black text-xs py-3 rounded-lg shadow-lg border-2 border-purple-400 uppercase tracking-widest">ALEATÓRIO</button>
            </div>
            <div id="painel-defesa" class="w-full max-w-xs hidden">
                <button id="btn-defender" onclick="confirmarDefesa()" class="w-full bg-red-600 hover:bg-red-500 text-white font-black text-xs py-4 rounded-lg shadow-lg border-2 border-red-400 uppercase tracking-widest"></button>
            </div>
        </div>

        <div id="modal-embate" class="hidden fixed inset-0 bg-black/95 z-[150] flex flex-col items-center justify-center p-4 backdrop-blur-md">
            <h2 id="embate-atributo-titulo" class="text-[#dca3e8] font-black text-xl uppercase tracking-widest mb-8 drop-shadow-lg absolute top-10"></h2>
            <div class="w-full max-w-md flex flex-row justify-around items-center px-2">
                <div id="clash-p1-container" class="clash-card-container flex flex-col items-center gap-3">
                    <span id="clash-p1-name" class="text-sky-400 font-black text-[10px] uppercase truncate w-24 text-center"></span>
                    <div id="clash-p1-card" class="w-24 aspect-[2.5/3.5] bg-gray-800 rounded-lg shadow-2xl border-4 border-transparent" style="background-size: cover; background-position: center;"></div>
                    <div class="bg-black/60 px-4 py-1 rounded-md border border-white/20"><span id="clash-p1-valor" class="text-white font-black text-2xl"></span></div>
                </div>
                <span id="clash-vs-text" class="text-white font-black text-3xl mx-2 drop-shadow-lg">VS</span>
                <div id="clash-p2-container" class="clash-card-container flex flex-col items-center gap-3">
                    <span id="clash-p2-name" class="text-fuchsia-400 font-black text-[10px] uppercase truncate w-24 text-center"></span>
                    <div id="clash-p2-card" class="w-24 aspect-[2.5/3.5] bg-gray-800 rounded-lg shadow-2xl border-4 border-transparent" style="background-size: cover; background-position: center;"></div>
                    <div class="bg-black/60 px-4 py-1 rounded-md border border-white/20"><span id="clash-p2-valor" class="text-white font-black text-2xl"></span></div>
                </div>
            </div>
        </div>

        <div id="modal-desistir" class="hidden fixed inset-0 bg-black/80 z-[200] flex items-center justify-center p-4 backdrop-blur-sm">
            <div class="bg-[#dca3e8] border-4 border-[#7a32a8] rounded-2xl p-6 max-w-xs w-full text-center shadow-2xl relative">
                <h2 class="text-red-600 font-black text-lg mb-2 uppercase">Desistir da Batalha?</h2>
                <div class="flex justify-center gap-4 mt-6">
                    <button onclick="fecharModalDesistir()" class="flex-1 bg-gray-500 text-white font-black py-2 rounded-full shadow-md uppercase text-xs">NÃO</button>
                    <button onclick="confirmarDesistencia()" class="flex-1 bg-red-600 text-white font-black py-2 rounded-full shadow-md uppercase text-xs">SIM</button>
                </div>
            </div>
        </div>

        <div id="modal-fim-etapa" class="hidden fixed inset-0 bg-black/95 z-[250] flex flex-col items-center justify-start pt-10 p-4 backdrop-blur-md">
            <h1 id="fim-titulo-jogador" class="text-[#dca3e8] font-black text-xl uppercase tracking-widest mb-1 text-center">CARTAS GANHAS POR</h1>
            <h2 id="fim-pontos-jogador" class="text-[#4ade80] font-black text-4xl mb-6 drop-shadow-md">0 PTS</h2>
            <div id="fim-grid-cartas" class="grid grid-cols-4 gap-2 w-full max-w-sm overflow-y-auto no-scrollbar content-start flex-grow pb-10"></div>
            <div class="w-full max-w-sm pb-8 flex-shrink-0 flex justify-center mt-4">
                <button onclick="avancarEtapaFim()" class="bg-[#7a32a8] hover:bg-purple-600 text-white font-black py-3 px-12 rounded-full shadow-lg border-2 border-[#bc7bd4] tracking-widest uppercase">AVANÇAR</button>
            </div>
        </div>

        <div id="modal-resultado-final" class="hidden fixed inset-0 bg-black/95 z-[300] flex flex-col items-center justify-center p-4">
            <h1 id="texto-vitoria" class="text-4xl font-black text-white uppercase tracking-widest mb-6 drop-shadow-2xl text-center"></h1>
            
            <div id="recompensas-final" class="hidden bg-[#dca3e8] border-4 border-[#7a32a8] rounded-2xl p-6 w-full max-w-xs flex flex-col items-center gap-2 mb-8 shadow-2xl">
                <span class="text-[#7a32a8] font-black text-lg tracking-widest uppercase">Recompensas</span>
                <div class="flex w-full justify-around mt-2">
                    <span class="text-black font-black text-base">+20 XP</span>
                    <span class="text-black font-black text-base flex items-center gap-1">+20 <img src="moedas.png" class="w-5 h-5 object-contain"></span>
                </div>
            </div>

            <button id="btn-finalizar-batalha" class="bg-[#7a32a8] hover:bg-purple-600 text-white font-black py-4 px-12 rounded-full shadow-lg border-2 border-white tracking-widest text-lg">FINALIZAR</button>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, updateDoc, deleteDoc, getDoc, increment, arrayUnion, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { INFO_CARTAS } from './cartas.js';

        const app = initializeApp({
          apiKey: "AIzaSyCU3lFTgfrDMaD9jwR7X7ivYPmGQh4VE1g",
          authDomain: "supercards-tcg.firebaseapp.com",
          projectId: "supercards-tcg",
          storageBucket: "supercards-tcg.firebasestorage.app",
          messagingSenderId: "862316380615",
          appId: "1:862316380615:web:b3f28056ebc967673999e2"
        });
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserUid = null;
        let minhaRole = null; 
        let oppRole = null;
        let isHost = false;
        let salaId = null;
        let dadosSala = null;
        let cartaFocadaId = null;
        let ultimoEstadoToast = null; 
        let etapaFim = 0, pointsJ1 = 0, pointsJ2 = 0;
        
        // --- NOVAS VARIÁVEIS DE OTIMIZAÇÃO E ANIMAÇÃO ---
        window.turnoAnimadoLocal = -1;
        window.ultimaMaoOpp = "";
        window.ultimaMaoMy = "";

        // Variaveis de Integração Segura do Torneio
        window.isTorneio = false;
        window.torneioId = null;
        window.torneioOpp = null;

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex > 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        window.mostrarToast = function(msg) {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div'); t.className = 'toast-msg'; t.innerHTML = msg;
            c.appendChild(t); setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 500); }, 4000); 
        };

        function renderizarArena() {
            const opp = dadosSala[oppRole]; const my = dadosSala[minhaRole];
            document.getElementById('opp-nome').innerText = opp.nome;
            if (opp.foto) { document.getElementById('opp-foto').src = opp.foto; document.getElementById('opp-foto').classList.remove('hidden'); document.getElementById('opp-foto-placeholder').classList.add('hidden'); }
            document.getElementById('opp-deck-count').innerText = opp.deck.length; document.getElementById('player-deck-count').innerText = my.deck.length;

            // OTIMIZAÇÃO: Só recria o HTML se a quantidade/ordem das cartas mudou (Salva o FPS do iPhone)
            const maoOppStr = JSON.stringify(opp.mao);
            const maoMyStr = JSON.stringify(my.mao);

            if (window.ultimaMaoOpp !== maoOppStr) {
                window.ultimaMaoOpp = maoOppStr;
                const oppMao = document.getElementById('mao-adversario'); oppMao.innerHTML = '';
                opp.mao.forEach((_, i) => oppMao.innerHTML += `<img src="fundo_carta.png" class="w-[18%] max-w-[65px] object-contain shadow-md border border-black/20 rounded-md" style="z-index: ${i};">`);
            }

            if (window.ultimaMaoMy !== maoMyStr) {
                window.ultimaMaoMy = maoMyStr;
                const myMao = document.getElementById('mao-jogador'); myMao.innerHTML = '';
                my.mao.forEach((id, i) => {
                    const info = INFO_CARTAS[id] || { miniatura: 'fundo_carta.png', imagem: 'fundo_carta.png' };
                    myMao.innerHTML += `<div onclick="abrirZoomCarta('${id}')" class="w-[26%] max-w-[100px] aspect-[2.5/3.5] bg-gray-800 rounded-md shadow-2xl border-2 border-black hover:border-[#4ade80] cursor-pointer hover-carta relative overflow-hidden" style="z-index: ${i};"><img src="${info.miniatura || info.imagem}" class="w-full h-full object-cover"></div>`;
                });
            }
            
            document.getElementById('arena-combate').classList.add('hidden');

            // === INJEÇÃO DO BOTÃO DE FORÇAR VITÓRIA PARA BOTS NO TORNEIO ===
            if (window.isTorneio && window.torneioOpp && window.torneioOpp.startsWith('bot_')) {
                if (!document.getElementById('btn-forcar-bot')) {
                    const container = document.querySelector('.w-full.h-full.max-w-sm.relative');
                    const btn = document.createElement('button');
                    btn.id = 'btn-forcar-bot';
                    btn.innerHTML = 'FORÇAR VITÓRIA (BOT)';
                    btn.className = 'absolute top-32 left-1/2 transform -translate-x-1/2 bg-red-600 hover:bg-red-500 text-white font-black px-6 py-2 rounded-full shadow-[0_0_20px_rgba(220,38,38,0.8)] z-[60] border-2 border-white animate-pulse text-xs tracking-widest uppercase';
                    btn.onclick = window.forcarVitoriaBot;
                    container.appendChild(btn);
                }
            }
        }

        // ====== LÓGICA DE REGISTRO DO TORNEIO (Invisível na casual) ======
        window.registrarResultadoTorneio = async function(vencedorUid, placar1, placar2) {
            try {
                const tRef = doc(db, "torneios", window.torneioId);
                const tSnap = await getDoc(tRef);
                if (!tSnap.exists()) return;
                const dados = tSnap.data();
                const rodada = dados.rodadaAtual;
                let atualizou = false;
                
                const uidHost = dadosSala.jogador1.uid;
                const uidAdv = dadosSala.jogador2.uid;

                dados.rodadas[rodada].confrontos.forEach(jogo => {
                    if(jogo.status !== 'finalizado' && 
                      ((jogo.jogador1 === uidHost && jogo.jogador2 === uidAdv) || 
                       (jogo.jogador1 === uidAdv && jogo.jogador2 === uidHost))) {
                        
                        jogo.status = 'finalizado';
                        jogo.vencedor = vencedorUid;
                        
                        if (jogo.jogador1 === uidHost) {
                            jogo.placar1 = placar1; jogo.placar2 = placar2;
                        } else {
                            jogo.placar1 = placar2; jogo.placar2 = placar1;
                        }
                        
                        if (vencedorUid === jogo.jogador1) {
                            dados.classificacao[jogo.jogador1].pontos += 3;
                            dados.classificacao[jogo.jogador1].vitorias += 1;
                            dados.classificacao[jogo.jogador2].derrotas += 1;
                        } else if (vencedorUid === jogo.jogador2) {
                            dados.classificacao[jogo.jogador2].pontos += 3;
                            dados.classificacao[jogo.jogador2].vitorias += 1;
                            dados.classificacao[jogo.jogador1].derrotas += 1;
                        } else { 
                            dados.classificacao[jogo.jogador1].pontos += 1;
                            dados.classificacao[jogo.jogador1].empates += 1;
                            dados.classificacao[jogo.jogador2].pontos += 1;
                            dados.classificacao[jogo.jogador2].empates += 1;
                        }
                        
                        dados.classificacao[jogo.jogador1].saldoPontos += jogo.placar1;
                        dados.classificacao[jogo.jogador2].saldoPontos += jogo.placar2;
                        
                        atualizou = true;
                    }
                });
                if(atualizou) await updateDoc(tRef, { rodadas: dados.rodadas, classificacao: dados.classificacao });
            } catch(e) { console.error("Erro ao registrar pontos no torneio:", e); }
        };

        window.forcarVitoriaBot = async () => {
            if(!confirm("FORÇAR VITÓRIA PARA TESTE: Pular a partida contra o bot e ir para o torneio?")) return;
            document.getElementById('btn-forcar-bot').innerText = "PROCESSANDO...";
            
            let myScore = Math.floor(Math.random() * 10) + 20; 
            let botScore = Math.floor(Math.random() * 10) + 5; 
            let p1Score = myScore; let p2Score = botScore;
            
            await window.registrarResultadoTorneio(currentUserUid, p1Score, p2Score);
            await window.concederRecompensasArena(true); 
            
            try{ await deleteDoc(doc(db, "partidas", salaId)); }catch(e){}
            window.location.href = 'torneios.html';
        };

        // ====== RECOMPENSAS PADRÃO (Isoladas para não quebrar nada) ======
        window.concederRecompensasArena = async function(vitoria) {
            if (!window.dadosSalvos) {
                window.dadosSalvos = true;
                try {
                    const s = await getDoc(doc(db, "users", currentUserUid));
                    if(s.exists()) {
                        let d = s.data(); let ups = {};
                        let ms = d.missoesDiarias || {}; let aM = false;
                        
                        (ms.lista || []).forEach(m => { 
                            if(["batalhar","jogar_batalha","jogar"].includes(m.id) && m.progresso < m.meta) { m.progresso++; aM = true; } 
                            if(vitoria && ["ganhar_partida","vencer_batalha","vencer"].includes(m.id) && m.progresso < m.meta) { m.progresso++; aM = true; } 
                        });
                        if(aM) ups.missoesDiarias = ms;

                        if (vitoria) {
                            ups['estatisticas.batalhasVencidas'] = increment(1); 
                            let va = (d.estatisticas?.batalhasVencidas || 0) + 1;
                            let xpB = 20; let moB = 20;
                            
                            if (va >= 30 && (!d.badges || !d.badges['badge-005'])) { 
                                ups['badges.badge-005'] = true; xpB += 50; moB += 50; localStorage.setItem('novaBadge', 'Guerreiro'); 
                            }
                            
                            let nA = d.nivel || 1; let nx = (d.xp || 0) + xpB; let sub = false; let pb = 0; let pp = 0;
                            let mx = (nA <= 5) ? 200 : (nA <= 15 ? 750 : (nA <= 25 ? 1600 : 3000));
                            while (nx >= mx && nA < 30) {
                                nx -= mx; nA++; sub = true; moB += 30; pb++;
                                if ([10, 20, 30].includes(nA)) pp++;
                                mx = (nA <= 5) ? 200 : (nA <= 15 ? 750 : (nA <= 25 ? 1600 : 3000));
                            }
                            
                            ups.xp = nx; ups.nivel = nA; ups.moedas = increment(moB);
                            if(pb > 0) ups['inventario.pacoteBasico'] = increment(pb); 
                            if(pp > 0) ups['inventario.pacotePremium'] = increment(pp);
                            if(sub) localStorage.setItem('novoLevel', nA);
                        }
                        if(Object.keys(ups).length > 0) await updateDoc(doc(db, "users", currentUserUid), ups);
                    }
                } catch(e) { console.error("Erro ao salvar recompensas:", e); }
            }
        };

        function dispararToastsDeTurno(esperarAnimacao = false) {
            if (dadosSala.status === 'finalizada') return;
            let estado = `${dadosSala.turnoAtual}-${dadosSala.statusTurno}`;
            if (ultimoEstadoToast === estado) return; ultimoEstadoToast = estado;

            const nAtacante = dadosSala.quemAtaca === dadosSala.jogador1.uid ? dadosSala.jogador1.nome : dadosSala.jogador2.nome;

            if (dadosSala.statusTurno === 'aguardando_ataque') {
                if (esperarAnimacao) {
                    // Se estiver passando a animação do embate, espera 4.6 segundos para mostrar o aviso
                    setTimeout(() => {
                        if (dadosSala.status !== 'finalizada') {
                            window.mostrarToast(`Vez de ${nAtacante} escolher uma carta e atributo`);
                        }
                    }, 3200); 
                } else {
                    // Se for o primeiro turno do jogo, mostra na hora
                    window.mostrarToast(`Vez de ${nAtacante} escolher uma carta e atributo`);
                }
            }
        }
        // NOVA FUNÇÃO: Controla o Atributo no centro da tela
        function atualizarAtributoPiscando() {
            const avisoDiv = document.getElementById('aviso-atributo');
            const avisoTexto = document.getElementById('aviso-atributo-texto');
            
            // Só aparece na hora que alguém está defendendo
            if (dadosSala.statusTurno === 'aguardando_defesa') {
                avisoTexto.innerText = `${dadosSala.atributoTurno.toUpperCase()}`;
                
                // Se você for o defensor, a cor fica vermelha! Se for o atacante, fica amarela.
                if (dadosSala.quemAtaca !== currentUserUid) {
                    avisoTexto.className = "text-red-400 font-black text-sm uppercase tracking-widest animate-pulse drop-shadow-lg bg-black/80 px-6 py-2 rounded-full border border-red-500/50 text-center";
                } else {
                    avisoTexto.className = "text-yellow-400 font-black text-sm uppercase tracking-widest animate-pulse drop-shadow-lg bg-black/80 px-6 py-2 rounded-full border border-yellow-500/50 text-center";
                }
                avisoDiv.classList.remove('hidden');
            } else {
                avisoDiv.classList.add('hidden'); // Some no embate e no ataque
            }
        }

        window.abrirZoomCarta = function(id) {
            // TRAVA FÍSICA: Impede clicar em cartas enquanto a animação do embate estiver na tela
            if (!document.getElementById('modal-embate').classList.contains('hidden')) return;

            if (dadosSala.statusTurno === 'resolvendo' || dadosSala.statusTurno === 'exibindo_resultado' || dadosSala.status === 'finalizada') return;
            if (dadosSala[minhaRole].cartaJogada) return; 
            const isMyTurn = dadosSala.quemAtaca === currentUserUid;
            if (!isMyTurn && dadosSala.statusTurno === 'aguardando_ataque') return; 

            cartaFocadaId = id; document.getElementById('zoom-img').src = INFO_CARTAS[id]?.imagem || 'fundo_carta.png';
            if (isMyTurn) { document.getElementById('painel-atributos').classList.remove('hidden'); document.getElementById('painel-defesa').classList.add('hidden'); }
            else { document.getElementById('painel-atributos').classList.add('hidden'); document.getElementById('painel-defesa').classList.remove('hidden'); document.getElementById('btn-defender').innerText = `DEFENDER (${dadosSala.atributoTurno.toUpperCase()})`; }
            document.getElementById('modal-zoom').classList.remove('hidden');
        };

        window.fecharZoomCarta = function() { document.getElementById('modal-zoom').classList.add('hidden'); };

        window.confirmarAcao = function(attr) {
            const idAlvo = cartaFocadaId; fecharZoomCarta(); cartaFocadaId = null; 
            const newMao = [...dadosSala[minhaRole].mao]; newMao.splice(newMao.indexOf(idAlvo), 1);
            let updates = { [`${minhaRole}.cartaJogada`]: idAlvo, [`${minhaRole}.mao`]: newMao };
            
            if (dadosSala.quemAtaca === currentUserUid) { updates.atributoTurno = attr; updates.statusTurno = 'aguardando_defesa'; }
            else updates.statusTurno = 'resolvendo'; 
            updateDoc(doc(db, "partidas", salaId), updates);
        };

        window.confirmarDefesa = function() { window.confirmarAcao(null); };

        function exibirAnimacaoClash(data) {
            document.getElementById('embate-atributo-titulo').innerText = `ATRIBUTO: ${data.attr_nome.toUpperCase()}`;
            document.getElementById('clash-p1-name').innerText = dadosSala.jogador1.nome;
            document.getElementById('clash-p1-card').style.backgroundImage = `url('${(INFO_CARTAS[data.id1]||{}).imagem||'fundo_carta.png'}')`;
            document.getElementById('clash-p1-valor').innerText = data.val1;
            document.getElementById('clash-p2-name').innerText = dadosSala.jogador2.nome;
            document.getElementById('clash-p2-card').style.backgroundImage = `url('${(INFO_CARTAS[data.id2]||{}).imagem||'fundo_carta.png'}')`;
            document.getElementById('clash-p2-valor').innerText = data.val2;

            const p1 = document.getElementById('clash-p1-container'), p2 = document.getElementById('clash-p2-container'), vs = document.getElementById('clash-vs-text');
            [p1, p2, vs].forEach(el => { el.style.animation = 'none'; void el.offsetWidth; });
            p1.classList.remove('is-winner', 'is-loser'); p2.classList.remove('is-winner', 'is-loser');
            document.getElementById('modal-embate').classList.remove('hidden');

            // === ÁUDIOS ESPECIAIS DAS CARTAS ===
            const audiosEspeciais = {
                "031": "audios/031.mp3",
                "032": "audios/032.mp3",
                "037": "audios/037.mp3",
                "041": "audios/041.mp3",
                "042": "audios/042.mp3",
                "046": "audios/046.mp3",
                "049": "audios/049.mp3",
                "050": "audios/050.mp3",
                "052": "audios/052.mp3",
                "075": "audios/075.mp3",
                "079": "audios/079.mp3",
                "085": "audios/085.mp3",
                "087": "audios/087.mp3",
                "092": "audios/092.mp3",
            };

            // 1. Descobre qual carta ganhou o turno
            let cartaVencedora = null;
            if (data.chaveVencedor === 'jogador1') cartaVencedora = data.id1;
            else if (data.chaveVencedor === 'jogador2') cartaVencedora = data.id2;

            // 2. Toca o som EXCLUSIVAMENTE se a carta vencedora tiver áudio
            if (cartaVencedora && audiosEspeciais[cartaVencedora]) {
                new Audio(audiosEspeciais[cartaVencedora]).play().catch(e => console.log(e));
            }
            // Se der empate ou a vencedora não tiver som, ele procura se a outra tem.
            let cartaParaTocar = (cartaVencedora && audiosEspeciais[cartaVencedora]) 
                ? cartaVencedora 
                : [data.id1, data.id2].find(id => audiosEspeciais[id]);

            if (cartaParaTocar) {
                new Audio(audiosEspeciais[cartaParaTocar]).play().catch(e => console.log(e));
            }

            p1.style.animation = 'slideInFromLeft 0.5s forwards'; p2.style.animation = 'slideInFromRight 0.5s forwards';
            vs.style.animation = 'fadeIn 1s 0.5s forwards'; vs.style.opacity = 0;

            setTimeout(() => {
                if (data.chaveVencedor === 'jogador1') { p1.classList.add('is-winner'); p2.classList.add('is-loser'); }
                else if (data.chaveVencedor === 'jogador2') { p2.classList.add('is-winner'); p1.classList.add('is-loser'); }
                else { p1.classList.add('is-loser'); p2.classList.add('is-loser'); }
                
                // Dispara o toast do resultado EXATAMENTE na hora do impacto!
                if (data.vencedorTurno === 'anuladas') window.mostrarToast(`Empate absoluto! As cartas se ANULARAM.`);
                else if (data.vencedorTurno === 'desempate') window.mostrarToast(`EMPATE!<br><span class="text-xs font-normal">${data.nomeVencedorTurno} venceu no atributo extra (${data.valorDesempate}).</span>`);
                else window.mostrarToast(`${data.nomeVencedorTurno} ganhou o turno!`);
            }, 1500);

            // O celular do jogador gerencia o fechamento, o servidor já está livre!
            setTimeout(() => {
                document.getElementById('modal-embate').classList.add('hidden');
                if (dadosSala.status === 'finalizada') iniciarCascataFinal();
            }, 3000);
        }

        async function resolverCombateHost() {
            // TRAVA ANTI-CLONE: Ignora se duas abas tentarem processar juntas ou se não for a hora
            if (window.resolvendoHost || dadosSala.statusTurno !== 'resolvendo') return; 
            window.resolvendoHost = true;

            const id1 = dadosSala.jogador1.cartaJogada, id2 = dadosSala.jogador2.cartaJogada;
            if (!id1 || !id2) return window.resolvendoHost = false;

            const attr = dadosSala.atributoTurno.toLowerCase();
            const info1 = INFO_CARTAS[id1] || {}, info2 = INFO_CARTAS[id2] || {};
            let val1 = info1[attr] || 0, val2 = info2[attr] || 0;

            let vencK = null, nomeV = "", tipo = "normal", valD = 0; 
            if (val1 > val2) { vencK = 'jogador1'; nomeV = dadosSala.jogador1.nome; }
            else if (val2 > val1) { vencK = 'jogador2'; nomeV = dadosSala.jogador2.nome; }
            else {
                tipo = "desempate";
                const atrs = ['aura', 'fofura', 'diversao', 'aleatoriedade'].filter(a => a !== attr);
                const m1 = Math.max(...atrs.map(a => info1[a] || 0)), m2 = Math.max(...atrs.map(a => info2[a] || 0));
                if (m1 > m2) { vencK = 'jogador1'; nomeV = dadosSala.jogador1.nome; valD = m1; }
                else if (m2 > m1) { vencK = 'jogador2'; nomeV = dadosSala.jogador2.nome; valD = m2; }
                else { vencK = 'nenhum'; nomeV = 'Ninguém'; tipo = 'anuladas'; }
            }

            // TURNO ATÔMICO: Calcula e avança tudo em 1 único segundo, sem esperar a animação.
            let j1P = [...(dadosSala.jogador1.pilhaVitorias || [])], j2P = [...(dadosSala.jogador2.pilhaVitorias || [])];
            if (vencK === 'jogador1') j1P.push(id1, id2); else if (vencK === 'jogador2') j2P.push(id1, id2);
            let j1D = [...dadosSala.jogador1.deck], j1M = [...dadosSala.jogador1.mao]; if(j1D.length) j1M.push(j1D.shift());
            let j2D = [...dadosSala.jogador2.deck], j2M = [...dadosSala.jogador2.mao]; if(j2D.length) j2M.push(j2D.shift());
            
            let proxStatus = (!j1M.length && !j2M.length) ? 'finalizada' : 'aguardando_ataque';
            let proxAtacante = dadosSala.quemAtaca === dadosSala.jogador1.uid ? dadosSala.jogador2.uid : dadosSala.jogador1.uid;
            
            let ups = { 
                'jogador1.pilhaVitorias': j1P, 'jogador2.pilhaVitorias': j2P, 
                'jogador1.deck': j1D, 'jogador1.mao': j1M, 'jogador2.deck': j2D, 'jogador2.mao': j2M, 
                'jogador1.cartaJogada': null, 'jogador2.cartaJogada': null, 'atributoTurno': null, 
                'statusTurno': proxStatus, 'status': proxStatus === 'finalizada' ? 'finalizada' : dadosSala.status,
                'turnoAtual': (dadosSala.turnoAtual || 1) + 1, 'quemAtaca': proxAtacante,
                'ultimoClash': { id1, val1, id2, val2, vencedorTurno: tipo, nomeVencedorTurno: nomeV, chaveVencedor: vencK, valorDesempate: valD, turno: (dadosSala.turnoAtual || 1), attr_nome: dadosSala.atributoTurno }
            };

            try {
                await updateDoc(doc(db, "partidas", salaId), ups); 
            } finally {
                window.resolvendoHost = false;
            }
        }
        
        function montarGridFinal(k) {
            const grid = document.getElementById('fim-grid-cartas'); grid.innerHTML = '';
            let t = 0;
            (dadosSala[k].pilhaVitorias || []).forEach(id => {
                const i = INFO_CARTAS[id] || { pontos: 0 }; t += i.pontos;
                grid.innerHTML += `<div class="relative aspect-[2.5/3.5] bg-gray-800 rounded-md shadow-lg border border-black"><img src="${i.miniatura || i.imagem || 'fundo_carta.png'}" class="w-full h-full object-cover"></div>`;
            });
            document.getElementById('fim-titulo-jogador').innerText = `CARTAS GANHAS POR: ${dadosSala[k].nome}`;
            document.getElementById('fim-pontos-jogador').innerText = `${t} PTS`; return t;
        }

        window.avancarEtapaFim = async function() {
            etapaFim++;
            if (etapaFim === 2) {
                pointsJ2 = montarGridFinal('jogador2');
            } else if (etapaFim === 3) {
                document.getElementById('modal-fim-etapa').classList.add('hidden');
                
                const myP = minhaRole === 'jogador1' ? pointsJ1 : pointsJ2;
                const oppP = minhaRole === 'jogador1' ? pointsJ2 : pointsJ1;
                const vitoria = myP > oppP;
                const isEmpate = myP === oppP;
                
                document.getElementById('texto-vitoria').innerText = vitoria ? "VITÓRIA!" : (isEmpate ? "EMPATE" : "DERROTA");
                
                if (vitoria) document.getElementById('recompensas-final').classList.remove('hidden');
                else document.getElementById('recompensas-final').classList.add('hidden');

                document.getElementById('modal-resultado-final').classList.remove('hidden');

                // Concede XP e Moedas Padrão
                await window.concederRecompensasArena(vitoria);

                // SE FOR UMA PARTIDA OFICIAL DO TORNEIO (E SÓ SE FOR), REGISTRA OS PONTOS
                if (window.isTorneio && isHost) {
                    let vencedorUid = null;
                    if (vitoria) vencedorUid = currentUserUid;
                    else if (!isEmpate) vencedorUid = dadosSala[oppRole].uid;
                    else vencedorUid = 'empate';
                    
                    let p1Score = minhaRole === 'jogador1' ? myP : oppP;
                    let p2Score = minhaRole === 'jogador2' ? myP : oppP;
                    
                    await window.registrarResultadoTorneio(vencedorUid, p1Score, p2Score);
                }
            }
        };
        
        function iniciarCascataFinal() { if (window.etapaIniciada) return; window.etapaIniciada = true; etapaFim = 1; pointsJ1 = montarGridFinal('jogador1'); document.getElementById('modal-fim-etapa').classList.remove('hidden'); }

        window.abrirModalDesistir = function() { document.getElementById('modal-desistir').classList.remove('hidden'); };
        window.fecharModalDesistir = function() { document.getElementById('modal-desistir').classList.add('hidden'); };
        window.confirmarDesistencia = async function() { 
            if(salaId) try{ await deleteDoc(doc(db, "partidas", salaId)); }catch(e){} 
            window.location.href = window.isTorneio ? 'torneios.html' : 'batalha.html'; 
        };

        document.getElementById('btn-finalizar-batalha').onclick = () => {
            window.location.href = window.isTorneio ? 'torneios.html' : 'batalha.html';
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserUid = user.uid;

                // === LEÃO DE CHÁCARA DO TORNEIO (Invisível para partidas casuais) ===
                let tAdv = localStorage.getItem("torneioAdversario");
                let tId = localStorage.getItem("torneioId");
                
                if (tAdv && tId) {
                    window.isTorneio = true; window.torneioId = tId; window.torneioOpp = tAdv;
                    localStorage.removeItem("torneioAdversario"); localStorage.removeItem("torneioId");

                    let ids = [currentUserUid, tAdv].sort();
                    salaId = `tourney_${tId}_${ids[0]}_${ids[1]}`;
                    window.history.replaceState({}, document.title, `arena.html?sala=${salaId}`);
                    
                    try {
                        const salaSnap = await getDoc(doc(db, "partidas", salaId));
                        if (!salaSnap.exists()) {
                            
                            // QUEM ABRE A SALA SEMPRE SERÁ O HOST (JOGADOR 1)
                            let p1Uid = currentUserUid; 
                            let p2Uid = tAdv;
                            
                            const mySnap = await getDoc(doc(db, "users", p1Uid));
                            const oppSnap = await getDoc(doc(db, "users", p2Uid));
                            
                            let p1Data = mySnap.data() || {};
                            let p2Data = oppSnap.data() || {};
                            
                            // 1. CORREÇÃO DAS CARTAS: Puxa as cartas reais do deck, e não as letras do nome!
                            let j1Deck = (p1Data.decks && p1Data.deckPadrao && p1Data.decks[p1Data.deckPadrao]) ? [...p1Data.decks[p1Data.deckPadrao].cartas] : [];
                            
                            let j2Deck = [];
                            if(p2Uid.startsWith('bot_')) { 
                                j2Deck = Object.keys(INFO_CARTAS).slice(0, 20); 
                            } else if (p2Data.decks && p2Data.deckPadrao && p2Data.decks[p2Data.deckPadrao]) {
                                j2Deck = [...p2Data.decks[p2Data.deckPadrao].cartas];
                            }

                            // Trava de segurança extra
                            if(j1Deck.length < 20) j1Deck = Object.keys(INFO_CARTAS).slice(0, 20);
                            if(j2Deck.length < 20) j2Deck = Object.keys(INFO_CARTAS).slice(0, 20);
                            
                            await setDoc(doc(db, "partidas", salaId), {
                                status: 'aguardando',
                                jogador1: { uid: p1Uid, nome: p1Data.nomeDisplay || p1Data.nome || 'JOGADOR 1', foto: p1Data.fotoPerfil || 'fundo_carta.png', deck: j1Deck },
                                jogador2: { uid: p2Uid, nome: p2Data.nomeDisplay || p2Data.nome || 'JOGADOR 2', foto: p2Data.fotoPerfil || 'fundo_carta.png', deck: j2Deck }
                            });

                            // 2. CORREÇÃO DO LOOP INFINITO: Limpa a "sala de espera" no torneio assim que a partida é criada!
                            try {
                                await updateDoc(doc(db, "torneios", window.torneioId), {
                                    [`lobbies.${salaId}`]: []
                                });
                            } catch(e) {}
                        }
                    } catch(e) { console.error("Erro ao montar sala torneio:", e); }
                } else {
                    salaId = new URLSearchParams(window.location.search).get('sala');
                }
                // === FIM DA BARREIRA ===

                if (!salaId) return window.location.href = 'batalha.html';

                onSnapshot(doc(db, "partidas", salaId), (docSnap) => {
                    if (!docSnap.exists()) return window.location.href = window.isTorneio ? 'torneios.html' : 'batalha.html';
                    dadosSala = docSnap.data();

                    if (dadosSala.jogador1?.uid === dadosSala.jogador2?.uid) {
                        alert("ERRO!"); return window.location.href = window.isTorneio ? 'torneios.html' : 'batalha.html';
                    }

                    if (dadosSala.jogador1?.uid === currentUserUid) { minhaRole = 'jogador1'; oppRole = 'jogador2'; isHost = true; }
                    else if (dadosSala.jogador2?.uid === currentUserUid) { minhaRole = 'jogador2'; oppRole = 'jogador1'; isHost = false; }
                    else return window.location.href = window.isTorneio ? 'torneios.html' : 'batalha.html';

                    if (!dadosSala.jogador2) return; 

                    if (isHost && !dadosSala.jogador1.mao) {
                        let j1 = [...dadosSala.jogador1.deck], j2 = [...dadosSala.jogador2.deck]; shuffle(j1); shuffle(j2);
                        updateDoc(doc(db, "partidas", salaId), { 
                            'jogador1.mao': j1.splice(0,5), 
                            'jogador1.deck': j1, 
                            'jogador1.pilhaVitorias': [], 
                            'jogador2.mao': j2.splice(0,5), 
                            'jogador2.deck': j2, 
                            'jogador2.pilhaVitorias': [], 
                            'statusTurno': 'aguardando_ataque', 
                            'turnoAtual': 1, 
                            'quemAtaca': Math.random() < 0.5 ? dadosSala.jogador1.uid : dadosSala.jogador2.uid 
                        }); return; 
                    }

                    if (!dadosSala.jogador1.mao) return; 

                    renderizarArena(); atualizarAtributoPiscando();

                    // GATILHO DA ANIMAÇÃO LOCAL
                    let animandoAgora = false;
                    if (dadosSala.ultimoClash && dadosSala.ultimoClash.turno > window.turnoAnimadoLocal) {
                        window.turnoAnimadoLocal = dadosSala.ultimoClash.turno;
                        animandoAgora = true;
                        exibirAnimacaoClash(dadosSala.ultimoClash);
                    }

                    // Dispara Toasts avisando se ele deve esperar a animação terminar
                    dispararToastsDeTurno(animandoAgora);

                    // Aguarda a tela de clash fechar para abrir a tela de pontos finais
                    if (dadosSala.status === 'finalizada' && document.getElementById('modal-embate').classList.contains('hidden')) {
                        iniciarCascataFinal();
                    }

                    // Se for a hora do combate, o Host calcula tudo num instante só
                    if (dadosSala.statusTurno === 'resolvendo' && isHost) resolverCombateHost();
                });
            } else window.location.href = "index.html";
        });
    </script>
