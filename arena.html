<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supercards - Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            /* Fundo gradiente inspirado na sua imagem de referência */
            background: linear-gradient(180deg, #7a32a8 0%, #4ade80 100%);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        #toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            width: 90%;
            max-width: 350px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast-msg {
            background: #dca3e8;
            color: #7a32a8;
            border: 3px solid #7a32a8;
            padding: 12px 20px;
            border-radius: 9999px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.3);
            text-align: center;
            font-weight: 900;
            font-size: 0.85rem;
            animation: slideDown 0.3s ease-out;
            pointer-events: auto;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Classes para a mão em leque do adversário */
        .leque-1 { transform: rotate(-15deg) translateY(10px); }
        .leque-2 { transform: rotate(-5deg) translateY(0px); }
        .leque-3 { transform: rotate(5deg) translateY(0px); }
        .leque-4 { transform: rotate(15deg) translateY(10px); }

        /* Animação para puxar a carta */
        .hover-carta { transition: transform 0.2s ease, z-index 0s; }
        .hover-carta:hover { transform: translateY(-20px) scale(1.05); z-index: 50; }
    </style>
</head>
<body class="fixed inset-0 overflow-hidden w-screen h-screen">

    <div id="toast-container"></div>

    <div class="w-full h-full max-w-sm mx-auto relative flex flex-col border-x-2 border-[#dca3e8]/30 shadow-2xl">

        <!-- STATUS DA PARTIDA (De quem é o turno) -->
        <div id="status-turno" class="absolute top-20 w-full text-center z-10 hidden">
            <span class="bg-black/50 text-white font-black text-xs px-4 py-1 rounded-full uppercase tracking-widest border border-white/30 backdrop-blur-sm shadow-lg">
                SEU TURNO DE ATACAR
            </span>
        </div>

        <!-- ================= ÁREA DO ADVERSÁRIO (TOPO) ================= -->
        <div class="w-full h-[45%] relative z-20">
            
            <!-- Perfil do Adversário -->
            <div class="absolute top-4 left-1/2 transform -translate-x-1/2 flex items-center bg-[#dca3e8] rounded-full border-4 border-black w-[85%] max-w-[280px] shadow-lg z-30 overflow-hidden h-12">
                <div class="w-12 h-12 bg-white flex items-center justify-center flex-shrink-0 border-r-4 border-black">
                    <img id="opp-foto" src="" class="w-full h-full object-cover hidden">
                    <span id="opp-foto-placeholder" class="text-[#7a32a8] font-black text-[10px]">FOTO</span>
                </div>
                <span id="opp-nome" class="flex-grow text-center text-[#7a32a8] font-black text-sm uppercase truncate px-2">BUSCANDO...</span>
            </div>

            <!-- Mão do Adversário (Leque Invertido) -->
            <div id="mao-adversario" class="absolute top-16 left-1/2 transform -translate-x-1/2 flex justify-center w-full z-10 pointer-events-none">
                <img src="fundo_carta.png" class="w-16 object-contain leque-1 shadow-md -mr-4">
                <img src="fundo_carta.png" class="w-16 object-contain leque-2 shadow-md -mr-4">
                <img src="fundo_carta.png" class="w-16 object-contain shadow-md z-10">
                <img src="fundo_carta.png" class="w-16 object-contain leque-3 shadow-md -ml-4">
                <img src="fundo_carta.png" class="w-16 object-contain leque-4 shadow-md -ml-4">
            </div>

            <!-- Deck do Adversário -->
            <div class="absolute top-[50%] right-4 flex flex-col items-center">
                <img src="fundo_carta.png" class="w-16 object-contain drop-shadow-xl brightness-75">
                <span id="opp-deck-count" class="text-white font-black text-2xl -mt-10 drop-shadow-[0_2px_2px_rgba(0,0,0,1)] z-10">15</span>
            </div>

        </div>

        <!-- ================= MARCA D'ÁGUA CENTRAL ================= -->
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-0">
            <h1 class="text-white/20 font-black text-4xl uppercase tracking-widest rotate-[-15deg]">SUPERCARDS</h1>
        </div>

        <!-- ================= ÁREA DO JOGADOR (BASE) ================= -->
        <div class="w-full h-[55%] relative z-20 border-t-2 border-[#dca3e8]/20 backdrop-blur-sm bg-black/10">
            
            <!-- Deck do Jogador -->
            <div class="absolute top-10 left-4 flex flex-col items-center">
                <img src="fundo_carta.png" class="w-16 object-contain drop-shadow-xl brightness-75">
                <span id="player-deck-count" class="text-[#4ade80] font-black text-2xl -mt-10 drop-shadow-[0_2px_2px_rgba(0,0,0,1)] z-10">15</span>
            </div>

            <!-- Área de Combate (Centro da tela, onde as cartas vão bater) -->
            <div id="arena-combate" class="absolute -top-16 left-1/2 transform -translate-x-1/2 w-full h-32 flex justify-center items-center gap-4 z-40 hidden">
                <!-- Carta do Jogador -->
                <div id="carta-jogada-player" class="w-24 aspect-[2.5/3.5] bg-gray-800 rounded-lg shadow-2xl border-2 border-white transform translate-y-10 transition-transform duration-500"></div>
                <!-- Carta do Adversário -->
                <div id="carta-jogada-opp" class="w-24 aspect-[2.5/3.5] bg-gray-800 rounded-lg shadow-2xl border-2 border-black transform -translate-y-10 transition-transform duration-500"></div>
            </div>

            <!-- Mão do Jogador (Cartas enfileiradas) -->
            <div id="mao-jogador" class="absolute bottom-4 left-0 w-full flex justify-center gap-1 px-2 z-30">
                <!-- Essas cartas são provisórias só para você ver o design na tela -->
                <div onclick="abrirZoomCarta('001')" class="w-[19%] aspect-[2.5/3.5] bg-gray-800 rounded-md shadow-xl border-2 border-transparent hover:border-[#4ade80] cursor-pointer hover-carta relative">
                    <img src="fundo_carta.png" class="w-full h-full object-cover rounded-sm">
                </div>
                <div onclick="abrirZoomCarta('002')" class="w-[19%] aspect-[2.5/3.5] bg-gray-800 rounded-md shadow-xl border-2 border-transparent hover:border-[#4ade80] cursor-pointer hover-carta relative">
                    <img src="fundo_carta.png" class="w-full h-full object-cover rounded-sm">
                </div>
                <div onclick="abrirZoomCarta('003')" class="w-[19%] aspect-[2.5/3.5] bg-gray-800 rounded-md shadow-xl border-2 border-transparent hover:border-[#4ade80] cursor-pointer hover-carta relative">
                    <img src="fundo_carta.png" class="w-full h-full object-cover rounded-sm">
                </div>
                <div onclick="abrirZoomCarta('004')" class="w-[19%] aspect-[2.5/3.5] bg-gray-800 rounded-md shadow-xl border-2 border-transparent hover:border-[#4ade80] cursor-pointer hover-carta relative">
                    <img src="fundo_carta.png" class="w-full h-full object-cover rounded-sm">
                </div>
                <div onclick="abrirZoomCarta('005')" class="w-[19%] aspect-[2.5/3.5] bg-gray-800 rounded-md shadow-xl border-2 border-transparent hover:border-[#4ade80] cursor-pointer hover-carta relative">
                    <img src="fundo_carta.png" class="w-full h-full object-cover rounded-sm">
                </div>
            </div>

        </div>

        <!-- ================= MODAL DE ZOOM E ATAQUE ================= -->
        <div id="modal-zoom" class="hidden fixed inset-0 bg-black/90 z-[100] flex flex-col items-center justify-center p-4 backdrop-blur-md">
            
            <button onclick="fecharZoomCarta()" class="absolute top-4 right-6 text-white font-black text-2xl hover:text-gray-300 transition-colors z-50">X</button>
            
            <h2 id="titulo-acao" class="text-white font-black text-xl text-center uppercase tracking-wider mb-4 drop-shadow-md">ESCOLHA O ATRIBUTO</h2>
            
            <!-- Imagem em alta resolução da carta -->
            <img id="zoom-img" src="fundo_carta.png" alt="Carta" class="w-[65%] max-w-[240px] aspect-[2.5/3.5] object-cover drop-shadow-2xl mb-6 rounded-xl border-4 border-[#bc7bd4]">
            
            <!-- Botões de Atributo -->
            <div id="painel-atributos" class="grid grid-cols-2 gap-3 w-full max-w-xs">
                <button onclick="confirmarAcao('aura')" class="bg-blue-600 hover:bg-blue-500 text-white font-black text-xs py-3 rounded-lg shadow-lg border-2 border-blue-400 uppercase tracking-widest">
                    AURA
                </button>
                <button onclick="confirmarAcao('fofura')" class="bg-pink-500 hover:bg-pink-400 text-white font-black text-xs py-3 rounded-lg shadow-lg border-2 border-pink-300 uppercase tracking-widest">
                    FOFURA
                </button>
                <button onclick="confirmarAcao('diversao')" class="bg-yellow-500 hover:bg-yellow-400 text-black font-black text-xs py-3 rounded-lg shadow-lg border-2 border-yellow-300 uppercase tracking-widest">
                    DIVERSÃO
                </button>
                <button onclick="confirmarAcao('aleatoriedade')" class="bg-purple-600 hover:bg-purple-500 text-white font-black text-xs py-3 rounded-lg shadow-lg border-2 border-purple-400 uppercase tracking-widest">
                    ALEATORIEDADE
                </button>
            </div>
        </div>

    </div>

    <!-- SCRIPT DE INTERFACE BÁSICA -->
    <script type="module">
        import { INFO_CARTAS } from './cartas.js';

        let cartaFocadaId = null;

        window.mostrarToast = function(mensagem) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast-msg';
            toast.innerHTML = mensagem;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s ease';
                setTimeout(() => toast.remove(), 500); 
            }, 3000);
        };

        window.abrirZoomCarta = function(idCarta) {
            cartaFocadaId = idCarta;
            
            if (INFO_CARTAS && INFO_CARTAS[idCarta]) {
                document.getElementById('zoom-img').src = INFO_CARTAS[idCarta].imagem;
            }

            document.getElementById('modal-zoom').classList.remove('hidden');
        };

        window.fecharZoomCarta = function() {
            document.getElementById('modal-zoom').classList.add('hidden');
            cartaFocadaId = null;
        };

        window.confirmarAcao = function(atributo) {
            fecharZoomCarta();
            window.mostrarToast(`Você declarou ataque com ${atributo.toUpperCase()}! Aguardando adversário...`);
        };

    </script>
</body>
</html>
