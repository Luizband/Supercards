<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supercards - Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(180deg, #7a32a8 0%, #4ade80 100%);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        #toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            width: 90%;
            max-width: 350px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast-msg {
            background: #dca3e8;
            color: #7a32a8;
            border: 3px solid #7a32a8;
            padding: 12px 20px;
            border-radius: 9999px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.3);
            text-align: center;
            font-weight: 900;
            font-size: 0.85rem;
            animation: slideDown 0.3s ease-out forwards;
            pointer-events: auto;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .leque-1 { transform: rotate(-15deg) translateY(10px); }
        .leque-2 { transform: rotate(-5deg) translateY(0px); }
        .leque-3 { transform: rotate(5deg) translateY(0px); }
        .leque-4 { transform: rotate(15deg) translateY(10px); }

        /* Animação das suas cartas sobrepostas */
        .hover-carta { 
            transition: transform 0.2s ease, z-index 0s; 
        }
        .hover-carta:hover { 
            transform: translateY(-20px) scale(1.1); 
            z-index: 50 !important; 
        }
    </style>
</head>
<body class="fixed inset-0 overflow-hidden w-screen h-screen">

    <div id="toast-container"></div>

    <div class="w-full h-full max-w-sm mx-auto relative flex flex-col border-x-2 border-[#dca3e8]/30 shadow-2xl">

        <!-- ================= CABEÇALHO COM BOTÃO DESISTIR ================= -->
        <div class="absolute top-4 w-[95%] left-1/2 transform -translate-x-1/2 flex items-center justify-between bg-[#dca3e8] rounded-full shadow-lg z-50 h-12 px-2">
            
            <div class="flex-1 text-center truncate pr-8">
                <span id="opp-nome" class="text-[#7a32a8] font-black text-[11px] uppercase tracking-wide">BUSCANDO...</span>
            </div>
            
            <div class="absolute left-1/2 transform -translate-x-1/2 -top-2 w-16 h-16 bg-[#dca3e8] rounded-full flex items-center justify-center shadow-md overflow-hidden z-40 border-2 border-[#bc7bd4]">
                <img id="opp-foto" src="" class="hidden w-full h-full object-cover">
                <span id="opp-foto-placeholder" class="text-[#7a32a8] font-black text-[10px]">FOTO</span>
            </div>
            
            <div class="flex-1 flex justify-end pl-8">
                <button onclick="abrirModalDesistir()" class="bg-red-600 hover:bg-red-700 text-white font-black text-[9px] px-3 py-1.5 rounded-full shadow-md border-2 border-red-800 uppercase tracking-widest transition-transform active:scale-95">
                    DESISTIR
                </button>
            </div>
        </div>

        <!-- ================= ÁREA DO ADVERSÁRIO ================= -->
        <div class="w-full h-[45%] relative z-20 mt-16">

            <div id="mao-adversario" class="absolute top-4 left-1/2 transform -translate-x-1/2 flex justify-center w-full z-10 pointer-events-none">
                <!-- Injetado via JS -->
            </div>

            <!-- Deck Invertido -->
            <div class="absolute bottom-4 right-4 flex flex-col items-center">
                <img src="fundo_carta.png" class="w-14 object-contain drop-shadow-xl brightness-50 rounded-md border border-black">
                <span id="opp-deck-count" class="text-white font-black text-xl -mt-9 drop-shadow-[0_2px_4px_rgba(0,0,0,1)] z-10">20</span>
            </div>

        </div>

        <!-- ================= LOGO ================= -->
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-0">
            <img src="logo.png" class="w-[80%] max-w-[250px] opacity-20 grayscale object-contain drop-shadow-lg">
        </div>

        <!-- ================= ÁREA DO JOGADOR ================= -->
        <div class="w-full h-[55%] relative z-20 border-t-2 border-[#dca3e8]/20 backdrop-blur-sm bg-black/10">
            
            <div class="absolute top-4 left-4 flex flex-col items-center">
                <img src="fundo_carta.png" class="w-14 object-contain drop-shadow-xl brightness-50 rounded-md border border-black">
                <span id="player-deck-count" class="text-white font-black text-xl -mt-9 drop-shadow-[0_2px_4px_rgba(0,0,0,1)] z-10">20</span>
            </div>

            <!-- Centro da Arena -->
            <div id="arena-combate" class="absolute -top-16 left-1/2 transform -translate-x-1/2 w-full h-32 flex justify-center items-center gap-4 z-40 hidden">
                <div id="carta-jogada-player" class="w-[85px] aspect-[2.5/3.5] bg-gray-800 rounded-lg shadow-2xl border-2 border-white transform translate-y-10 transition-all duration-500"></div>
                <div id="carta-jogada-opp" class="w-[85px] aspect-[2.5/3.5] bg-gray-800 rounded-lg shadow-2xl border-2 border-black transform -translate-y-10 transition-all duration-500"></div>
            </div>

            <!-- Mão do jogador MAIOR e SOBREPOSTA -->
            <div id="mao-jogador" class="absolute bottom-9 left-1/2 transform -translate-x-1/2 w-full flex justify-center -space-x-4 px-2 z-30">
                <!-- Injetado via JS -->
            </div>

        </div>

        <!-- ================= MODAL AÇÃO ================= -->
        <div id="modal-zoom" class="hidden fixed inset-0 bg-black/90 z-[100] flex flex-col items-center justify-center p-4 backdrop-blur-md">
            <button onclick="fecharZoomCarta()" class="absolute top-4 right-6 text-white font-black text-2xl hover:text-gray-300 transition-colors z-50">X</button>
            <h2 id="titulo-acao" class="text-white font-black text-xl text-center uppercase tracking-wider mb-4 drop-shadow-md">AÇÃO DA CARTA</h2>
            <img id="zoom-img" src="fundo_carta.png" alt="Carta" class="w-[65%] max-w-[240px] aspect-[2.5/3.5] object-cover drop-shadow-2xl mb-6 rounded-xl border-4 border-[#bc7bd4]">
            
            <div id="painel-atributos" class="grid grid-cols-2 gap-3 w-full max-w-xs hidden">
                <button onclick="confirmarAcao('aura')" class="bg-blue-600 hover:bg-blue-500 text-white font-black text-xs py-3 rounded-lg shadow-lg border-2 border-blue-400 uppercase tracking-widest">AURA</button>
                <button onclick="confirmarAcao('fofura')" class="bg-pink-500 hover:bg-pink-400 text-white font-black text-xs py-3 rounded-lg shadow-lg border-2 border-pink-300 uppercase tracking-widest">FOFURA</button>
                <button onclick="confirmarAcao('diversao')" class="bg-yellow-500 hover:bg-yellow-400 text-black font-black text-xs py-3 rounded-lg shadow-lg border-2 border-yellow-300 uppercase tracking-widest">DIVERSÃO</button>
                <button onclick="confirmarAcao('aleatoriedade')" class="bg-purple-600 hover:bg-purple-500 text-white font-black text-xs py-3 rounded-lg shadow-lg border-2 border-purple-400 uppercase tracking-widest">ALEATORIEDADE</button>
            </div>

            <div id="painel-defesa" class="w-full max-w-xs hidden">
                <button id="btn-defender" onclick="confirmarDefesa()" class="w-full bg-red-600 hover:bg-red-500 text-white font-black text-xs py-4 rounded-lg shadow-lg border-2 border-red-400 uppercase tracking-widest"></button>
            </div>
        </div>

        <!-- ================= MODAL DESISTIR ================= -->
        <div id="modal-desistir" class="hidden fixed inset-0 bg-black/80 z-[100] flex items-center justify-center p-4 backdrop-blur-sm">
            <div class="bg-[#dca3e8] border-4 border-[#7a32a8] rounded-2xl p-6 max-w-xs w-full text-center shadow-2xl relative">
                <h2 class="text-red-600 font-black text-lg mb-2 uppercase">Desistir da Batalha?</h2>
                <p class="text-[#7a32a8] font-bold text-xs mb-6">A partida será encerrada imediatamente e nenhum jogador receberá recompensas.</p>
                <div class="flex justify-center gap-4">
                    <button onclick="fecharModalDesistir()" class="flex-1 bg-gray-500 hover:bg-gray-600 text-white font-black py-2 rounded-full shadow-md uppercase text-xs">NÃO</button>
                    <button onclick="confirmarDesistencia()" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-black py-2 rounded-full shadow-md uppercase text-xs">SIM</button>
                </div>
            </div>
        </div>

        <!-- ================= FASES DE FIM DE JOGO ================= -->
        <div id="modal-fim-etapa" class="hidden fixed inset-0 bg-black/95 z-[200] flex flex-col items-center justify-start pt-10 p-4 backdrop-blur-md">
            
            <h1 id="fim-titulo-jogador" class="text-[#dca3e8] font-black text-xl uppercase tracking-widest mb-1 text-center">CARTAS DE JOGADOR</h1>
            <h2 id="fim-pontos-jogador" class="text-white font-black text-4xl mb-6 drop-shadow-md">0 PTS</h2>
            
            <div id="fim-grid-cartas" class="grid grid-cols-4 gap-2 w-full max-w-sm overflow-y-auto no-scrollbar content-start flex-grow pb-10">
                <!-- Cartas Injetadas -->
            </div>

            <div class="w-full max-w-sm pb-8 flex-shrink-0 flex justify-center mt-4">
                <button id="btn-avancar-fim" onclick="avancarEtapaFim()" class="bg-[#7a32a8] hover:bg-purple-600 text-white font-black py-3 px-12 rounded-full shadow-lg border-2 border-[#bc7bd4] tracking-widest uppercase">
                    AVANÇAR
                </button>
            </div>
        </div>

        <div id="modal-resultado-final" class="hidden fixed inset-0 bg-black/95 z-[250] flex flex-col items-center justify-center p-4">
            <h1 id="texto-vitoria" class="text-5xl font-black text-white uppercase tracking-widest mb-6 drop-shadow-2xl text-center"></h1>
            <div id="recompensas-final" class="bg-[#dca3e8] border-4 border-[#7a32a8] rounded-2xl p-6 w-full max-w-xs flex flex-col items-center gap-2 mb-8 shadow-2xl">
                <span class="text-[#7a32a8] font-black text-lg">RECOMPENSAS</span>
                <span class="text-black font-bold text-sm">+10 XP</span>
                <span class="text-black font-bold text-sm flex items-center gap-1">+10 <img src="moedas.png" class="w-4 h-4"></span>
            </div>
            <button onclick="window.location.href='batalha.html'" class="bg-[#7a32a8] hover:bg-purple-600 text-white font-black py-4 px-12 rounded-full shadow-lg border-2 border-white tracking-widest text-lg">FINALIZAR</button>
        </div>

    </div>

    <!-- SCRIPT FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, updateDoc, deleteDoc, getDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { INFO_CARTAS } from './cartas.js';

        const firebaseConfig = {
          apiKey: "AIzaSyCU3lFTgfrDMaD9jwR7X7ivYPmGQh4VE1g",
          authDomain: "supercards-tcg.firebaseapp.com",
          projectId: "supercards-tcg",
          storageBucket: "supercards-tcg.firebasestorage.app",
          messagingSenderId: "862316380615",
          appId: "1:862316380615:web:b3f28056ebc967673999e2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserUid = null;
        let minhaRole = null; 
        let oppRole = null;
        let isHost = false;
        let salaId = null;
        let dadosSala = null;
        let cartaFocadaId = null;
        let ultimoEstado = null; // Para travar repetições de toast

        // Controle de fim de jogo
        let etapaFim = 0; 
        let pointsJ1 = 0;
        let pointsJ2 = 0;

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex > 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        window.mostrarToast = function(mensagem) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast-msg';
            toast.innerHTML = mensagem;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s ease';
                setTimeout(() => toast.remove(), 500); 
            }, 4000); // 4 segundos na tela
        };

        // ==========================================
        // RENDERIZAÇÃO DA ARENA
        // ==========================================
        function renderizarArena() {
            const oppData = dadosSala[oppRole];
            const myData = dadosSala[minhaRole];

            document.getElementById('opp-nome').innerText = oppData.nome;
            if (oppData.foto) {
                document.getElementById('opp-foto').src = oppData.foto;
                document.getElementById('opp-foto').classList.remove('hidden');
                document.getElementById('opp-foto-placeholder').classList.add('hidden');
            }

            document.getElementById('opp-deck-count').innerText = oppData.deck.length;
            document.getElementById('player-deck-count').innerText = myData.deck.length;

            const oppMaoContainer = document.getElementById('mao-adversario');
            oppMaoContainer.innerHTML = '';
            const classesLeque = ['leque-1 -mr-4', 'leque-2 -mr-4', 'z-10', 'leque-3 -ml-4', 'leque-4 -ml-4'];
            oppData.mao.forEach((_, i) => {
                oppMaoContainer.innerHTML += `<img src="fundo_carta.png" class="w-[18%] max-w-[65px] object-contain ${classesLeque[i] || ''} shadow-md border border-black/20 rounded-md">`;
            });

            // Mão do Jogador (Maiores e Sobrepostas via flex e space-x)
            const myMaoContainer = document.getElementById('mao-jogador');
            myMaoContainer.innerHTML = '';
            myData.mao.forEach((cartaId, index) => {
                const info = INFO_CARTAS[cartaId] || { miniatura: 'fundo_carta.png', imagem: 'fundo_carta.png' };
                myMaoContainer.innerHTML += `
                    <div onclick="abrirZoomCarta('${cartaId}')" class="w-[26%] max-w-[90px] aspect-[2.5/3.5] bg-gray-800 rounded-md shadow-2xl border-2 border-transparent hover:border-[#4ade80] cursor-pointer hover-carta relative overflow-hidden" style="z-index: ${index};">
                        <img src="${info.miniatura || info.imagem}" class="w-full h-full object-cover">
                    </div>
                `;
            });

            const arenaCombate = document.getElementById('arena-combate');
            const slotOpp = document.getElementById('carta-jogada-opp');
            const slotPlayer = document.getElementById('carta-jogada-player');
            
            slotPlayer.className = "w-[85px] aspect-[2.5/3.5] bg-gray-800 rounded-lg shadow-2xl border-2 border-white transform translate-y-10 transition-all duration-500";
            slotOpp.className = "w-[85px] aspect-[2.5/3.5] bg-gray-800 rounded-lg shadow-2xl border-2 border-black transform -translate-y-10 transition-all duration-500";

            let hasCardInCenter = false;
            
            if (myData.cartaJogada) {
                hasCardInCenter = true;
                const info = INFO_CARTAS[myData.cartaJogada] || { imagem: 'fundo_carta.png' };
                slotPlayer.innerHTML = `<img src="${info.imagem}" class="w-full h-full object-cover rounded-md">`;
                slotPlayer.classList.remove('opacity-0');
            } else {
                slotPlayer.classList.add('opacity-0');
            }

            if (oppData.cartaJogada) {
                hasCardInCenter = true;
                // Só revela a carta do adversário se o status for resolvendo ou resultado
                if (dadosSala.statusTurno === 'resolvendo' || dadosSala.statusTurno === 'exibindo_resultado') {
                    const info = INFO_CARTAS[oppData.cartaJogada] || { imagem: 'fundo_carta.png' };
                    slotOpp.innerHTML = `<img src="${info.imagem}" class="w-full h-full object-cover rounded-md">`;
                } else {
                    slotOpp.innerHTML = `<img src="fundo_carta.png" class="w-full h-full object-cover rounded-md">`;
                }
                slotOpp.classList.remove('opacity-0');
            } else {
                slotOpp.classList.add('opacity-0');
            }

            if (hasCardInCenter) arenaCombate.classList.remove('hidden');
            else arenaCombate.classList.add('hidden');
        }

        // ==========================================
        // GESTÃO DE TOASTS E AÇÕES
        // ==========================================
        function gerenciarToastsDeTurno() {
            let estadoAtual = `${dadosSala.turnoAtual}-${dadosSala.statusTurno}`;
            if (ultimoEstado === estadoAtual) return;
            ultimoEstado = estadoAtual;

            const atacanteNome = dadosSala.quemAtaca === dadosSala.jogador1.uid ? dadosSala.jogador1.nome : dadosSala.jogador2.nome;
            const defensorNome = dadosSala.quemAtaca === dadosSala.jogador1.uid ? dadosSala.jogador2.nome : dadosSala.jogador1.nome;

            if (dadosSala.statusTurno === 'aguardando_ataque') {
                window.mostrarToast(`Vez do jogador ${atacanteNome} escolher uma carta e uma caracteristica!`);
            } else if (dadosSala.statusTurno === 'aguardando_defesa') {
                const attrStr = dadosSala.atributoTurno ? dadosSala.atributoTurno.toUpperCase() : "ATRIBUTO";
                window.mostrarToast(`Vez do jogador ${defensorNome} jogar uma carta com ${attrStr}!`);
            } else if (dadosSala.statusTurno === 'exibindo_resultado') {
                if (dadosSala.vencedorTurno === 'empate') {
                    window.mostrarToast(`Jogador ${dadosSala.nomeVencedorTurno} ganhou por desempate!`);
                } else {
                    window.mostrarToast(`Jogador ${dadosSala.nomeVencedorTurno} ganhou!`);
                }
            }
        }

        window.abrirZoomCarta = function(idCarta) {
            if (dadosSala.statusTurno === 'resolvendo' || dadosSala.statusTurno === 'exibindo_resultado' || dadosSala.status === 'finalizada') return;
            if (dadosSala[minhaRole].cartaJogada) return; 

            const isMyTurn = dadosSala.quemAtaca === currentUserUid;
            if (!isMyTurn && dadosSala.statusTurno === 'aguardando_ataque') return; // Espera o atacante

            cartaFocadaId = idCarta;
            document.getElementById('zoom-img').src = INFO_CARTAS[idCarta]?.imagem || 'fundo_carta.png';

            const painelAtributos = document.getElementById('painel-atributos');
            const painelDefesa = document.getElementById('painel-defesa');

            if (isMyTurn) {
                painelAtributos.classList.remove('hidden');
                painelDefesa.classList.add('hidden');
            } else {
                painelAtributos.classList.add('hidden');
                painelDefesa.classList.remove('hidden');
                document.getElementById('btn-defender').innerText = `DEFENDER (${dadosSala.atributoTurno.toUpperCase()})`;
            }

            document.getElementById('modal-zoom').classList.remove('hidden');
        };

        window.fecharZoomCarta = function() {
            document.getElementById('modal-zoom').classList.add('hidden');
            cartaFocadaId = null;
        };

        window.confirmarAcao = function(atributo) {
            fecharZoomCarta();
            const myMao = [...dadosSala[minhaRole].mao];
            const newMao = myMao.filter(id => id !== cartaFocadaId);

            let updates = {
                [`${minhaRole}.cartaJogada`]: cartaFocadaId,
                [`${minhaRole}.mao`]: newMao
            };

            const isMyTurn = dadosSala.quemAtaca === currentUserUid;
            if (isMyTurn) {
                updates.atributoTurno = atributo;
                updates.statusTurno = 'aguardando_defesa';
            } else {
                updates.statusTurno = 'resolvendo'; // Engatilha o Host
            }

            updateDoc(doc(db, "partidas", salaId), updates);
        };

        window.confirmarDefesa = function() {
            window.confirmarAcao(null);
        };

        // ==========================================
        // LÓGICA DO HOST
        // ==========================================
        async function resolverCombateHost() {
            if (window.resolvendoHost) return;
            window.resolvendoHost = true;

            // Espera 3 segundos para ler as cartas
            await new Promise(resolve => setTimeout(resolve, 3000));

            const id1 = dadosSala.jogador1.cartaJogada;
            const id2 = dadosSala.jogador2.cartaJogada;
            const attr = dadosSala.atributoTurno.toLowerCase();

            const info1 = INFO_CARTAS[id1] || { aura:0, fofura:0, diversao:0, aleatoriedade:0 };
            const info2 = INFO_CARTAS[id2] || { aura:0, fofura:0, diversao:0, aleatoriedade:0 };

            let val1 = info1[attr] || 0;
            let val2 = info2[attr] || 0;

            let vencedorKey = null;
            let nomeVencedor = "";
            let tipoVitoria = "normal";

            if (val1 > val2) {
                vencedorKey = 'jogador1';
                nomeVencedor = dadosSala.jogador1.nome;
            } else if (val2 > val1) {
                vencedorKey = 'jogador2';
                nomeVencedor = dadosSala.jogador2.nome;
            } else {
                // Desempate
                tipoVitoria = "empate";
                const m1 = Math.max(info1.aura, info1.fofura, info1.diversao, info1.aleatoriedade);
                const m2 = Math.max(info2.aura, info2.fofura, info2.diversao, info2.aleatoriedade);
                
                if (m1 > m2) {
                    vencedorKey = 'jogador1'; nomeVencedor = dadosSala.jogador1.nome;
                } else if (m2 > m1) {
                    vencedorKey = 'jogador2'; nomeVencedor = dadosSala.jogador2.nome;
                } else {
                    vencedorKey = dadosSala.quemAtaca === dadosSala.jogador1.uid ? 'jogador1' : 'jogador2';
                    nomeVencedor = dadosSala[vencedorKey].nome;
                }
            }

            // Exibe resultado pra geral
            await updateDoc(doc(db, "partidas", salaId), {
                statusTurno: 'exibindo_resultado',
                vencedorTurno: tipoVitoria,
                nomeVencedorTurno: nomeVencedor,
                chaveVencedor: vencedorKey
            });

            // Espera 2.5 segundos de Toast
            await new Promise(resolve => setTimeout(resolve, 2500));

            // Coleta prêmios e saca
            let j1Pilha = [...(dadosSala.jogador1.pilhaVitorias || [])];
            let j2Pilha = [...(dadosSala.jogador2.pilhaVitorias || [])];

            if (vencedorKey === 'jogador1') j1Pilha.push(id1, id2);
            else j2Pilha.push(id1, id2);

            let j1Deck = [...dadosSala.jogador1.deck];
            let j1Mao = [...dadosSala.jogador1.mao];
            if (j1Deck.length > 0) j1Mao.push(j1Deck.shift());

            let j2Deck = [...dadosSala.jogador2.deck];
            let j2Mao = [...dadosSala.jogador2.mao];
            if (j2Deck.length > 0) j2Mao.push(j2Deck.shift());
            
            let proxTurno = dadosSala.turnoAtual + 1;
            let proxAtacante = (dadosSala.quemAtaca === dadosSala.jogador1.uid) ? dadosSala.jogador2.uid : dadosSala.jogador1.uid;
            
            let updates = {
                'jogador1.pilhaVitorias': j1Pilha, 'jogador2.pilhaVitorias': j2Pilha,
                'jogador1.deck': j1Deck, 'jogador1.mao': j1Mao,
                'jogador2.deck': j2Deck, 'jogador2.mao': j2Mao,
                'jogador1.cartaJogada': null, 'jogador2.cartaJogada': null,
                'atributoTurno': null, 'vencedorTurno': null, 'nomeVencedorTurno': null, 'chaveVencedor': null
            };

            if (j1Mao.length === 0 && j2Mao.length === 0) {
                updates['status'] = 'finalizada';
                updates['statusTurno'] = 'finalizada';
            } else {
                updates['turnoAtual'] = proxTurno;
                updates['statusTurno'] = 'aguardando_ataque';
                updates['quemAtaca'] = proxAtacante;
            }

            await updateDoc(doc(db, "partidas", salaId), updates);
            window.resolvendoHost = false;
        }

        // ==========================================
        // FIM DE JOGO: CASCATA DE MODAIS
        // ==========================================
        function montarGrid(jogadorKey) {
            const grid = document.getElementById('fim-grid-cartas');
            grid.innerHTML = '';
            
            const pilha = dadosSala[jogadorKey].pilhaVitorias || [];
            let total = 0;
            
            pilha.forEach(id => {
                const info = INFO_CARTAS[id] || { miniatura: 'fundo_carta.png', pontos: 0 };
                total += info.pontos;
                grid.innerHTML += `
                    <div class="relative aspect-[2.5/3.5] bg-gray-800 rounded-md shadow-lg overflow-hidden border-2 border-transparent">
                        <img src="${info.miniatura || info.imagem || 'fundo_carta.png'}" class="w-full h-full object-cover">
                    </div>
                `;
            });
            
            document.getElementById('fim-titulo-jogador').innerText = `CARTAS DE ${dadosSala[jogadorKey].nome}`;
            document.getElementById('fim-pontos-jogador').innerText = `${total} PTS`;
            
            return total;
        }

        window.avancarEtapaFim = async function() {
            etapaFim++;
            if (etapaFim === 2) {
                // Etapa 2: Mostra cartas do Jogador 2
                pointsJ2 = montarGrid('jogador2');
            } else if (etapaFim === 3) {
                // Etapa 3: Veredito
                document.getElementById('modal-fim-etapa').classList.add('hidden');
                
                const myPoints = minhaRole === 'jogador1' ? pointsJ1 : pointsJ2;
                const oppPoints = minhaRole === 'jogador1' ? pointsJ2 : pointsJ1;
                
                const vitoria = myPoints > oppPoints;
                const empate = myPoints === oppPoints;

                document.getElementById('texto-vitoria').innerText = vitoria ? "VITÓRIA!" : (empate ? "EMPATE" : "DERROTA");
                if (!vitoria) document.getElementById('recompensas-final').classList.add('hidden');
                
                document.getElementById('modal-resultado-final').classList.remove('hidden');

                if (vitoria && !window.premioColetado) {
                    window.premioColetado = true;
                    const userRef = doc(db, "users", currentUserUid);
                    await updateDoc(userRef, {
                        moedas: increment(10),
                        xp: increment(10),
                        'estatisticas.batalhasVencidas': increment(1)
                    });
                }
            }
        };

        function iniciarCascataFinal() {
            if (window.etapaIniciada) return;
            window.etapaIniciada = true;
            
            etapaFim = 1;
            pointsJ1 = montarGrid('jogador1');
            document.getElementById('modal-fim-etapa').classList.remove('hidden');
        }

        // ==========================================
        // INICIALIZAÇÃO
        // ==========================================
        window.abrirModalDesistir = function() { document.getElementById('modal-desistir').classList.remove('hidden'); };
        window.fecharModalDesistir = function() { document.getElementById('modal-desistir').classList.add('hidden'); };
        
        window.confirmarDesistencia = async function() {
            if (salaId) {
                try { await deleteDoc(doc(db, "partidas", salaId)); } catch(e) {}
            }
            window.location.href = 'batalha.html';
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUserUid = user.uid;
                const params = new URLSearchParams(window.location.search);
                salaId = params.get('sala');
                
                if (!salaId) return window.location.href = 'batalha.html';

                unsubscribePartida = onSnapshot(doc(db, "partidas", salaId), (docSnap) => {
                    if (!docSnap.exists()) {
                        window.mostrarToast("A sala foi encerrada.");
                        setTimeout(() => window.location.href = 'batalha.html', 1500);
                        return;
                    }

                    dadosSala = docSnap.data();

                    if (dadosSala.jogador1 && dadosSala.jogador1.uid === user.uid) {
                        minhaRole = 'jogador1'; oppRole = 'jogador2'; isHost = true;
                    } else {
                        minhaRole = 'jogador2'; oppRole = 'jogador1'; isHost = false;
                    }

                    // Distribui a mão inicial
                    if (isHost && !dadosSala.jogador1.mao) {
                        let j1Deck = [...dadosSala.jogador1.deck];
                        let j2Deck = [...dadosSala.jogador2.deck];
                        shuffle(j1Deck); shuffle(j2Deck);
                        updateDoc(doc(db, "partidas", salaId), {
                            'jogador1.mao': j1Deck.splice(0, 5), 'jogador1.deck': j1Deck, 'jogador1.pilhaVitorias': [],
                            'jogador2.mao': j2Deck.splice(0, 5), 'jogador2.deck': j2Deck, 'jogador2.pilhaVitorias': [],
                            'statusTurno': 'aguardando_ataque'
                        });
                        return; 
                    }

                    if (!dadosSala.jogador1.mao) return; 

                    renderizarArena();
                    gerenciarToastsDeTurno();

                    if (dadosSala.statusTurno === 'exibindo_resultado') {
                        const slotPlayer = document.getElementById('carta-jogada-player');
                        const slotOpp = document.getElementById('carta-jogada-opp');
                        if (dadosSala.chaveVencedor === minhaRole) {
                            slotPlayer.classList.add('border-green-400', 'scale-110', 'z-50');
                            slotOpp.classList.add('grayscale', 'opacity-50');
                        } else if (dadosSala.chaveVencedor === oppRole) {
                            slotOpp.classList.add('border-green-400', 'scale-110', 'z-50');
                            slotPlayer.classList.add('grayscale', 'opacity-50');
                        }
                    }

                    if (dadosSala.statusTurno === 'resolvendo' && isHost) {
                        resolverCombateHost();
                    } else if (dadosSala.status === 'finalizada') {
                        iniciarCascataFinal();
                    }
                });
            } else {
                window.location.href = "index.html";
            }
        });
    </script>
</body>
</html>
