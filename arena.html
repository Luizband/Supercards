<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supercards - Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(180deg, #7a32a8 0%, #4ade80 100%);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        #toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            width: 90%;
            max-width: 350px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast-msg {
            background: #dca3e8;
            color: #7a32a8;
            border: 3px solid #7a32a8;
            padding: 12px 20px;
            border-radius: 9999px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.3);
            text-align: center;
            font-weight: 900;
            font-size: 0.85rem;
            animation: slideDown 0.3s ease-out;
            pointer-events: auto;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .leque-1 { transform: rotate(-15deg) translateY(10px); }
        .leque-2 { transform: rotate(-5deg) translateY(0px); }
        .leque-3 { transform: rotate(5deg) translateY(0px); }
        .leque-4 { transform: rotate(15deg) translateY(10px); }

        .hover-carta { transition: transform 0.2s ease, z-index 0s; }
        .hover-carta:hover { transform: translateY(-20px) scale(1.05); z-index: 50; }
    </style>
</head>
<body class="fixed inset-0 overflow-hidden w-screen h-screen">

    <div id="toast-container"></div>

    <div class="w-full h-full max-w-sm mx-auto relative flex flex-col border-x-2 border-[#dca3e8]/30 shadow-2xl">

        <!-- ================= CABEÇALHO ================= -->
        <div class="absolute top-4 w-[95%] left-1/2 transform -translate-x-1/2 flex items-center justify-between bg-[#dca3e8] rounded-full shadow-lg z-50 h-12">
            
            <div class="flex-1 text-center truncate px-2">
                <span id="opp-nome" class="text-[#7a32a8] font-black text-[10px] uppercase tracking-wide">BUSCANDO...</span>
            </div>
            
            <div class="absolute left-1/2 transform -translate-x-1/2 -top-2 w-16 h-16 bg-[#dca3e8] rounded-full flex items-center justify-center shadow-md overflow-hidden z-40 border-2 border-[#bc7bd4]">
                <img id="opp-foto" src="" class="hidden w-full h-full object-cover">
                <span id="opp-foto-placeholder" class="text-[#7a32a8] font-black text-[10px]">FOTO</span>
            </div>
            
            <div class="flex-1 text-center truncate px-2">
                <span id="msg-jogo" class="text-[#7a32a8] font-black text-[9px] uppercase animate-pulse">SINCRONIZANDO SALA</span>
            </div>

        </div>

        <!-- Botão de Desistir Menor -->
        <button onclick="abrirModalDesistir()" class="absolute top-16 left-3 bg-red-600 hover:bg-red-700 text-white font-black text-[7px] px-1.5 py-0.5 rounded shadow-sm border border-red-800 uppercase tracking-widest z-40 transition-transform active:scale-95">
            Desistir
        </button>

        <!-- ================= ÁREA DO ADVERSÁRIO ================= -->
        <div class="w-full h-[45%] relative z-20 mt-16">

            <div id="mao-adversario" class="absolute top-4 left-1/2 transform -translate-x-1/2 flex justify-center w-full z-10 pointer-events-none">
                <!-- Injetado via JS -->
            </div>

            <!-- Deck Invertido e Espelhado -->
            <div class="absolute bottom-8 right-4 flex flex-col items-center">
                <img src="fundo_carta.png" class="w-14 object-contain drop-shadow-xl brightness-50 rounded-md">
                <span id="opp-deck-count" class="text-white font-black text-xl -mt-9 drop-shadow-[0_2px_4px_rgba(0,0,0,1)] z-10">20</span>
            </div>

        </div>

        <!-- ================= LOGO ================= -->
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-0">
            <img src="logo.png" class="w-[80%] max-w-[250px] opacity-20 grayscale object-contain drop-shadow-lg">
        </div>

        <!-- ================= ÁREA DO JOGADOR ================= -->
        <div class="w-full h-[55%] relative z-20 border-t-2 border-[#dca3e8]/20 backdrop-blur-sm bg-black/10">
            
            <div class="absolute top-8 left-4 flex flex-col items-center">
                <img src="fundo_carta.png" class="w-14 object-contain drop-shadow-xl brightness-50 rounded-md">
                <span id="player-deck-count" class="text-white font-black text-xl -mt-9 drop-shadow-[0_2px_4px_rgba(0,0,0,1)] z-10">20</span>
            </div>

            <div id="arena-combate" class="absolute -top-16 left-1/2 transform -translate-x-1/2 w-full h-32 flex justify-center items-center gap-4 z-40 hidden">
                <div id="carta-jogada-player" class="w-24 aspect-[2.5/3.5] bg-gray-800 rounded-lg shadow-2xl border-2 border-white transform translate-y-10 transition-all duration-500"></div>
                <div id="carta-jogada-opp" class="w-24 aspect-[2.5/3.5] bg-gray-800 rounded-lg shadow-2xl border-2 border-black transform -translate-y-10 transition-all duration-500"></div>
            </div>

            <!-- Mão do jogador elevada com bottom-24 -->
            <div id="mao-jogador" class="absolute bottom-24 left-0 w-full flex justify-center gap-1 px-2 z-30 h-[100px]">
                <!-- Injetado via JS -->
            </div>

        </div>

        <!-- ================= MODAIS DA PARTIDA ================= -->
        <div id="modal-zoom" class="hidden fixed inset-0 bg-black/90 z-[100] flex flex-col items-center justify-center p-4 backdrop-blur-md">
            <button onclick="fecharZoomCarta()" class="absolute top-4 right-6 text-white font-black text-2xl hover:text-gray-300 transition-colors z-50">X</button>
            <h2 id="titulo-acao" class="text-white font-black text-xl text-center uppercase tracking-wider mb-4 drop-shadow-md">AÇÃO DA CARTA</h2>
            <img id="zoom-img" src="fundo_carta.png" alt="Carta" class="w-[65%] max-w-[240px] aspect-[2.5/3.5] object-cover drop-shadow-2xl mb-6 rounded-xl border-4 border-[#bc7bd4]">
            
            <!-- Opções se for o atacante -->
            <div id="painel-atributos" class="grid grid-cols-2 gap-3 w-full max-w-xs hidden">
                <button onclick="confirmarAcao('aura')" class="bg-blue-600 hover:bg-blue-500 text-white font-black text-xs py-3 rounded-lg shadow-lg border-2 border-blue-400 uppercase tracking-widest">AURA</button>
                <button onclick="confirmarAcao('fofura')" class="bg-pink-500 hover:bg-pink-400 text-white font-black text-xs py-3 rounded-lg shadow-lg border-2 border-pink-300 uppercase tracking-widest">FOFURA</button>
                <button onclick="confirmarAcao('diversao')" class="bg-yellow-500 hover:bg-yellow-400 text-black font-black text-xs py-3 rounded-lg shadow-lg border-2 border-yellow-300 uppercase tracking-widest">DIVERSÃO</button>
                <button onclick="confirmarAcao('aleatoriedade')" class="bg-purple-600 hover:bg-purple-500 text-white font-black text-xs py-3 rounded-lg shadow-lg border-2 border-purple-400 uppercase tracking-widest">ALEATORIEDADE</button>
            </div>

            <!-- Opção se for o defensor -->
            <div id="painel-defesa" class="w-full max-w-xs hidden">
                <button id="btn-defender" onclick="confirmarDefesa()" class="w-full bg-red-600 hover:bg-red-500 text-white font-black text-xs py-4 rounded-lg shadow-lg border-2 border-red-400 uppercase tracking-widest"></button>
            </div>
        </div>

        <div id="modal-desistir" class="hidden fixed inset-0 bg-black/80 z-[100] flex items-center justify-center p-4 backdrop-blur-sm">
            <div class="bg-[#dca3e8] border-4 border-[#7a32a8] rounded-2xl p-6 max-w-xs w-full text-center shadow-2xl relative">
                <h2 class="text-red-600 font-black text-lg mb-2 uppercase">Desistir da Batalha?</h2>
                <p class="text-[#7a32a8] font-bold text-xs mb-6">A partida será encerrada imediatamente e nenhum jogador receberá recompensas.</p>
                <div class="flex justify-center gap-4">
                    <button onclick="fecharModalDesistir()" class="flex-1 bg-gray-500 hover:bg-gray-600 text-white font-black py-2 rounded-full shadow-md uppercase text-xs">NÃO</button>
                    <button onclick="confirmarDesistencia()" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-black py-2 rounded-full shadow-md uppercase text-xs">SIM</button>
                </div>
            </div>
        </div>

        <!-- PLACAR FINAL -->
        <div id="modal-fim" class="hidden fixed inset-0 bg-black/95 z-[200] flex flex-col items-center justify-center p-4">
            <h1 id="titulo-fim" class="text-4xl font-black text-white uppercase tracking-widest mb-2"></h1>
            <h2 id="placar-final" class="text-6xl font-black text-[#4ade80] mb-4"></h2>
            <span id="msg-recompensa" class="text-[#dca3e8] font-bold text-sm mb-8 tracking-widest"></span>
            <button onclick="window.location.href='batalha.html'" class="bg-[#7a32a8] hover:bg-[#bc7bd4] text-white font-black py-3 px-12 rounded-full shadow-lg border-2 border-white tracking-widest">RETORNAR</button>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, updateDoc, deleteDoc, getDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { INFO_CARTAS } from './cartas.js';

        const firebaseConfig = {
          apiKey: "AIzaSyCU3lFTgfrDMaD9jwR7X7ivYPmGQh4VE1g",
          authDomain: "supercards-tcg.firebaseapp.com",
          projectId: "supercards-tcg",
          storageBucket: "supercards-tcg.firebasestorage.app",
          messagingSenderId: "862316380615",
          appId: "1:862316380615:web:b3f28056ebc967673999e2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserUid = null;
        let minhaRole = null; 
        let oppRole = null;
        let isHost = false;
        let salaId = null;
        let dadosSala = null;
        let unsubscribePartida = null;
        let cartaFocadaId = null;

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex > 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        window.mostrarToast = function(mensagem) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast-msg';
            toast.innerHTML = mensagem;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s ease';
                setTimeout(() => toast.remove(), 500); 
            }, 3000);
        };

        window.atualizarMensagem = function(texto) {
            const painel = document.getElementById('msg-jogo');
            if (painel.innerText === texto) return;
            painel.innerText = texto;
            painel.classList.remove('animate-pulse');
            void painel.offsetWidth; 
            painel.classList.add('animate-pulse');
        };

        // ==========================================
        // RENDERIZAÇÃO DA INTERFACE DE COMBATE
        // ==========================================
        function renderizarArena() {
            const oppData = dadosSala[oppRole];
            const myData = dadosSala[minhaRole];

            // Informações do adversário
            document.getElementById('opp-nome').innerText = oppData.nome;
            if (oppData.foto) {
                document.getElementById('opp-foto').src = oppData.foto;
                document.getElementById('opp-foto').classList.remove('hidden');
                document.getElementById('opp-foto-placeholder').classList.add('hidden');
            }

            // Decks
            document.getElementById('opp-deck-count').innerText = oppData.deck.length;
            document.getElementById('player-deck-count').innerText = myData.deck.length;

            // Mão do Adversário
            const oppMaoContainer = document.getElementById('mao-adversario');
            oppMaoContainer.innerHTML = '';
            const classesLeque = ['leque-1 -mr-4', 'leque-2 -mr-4', 'z-10', 'leque-3 -ml-4', 'leque-4 -ml-4'];
            oppData.mao.forEach((_, i) => {
                oppMaoContainer.innerHTML += `<img src="fundo_carta.png" class="w-16 object-contain ${classesLeque[i] || ''} shadow-md border border-black/20 rounded-md">`;
            });

            // Mão do Jogador (Usa as suas cartas de verdade do Banco)
            const myMaoContainer = document.getElementById('mao-jogador');
            myMaoContainer.innerHTML = '';
            myData.mao.forEach((cartaId) => {
                const info = INFO_CARTAS[cartaId];
                myMaoContainer.innerHTML += `
                    <div onclick="abrirZoomCarta('${cartaId}')" class="w-[19%] max-w-[70px] aspect-[2.5/3.5] bg-gray-800 rounded-md shadow-xl border-2 border-transparent hover:border-[#4ade80] cursor-pointer hover-carta relative overflow-hidden">
                        <img src="${info.miniatura || info.imagem}" class="w-full h-full object-cover">
                    </div>
                `;
            });

            // Arena Central
            const arenaCombate = document.getElementById('arena-combate');
            const slotOpp = document.getElementById('carta-jogada-opp');
            const slotPlayer = document.getElementById('carta-jogada-player');
            
            // Reseta estilos da resolução anterior
            slotPlayer.className = "w-24 aspect-[2.5/3.5] bg-gray-800 rounded-lg shadow-2xl border-2 border-white transform translate-y-10 transition-all duration-500";
            slotOpp.className = "w-24 aspect-[2.5/3.5] bg-gray-800 rounded-lg shadow-2xl border-2 border-black transform -translate-y-10 transition-all duration-500";

            let hasCardInCenter = false;
            
            if (myData.cartaJogada) {
                hasCardInCenter = true;
                const info = INFO_CARTAS[myData.cartaJogada];
                slotPlayer.innerHTML = `<img src="${info.imagem}" class="w-full h-full object-cover rounded-md">`;
                slotPlayer.classList.remove('opacity-0');
            } else {
                slotPlayer.classList.add('opacity-0');
            }

            if (oppData.cartaJogada) {
                hasCardInCenter = true;
                if (dadosSala.statusTurno === 'resolvendo') {
                    const info = INFO_CARTAS[oppData.cartaJogada];
                    slotOpp.innerHTML = `<img src="${info.imagem}" class="w-full h-full object-cover rounded-md">`;
                } else {
                    slotOpp.innerHTML = `<img src="fundo_carta.png" class="w-full h-full object-cover rounded-md">`;
                }
                slotOpp.classList.remove('opacity-0');
            } else {
                slotOpp.classList.add('opacity-0');
            }

            if (hasCardInCenter) arenaCombate.classList.remove('hidden');
            else arenaCombate.classList.add('hidden');

            // Painel de Status
            const isMyTurn = dadosSala.quemAtaca === currentUserUid;
            if (dadosSala.statusTurno === 'resolvendo') {
                window.atualizarMensagem("RESOLVENDO COMBATE...");
            } else if (isMyTurn) {
                if (!myData.cartaJogada) window.atualizarMensagem("SUA VEZ! ATAQUE!");
                else window.atualizarMensagem("AGUARDANDO DEFESA...");
            } else {
                if (!oppData.cartaJogada) window.atualizarMensagem("VEZ DO ADVERSARIO...");
                else {
                    if (!myData.cartaJogada) window.atualizarMensagem(`DEFENDA! ATRIBUTO: ${dadosSala.atributoTurno}`);
                }
            }
        }

        // ==========================================
        // FLUXO DE AÇÕES DO JOGADOR
        // ==========================================
        window.abrirZoomCarta = function(idCarta) {
            if (dadosSala.statusTurno === 'resolvendo' || dadosSala.status === 'finalizada') return;
            if (dadosSala[minhaRole].cartaJogada) return; 

            const isMyTurn = dadosSala.quemAtaca === currentUserUid;
            if (!isMyTurn && !dadosSala.atributoTurno) {
                window.mostrarToast("Aguarde o ataque do adversario!");
                return;
            }

            cartaFocadaId = idCarta;
            document.getElementById('zoom-img').src = INFO_CARTAS[idCarta].imagem;

            const painelAtributos = document.getElementById('painel-atributos');
            const painelDefesa = document.getElementById('painel-defesa');

            if (isMyTurn) {
                painelAtributos.classList.remove('hidden');
                painelDefesa.classList.add('hidden');
            } else {
                painelAtributos.classList.add('hidden');
                painelDefesa.classList.remove('hidden');
                document.getElementById('btn-defender').innerText = `DEFENDER (${dadosSala.atributoTurno.toUpperCase()})`;
            }

            document.getElementById('modal-zoom').classList.remove('hidden');
        };

        window.fecharZoomCarta = function() {
            document.getElementById('modal-zoom').classList.add('hidden');
            cartaFocadaId = null;
        };

        window.confirmarAcao = function(atributo) {
            fecharZoomCarta();
            const myMao = [...dadosSala[minhaRole].mao];
            const newMao = myMao.filter(id => id !== cartaFocadaId);

            let updates = {
                [`${minhaRole}.cartaJogada`]: cartaFocadaId,
                [`${minhaRole}.mao`]: newMao
            };

            const isMyTurn = dadosSala.quemAtaca === currentUserUid;
            if (isMyTurn) {
                updates.atributoTurno = atributo;
            } else {
                updates.statusTurno = 'resolvendo';
            }

            updateDoc(doc(db, "partidas", salaId), updates);
        };

        window.confirmarDefesa = function() {
            window.confirmarAcao(null);
        };

        // ==========================================
        // INTELIGÊNCIA ARTIFICIAL DO HOST (RESOLUÇÃO)
        // ==========================================
        function destacarVencedor() {
            const id1 = dadosSala.jogador1.cartaJogada;
            const id2 = dadosSala.jogador2.cartaJogada;
            const attr = dadosSala.atributoTurno;
            
            let vencedor = null;
            let val1 = INFO_CARTAS[id1][attr];
            let val2 = INFO_CARTAS[id2][attr];
            
            if (val1 > val2) vencedor = 'jogador1';
            else if (val2 > val1) vencedor = 'jogador2';
            else {
                const m1 = Math.max(INFO_CARTAS[id1].aura, INFO_CARTAS[id1].fofura, INFO_CARTAS[id1].diversao, INFO_CARTAS[id1].aleatoriedade);
                const m2 = Math.max(INFO_CARTAS[id2].aura, INFO_CARTAS[id2].fofura, INFO_CARTAS[id2].diversao, INFO_CARTAS[id2].aleatoriedade);
                if (m1 > m2) vencedor = 'jogador1';
                else if (m2 > m1) vencedor = 'jogador2';
                else vencedor = dadosSala.quemAtaca === dadosSala.jogador1.uid ? 'jogador1' : 'jogador2';
            }

            const slotPlayer = document.getElementById('carta-jogada-player');
            const slotOpp = document.getElementById('carta-jogada-opp');

            if (vencedor === minhaRole) {
                slotPlayer.classList.add('border-green-400', 'scale-110', 'z-50');
                slotOpp.classList.add('grayscale', 'opacity-50');
            } else {
                slotOpp.classList.add('border-green-400', 'scale-110', 'z-50');
                slotPlayer.classList.add('grayscale', 'opacity-50');
            }
        }

        async function processarFimDeTurnoHost() {
            const id1 = dadosSala.jogador1.cartaJogada;
            const id2 = dadosSala.jogador2.cartaJogada;
            const attr = dadosSala.atributoTurno;

            let val1 = INFO_CARTAS[id1][attr];
            let val2 = INFO_CARTAS[id2][attr];

            let vencedor = null;
            if (val1 > val2) vencedor = 'jogador1';
            else if (val2 > val1) vencedor = 'jogador2';
            else {
                const m1 = Math.max(INFO_CARTAS[id1].aura, INFO_CARTAS[id1].fofura, INFO_CARTAS[id1].diversao, INFO_CARTAS[id1].aleatoriedade);
                const m2 = Math.max(INFO_CARTAS[id2].aura, INFO_CARTAS[id2].fofura, INFO_CARTAS[id2].diversao, INFO_CARTAS[id2].aleatoriedade);
                if (m1 > m2) vencedor = 'jogador1';
                else if (m2 > m1) vencedor = 'jogador2';
                else vencedor = dadosSala.quemAtaca === dadosSala.jogador1.uid ? 'jogador1' : 'jogador2';
            }

            let j1Pilha = [...(dadosSala.jogador1.pilhaVitorias || []), id1, id2];
            let j2Pilha = [...(dadosSala.jogador2.pilhaVitorias || []), id1, id2];

            let updates = {};
            if (vencedor === 'jogador1') updates['jogador1.pilhaVitorias'] = j1Pilha;
            else updates['jogador2.pilhaVitorias'] = j2Pilha;

            let j1Deck = [...dadosSala.jogador1.deck];
            let j1Mao = [...dadosSala.jogador1.mao];
            if (j1Deck.length > 0) j1Mao.push(j1Deck.shift());

            let j2Deck = [...dadosSala.jogador2.deck];
            let j2Mao = [...dadosSala.jogador2.mao];
            if (j2Deck.length > 0) j2Mao.push(j2Deck.shift());

            updates['jogador1.deck'] = j1Deck;
            updates['jogador1.mao'] = j1Mao;
            updates['jogador2.deck'] = j2Deck;
            updates['jogador2.mao'] = j2Mao;

            updates['jogador1.cartaJogada'] = null;
            updates['jogador2.cartaJogada'] = null;
            updates['atributoTurno'] = null;
            
            let proxTurno = dadosSala.turnoAtual + 1;
            
            if (proxTurno > 20 || (j1Mao.length === 0 && j2Mao.length === 0)) {
                updates['status'] = 'finalizada';
                updates['statusTurno'] = 'finalizada';
            } else {
                updates['turnoAtual'] = proxTurno;
                updates['statusTurno'] = 'jogando';
                updates['quemAtaca'] = (dadosSala.quemAtaca === dadosSala.jogador1.uid) ? dadosSala.jogador2.uid : dadosSala.jogador1.uid;
            }

            updateDoc(doc(db, "partidas", salaId), updates);
        }

        async function processarFinalizacaoLocal() {
            if (window.fimProcessado) return;
            window.fimProcessado = true;

            const myPilha = dadosSala[minhaRole].pilhaVitorias || [];
            const oppPilha = dadosSala[oppRole].pilhaVitorias || [];

            let myPoints = 0;
            myPilha.forEach(id => myPoints += INFO_CARTAS[id].pontos);

            let oppPoints = 0;
            oppPilha.forEach(id => oppPoints += INFO_CARTAS[id].pontos);

            document.getElementById('placar-final').innerText = `${myPoints} x ${oppPoints}`;

            const vitoria = myPoints > oppPoints;
            const empate = myPoints === oppPoints;

            document.getElementById('titulo-fim').innerText = vitoria ? "VITORIA" : (empate ? "EMPATE" : "DERROTA");
            document.getElementById('msg-recompensa').innerText = vitoria ? "+10 XP | +10 MOEDAS" : "SEM RECOMPENSAS";

            document.getElementById('modal-fim').classList.remove('hidden');

            const userRef = doc(db, "users", currentUserUid);
            const snap = await getDoc(userRef);
            
            if(snap.exists()) {
                let dados = snap.data();
                let updates = {};
                
                let pacoteMissoes = dados.missoesDiarias || {};
                let atualizouMissao = false;
                if (pacoteMissoes.lista) {
                    pacoteMissoes.lista.forEach(m => {
                        if (m.id === "batalhar" && m.progresso < m.meta) {
                            m.progresso++; atualizouMissao = true;
                        }
                        if (vitoria && m.id === "ganhar_partida" && m.progresso < m.meta) {
                            m.progresso++; atualizouMissao = true;
                        }
                    });
                }
                if (atualizouMissao) updates.missoesDiarias = pacoteMissoes;

                if (vitoria) {
                    updates.moedas = increment(10);
                    updates.xp = increment(10);
                    updates['estatisticas.batalhasVencidas'] = increment(1);
                }

                if(Object.keys(updates).length > 0) {
                    await updateDoc(userRef, updates);
                }
            }
        }

        // ==========================================
        // CONTROLE DE DESISTÊNCIA
        // ==========================================
        window.abrirModalDesistir = function() { document.getElementById('modal-desistir').classList.remove('hidden'); };
        window.fecharModalDesistir = function() { document.getElementById('modal-desistir').classList.add('hidden'); };
        
        window.confirmarDesistencia = async function() {
            if (salaId) {
                try {
                    await deleteDoc(doc(db, "partidas", salaId));
                } catch(e) {}
            }
            window.location.href = 'batalha.html';
        };

        // ==========================================
        // INICIALIZAÇÃO E SINCRONIZAÇÃO
        // ==========================================
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUserUid = user.uid;
                const params = new URLSearchParams(window.location.search);
                salaId = params.get('sala');
                
                if (!salaId) return window.location.href = 'batalha.html';

                unsubscribePartida = onSnapshot(doc(db, "partidas", salaId), (docSnap) => {
                    if (!docSnap.exists()) {
                        window.mostrarToast("A sala foi encerrada.");
                        setTimeout(() => window.location.href = 'batalha.html', 2000);
                        return;
                    }

                    dadosSala = docSnap.data();

                    if (dadosSala.jogador1 && dadosSala.jogador1.uid === user.uid) {
                        minhaRole = 'jogador1'; oppRole = 'jogador2'; isHost = true;
                    } else if (dadosSala.jogador2 && dadosSala.jogador2.uid === user.uid) {
                        minhaRole = 'jogador2'; oppRole = 'jogador1'; isHost = false;
                    }

                    if (isHost && !dadosSala.jogador1.mao) {
                        let j1Deck = [...dadosSala.jogador1.deck];
                        let j2Deck = [...dadosSala.jogador2.deck];
                        shuffle(j1Deck);
                        shuffle(j2Deck);
                        updateDoc(doc(db, "partidas", salaId), {
                            'jogador1.mao': j1Deck.splice(0, 5),
                            'jogador1.deck': j1Deck,
                            'jogador1.pilhaVitorias': [],
                            'jogador1.cartaJogada': null,
                            'jogador2.mao': j2Deck.splice(0, 5),
                            'jogador2.deck': j2Deck,
                            'jogador2.pilhaVitorias': [],
                            'jogador2.cartaJogada': null,
                            'statusTurno': 'jogando'
                        });
                        return; 
                    }

                    if (!dadosSala.jogador1.mao || !dadosSala.jogador2.mao) return; 

                    renderizarArena();

                    if (dadosSala.statusTurno === 'resolvendo') {
                        destacarVencedor();
                        if (isHost) setTimeout(processarFimDeTurnoHost, 4000);
                    } else if (dadosSala.status === 'finalizada') {
                        processarFinalizacaoLocal();
                    }
                });
            } else {
                window.location.href = "index.html";
            }
        });
    </script>
</body>
</html>
