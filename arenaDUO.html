<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Supercards - Arena DUO (2x2)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #1a1a1a;
            background-image: url('fundoDUO.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overscroll-behavior: none; /* Evita que a tela puxe no mobile */
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Animação para a vez do jogador */
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0px rgba(220, 163, 232, 0.7); }
            100% { box-shadow: 0 0 0 12px rgba(220, 163, 232, 0); }
        }
        .vez-ativa { animation: pulse-ring 1.5s infinite; border-color: #dca3e8 !important; }

        /* Efeito Hover nas Cartas do Jogador */
        .hover-carta { transition: transform 0.2s ease, z-index 0s; }
        .hover-carta:hover { transform: translateY(-15px) scale(1.15); z-index: 50 !important; }

        /* MENSAGEM DE BLOQUEIO SE O CELULAR ESTIVER EM PÉ */
        #aviso-retrato { display: none; }
        @media (orientation: portrait) {
            #main-arena { display: none !important; }
            #aviso-retrato { display: flex; }
        }
    </style>
</head>
<body class="fixed inset-0 overflow-hidden w-screen h-screen text-white select-none">

    <!-- TELA DE BLOQUEIO PORTRAIT -->
    <div id="aviso-retrato" class="w-full h-full bg-black/95 flex-col items-center justify-center p-6 text-center z-[9999] absolute inset-0">
        <span class="text-6xl mb-4">🔄</span>
        <h1 class="text-2xl font-black text-[#dca3e8] uppercase tracking-widest mb-2">Vire o Celular</h1>
        <p class="text-sm text-gray-300 font-bold">O modo Arena 2x2 só pode ser jogado com a tela na horizontal.</p>
    </div>

    <!-- ARENA DUO (LANDSCAPE) -->
    <div id="main-arena" class="w-full h-full relative flex items-center justify-center">

        <!-- ========================================== -->
        <!-- HUD SUPERIOR (Toasts, Montante e Desistir) -->
        <!-- ========================================== -->
        <div class="absolute top-3 w-full px-6 flex justify-between items-start z-50 pointer-events-none">
            <!-- Toast de Avisos (Esquerda) -->
            <div class="bg-[#dca3e8] text-[#7a32a8] font-black text-xs px-5 py-2 rounded-full shadow-lg border-2 border-[#bc7bd4] uppercase pointer-events-auto">
                Aguardando Jogadores...
            </div>

            <!-- Botões e Status (Direita) -->
            <div class="flex items-center gap-4 pointer-events-auto">
                <!-- Montante Central (Deck de Compra) -->
                <div class="bg-black/70 border border-white/20 rounded-lg px-4 py-1.5 flex items-center gap-3 shadow-lg backdrop-blur-sm">
                    <img src="fundo_carta.png" class="w-5 h-6 object-cover rounded-[2px] opacity-80 border border-black">
                    <div class="flex flex-col leading-none">
                        <span class="text-[9px] text-gray-400 font-bold uppercase tracking-widest">Montante</span>
                        <span class="text-base text-white font-black" id="deck-count">15</span>
                    </div>
                </div>
                <button class="bg-red-600 hover:bg-red-700 text-white font-black text-[11px] px-4 py-2 rounded-full shadow-md border-2 border-red-800 uppercase tracking-widest transition-transform active:scale-95">Desistir</button>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- JOGADOR PARCEIRO (TOPO) -->
        <!-- ========================================== -->
        <div class="absolute top-2 left-1/2 transform -translate-x-1/2 flex flex-col items-center gap-1 z-10">
            <div class="flex flex-col items-center">
                <img src="fundo_carta.png" class="w-14 h-14 rounded-full border-2 border-black/50 object-cover shadow-md bg-gray-800">
                <span class="bg-black/90 px-3 py-1 rounded text-[9px] font-black mt-1 uppercase border border-white/20 shadow-lg">Parceiro</span>
            </div>
            <!-- Cartas na mão do parceiro -->
            <div class="flex -space-x-3 opacity-90 mt-1">
                <img src="fundo_carta.png" class="w-9 aspect-[2.5/3.5] rounded shadow-md border border-black/30">
                <img src="fundo_carta.png" class="w-9 aspect-[2.5/3.5] rounded shadow-md border border-black/30">
                <img src="fundo_carta.png" class="w-9 aspect-[2.5/3.5] rounded shadow-md border border-black/30">
                <img src="fundo_carta.png" class="w-9 aspect-[2.5/3.5] rounded shadow-md border border-black/30">
                <img src="fundo_carta.png" class="w-9 aspect-[2.5/3.5] rounded shadow-md border border-black/30">
            </div>
        </div>

        <!-- ========================================== -->
        <!-- OPONENTE 1 (ESQUERDA) -->
        <!-- ========================================== -->
        <div class="absolute left-6 top-1/2 transform -translate-y-1/2 flex items-center gap-4 z-10">
            <div class="flex flex-col items-center">
                <img src="fundo_carta.png" class="w-14 h-14 rounded-full border-2 border-black/50 object-cover shadow-md bg-gray-800">
                <span class="bg-black/90 px-2 py-1 rounded text-[9px] font-black mt-1 uppercase text-red-400 border border-white/20 shadow-lg">Inimigo 1</span>
            </div>
            <!-- Cartas empilhadas verticalmente -->
            <div class="flex flex-col -space-y-5 opacity-90">
                <img src="fundo_carta.png" class="w-10 aspect-[3.5/2.5] rounded shadow-md border border-black/30 transform rotate-90">
                <img src="fundo_carta.png" class="w-10 aspect-[3.5/2.5] rounded shadow-md border border-black/30 transform rotate-90">
                <img src="fundo_carta.png" class="w-10 aspect-[3.5/2.5] rounded shadow-md border border-black/30 transform rotate-90">
                <img src="fundo_carta.png" class="w-10 aspect-[3.5/2.5] rounded shadow-md border border-black/30 transform rotate-90">
                <img src="fundo_carta.png" class="w-10 aspect-[3.5/2.5] rounded shadow-md border border-black/30 transform rotate-90">
            </div>
        </div>

        <!-- ========================================== -->
        <!-- OPONENTE 2 (DIREITA) -->
        <!-- ========================================== -->
        <div class="absolute right-6 top-1/2 transform -translate-y-1/2 flex flex-row-reverse items-center gap-4 z-10">
            <div class="flex flex-col items-center">
                <img src="fundo_carta.png" class="w-14 h-14 rounded-full border-2 border-black/50 object-cover shadow-md bg-gray-800">
                <span class="bg-black/90 px-2 py-1 rounded text-[9px] font-black mt-1 uppercase text-red-400 border border-white/20 shadow-lg">Inimigo 2</span>
            </div>
            <div class="flex flex-col -space-y-5 opacity-90">
                <img src="fundo_carta.png" class="w-10 aspect-[3.5/2.5] rounded shadow-md border border-black/30 transform -rotate-90">
                <img src="fundo_carta.png" class="w-10 aspect-[3.5/2.5] rounded shadow-md border border-black/30 transform -rotate-90">
                <img src="fundo_carta.png" class="w-10 aspect-[3.5/2.5] rounded shadow-md border border-black/30 transform -rotate-90">
                <img src="fundo_carta.png" class="w-10 aspect-[3.5/2.5] rounded shadow-md border border-black/30 transform -rotate-90">
                <img src="fundo_carta.png" class="w-10 aspect-[3.5/2.5] rounded shadow-md border border-black/30 transform -rotate-90">
            </div>
        </div>

        <!-- ========================================== -->
        <!-- O CAMPO DE BATALHA (Bandeja Reta) -->
        <!-- ========================================== -->
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-black/30 backdrop-blur-md border border-white/10 px-8 py-5 rounded-[2.5rem] flex justify-center items-center gap-3 z-20 shadow-2xl">
            <!-- As cartas jogadas ficam lada a lado -->
            <div class="w-[60px] aspect-[2.5/3.5] bg-gray-800 rounded-md shadow-lg border-2 border-red-500 cursor-pointer hover:scale-105 transition-transform"><img src="fundo_carta.png" class="w-full h-full object-cover rounded-sm"></div>
            <div class="w-[60px] aspect-[2.5/3.5] bg-gray-800 rounded-md shadow-lg border-2 border-gray-400 cursor-pointer hover:scale-105 transition-transform"><img src="fundo_carta.png" class="w-full h-full object-cover rounded-sm"></div>
            <div class="w-[60px] aspect-[2.5/3.5] bg-gray-800 rounded-md shadow-lg border-2 border-[#4ade80] cursor-pointer hover:scale-105 transition-transform"><img src="fundo_carta.png" class="w-full h-full object-cover rounded-sm"></div>
            <div class="w-[60px] aspect-[2.5/3.5] bg-gray-800 rounded-md shadow-lg border-2 border-red-500 cursor-pointer hover:scale-105 transition-transform"><img src="fundo_carta.png" class="w-full h-full object-cover rounded-sm"></div>
        </div>

        <!-- ========================================== -->
        <!-- VOCÊ (BASE DA TELA) -->
        <!-- ========================================== -->
        <div class="absolute bottom-1 w-full flex justify-center z-40">
            <!-- Sua Mão (Centralizada no fundo) -->
            <div class="flex -space-x-4 mb-1">
                <div class="w-[75px] aspect-[2.5/3.5] bg-gray-800 rounded-lg shadow-2xl border-2 border-black hover:border-[#4ade80] cursor-pointer hover-carta relative overflow-hidden"><img src="fundo_carta.png" class="w-full h-full object-cover"></div>
                <div class="w-[75px] aspect-[2.5/3.5] bg-gray-800 rounded-lg shadow-2xl border-2 border-black hover:border-[#4ade80] cursor-pointer hover-carta relative overflow-hidden"><img src="fundo_carta.png" class="w-full h-full object-cover"></div>
                <div class="w-[75px] aspect-[2.5/3.5] bg-gray-800 rounded-lg shadow-2xl border-2 border-black hover:border-[#4ade80] cursor-pointer hover-carta relative overflow-hidden"><img src="fundo_carta.png" class="w-full h-full object-cover"></div>
                <div class="w-[75px] aspect-[2.5/3.5] bg-gray-800 rounded-lg shadow-2xl border-2 border-black hover:border-[#4ade80] cursor-pointer hover-carta relative overflow-hidden"><img src="fundo_carta.png" class="w-full h-full object-cover"></div>
                <div class="w-[75px] aspect-[2.5/3.5] bg-gray-800 rounded-lg shadow-2xl border-2 border-black hover:border-[#4ade80] cursor-pointer hover-carta relative overflow-hidden"><img src="fundo_carta.png" class="w-full h-full object-cover"></div>
            </div>
        </div>

        <!-- Seu Perfil isolado na direita para não apertar as cartas -->
        <div class="absolute bottom-4 right-8 flex flex-col items-center z-40">
            <div class="w-16 h-16 rounded-full border-2 border-[#dca3e8] object-cover shadow-[0_0_15px_#dca3e8] bg-gray-800 vez-ativa"></div>
            <span class="bg-[#dca3e8] text-[#7a32a8] px-4 py-1 rounded-full text-[10px] font-black mt-2 uppercase border-2 border-[#bc7bd4] shadow-lg">Você</span>
        </div>

    </div>

</body>
</html>
