<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supercards - Batalhas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-image: url('fundotela.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        #toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            width: 90%;
            max-width: 350px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast-msg {
            background: #dca3e8;
            color: #7a32a8;
            border: 3px solid #7a32a8;
            padding: 12px 20px;
            border-radius: 9999px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.3);
            text-align: center;
            font-weight: 900;
            font-size: 0.85rem;
            animation: slideDown 0.3s ease-out;
            pointer-events: auto;
        }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="fixed inset-0 px-4 pt-4 flex justify-center overflow-hidden w-screen">

    <div id="toast-container"></div>

    <div class="w-full max-w-sm flex flex-col h-full relative">
        <header class="flex items-center gap-3 mt-4 mb-6 w-full flex-shrink-0">
            <div class="relative flex-shrink-0">
                <div class="bg-[#dca3e8] w-20 h-20 rounded-full flex items-center justify-center text-[#7a32a8] font-black text-xl shadow-lg border-2 border-[#bc7bd4] overflow-hidden relative">
                    <span id="texto-sem-foto" class="text-sm">FOTO</span>
                    <img id="img-perfil-global" src="" class="hidden w-full h-full object-cover absolute inset-0">
                </div>
                <div class="absolute -bottom-2 left-1/2 transform -translate-x-1/2 bg-[#bc7bd4] w-7 h-7 rounded-full flex items-center justify-center shadow-md border-2 border-[#dca3e8] z-30">
                    <span id="player-level" class="text-[#7a32a8] font-black text-xs">--</span>
                </div>
            </div>

            <div class="flex flex-col flex-grow gap-2.5 justify-center overflow-hidden">
                <div class="flex items-center gap-1.5 w-full">
                    <div class="bg-[#dca3e8] rounded-full px-3 py-1.5 flex items-center justify-center gap-1 shadow-md flex-shrink-0">
                        <span id="player-coins" class="text-[#7a32a8] font-black text-sm">...</span>
                        <img src="moedas.png" class="w-4 h-4 object-contain">
                    </div>
                    <nav class="bg-[#dca3e8] rounded-full flex justify-between items-center px-2 py-1 shadow-md flex-grow">
                        <button onclick="window.location.href='perfil.html'" class="bg-[#7a32a8] hover:bg-purple-600 transition-colors rounded-full flex items-center justify-center w-7 h-7 shadow-sm"><img src="perfil.png" class="w-3.5 h-3.5 object-contain"></button>
                        <button onclick="window.location.href='shop.html'" class="bg-[#7a32a8] hover:bg-purple-600 transition-colors rounded-full flex items-center justify-center w-7 h-7 shadow-sm"><img src="shop.png" class="w-3.5 h-3.5 object-contain"></button>
                        <button onclick="window.location.href='missoes.html'" class="bg-[#7a32a8] hover:bg-purple-600 transition-colors rounded-full flex items-center justify-center w-7 h-7 shadow-sm"><img src="missao.png" class="w-3.5 h-3.5 object-contain"></button>
                    </nav>
                </div>
                <div class="flex items-center gap-1.5 w-full">
                    <div class="bg-[#dca3e8] rounded-full px-2 py-1 flex items-center justify-center shadow-md w-1/2 h-7 overflow-hidden flex-shrink-0">
                        <span id="player-name" class="text-[#7a32a8] font-black text-[10px] uppercase truncate text-center w-full">...</span>
                    </div>
                    <div class="flex flex-col items-center flex-grow w-1/2">
                        <div class="w-full bg-transparent border border-[#dca3e8] rounded-full h-2.5 overflow-hidden shadow-inner">
                            <div id="player-barra-xp" class="bg-[#dca3e8] h-full transition-all duration-500" style="width: 0%;"></div>
                        </div>
                        <span id="player-texto-xp" class="text-[#dca3e8] text-[9px] font-bold mt-1">0/0 xp</span>
                    </div>
                </div>
            </div>
        </header>

        <main class="flex flex-col items-center w-full flex-grow overflow-y-auto no-scrollbar pb-32">
            <h1 class="text-[#dca3e8] font-black text-2xl text-center mb-6 drop-shadow-md uppercase tracking-wider">BATALHAS</h1>

            <div class="grid grid-cols-2 gap-6 w-full max-w-[280px] mb-4">
                <div onclick="buscarPartida()" class="flex flex-col items-center group cursor-pointer">
                    <div class="bg-[#dca3e8] w-full aspect-square rounded-[24px] flex items-center justify-center p-4 shadow-xl hover:scale-105 transition-transform border-4 border-transparent hover:border-[#8b3dff]/50">
                        <img src="vs.png" class="w-full h-full object-contain drop-shadow-lg">
                    </div>
                    <span class="text-[#dca3e8] font-black text-sm mt-3 drop-shadow-md uppercase tracking-wide text-center leading-tight">Buscar<br>Partida</span>
                </div>
                <div onclick="window.location.href='decks.html'" class="flex flex-col items-center group cursor-pointer">
                    <div class="bg-[#dca3e8] w-full aspect-square rounded-[24px] flex items-center justify-center p-4 shadow-xl hover:scale-105 transition-transform border-4 border-transparent hover:border-[#8b3dff]/50 relative">
                        <img src="colecao.png" class="w-[80%] h-[80%] object-contain drop-shadow-lg opacity-90">
                    </div>
                    <span class="text-[#dca3e8] font-black text-sm mt-3 drop-shadow-md uppercase tracking-wide text-center leading-tight">Meus<br>Decks</span>
                </div>
            </div>

            <div onclick="abrirModalDesafio()" class="flex items-center justify-center bg-[#7a32a8] hover:bg-purple-600 w-full max-w-[280px] rounded-full py-3 shadow-lg border-2 border-[#bc7bd4] cursor-pointer transition-transform hover:scale-105 mb-8 relative">
                <span class="text-white font-black text-sm uppercase tracking-widest drop-shadow-md">Desafiar Jogador</span>
                <span id="ping-desafio" class="hidden absolute top-0 right-0 -mt-1 -mr-1 flex h-4 w-4 z-50">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-4 w-4 bg-red-600 border-2 border-white"></span>
                </span>
            </div>

            <div class="bg-[#dca3e8] rounded-[24px] w-full max-w-[280px] p-5 shadow-2xl border-4 border-[#bc7bd4] flex flex-col">
                <h2 class="text-[#7a32a8] font-black text-base text-center uppercase tracking-widest mb-4">RANKING GLOBAL</h2>
                <div id="lista-ranking" class="flex flex-col gap-2 w-full">
                    <span class="text-[#7a32a8] text-xs font-bold text-center animate-pulse">Carregando heróis...</span>
                </div>
            </div>
        </main>

        <footer class="fixed bottom-8 left-1/2 transform -translate-x-1/2 w-full flex justify-center z-[100] pointer-events-none">
            <button onclick="window.location.href='menu.html'" class="bg-[#7a32a8] hover:bg-purple-600 text-white font-black py-2.5 px-12 rounded-full shadow-2xl transition-transform hover:-translate-y-1 pointer-events-auto border-2 border-[#dca3e8] uppercase text-sm tracking-wider">Retornar</button>
        </footer>
    </div>

    <div id="modal-busca" class="hidden fixed inset-0 bg-black/90 z-[200] flex flex-col items-center justify-center p-4 backdrop-blur-md pointer-events-auto w-screen h-screen">
        <h2 class="text-[#dca3e8] font-black text-2xl text-center uppercase tracking-wider mb-8 animate-pulse">Procurando<br>Oponente...</h2>
        <div class="w-16 h-16 border-4 border-[#7a32a8] border-t-[#dca3e8] rounded-full animate-spin mb-8"></div>
        <button onclick="cancelarBusca()" class="bg-red-600 hover:bg-red-700 text-white font-black py-2.5 px-10 rounded-full shadow-xl uppercase text-sm tracking-wide">Cancelar</button>
    </div>

    <div id="modal-desafio" class="hidden fixed inset-0 bg-black/90 z-[200] flex flex-col items-center justify-center p-4 backdrop-blur-md pointer-events-auto">
        <div class="bg-[#dca3e8] border-4 border-[#7a32a8] rounded-2xl p-5 w-full max-w-sm shadow-2xl flex flex-col h-[85%] max-h-[600px] relative">
            <button onclick="fecharModalDesafio()" class="absolute top-2 right-4 text-[#7a32a8] font-black text-xl hover:text-purple-600 transition-colors z-50">X</button>

            <div id="view-busca-desafio" class="flex flex-col h-full w-full">
                <h2 class="text-[#7a32a8] font-black text-lg text-center uppercase tracking-wider mb-4 mt-2">Desafiar Jogador</h2>
                <input type="text" id="input-busca-desafio" placeholder="Buscar jogador..." class="mb-3 w-full bg-[#bc7bd4] text-[#7a32a8] placeholder-[#7a32a8]/70 font-black text-xs rounded-full px-4 py-2.5 outline-none border-2 border-[#7a32a8]/30 focus:border-[#7a32a8] transition-colors shadow-inner flex-shrink-0 text-center uppercase">

                <div id="lista-jogadores-desafio" class="flex flex-col gap-2 overflow-y-auto no-scrollbar flex-grow mb-3 bg-white/30 rounded-xl p-2 border border-[#7a32a8]/20 min-h-[120px]">
                    <span class="text-[#7a32a8] text-[10px] font-bold text-center mt-2">Pesquise o nome do jogador.</span>
                </div>

                <div class="w-full h-px bg-[#7a32a8]/30 mb-3 flex-shrink-0"></div>
                <h2 class="text-[#7a32a8] font-black text-sm text-center uppercase tracking-wider mb-2 flex-shrink-0">Convites Recebidos</h2>

                <div id="lista-convites-desafio" class="flex flex-col gap-2 overflow-y-auto no-scrollbar h-[30%] min-h-[100px] bg-white/30 rounded-xl p-2 border border-[#7a32a8]/20 mb-2">
                    <span class="text-[#7a32a8] text-[10px] font-bold text-center mt-2">Nenhum convite pendente.</span>
                </div>
            </div>

            <div id="view-lobby-desafio" class="hidden flex flex-col h-full w-full items-center justify-center">
                <h2 class="text-[#7a32a8] font-black text-2xl text-center uppercase tracking-widest mb-8 drop-shadow-sm">Sala de Espera</h2>

                <div class="flex w-full justify-around items-center mb-8 bg-white/30 p-5 rounded-xl border-2 border-[#7a32a8]/20 shadow-inner">
                    <div class="flex flex-col items-center gap-3 w-1/2">
                        <span id="lobby-p1-nome" class="text-[#7a32a8] font-black text-sm uppercase truncate max-w-[100px] text-center w-full">P1</span>
                        <div id="lobby-p1-status" class="w-6 h-6 rounded-full bg-red-500 border-2 border-white shadow-md transition-colors"></div>
                    </div>
                    <span class="text-[#7a32a8] font-black text-3xl opacity-50">VS</span>
                    <div class="flex flex-col items-center gap-3 w-1/2">
                        <span id="lobby-p2-nome" class="text-[#7a32a8] font-black text-sm uppercase truncate max-w-[100px] text-center w-full">P2</span>
                        <div id="lobby-p2-status" class="w-6 h-6 rounded-full bg-gray-400 border-2 border-white shadow-md transition-colors"></div>
                    </div>
                </div>

                <span id="lobby-mensagem-status" class="text-[#7a32a8] font-black text-xs text-center mb-6 h-8 uppercase tracking-wide animate-pulse">Aguardando oponente aceitar...</span>

                <button id="btn-pronto-desafio" onclick="marcarProntoDesafio()" class="hidden w-full bg-[#4ade80] hover:bg-[#22c55e] text-[#7a32a8] font-black text-base py-4 rounded-full shadow-lg border-2 border-[#22c55e] uppercase tracking-widest transition-transform hover:scale-105 mb-4">ESTOU PRONTO!</button>
                <button onclick="cancelarDesafio()" class="w-full bg-red-500 hover:bg-red-600 text-white font-black text-xs py-3 rounded-full shadow-md uppercase tracking-wider transition-colors border border-red-700">Cancelar e Sair</button>
            </div>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, orderBy, limit, getDocs, where, addDoc, updateDoc, onSnapshot, serverTimestamp, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const app = initializeApp({
          apiKey: "AIzaSyCU3lFTgfrDMaD9jwR7X7ivYPmGQh4VE1g",
          authDomain: "supercards-tcg.firebaseapp.com",
          projectId: "supercards-tcg",
          storageBucket: "supercards-tcg.firebasestorage.app",
          messagingSenderId: "862316380615",
          appId: "1:862316380615:web:b3f28056ebc967673999e2"
        });
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserUid = null;
        let currentUserDoc = null;
        let partidaIdAtual = null;
        let unsubscribePartida = null;
        let lobbyAtivo = null;

        window.mostrarToast = function(msg) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast-msg'; toast.innerHTML = msg;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 500); }, 3000);
        };

        // ===============================================
        // SISTEMA DE LOBBY / DESAFIOS PRIVADOS (NOVO)
        // ===============================================

        window.abrirModalDesafio = function() {
            document.getElementById('input-busca-desafio').value = "";
            document.getElementById('modal-desafio').classList.remove('hidden');
        };
        
        window.fecharModalDesafio = function() {
            if (lobbyAtivo && (lobbyAtivo.jogador1.uid === currentUserUid && !lobbyAtivo.jogador2)) {
                // Se eu fechar sendo host e ele ainda não aceitou, cancelo automaticamente
                cancelarDesafio();
            }
            document.getElementById('modal-desafio').classList.add('hidden');
        };

        // Escutador global para achar convites ou lobbies ativos
        function escutarDesafios() {
            const q = query(collection(db, "partidas"), where("participantes", "array-contains", currentUserUid));
            
            onSnapshot(q, (snap) => {
                let convites = [];
                let meuLobby = null;

                snap.forEach(d => {
                    const data = d.data();
                    if (data.status === "finalizada") return;

                    // Convites que EU recebi
                    if (data.status === "convite" && data.convidadoUid === currentUserUid) {
                        convites.push({ id: d.id, ...data });
                    }
                    // Lobby ativo que eu faço parte
                    if (data.status === "lobby" || (data.status === "convite" && data.jogador1.uid === currentUserUid)) {
                        meuLobby = { id: d.id, ...data };
                    }
                    // Se o lobby ficou verde pros dois e virou andamento, vai pra ARENA!
                    if (data.status === "andamento" && data.tipo === "desafio" && (data.jogador1.uid === currentUserUid || data.jogador2?.uid === currentUserUid)) {
                        window.location.href = `arena.html?sala=${d.id}`;
                    }
                });

                lobbyAtivo = meuLobby;

                // Mostra/Esconde a notificação na tela principal
                const ping = document.getElementById('ping-desafio');
                if (convites.length > 0) ping.classList.remove('hidden');
                else ping.classList.add('hidden');

                renderizarModalLobby(convites, meuLobby);

                // LÓGICA DO HOST: Se os dois estão prontos, o Host muda o status para rodar o jogo
                if (meuLobby && meuLobby.status === "lobby" && meuLobby.jogador1.uid === currentUserUid) {
                    if (meuLobby.jogador1.pronto && meuLobby.jogador2?.pronto) {
                        updateDoc(doc(db, "partidas", meuLobby.id), { status: "andamento" });
                    }
                }
            });
        }

        // Renderiza as trocas de tela dentro do Modal
        function renderizarModalLobby(convites, lobby) {
            const vBusca = document.getElementById('view-busca-desafio');
            const vLobby = document.getElementById('view-lobby-desafio');

            if (lobby) {
                // MODO SALA DE ESPERA (LOBBY)
                vBusca.classList.add('hidden');
                vLobby.classList.remove('hidden');

                const ehJ1 = lobby.jogador1.uid === currentUserUid;
                const eu = ehJ1 ? lobby.jogador1 : lobby.jogador2;
                const ele = ehJ1 ? lobby.jogador2 : lobby.jogador1;

                // Seta o P1 (Host)
                document.getElementById('lobby-p1-nome').innerText = lobby.jogador1.nome;
                const dot1 = document.getElementById('lobby-p1-status');
                dot1.className = `w-6 h-6 rounded-full border-2 border-white shadow-md transition-colors ${lobby.jogador1.pronto ? 'bg-green-500' : 'bg-red-500'}`;

                // Seta o P2 (Convidado)
                const dot2 = document.getElementById('lobby-p2-status');
                if (!lobby.jogador2) {
                    document.getElementById('lobby-p2-nome').innerText = lobby.convidadoNome;
                    dot2.className = `w-6 h-6 rounded-full border-2 border-white shadow-md bg-gray-400`;
                    document.getElementById('lobby-mensagem-status').innerText = `Aguardando ${lobby.convidadoNome} aceitar...`;
                    document.getElementById('btn-pronto-desafio').classList.add('hidden');
                } else {
                    document.getElementById('lobby-p2-nome').innerText = lobby.jogador2.nome;
                    dot2.className = `w-6 h-6 rounded-full border-2 border-white shadow-md transition-colors ${lobby.jogador2.pronto ? 'bg-green-500' : 'bg-red-500'}`;

                    if (eu.pronto) {
                        document.getElementById('btn-pronto-desafio').classList.add('hidden');
                        document.getElementById('lobby-mensagem-status').innerText = "Aguardando oponente ficar pronto...";
                    } else {
                        document.getElementById('btn-pronto-desafio').classList.remove('hidden');
                        document.getElementById('lobby-mensagem-status').innerText = "Oponente na sala! Confirme quando estiver pronto.";
                    }
                }
            } else {
                // MODO LISTA DE JOGADORES / CONVITES
                vBusca.classList.remove('hidden');
                vLobby.classList.add('hidden');

                const lc = document.getElementById('lista-convites-desafio');
                lc.innerHTML = '';
                if (convites.length === 0) {
                    lc.innerHTML = '<span class="text-[#7a32a8] text-[10px] font-bold text-center mt-2">Nenhum convite pendente.</span>';
                } else {
                    convites.forEach(c => {
                        lc.innerHTML += `
                            <div class="flex items-center justify-between bg-[#4ade80] border-2 border-[#22c55e] rounded-lg p-3 shadow-sm gap-2">
                                <div class="flex items-center gap-2 overflow-hidden">
                                    <div class="flex flex-col overflow-hidden">
                                        <span class="text-[#7a32a8] font-black text-xs uppercase truncate">Desafio de: ${c.jogador1.nome}</span>
                                    </div>
                                </div>
                                <div class="flex gap-1 flex-shrink-0">
                                    <button onclick="recusarDesafio('${c.id}')" class="bg-red-500 hover:bg-red-600 text-white font-black text-[10px] py-1.5 px-3 rounded-md shadow-sm">X</button>
                                    <button onclick="aceitarDesafio('${c.id}')" class="bg-[#7a32a8] hover:bg-purple-600 text-white font-black text-[10px] py-1.5 px-3 rounded-md shadow-sm uppercase tracking-wider">ACEITAR</button>
                                </div>
                            </div>`;
                    });
                }
            }
        }

        // Pesquisa de jogadores no modal
        document.getElementById('input-busca-desafio').addEventListener('input', async (event) => {
            const termoBusca = event.target.value.toLowerCase().trim();
            const container = document.getElementById('lista-jogadores-desafio');

            if (termoBusca === "") {
                container.innerHTML = '<span class="text-[#7a32a8] text-[10px] font-bold text-center mt-2">Pesquise o nome do jogador.</span>';
                return;
            }

            container.innerHTML = '<span class="text-[#7a32a8] text-[10px] font-bold text-center mt-2 animate-pulse">Buscando...</span>';

            try {
                const q = query(collection(db, "users"), limit(50));
                const snap = await getDocs(q);

                container.innerHTML = '';
                let temResultado = false;

                snap.forEach(docSnap => {
                    if (docSnap.id !== currentUserUid) {
                        const dados = docSnap.data();
                        const nomeDb = dados.nome || dados.nomeDisplay || "JOGADOR";

                        if (nomeDb.toLowerCase().includes(termoBusca)) {
                            temResultado = true;
                            const nomeFormatado = nomeDb.toUpperCase();
                            const nivel = dados.nivel || 1;

                            const div = document.createElement('div');
                            div.className = "flex items-center justify-between bg-white border border-[#7a32a8]/20 rounded-lg p-2 shadow-sm";
                            div.innerHTML = `
                                <div class="flex flex-col">
                                    <span class="text-[#7a32a8] font-black text-xs uppercase">${nomeFormatado}</span>
                                    <span class="text-[#7a32a8]/70 font-bold text-[9px]">Nível ${nivel}</span>
                                </div>
                                <button onclick="enviarDesafio('${docSnap.id}', '${nomeFormatado}')" class="bg-[#7a32a8] hover:bg-purple-600 text-white font-black text-[9px] py-2 px-4 rounded-full shadow-sm uppercase tracking-wider transition-transform hover:scale-105">CONVIDAR</button>
                            `;
                            container.appendChild(div);
                        }
                    }
                });
                if (!temResultado) container.innerHTML = '<span class="text-[#7a32a8] text-[10px] font-bold text-center mt-2">Nenhum jogador encontrado.</span>';
            } catch (e) { console.error(e); }
        });

        // Ações do Lobby
        window.enviarDesafio = async function(uidAlvo, nomeAlvo) {
            if (!currentUserDoc.deckPadrao || !currentUserDoc.decks || !currentUserDoc.decks[currentUserDoc.deckPadrao]) return window.mostrarToast("Selecione um Deck Padrão completo!");
            const deck = currentUserDoc.decks[currentUserDoc.deckPadrao].cartas;
            if (deck.length < 20) return window.mostrarToast("Seu Deck Padrão precisa de 20 cartas.");

            window.mostrarToast("Enviando convite...");
            try {
                await addDoc(collection(db, "partidas"), {
                    tipo: "desafio",
                    status: "convite",
                    criadoEm: serverTimestamp(),
                    participantes: [currentUserUid, uidAlvo],
                    convidadoUid: uidAlvo,
                    convidadoNome: nomeAlvo,
                    jogador1: { uid: currentUserUid, nome: currentUserDoc.nomeDisplay||"P1", foto: currentUserDoc.fotoPerfil||"", deck: deck, pronto: false },
                    jogador2: null,
                    turnoAtual: 0,
                    quemAtaca: null
                });
                document.getElementById('input-busca-desafio').value = "";
                document.getElementById('lista-jogadores-desafio').innerHTML = '<span class="text-[#7a32a8] text-[10px] font-bold text-center mt-2">Pesquise o nome do jogador.</span>';
            } catch(e) { console.error(e); }
        };

        window.aceitarDesafio = async function(id) {
            if (!currentUserDoc.deckPadrao || !currentUserDoc.decks || !currentUserDoc.decks[currentUserDoc.deckPadrao]) return window.mostrarToast("Selecione um Deck Padrão completo!");
            const deck = currentUserDoc.decks[currentUserDoc.deckPadrao].cartas;
            if (deck.length < 20) return window.mostrarToast("Seu Deck Padrão precisa de 20 cartas.");

            window.mostrarToast("Entrando na sala...");
            try {
                await updateDoc(doc(db, "partidas", id), {
                    status: "lobby",
                    jogador2: { uid: currentUserUid, nome: currentUserDoc.nomeDisplay||"P2", foto: currentUserDoc.fotoPerfil||"", deck: deck, pronto: false }
                });
            } catch(e) { console.error(e); }
        };

        window.recusarDesafio = async function(id) {
            try { await deleteDoc(doc(db, "partidas", id)); window.mostrarToast("Convite recusado."); } catch(e) {}
        };

        window.cancelarDesafio = async function() {
            if(lobbyAtivo) {
                 try { await deleteDoc(doc(db, "partidas", lobbyAtivo.id)); window.mostrarToast("A sala foi cancelada."); } catch(e) {}
            }
        };

        window.marcarProntoDesafio = async function() {
            if(!lobbyAtivo) return;
            const ehJ1 = lobbyAtivo.jogador1.uid === currentUserUid;
            const campo = ehJ1 ? "jogador1.pronto" : "jogador2.pronto";
            try { await updateDoc(doc(db, "partidas", lobbyAtivo.id), { [campo]: true }); } catch(e) {}
        };

        // ===============================================
        // BUSCA ALEATÓRIA (MANTIDA INTACTA)
        // ===============================================
        window.buscarPartida = async function() {
            if (!currentUserDoc) return;
            if (!currentUserDoc.deckPadrao || !currentUserDoc.decks || !currentUserDoc.decks[currentUserDoc.deckPadrao]) {
                return window.mostrarToast("Você precisa selecionar um Deck Padrão!");
            }
            const deck = currentUserDoc.decks[currentUserDoc.deckPadrao].cartas;
            if (deck.length < 20) return window.mostrarToast("Seu Deck Padrão está incompleto.");

            document.getElementById('modal-busca').classList.remove('hidden');

            try {
                const q = query(collection(db, "partidas"), where("status", "==", "aguardando"), limit(10));
                const snap = await getDocs(q);

                let salaAberta = null;
                snap.forEach(d => {
                    const dados = d.data();
                    if (dados.jogador1 && dados.jogador1.uid !== auth.currentUser.uid && dados.tipo !== "desafio") {
                        if (!salaAberta) salaAberta = d.id;
                    }
                });

                if (salaAberta) {
                    await updateDoc(doc(db, "partidas", salaAberta), {
                        status: "andamento",
                        jogador2: {
                            uid: auth.currentUser.uid,
                            nome: currentUserDoc.nomeDisplay || "JOGADOR 2",
                            foto: currentUserDoc.fotoPerfil || "",
                            deck: deck
                        }
                    });
                    window.location.href = `arena.html?sala=${salaAberta}`;
                } else {
                    const docRef = await addDoc(collection(db, "partidas"), {
                        tipo: "aleatoria", status: "aguardando", criadoEm: serverTimestamp(),
                        jogador1: { uid: auth.currentUser.uid, nome: currentUserDoc.nomeDisplay || "JOGADOR 1", foto: currentUserDoc.fotoPerfil || "", deck: deck },
                        jogador2: null, turnoAtual: 0, quemAtaca: null
                    });
                    partidaIdAtual = docRef.id;
                    unsubscribePartida = onSnapshot(docRef, (docSnap) => {
                        if (docSnap.data()?.status === "andamento") window.location.href = `arena.html?sala=${docRef.id}`;
                    });
                }
            } catch (error) {
                console.error("Erro na busca:", error);
                cancelarBusca();
            }
        };

        window.cancelarBusca = async function() {
            document.getElementById('modal-busca').classList.add('hidden');
            if (partidaIdAtual) {
                if (unsubscribePartida) unsubscribePartida();
                try { await deleteDoc(doc(db, "partidas", partidaIdAtual)); } catch(e) {}
                partidaIdAtual = null;
            }
        };

        // ===============================================
        // RANKING E INICIALIZAÇÃO
        // ===============================================
        async function carregarRanking() {
            const container = document.getElementById('lista-ranking');
            const q = query(collection(db, "users"), orderBy("estatisticas.batalhasVencidas", "desc"), limit(5));
            const snap = await getDocs(q);
            container.innerHTML = '';
            let pos = 1;
            snap.forEach((d) => {
                const v = d.data().estatisticas?.batalhasVencidas || 0;
                const nome = (d.data().nomeDisplay || d.data().nome || "JOGADOR").toUpperCase();
                const div = document.createElement('div');
                div.className = pos === 1 ? "flex justify-between items-center bg-[#7a32a8] text-white rounded-full px-4 py-2 shadow-inner border border-yellow-400" : "flex justify-between items-center bg-[#7a32a8] text-white rounded-full px-4 py-2 shadow-inner";
                div.innerHTML = `<span class="font-black text-[11px] truncate max-w-[120px]">${pos}. ${nome}</span><span class="font-bold text-[10px] opacity-90">${v} VITÓRIAS</span>`;
                container.appendChild(div); pos++;
            });
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserUid = user.uid; // salva globalmente para usar nas buscas
                document.getElementById('player-name').innerText = user.displayName?.toUpperCase() || "JOGADOR";
                const snap = await getDoc(doc(db, "users", user.uid));
                if (snap.exists()) {
                    currentUserDoc = snap.data();

                    // AUTO-CURA: Salva o nome no banco se estiver faltando
                    if (!currentUserDoc.nomeDisplay && !currentUserDoc.nome && user.displayName) {
                        updateDoc(doc(db, "users", user.uid), { nomeDisplay: user.displayName });
                        currentUserDoc.nomeDisplay = user.displayName;
                    }
                    
                    document.getElementById('player-coins').innerText = currentUserDoc.moedas || 0;
                    document.getElementById('player-level').innerText = currentUserDoc.nivel || 1;
                    if (currentUserDoc.fotoPerfil) {
                        document.getElementById('img-perfil-global').src = currentUserDoc.fotoPerfil;
                        document.getElementById('img-perfil-global').classList.remove('hidden');
                        document.getElementById('texto-sem-foto').classList.add('hidden');
                    }
                    
                    let nxp = currentUserDoc.xp || 0;
                    let mxp = (currentUserDoc.nivel >= 1 && currentUserDoc.nivel <= 5) ? 200 : (currentUserDoc.nivel <= 15 ? 750 : (currentUserDoc.nivel <= 25 ? 1600 : 3000));
                    document.getElementById('player-barra-xp').style.width = `${Math.min((nxp/mxp)*100, 100)}%`;
                    document.getElementById('player-texto-xp').innerText = `${nxp}/${mxp} xp`;

                    carregarRanking();
                    escutarDesafios(); // Inicia a varredura por convites ou Lobbies do Firebase
                    
                    if (localStorage.getItem('novaBadge')) {
                        setTimeout(() => window.mostrarToast(`🏆 CONQUISTA!<br>Recompensa: +50 XP / +50 Moedas`), 500);
                        localStorage.removeItem('novaBadge');
                    }
                    if (localStorage.getItem('novoLevel')) {
                        setTimeout(() => window.mostrarToast(`🎉 LEVEL UP!`), 2000);
                        localStorage.removeItem('novoLevel');
                    }
                }
            } else window.location.href = "index.html";
        });
    </script>
</body>
</html>
