<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supercards - Inventário</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-image: url('fundotela.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes surgir {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .carta-animada {
            animation: surgir 0.5s ease-out forwards;
        }
    </style>
</head>
<body class="h-[100dvh] p-4 flex justify-center overflow-hidden">

    <div class="w-full max-w-sm flex flex-col h-full relative">
        <header class="relative w-full mt-6 mb-6 flex justify-center z-10">
            <div class="bg-[#dca3e8] w-full rounded-full flex justify-between items-center px-6 py-3 shadow-md">
                <span id="player-level" class="text-black font-black text-sm drop-shadow-sm">NÍVEL --</span>
                <span id="player-coins" class="text-white font-black text-sm drop-shadow-sm">-- moedas</span>
            </div>
            <div class="absolute -top-4 left-1/2 transform -translate-x-1/2 bg-[#bc7bd4] w-16 h-16 rounded-full flex items-center justify-center text-[#7a32a8] font-bold shadow-lg border-2 border-[#dca3e8]">
                foto
            </div>
        </header>

        <h1 class="text-white font-black text-2xl text-center mb-6 drop-shadow-md">Inventário</h1>

        <main class="flex-grow overflow-y-auto no-scrollbar pb-4">
            <div id="grid-inventario" class="grid grid-cols-4 gap-3"></div>
        </main>

        <footer class="mt-auto flex justify-center pb-2 pt-4">
            <button onclick="window.location.href='menu.html'" class="bg-[#7a32a8] hover:bg-purple-600 text-white font-black py-2 px-8 rounded-full shadow-lg transition-transform hover:-translate-y-1">
                retornar
            </button>
        </footer>

        <div id="modal-revelar-carta" class="hidden fixed inset-0 bg-black/95 z-[60] flex flex-col items-center justify-center p-4 backdrop-blur-md cursor-pointer select-none">
            <h3 id="texto-contador-carta" class="text-white font-black text-xl mb-8 tracking-widest uppercase drop-shadow-lg">CARTA 1 DE 5</h3>
            
            <div class="relative w-[65%] max-w-[240px] aspect-[2.5/3.5] flex justify-center items-center">
                <div id="brilho-raridade" class="absolute inset-0 bg-white blur-3xl opacity-60 rounded-full transition-colors duration-500"></div>
                
                <div id="carta-revelada-container" class="relative w-full h-full bg-gray-900 rounded-xl overflow-hidden shadow-[0_0_40px_rgba(0,0,0,0.8)] border-4 border-[#dca3e8] transform transition-transform duration-300 scale-0">
                    <img id="img-carta-revelada" src="" class="w-full h-full object-cover">
                </div>
            </div>
            
            <p class="text-white/70 font-bold mt-10 animate-pulse text-sm">Toque na tela para revelar</p>
        </div>

        <div id="modal-abrir-pacote" class="hidden fixed inset-0 bg-black/90 z-50 flex flex-col items-center justify-center p-4 backdrop-blur-sm">
            <h2 class="text-white font-black text-3xl mb-8 text-center drop-shadow-[0_0_10px_rgba(220,163,232,0.8)]">NOVAS CARTAS!</h2>
            <div id="cartas-tiradas" class="flex flex-wrap justify-center gap-2 w-full max-w-sm mb-8"></div>
            <button id="btn-fechar-pacote" class="bg-[#dca3e8] hover:bg-[#bc7bd4] text-black font-black py-3 px-10 rounded-full shadow-[0_0_15px_rgba(220,163,232,0.5)] transition-transform hover:scale-105">
                GUARDAR NA COLEÇÃO
            </button>
        </div>

        <div id="modal-confirmacao-abrir" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
            <div class="bg-[#dca3e8] border-4 border-[#7a32a8] rounded-2xl p-6 max-w-xs w-full text-center shadow-2xl">
                <h2 class="text-[#7a32a8] font-black text-xl mb-4" id="texto-confirmacao-abrir">Deseja abrir?</h2>
                <div class="flex justify-center gap-4 mt-6">
                    <button id="btn-cancelar-abrir" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-6 rounded-full shadow-md transition-transform hover:scale-105">NÃO</button>
                    <button id="btn-confirmar-abrir" class="bg-[#22c55e] hover:bg-[#16a34a] text-white font-black py-2 px-6 rounded-full shadow-md transition-transform hover:scale-105">SIM</button>
                </div>
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { INFO_CARTAS } from './cartas.js';

        const firebaseConfig = {
          apiKey: "AIzaSyCU3lFTgfrDMaD9jwR7X7ivYPmGQh4VE1g",
          authDomain: "supercards-tcg.firebaseapp.com",
          projectId: "supercards-tcg",
          storageBucket: "supercards-tcg.firebasestorage.app",
          messagingSenderId: "862316380615",
          appId: "1:862316380615:web:b3f28056ebc967673999e2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const gridInventario = document.getElementById('grid-inventario');
        const modalPacote = document.getElementById('modal-abrir-pacote');
        const divCartasTiradas = document.getElementById('cartas-tiradas');
        let currentUser = null;

        // Variáveis globais para o fluxo de revelação de cartas
        let arrayCartasRevelar = [];
        let indiceAtualRevelacao = 0;

        // --- SISTEMA DE DROP RATE --- //
        const bancoRaridades = { 'Comum': [], 'Rara': [], 'Épica': [], 'Lendária': [] };

        function normalizarRaridade(r) {
            if(!r) return "Comum";
            let lower = r.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            if (lower.includes("comum")) return "Comum";
            if (lower.includes("rara")) return "Rara";
            if (lower.includes("lendaria")) return "Lendária";
            if (lower.includes("epica")) return "Épica";
            return "Comum";
        }

        for (let i = 1; i <= 52; i++) {
            const id = String(i).padStart(3, '0');
            const carta = INFO_CARTAS[id];
            if (carta && carta.raridade) {
                bancoRaridades[normalizarRaridade(carta.raridade)].push(id);
            } else {
                bancoRaridades['Comum'].push(id);
            }
        }

        function sortearRaridade(tabelaProbs) {
            const rand = Math.random() * 100;
            let acumulado = 0;
            for (const [raridade, chance] of Object.entries(tabelaProbs)) {
                acumulado += chance;
                if (rand <= acumulado) return raridade;
            }
            return 'Comum';
        }

        function puxarCarta(raridade) {
            let lista = bancoRaridades[raridade];
            if (!lista || lista.length === 0) lista = bancoRaridades['Comum']; 
            return lista[Math.floor(Math.random() * lista.length)];
        }
        // ------------------------------ //

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                carregarInventario();
            } else {
                window.location.href = "index.html";
            }
        });

        async function carregarInventario() {
            const docRef = doc(db, "users", currentUser.uid);
            const docSnap = await getDoc(docRef);
            gridInventario.innerHTML = ""; 

            if (docSnap.exists()) {
                const dados = docSnap.data();
                
                document.getElementById('player-level').innerText = `NÍVEL ${dados.nivel || 1}`;
                document.getElementById('player-coins').innerText = `${dados.moedas || 0} moedas`;

                let itensNaMochila = [];

                if (dados.inventario && dados.inventario.pacoteBasico > 0) {
                    itensNaMochila.push({ img: 'pacote1.png', qtd: dados.inventario.pacoteBasico, tipo: 'pacoteBasico', nome: 'Pacote Básico' });
                }
                
                if (dados.inventario && dados.inventario.pacotePremium > 0) {
                    itensNaMochila.push({ img: 'pacote2.png', qtd: dados.inventario.pacotePremium, tipo: 'pacotePremium', nome: 'Pacote Premium' });
                }
                
                if (dados.fragmentos > 0) {
                    itensNaMochila.push({ img: 'fragmento.png', qtd: dados.fragmentos, tipo: 'fragmentos', nome: 'Fragmentos' });
                }

                for (let i = 0; i < 16; i++) {
                    const slot = document.createElement('div');
                    slot.className = "bg-[#dca3e8] aspect-square rounded-[1rem] shadow-sm relative flex items-center justify-center p-2";

                    if (i < itensNaMochila.length) {
                        const item = itensNaMochila[i];
                        slot.innerHTML = `
                            <span class="absolute top-1 left-1/2 transform -translate-x-1/2 text-black font-black text-[10px] drop-shadow-sm z-10">${item.qtd}</span>
                            <img src="${item.img}" alt="${item.nome}" class="w-[80%] h-[80%] object-contain drop-shadow-md hover:scale-110 transition-transform cursor-pointer">
                        `;
                        if (item.tipo.includes('pacote')) {
                            slot.querySelector('img').addEventListener('click', () => abrirPacote(item.tipo, item.nome));
                        }
                    }
                    gridInventario.appendChild(slot);
                }
            }
        }

        let pacoteParaAbrir = null;
        const modalConfirmacaoAbrir = document.getElementById('modal-confirmacao-abrir');

        function abrirPacote(tipoPacoteID, nomePacote) {
            pacoteParaAbrir = tipoPacoteID;
            document.getElementById('texto-confirmacao-abrir').innerText = `Abrir 1 ${nomePacote}?`;
            modalConfirmacaoAbrir.classList.remove('hidden');
        }

        document.getElementById('btn-cancelar-abrir').addEventListener('click', () => {
            modalConfirmacaoAbrir.classList.add('hidden');
            pacoteParaAbrir = null;
        });

        // -----------------------------------------------------------------------------------
        // LÓGICA DE REVELAÇÃO (CLICAR NA TELA PARA PRÓXIMA CARTA)
        // -----------------------------------------------------------------------------------
        const modalRevelar = document.getElementById('modal-revelar-carta');
        const imgCartaRevelada = document.getElementById('img-carta-revelada');
        const containerCartaRevelada = document.getElementById('carta-revelada-container');
        const brilhoRaridade = document.getElementById('brilho-raridade');

        function mostrarProximaCarta() {
            if (indiceAtualRevelacao < 5) {
                const idCarta = arrayCartasRevelar[indiceAtualRevelacao];
                const info = INFO_CARTAS[idCarta];
                const raridade = normalizarRaridade(info.raridade);
                
                // Esconde a carta atual dando um "zoom out" rápido
                containerCartaRevelada.classList.remove('scale-100');
                containerCartaRevelada.classList.add('scale-0');
                
                // Pequeno delay para trocar a imagem enquanto está escondida
                setTimeout(() => {
                    imgCartaRevelada.src = info.imagem;
                    document.getElementById('texto-contador-carta').innerText = `CARTA ${indiceAtualRevelacao + 1} DE 5`;
                    
                    // Muda a cor do brilho baseado na raridade
                    let corBrilho = "rgba(255, 255, 255, 0.4)"; // Comum (Branco)
                    let corBorda = "#dca3e8"; 

                    if (raridade === "Rara") { corBrilho = "rgba(59, 130, 246, 0.8)"; corBorda = "#3b82f6"; } // Azul
                    if (raridade === "Épica") { corBrilho = "rgba(147, 51, 234, 0.8)"; corBorda = "#9333ea"; } // Roxo Forte
                    if (raridade === "Lendária") { corBrilho = "rgba(234, 179, 8, 0.9)"; corBorda = "#eab308"; } // Dourado
                    
                    brilhoRaridade.style.backgroundColor = corBrilho;
                    containerCartaRevelada.style.borderColor = corBorda;

                    // Mostra a carta nova dando o "zoom in"
                    containerCartaRevelada.classList.remove('scale-0');
                    containerCartaRevelada.classList.add('scale-100');
                    
                    indiceAtualRevelacao++;
                }, 200);

            } else {
                // Acabaram as 5 cartas. Fecha a revelação e abre o resumo!
                modalRevelar.classList.add('hidden');
                modalPacote.classList.remove('hidden');
            }
        }

        // Clicar no modal de revelação puxa a próxima carta
        modalRevelar.addEventListener('click', mostrarProximaCarta);

        // -----------------------------------------------------------------------------------
        // Clicou em "SIM" para abrir o pacote
        // -----------------------------------------------------------------------------------
        document.getElementById('btn-confirmar-abrir').addEventListener('click', async () => {
            modalConfirmacaoAbrir.classList.add('hidden');
            if (!pacoteParaAbrir) return;

            try {
                const cartasSorteadas = [];
                const contagemParaSalvar = {};

                if (pacoteParaAbrir === 'pacoteBasico') {
                    const probsBasico = { 'Comum': 80, 'Rara': 17, 'Lendária': 2.5, 'Épica': 0.5 };
                    for (let i = 0; i < 5; i++) {
                        const raridade = sortearRaridade(probsBasico);
                        const idCarta = puxarCarta(raridade);
                        cartasSorteadas.push(idCarta);
                        contagemParaSalvar[idCarta] = (contagemParaSalvar[idCarta] || 0) + 1;
                    }
                } else if (pacoteParaAbrir === 'pacotePremium') {
                    const probsGarantida = { 'Rara': 75, 'Lendária': 20, 'Épica': 5 };
                    const probsNormal = { 'Comum': 60, 'Rara': 30, 'Lendária': 8, 'Épica': 2 };
                    for (let i = 0; i < 5; i++) {
                        let raridade = (i === 0) ? sortearRaridade(probsGarantida) : sortearRaridade(probsNormal);
                        const idCarta = puxarCarta(raridade);
                        cartasSorteadas.push(idCarta);
                        contagemParaSalvar[idCarta] = (contagemParaSalvar[idCarta] || 0) + 1;
                    }
                }

                // Salva no banco de dados IMEDIATAMENTE por segurança
                const atualizacaoColecao = {};
                for (const id in contagemParaSalvar) {
                    atualizacaoColecao[id] = increment(contagemParaSalvar[id]);
                }

                const docRef = doc(db, "users", currentUser.uid);
                await setDoc(docRef, {
                    inventario: { [pacoteParaAbrir]: increment(-1) },
                    colecao: atualizacaoColecao
                }, { merge: true });

                // Prepara a tela final de resumo por baixo dos panos
                divCartasTiradas.innerHTML = "";
                cartasSorteadas.forEach((id, index) => {
                    const info = INFO_CARTAS[id];
                    divCartasTiradas.innerHTML += `
                        <div class="w-[30%] max-w-[100px] aspect-[2.5/3.5] bg-gray-800 rounded-md overflow-hidden shadow-[0_0_10px_rgba(0,0,0,0.8)] border-2 border-[#dca3e8] carta-animada" style="animation-delay: ${index * 0.15}s; opacity: 0;">
                            <img src="${info.imagem}" class="w-full h-full object-cover" onerror="this.src='cartas/001.png'">
                        </div>
                    `;
                });

                // Inicia o fluxo de revelar uma por vez
                arrayCartasRevelar = cartasSorteadas;
                indiceAtualRevelacao = 0;
                modalRevelar.classList.remove('hidden');
                mostrarProximaCarta();

            } catch (error) {
                console.error("Erro ao abrir pacote:", error);
            }
            pacoteParaAbrir = null;
        });

        // Clicar em guardar na coleção fecha o resumo final e recarrega
        document.getElementById('btn-fechar-pacote').addEventListener('click', () => {
            modalPacote.classList.add('hidden');
            carregarInventario(); 
        });
    </script>
</body>
</html>
