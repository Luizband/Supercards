<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supercards - Inventário</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-image: url('fundotela.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        #toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            width: 90%;
            max-width: 350px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast-msg {
            background: #dca3e8;
            color: #7a32a8;
            border: 3px solid #7a32a8;
            padding: 12px 20px;
            border-radius: 9999px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.3);
            text-align: center;
            font-weight: 900;
            font-size: 0.85rem;
            animation: slideDown 0.3s ease-out;
            pointer-events: auto;
        }
        
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Animação Suave de Aparecer Crescendo */
        @keyframes zoomIn {
            0% { transform: scale(0.5); opacity: 0; filter: brightness(2); }
            100% { transform: scale(1); opacity: 1; filter: brightness(1); }
        }
        .anim-aparecer { 
            animation: zoomIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; 
            opacity: 0; 
        }
    </style>
</head>
<body class="h-[100dvh] p-4 flex justify-center overflow-hidden">

    <div id="toast-container"></div>

    <div class="w-full max-w-sm flex flex-col h-full relative">
        
        <header class="flex items-center gap-4 mt-4 mb-4 w-full">
            <div class="relative flex-shrink-0">
                <div class="bg-[#dca3e8] w-24 h-24 rounded-full flex items-center justify-center text-[#7a32a8] font-black text-xl shadow-lg border-2 border-[#bc7bd4] relative overflow-hidden">
                    <span id="texto-sem-foto">FOTO</span>
                    <img id="img-perfil-global" src="" class="hidden w-full h-full object-cover absolute inset-0">
                </div>
                <div class="absolute -bottom-2 left-1/2 transform -translate-x-1/2 bg-[#bc7bd4] w-8 h-8 rounded-full flex items-center justify-center shadow-md border-2 border-[#dca3e8] z-30">
                    <span id="player-level" class="text-[#7a32a8] font-black text-sm">--</span>
                </div>
            </div>

            <div class="flex flex-col flex-grow gap-2 justify-center">
                <div class="flex items-center gap-2 w-full">
                    <div class="bg-[#dca3e8] rounded-full px-3 py-2 flex items-center justify-center shadow-md flex-grow overflow-hidden">
                        <span id="player-name" class="text-[#7a32a8] font-black text-base tracking-wide uppercase truncate max-w-[130px]">JOGADOR</span>
                    </div>
                    <div class="bg-[#dca3e8] rounded-full px-3 py-2 flex items-center justify-center gap-1 shadow-md flex-shrink-0">
                        <span id="player-coins" class="text-[#7a32a8] font-black text-sm">0</span>
                        <img src="moedas.png" class="w-4 h-4 object-contain">
                    </div>
                </div>
                <div class="flex flex-col items-center mt-1 w-full">
                    <div class="w-full bg-transparent border border-[#dca3e8] rounded-full h-3 overflow-hidden shadow-inner">
                        <div id="barra-xp" class="bg-[#dca3e8] h-full transition-all duration-500" style="width: 0%;"></div>
                    </div>
                    <span id="texto-xp" class="text-[#dca3e8] text-[10px] font-bold mt-1">0/0 xp</span>
                </div>
            </div>
        </header>

        <main class="bg-[#dca3e8] rounded-[2rem] flex flex-col flex-grow p-5 shadow-xl overflow-hidden mb-16 relative border-2 border-[#bc7bd4]">
            <h1 class="text-[#7a32a8] font-black text-xl text-center mb-6 drop-shadow-sm uppercase">Meus Pacotes</h1>
            
            <div id="lista-pacotes" class="flex flex-col gap-4 overflow-y-auto no-scrollbar pb-4">
                <span class="text-center text-[#7a32a8] font-black mt-10 animate-pulse">Carregando inventário...</span>
            </div>
        </main>

        <footer class="mt-auto flex justify-center pb-2 z-10 absolute bottom-4 left-0 w-full pointer-events-none">
            <button onclick="window.location.href='menu.html'" class="bg-[#7a32a8] hover:bg-purple-600 text-white font-black text-sm py-2 px-10 rounded-full shadow-lg transition-transform hover:-translate-y-1 pointer-events-auto border-2 border-[#dca3e8]">
                retornar
            </button>
        </footer>

        <div id="modal-abrir-pacote" class="hidden fixed inset-0 bg-black/90 z-[100] flex flex-col items-center justify-center p-4 backdrop-blur-md">
            <h2 class="text-[#4ade80] font-black text-2xl mb-6 text-center uppercase drop-shadow-lg">Novas Cartas!</h2>
            
            <div id="grid-novas-cartas" class="flex flex-wrap justify-center gap-4 mb-8">
            </div>
            
            <button id="btn-guardar-colecao" onclick="window.guardarNaColecao()" class="hidden bg-[#7a32a8] hover:bg-purple-600 text-white font-black py-3 px-10 rounded-full shadow-lg transition-transform hover:scale-105 uppercase text-sm border-2 border-[#bc7bd4]">
                Guardar na Coleção
            </button>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, increment, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { INFO_CARTAS } from './cartas.js';

        const firebaseConfig = {
          apiKey: "AIzaSyCU3lFTgfrDMaD9jwR7X7ivYPmGQh4VE1g",
          authDomain: "supercards-tcg.firebaseapp.com",
          projectId: "supercards-tcg",
          storageBucket: "supercards-tcg.firebasestorage.app",
          messagingSenderId: "862316380615",
          appId: "1:862316380615:web:b3f28056ebc967673999e2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let dbUserRef = null;
        let dadosJogador = null;
        let abrindoPacote = false;
        
        let cartasSorteadaTemp = [];
        let tipoPacoteTemp = '';

        // Tabela de cores para o brilho de cada raridade
        const CORES_RARIDADE = {
            'Comum': '#a1a1aa',     // Cinza
            'Rara': '#3b82f6',      // Azul
            'Épica': '#a855f7',     // Roxo
            'Lendária': '#eab308'   // Dourado
        };

        const bancoRaridades = { 'Comum': [], 'Rara': [], 'Épica': [], 'Lendária': [] };
        for (const [id, carta] of Object.entries(INFO_CARTAS)) {
            if (bancoRaridades[carta.raridade]) {
                bancoRaridades[carta.raridade].push(id);
            }
        }

        window.mostrarToast = function(mensagem) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast-msg';
            toast.innerHTML = mensagem;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s ease';
                setTimeout(() => toast.remove(), 500); 
            }, 3000);
        };

        function obterGameDay() {
            let agora = new Date();
            if (agora.getHours() < 6) agora.setDate(agora.getDate() - 1);
            return `${agora.getFullYear()}-${agora.getMonth() + 1}-${agora.getDate()}`;
        }

        function calcularXPMaximo(nivel) {
            if (nivel >= 1 && nivel <= 5) return 200;
            if (nivel >= 6 && nivel <= 15) return 750;
            if (nivel >= 16 && nivel <= 25) return 1600;
            return 3000;
        }

        function atualizarVisualBarraXP(xpAtual, nivelAtual) {
            const xpMaximo = calcularXPMaximo(nivelAtual);
            const porcentagem = Math.min((xpAtual / xpMaximo) * 100, 100);
            document.getElementById('player-level').innerText = nivelAtual; 
            document.getElementById('texto-xp').innerText = `${xpAtual}/${xpMaximo} xp`;
            document.getElementById('barra-xp').style.width = `${porcentagem}%`;
        }

        function criarHTMLPacote(tipo, nome, desc, qtd, imagemSrc) {
            const isPremium = tipo === 'premium';
            const bgClass = isPremium ? 'bg-gradient-to-r from-[#ffd700]/80 to-[#ffaa00]/80 border-[#ffd700]' : 'bg-[#bc7bd4] border-[#7a32a8]/30';
            const titleClass = isPremium ? 'text-[#996600]' : 'text-[#7a32a8]';
            const descClass = isPremium ? 'text-[#805500]' : 'text-[#7a32a8]';

            return `
            <div class="${bgClass} rounded-2xl p-4 flex items-center gap-4 shadow-md border">
                <img src="${imagemSrc}" alt="${nome}" class="w-16 h-24 object-contain drop-shadow-lg pointer-events-none flex-shrink-0">
                <div class="flex flex-col flex-grow">
                    <span class="${titleClass} font-black text-sm uppercase leading-tight">${nome}</span>
                    <span class="${descClass} font-bold text-[10px] mb-2 leading-tight">${desc}</span>
                    <div class="flex items-center justify-between mt-auto">
                        <span class="bg-[#7a32a8] text-white px-3 py-1 rounded-full text-[10px] font-black shadow-inner">
                            QTD: <span>${qtd}</span>
                        </span>
                        <button onclick="abrirPacote('${tipo}')" class="bg-[#4ade80] hover:bg-[#22c55e] text-[#7a32a8] font-black text-[10px] px-4 py-1.5 rounded-full shadow-md uppercase transition-transform hover:scale-105 border border-[#22c55e]">
                            ABRIR
                        </button>
                    </div>
                </div>
            </div>`;
        }

        async function carregarInventario() {
            const docSnap = await getDoc(dbUserRef);
            if (docSnap.exists()) {
                dadosJogador = docSnap.data();
                
                if (dadosJogador.fotoPerfil) {
                    const imgElement = document.getElementById('img-perfil-global');
                    if (imgElement) {
                        imgElement.src = dadosJogador.fotoPerfil;
                        imgElement.classList.remove('hidden');
                        document.getElementById('texto-sem-foto').classList.add('hidden');
                    }
                }

                document.getElementById('player-coins').innerText = dadosJogador.moedas || 0;
                atualizarVisualBarraXP(dadosJogador.xp || 0, dadosJogador.nivel || 1);
                
                const inventario = dadosJogador.inventario || {};
                const qtdBasico = inventario.pacoteBasico || 0;
                const qtdPremium = inventario.pacotePremium || 0;
                
                const lista = document.getElementById('lista-pacotes');
                lista.innerHTML = '';

                if (qtdBasico <= 0 && qtdPremium <= 0) {
                    lista.innerHTML = '<span class="text-center text-[#7a32a8] font-black mt-10">Você não possui pacotes.</span>';
                    return;
                }

                if (qtdBasico > 0) {
                    lista.innerHTML += criarHTMLPacote('basico', 'Pacote Básico', '5 Cartas Aleatórias', qtdBasico, 'pacote1.png');
                }

                if (qtdPremium > 0) {
                    lista.innerHTML += criarHTMLPacote('premium', 'Pacote Premium', 'Garante 1 Rara ou superior', qtdPremium, 'pacote2.png');
                }
            }
        }

        function sortearCarta(ehPremium) {
            const roll = Math.random() * 100;
            let raridade = 'Comum';
            
            if (ehPremium) {
                if (roll < 10) raridade = 'Lendária';
                else if (roll < 35) raridade = 'Épica';
                else if (roll < 70) raridade = 'Rara';
                else raridade = 'Comum';
            } else {
                if (roll < 2) raridade = 'Lendária';
                else if (roll < 10) raridade = 'Épica';
                else if (roll < 30) raridade = 'Rara';
                else raridade = 'Comum';
            }

            let lista = bancoRaridades[raridade];
            if (!lista || lista.length === 0) lista = bancoRaridades['Comum'];
            return lista[Math.floor(Math.random() * lista.length)];
        }

        // FASE 1: SORTEIA E ANIMA AS CARTAS UMA A UMA (COM BRILHO DA RARIDADE)
        window.abrirPacote = async function(tipo) {
            if (abrindoPacote) return;
            abrindoPacote = true;

            const campo = tipo === 'basico' ? 'pacoteBasico' : 'pacotePremium';
            let qtd = (dadosJogador.inventario && dadosJogador.inventario[campo]) || 0;
            
            if (qtd <= 0) {
                window.mostrarToast("Pacote esgotado!");
                abrindoPacote = false;
                return;
            }

            tipoPacoteTemp = tipo;
            cartasSorteadaTemp = [];
            for(let i=0; i<5; i++) {
                cartasSorteadaTemp.push(sortearCarta(tipo === 'premium'));
            }

            const grid = document.getElementById('grid-novas-cartas');
            grid.innerHTML = '';
            document.getElementById('btn-guardar-colecao').classList.add('hidden');
            document.getElementById('modal-abrir-pacote').classList.remove('hidden');

            cartasSorteadaTemp.forEach((id, index) => {
                setTimeout(() => {
                    const info = INFO_CARTAS[id];
                    const corRaridade = CORES_RARIDADE[info.raridade] || '#dca3e8';
                    
                    const divCarta = document.createElement('div');
                    
                    // Aplica a animação de "Aparecer", a borda colorida e a sombra/brilho mágica
                    divCarta.className = "w-24 aspect-[2.5/3.5] bg-gray-800 rounded-lg overflow-hidden border-2 anim-aparecer";
                    divCarta.style.borderColor = corRaridade;
                    divCarta.style.boxShadow = `0 0 20px ${corRaridade}80`; // O "80" no final aplica 50% de opacidade no brilho
                    
                    divCarta.innerHTML = `<img src="${info.imagem}" class="w-full h-full object-cover">`;
                    
                    grid.appendChild(divCarta);

                    if (index === cartasSorteadaTemp.length - 1) {
                        setTimeout(() => {
                            document.getElementById('btn-guardar-colecao').classList.remove('hidden');
                            abrindoPacote = false;
                        }, 800);
                    }
                }, index * 800);
            });
        };

        // FASE 2: SALVA NO BANCO E CALCULA AS BADGES
        window.guardarNaColecao = async function() {
            document.getElementById('btn-guardar-colecao').classList.add('hidden'); 
            window.mostrarToast("Guardando na coleção... ⏳");

            try {
                const campo = tipoPacoteTemp === 'basico' ? 'pacoteBasico' : 'pacotePremium';
                
                // 1. CHECAGEM DA BADGE DE ABRIR 30 PACOTES
                let pacotesAbertosAtuais = (dadosJogador.estatisticas?.pacotesAbertos || 0) + 1;
                let badgesJogador = dadosJogador.badges || {};
                let ganhouBadge = false;
                let notificacoesNovas = [];

                if (pacotesAbertosAtuais >= 30 && !badgesJogador["badge-004"]) {
                    badgesJogador["badge-004"] = true;
                    ganhouBadge = true;
                    notificacoesNovas.push({
                        id: "notif_" + Date.now() + "_badge004",
                        titulo: "🏆 Conquista: Abridor Compulsivo",
                        texto: "Você abriu 30 pacotes de cartas!\nRecompensas: 50 XP e 50 Moedas.",
                        lida: false,
                        data: new Date().toISOString()
                    });
                }

                // 2. CHECAGEM DA MISSÃO DIÁRIA
                let pacoteMissoes = dadosJogador.missoesDiarias || {};
                const hoje = obterGameDay();
                let atualizouMissao = false;
                let msgMissaoProgresso = "";

                if (pacoteMissoes.dataReset === hoje && pacoteMissoes.lista) {
                    pacoteMissoes.lista.forEach(m => {
                        if (m.id === "abrir_pacote" && m.progresso < m.meta) {
                            m.progresso++;
                            atualizouMissao = true;
                            msgMissaoProgresso = `🎯 Progresso: ${m.desc}`;
                        }
                    });
                }

                // 3. MATEMÁTICA DO LEVEL UP
                let xpAtual = dadosJogador.xp || 0;
                let nivelAtual = dadosJogador.nivel || 1;
                let subiuNivel = false;
                let msgLevelUp = "";
                let bonusXp = ganhouBadge ? 50 : 0;
                let bonusMoedas = ganhouBadge ? 50 : 0;
                let novoXp = xpAtual + bonusXp;
                let pacotesBasicosGanhos = 0;
                let pacotesPremiumGanhos = 0;

                let xpMaximo = calcularXPMaximo(nivelAtual);
                if (novoXp >= xpMaximo && nivelAtual < 30) {
                    novoXp -= xpMaximo;
                    nivelAtual++;
                    subiuNivel = true;
                    bonusMoedas += 30;
                    pacotesBasicosGanhos++;

                    let textoRecompensaNotif = "1 Pacote Básico e 30 Moedas";
                    if (nivelAtual === 10 || nivelAtual === 20 || nivelAtual === 30) {
                        pacotesPremiumGanhos++;
                        textoRecompensaNotif = "1 Pacote Básico, 1 Pacote Premium e 30 Moedas";
                        msgLevelUp = `🎉 LEVEL UP! Nível ${nivelAtual} alcançado!<br><span class="text-xs">Recompensas: 1 Pacote Básico, 1 Pacote Premium e 30 <img src="moedas.png" class="inline w-4 h-4 ml-0.5 align-text-bottom"></span>`;
                    } else {
                        msgLevelUp = `🎉 LEVEL UP! Nível ${nivelAtual} alcançado!<br><span class="text-xs">Recompensas: 1 Pacote Básico e 30 <img src="moedas.png" class="inline w-4 h-4 ml-0.5 align-text-bottom"></span>`;
                    }

                    notificacoesNovas.push({
                        id: "notif_" + Date.now() + "_nivel" + nivelAtual,
                        titulo: `🎉 Level Up: Nível ${nivelAtual}`,
                        texto: `Parabéns! Você alcançou o Nível ${nivelAtual}.\nRecompensas recebidas: ${textoRecompensaNotif}.`,
                        lida: false,
                        data: new Date().toISOString()
                    });
                }

                // 4. PREPARANDO PACOTE DE ATUALIZAÇÃO DO BANCO
                let deltaBasico = (campo === 'pacoteBasico' ? -1 : 0) + pacotesBasicosGanhos;
                let deltaPremium = (campo === 'pacotePremium' ? -1 : 0) + pacotesPremiumGanhos;

                let updates = {
                    "estatisticas.pacotesAbertos": increment(1),
                    "estatisticas.totalCartas": increment(5),
                    "badges": badgesJogador,
                    "xp": novoXp,
                    "nivel": nivelAtual,
                    "moedas": increment(bonusMoedas)
                };

                if (deltaBasico !== 0) updates["inventario.pacoteBasico"] = increment(deltaBasico);
                if (deltaPremium !== 0) updates["inventario.pacotePremium"] = increment(deltaPremium);

                cartasSorteadaTemp.forEach(id => {
                    updates[`colecao.${id}`] = increment(1);
                });

                if (atualizouMissao) updates.missoesDiarias = pacoteMissoes;
                if (notificacoesNovas.length > 0) updates.notificacoes = arrayUnion(...notificacoesNovas);

                // Dispara o salvamento e recarrega a tela
                await updateDoc(dbUserRef, updates);
                document.getElementById('modal-abrir-pacote').classList.add('hidden');
                carregarInventario();

                // 5. CASCATA DE TOASTS
                let delay = 500;
                if (atualizouMissao) {
                    setTimeout(() => window.mostrarToast(msgMissaoProgresso), delay);
                    delay += 1000;
                }
                if (ganhouBadge) {
                    setTimeout(() => window.mostrarToast(`🏆 NOVA CONQUISTA!<br><span class="text-xs font-normal">Você abriu 30 pacotes no total.</span><br><span class="text-sm">Recompensa: +50 XP e +50 <img src="moedas.png" class="inline w-4 h-4 align-text-bottom"></span>`), delay);
                    delay += 1500;
                }
                if (subiuNivel) {
                    setTimeout(() => window.mostrarToast(msgLevelUp), delay);
                }

            } catch (e) {
                console.error(e);
                window.mostrarToast("Erro ao guardar as cartas no banco.");
                document.getElementById('btn-guardar-colecao').classList.remove('hidden'); 
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUserUid = user.uid;
                dbUserRef = doc(db, "users", currentUserUid);
                carregarInventario();
            } else {
                window.location.href = "index.html";
            }
        });
    </script>
</body>
</html>
