<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supercards - Inventário</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-image: url('fundotela.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        #toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            width: 90%;
            max-width: 350px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast-msg {
            background: #dca3e8;
            color: #7a32a8;
            border: 3px solid #7a32a8;
            padding: 12px 20px;
            border-radius: 9999px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.3);
            text-align: center;
            font-weight: 900;
            font-size: 0.85rem;
            animation: slideDown 0.3s ease-out;
            pointer-events: auto;
        }
        
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Animação Suave para a Carta Única Revelada */
        @keyframes popIn {
            0% { transform: scale(0.7); opacity: 0; filter: brightness(2); }
            100% { transform: scale(1); opacity: 1; filter: brightness(1); }
        }
        .anim-pop { 
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; 
        }
        
        /* Previne cliques acidentais e facilita a transição */
        .transicao-suave {
            transition: transform 0.15s ease, opacity 0.15s ease;
        }
    </style>
</head>
<body class="h-[100dvh] p-4 flex justify-center overflow-hidden">

    <div id="toast-container"></div>

    <div class="w-full max-w-sm flex flex-col h-full relative">
        
        <!-- CABEÇALHO -->
        <header class="flex items-center gap-4 mt-4 mb-4 w-full">
            <div class="relative flex-shrink-0">
                <div class="bg-[#dca3e8] w-24 h-24 rounded-full flex items-center justify-center text-[#7a32a8] font-black text-xl shadow-lg border-2 border-[#bc7bd4] relative overflow-hidden">
                    <span id="texto-sem-foto">FOTO</span>
                    <img id="img-perfil-global" src="" class="hidden w-full h-full object-cover absolute inset-0">
                </div>
                <div class="absolute -bottom-2 left-1/2 transform -translate-x-1/2 bg-[#bc7bd4] w-8 h-8 rounded-full flex items-center justify-center shadow-md border-2 border-[#dca3e8] z-30">
                    <span id="player-level" class="text-[#7a32a8] font-black text-sm">--</span>
                </div>
            </div>

            <div class="flex flex-col flex-grow gap-2 justify-center">
                <div class="flex items-center gap-2 w-full">
                    <div class="bg-[#dca3e8] rounded-full px-3 py-2 flex items-center justify-center shadow-md flex-grow overflow-hidden">
                        <span id="player-name" class="text-[#7a32a8] font-black text-base tracking-wide uppercase truncate max-w-[130px]">JOGADOR</span>
                    </div>
                    <div class="bg-[#dca3e8] rounded-full px-3 py-2 flex items-center justify-center gap-1 shadow-md flex-shrink-0">
                        <span id="player-coins" class="text-[#7a32a8] font-black text-sm">0</span>
                        <img src="moedas.png" class="w-4 h-4 object-contain">
                    </div>
                </div>
                <div class="flex flex-col items-center mt-1 w-full">
                    <div class="w-full bg-transparent border border-[#dca3e8] rounded-full h-3 overflow-hidden shadow-inner">
                        <div id="barra-xp" class="bg-[#dca3e8] h-full transition-all duration-500" style="width: 0%;"></div>
                    </div>
                    <span id="texto-xp" class="text-[#dca3e8] text-[10px] font-bold mt-1">0/0 xp</span>
                </div>
            </div>
        </header>

        <!-- ÁREA DO INVENTÁRIO -->
        <main class="bg-[#dca3e8] rounded-[2rem] flex flex-col flex-grow p-5 shadow-xl overflow-hidden mb-16 relative border-2 border-[#bc7bd4]">
            <h1 class="text-[#7a32a8] font-black text-xl text-center mb-6 drop-shadow-sm uppercase">Meus Pacotes</h1>
            
            <div id="lista-pacotes" class="flex flex-col gap-4 overflow-y-auto no-scrollbar pb-4">
                <span class="text-center text-[#7a32a8] font-black mt-10 animate-pulse">Carregando inventário...</span>
            </div>
        </main>

        <!-- BOTÃO VOLTAR -->
        <footer class="mt-auto flex justify-center pb-2 z-10 absolute bottom-10 left-0 w-full pointer-events-none">
            <button onclick="window.location.href='menu.html'" class="bg-[#7a32a8] hover:bg-purple-600 text-white font-black py-2 px-8 rounded-full shadow-lg transition-transform hover:-translate-y-1 pointer-events-auto border-2 border-[#dca3e8] uppercase tracking-wider">
                VOLTAR
            </button>
        </footer>

        <!-- MODAL DE CARTAS ABERTAS -->
        <div id="modal-abrir-pacote" class="hidden fixed inset-0 bg-black/95 z-[100] flex flex-col items-center justify-center p-4 backdrop-blur-md">
            
            <h2 id="titulo-abrir-pacote" class="text-[#4ade80] font-black text-2xl mb-8 text-center uppercase drop-shadow-lg">Toque para revelar</h2>
            
            <!-- EXIBIÇÃO DE CARTA ÚNICA (O Jogador clica aqui para avançar) -->
            <div id="container-revelacao" onclick="window.mostrarProximaCarta()" class="w-56 aspect-[2.5/3.5] bg-gray-800 rounded-2xl overflow-hidden border-4 cursor-pointer flex items-center justify-center relative shadow-2xl transicao-suave" data-bloqueado="false">
                <img id="img-revelacao" src="" class="w-full h-full object-cover">
            </div>

            <!-- GRID FINAL DE 5 CARTAS (Escondido até o fim da revelação) -->
            <div id="grid-novas-cartas" class="hidden flex-wrap justify-center gap-3 mb-8">
                <!-- Injetado via JS -->
            </div>
            
            <!-- BOTÃO GUARDAR (Escondido até o fim da revelação) -->
            <button id="btn-guardar-colecao" onclick="window.guardarNaColecao()" class="hidden mt-8 bg-[#7a32a8] hover:bg-purple-600 text-white font-black py-3 px-10 rounded-full shadow-lg transition-transform hover:scale-105 uppercase text-sm border-2 border-[#bc7bd4]">
                Guardar na Coleção
            </button>
        </div>

    </div>

    <!-- SCRIPT DO FIREBASE E LÓGICA -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, increment, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { INFO_CARTAS } from './cartas.js';

        const firebaseConfig = {
          apiKey: "AIzaSyCU3lFTgfrDMaD9jwR7X7ivYPmGQh4VE1g",
          authDomain: "supercards-tcg.firebaseapp.com",
          projectId: "supercards-tcg",
          storageBucket: "supercards-tcg.firebasestorage.app",
          messagingSenderId: "862316380615",
          appId: "1:862316380615:web:b3f28056ebc967673999e2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserUid = null;
        let dbUserRef = null;
        let dadosJogador = null;
        let abrindoPacote = false;
        
        let cartasSorteadaTemp = [];
        let tipoPacoteTemp = '';
        let indiceRevelacao = 0;

        // Cores de brilho por raridade
        const CORES_RARIDADE = {
            'Comum': '#a1a1aa',     
            'Rara': '#3b82f6',      
            'Lendária': '#eab308',  
            'Épica': '#a855f7'      
        };

        const bancoBase = { 'Comum': [], 'Rara': [], 'Lendária': [], 'Épica': [] };
        const bancoPOI = { 'Comum': [], 'Rara': [], 'Lendária': [], 'Épica': [] };
        const bancoGeral = { 'Comum': [], 'Rara': [], 'Lendária': [], 'Épica': [] };

        for (const [id, carta] of Object.entries(INFO_CARTAS)) {
            let numId = parseInt(id); 
            if (numId <= 52) {
                if (bancoBase[carta.raridade]) bancoBase[carta.raridade].push(id);
            } else {
                if (bancoPOI[carta.raridade]) bancoPOI[carta.raridade].push(id);
            }
            if (bancoGeral[carta.raridade]) bancoGeral[carta.raridade].push(id);
        }

        window.mostrarToast = function(mensagem) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast-msg';
            toast.innerHTML = mensagem;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s ease';
                setTimeout(() => toast.remove(), 500); 
            }, 3000);
        };

        function obterGameDay() {
            let agora = new Date();
            if (agora.getHours() < 6) agora.setDate(agora.getDate() - 1);
            return `${agora.getFullYear()}-${agora.getMonth() + 1}-${agora.getDate()}`;
        }

        function calcularXPMaximo(nivel) {
            if (nivel >= 1 && nivel <= 5) return 200;
            if (nivel >= 6 && nivel <= 15) return 750;
            if (nivel >= 16 && nivel <= 25) return 1600;
            return 3000;
        }

        function atualizarVisualBarraXP(xpAtual, nivelAtual) {
            const xpMaximo = calcularXPMaximo(nivelAtual);
            const porcentagem = Math.min((xpAtual / xpMaximo) * 100, 100);
            document.getElementById('player-level').innerText = nivelAtual; 
            document.getElementById('texto-xp').innerText = `${xpAtual}/${xpMaximo} xp`;
            document.getElementById('barra-xp').style.width = `${porcentagem}%`;
        }

        function criarHTMLPacote(tipo, nome, desc, qtd, imagemSrc) {
            const isPremium = tipo === 'premium';
            const bgClass = isPremium ? 'bg-gradient-to-r from-[#ffd700]/80 to-[#ffaa00]/80 border-[#ffd700]' : 'bg-[#bc7bd4] border-[#7a32a8]/30';
            const titleClass = isPremium ? 'text-[#996600]' : 'text-[#7a32a8]';
            const descClass = isPremium ? 'text-[#805500]' : 'text-[#7a32a8]';

            return `
            <div class="${bgClass} rounded-2xl p-4 flex items-center gap-4 shadow-md border">
                <img src="${imagemSrc}" alt="${nome}" class="w-16 h-24 object-contain drop-shadow-lg pointer-events-none flex-shrink-0">
                <div class="flex flex-col flex-grow">
                    <span class="${titleClass} font-black text-sm uppercase leading-tight">${nome}</span>
                    <span class="${descClass} font-bold text-[10px] mb-2 leading-tight">${desc}</span>
                    <div class="flex items-center justify-between mt-auto">
                        <span class="bg-[#7a32a8] text-white px-3 py-1 rounded-full text-[10px] font-black shadow-inner">
                            QTD: <span>${qtd}</span>
                        </span>
                        <button onclick="abrirPacote('${tipo}')" class="bg-[#4ade80] hover:bg-[#22c55e] text-[#7a32a8] font-black text-[10px] px-4 py-1.5 rounded-full shadow-md uppercase transition-transform hover:scale-105 border border-[#22c55e]">
                            ABRIR
                        </button>
                    </div>
                </div>
            </div>`;
        }

        async function carregarInventario() {
            const docSnap = await getDoc(dbUserRef);
            if (docSnap.exists()) {
                dadosJogador = docSnap.data();
                
                if (dadosJogador.fotoPerfil) {
                    const imgElement = document.getElementById('img-perfil-global');
                    if (imgElement) {
                        imgElement.src = dadosJogador.fotoPerfil;
                        imgElement.classList.remove('hidden');
                        document.getElementById('texto-sem-foto').classList.add('hidden');
                    }
                }

                // Linha adicionada para atualizar o nome no topo da tela do inventário!
                document.getElementById('player-name').innerText = (dadosJogador.nomeDisplay || dadosJogador.nome || "JOGADOR").toUpperCase();

                document.getElementById('player-coins').innerText = dadosJogador.moedas || 0;
                atualizarVisualBarraXP(dadosJogador.xp || 0, dadosJogador.nivel || 1);
                
               const inventario = dadosJogador.inventario || {};
                const qtdBasico = inventario.pacoteBasico || 0;
                const qtdPremium = inventario.pacotePremium || 0;
                const qtdGratis = inventario.pacoteGratis || 0; 
                const qtdExpansao = inventario.pacoteExpansao || 0;
                
                const lista = document.getElementById('lista-pacotes');
                lista.innerHTML = '';

                if (qtdBasico <= 0 && qtdPremium <= 0 && qtdGratis <= 0 && qtdExpansao <= 0) {
                    lista.innerHTML = '<span class="text-center text-[#7a32a8] font-black mt-10">Você não possui pacotes.</span>';
                    return;
                }

                if (qtdGratis > 0) {
                    lista.innerHTML += criarHTMLPacote('gratis', 'Pacote Diário', '5 Cartas Aleatórias', qtdGratis, 'pacotegratis.png');
                }
                if (qtdBasico > 0) {
                    lista.innerHTML += criarHTMLPacote('basico', 'Pacote Básico', '5 Cartas Aleatórias', qtdBasico, 'pacote1.png');
                }
                if (qtdExpansao > 0) {
                    // COLOQUE O NOME DA IMAGEM DO PACOTE NOVO AQUI:
                    lista.innerHTML += criarHTMLPacote('expansao', 'Para Onde Iremos', 'Apenas cartas dessa expansão', qtdExpansao, 'pacote-exp1.png');
                }
                if (qtdPremium > 0) {
                    lista.innerHTML += criarHTMLPacote('premium', 'Pacote Premium', 'Garante 1 Rara ou superior', qtdPremium, 'pacote2.png');
                }
            }
        }

        function sortearCarta(tipoPacote, isSlot1) {
            const roll = Math.random() * 100;
            let raridade = 'Comum';
            let poolSelecionado = bancoGeral; 
            
            if (tipoPacote === 'premium') {
                poolSelecionado = bancoBase;
                if (isSlot1) {
                    if (roll <= 75) raridade = 'Rara';
                    else if (roll <= 95) raridade = 'Lendária';
                    else raridade = 'Épica';
                } else {
                    if (roll <= 40) raridade = 'Comum';
                    else if (roll <= 82) raridade = 'Rara';
                    else if (roll <= 97) raridade = 'Lendária';
                    else raridade = 'Épica';
                }
            } 
            else if (tipoPacote === 'expansao') {
                poolSelecionado = bancoPOI;
                if (roll <= 75) raridade = 'Comum';
                else if (roll <= 94) raridade = 'Rara';
                else if (roll <= 99) raridade = 'Lendária';
                else raridade = 'Épica';
            }
            else if (tipoPacote === 'basico') {
                poolSelecionado = bancoBase;
                if (roll <= 80) raridade = 'Comum';
                else if (roll <= 97) raridade = 'Rara';
                else if (roll <= 99.5) raridade = 'Lendária';
                else raridade = 'Épica';
            }
            else { 
                poolSelecionado = bancoGeral;
                if (roll <= 80) raridade = 'Comum';
                else if (roll <= 97) raridade = 'Rara';
                else if (roll <= 99.5) raridade = 'Lendária';
                else raridade = 'Épica';
            }

            let lista = poolSelecionado[raridade];
            if (!lista || lista.length === 0) lista = bancoGeral['Comum']; 
            return lista[Math.floor(Math.random() * lista.length)];
        }

        // --- FASE 1: INICIA A REVELAÇÃO CARTA POR CARTA ---
        window.abrirPacote = async function(tipo) {
            if (abrindoPacote) return;
            abrindoPacote = true;

            // 🧹 LIMPEZA DO "FANTASMA" DO PACOTE ANTERIOR
            const imgRevelacao = document.getElementById('img-revelacao');
            const containerRevelacao = document.getElementById('container-revelacao');
            imgRevelacao.src = ""; // Apaga a imagem velha
            containerRevelacao.classList.remove('anim-pop'); // Remove qualquer animação travada
            containerRevelacao.style.opacity = '0'; // Esconde o container até a nova carta estar pronta

            // O código agora sabe identificar os 4 tipos de pacote
            const campo = tipo === 'basico' ? 'pacoteBasico' : (tipo === 'premium' ? 'pacotePremium' : (tipo === 'expansao' ? 'pacoteExpansao' : 'pacoteGratis'));
            let qtd = (dadosJogador.inventario && dadosJogador.inventario[campo]) || 0;
            
            if (qtd <= 0) {
                window.mostrarToast("Pacote esgotado!");
                abrindoPacote = false;
                return;
            }

            tipoPacoteTemp = tipo;
            cartasSorteadaTemp = [];
            indiceRevelacao = 0;

            for(let i = 0; i < 5; i++) {
                const idSorteado = sortearCarta(tipo, i === 0);
                cartasSorteadaTemp.push(idSorteado);
                
                // Pré-carrega a imagem secretamente para não ter delay na animação
                const imgPreload = new Image();
                imgPreload.src = INFO_CARTAS[idSorteado].imagem;
            }

            document.getElementById('grid-novas-cartas').classList.add('hidden');
            document.getElementById('btn-guardar-colecao').classList.add('hidden');
            document.getElementById('titulo-abrir-pacote').innerText = "Toque para revelar";
            
            containerRevelacao.classList.remove('hidden');
            containerRevelacao.dataset.bloqueado = "false";
            document.getElementById('modal-abrir-pacote').classList.remove('hidden');

            // Chama a primeira carta imediatamente (sem delay)
            window.mostrarProximaCarta(true);
        };
        // --- INTERAÇÃO DE CLIQUE: MOSTRA A PRÓXIMA CARTA OU A TELA FINAL ---
        window.mostrarProximaCarta = function(primeira = false) {
            const container = document.getElementById('container-revelacao');
            const imgElement = document.getElementById('img-revelacao');

            // Proteção contra múltiplos cliques frenéticos
            if (container.dataset.bloqueado === "true") return;
            container.dataset.bloqueado = "true";

            // Se for do clique 2 ao 5, faz a carta sumir rápido primeiro
            if (!primeira) {
                container.classList.remove('anim-pop');
                container.style.opacity = '0';
                container.style.transform = 'scale(0.8)';
            }

            const tempoEspera = primeira ? 0 : 150;

            setTimeout(() => {
                if (indiceRevelacao < 5) {
                    const id = cartasSorteadaTemp[indiceRevelacao];
                    const info = INFO_CARTAS[id];
                    const corRaridade = CORES_RARIDADE[info.raridade] || '#dca3e8';

                    imgElement.src = info.imagem;
                    container.style.borderColor = corRaridade;
                    container.style.boxShadow = `0 0 35px ${corRaridade}`;

                    // Restaura os estilos para a animação do CSS fazer efeito
                    container.style.opacity = '';
                    container.style.transform = '';

                    // Força o reset da animação
                    void container.offsetWidth; 
                    container.classList.add('anim-pop');

                    indiceRevelacao++;
                    
                    // Libera para clicar de novo após 300ms
                    setTimeout(() => { container.dataset.bloqueado = "false"; }, 300);

                } else {
                    // Fim das cartas, fecha display e vai pro resumo
                    container.classList.add('hidden');
                    container.dataset.bloqueado = "false";
                    document.getElementById('titulo-abrir-pacote').innerText = "Novas Cartas!";
                    
                    const grid = document.getElementById('grid-novas-cartas');
                    grid.innerHTML = '';
                    
                    cartasSorteadaTemp.forEach(id => {
                        const info = INFO_CARTAS[id];
                        const corRaridade = CORES_RARIDADE[info.raridade] || '#dca3e8';
                        grid.innerHTML += `
                            <div class="w-20 aspect-[2.5/3.5] bg-gray-800 rounded-lg overflow-hidden border-2 anim-pop" style="border-color: ${corRaridade}; box-shadow: 0 0 10px ${corRaridade}90;">
                                <img src="${info.imagem}" class="w-full h-full object-cover">
                            </div>
                        `;
                    });

                    grid.classList.remove('hidden');
                    grid.classList.add('flex');
                    document.getElementById('btn-guardar-colecao').classList.remove('hidden');
                }
            }, tempoEspera);
        };

        // --- FASE 2: SALVA NO BANCO E CALCULA AS BADGES/MISSÕES ---
        window.guardarNaColecao = async function() {
            document.getElementById('btn-guardar-colecao').classList.add('hidden'); 
            window.mostrarToast("Guardando na coleção... ⏳");

            try {
                const campo = tipoPacoteTemp === 'basico' ? 'pacoteBasico' : (tipoPacoteTemp === 'premium' ? 'pacotePremium' : (tipoPacoteTemp === 'expansao' ? 'pacoteExpansao' : 'pacoteGratis'));
                
                let pacotesAbertosAtuais = (dadosJogador.estatisticas?.pacotesAbertos || 0) + 1;
                let badgesJogador = dadosJogador.badges || {};
                let ganhouBadge = false;
                let notificacoesNovas = [];

                if (pacotesAbertosAtuais >= 30 && !badgesJogador["badge-008"]) {
                    badgesJogador["badge-008"] = true;
                    ganhouBadge = true;
                    notificacoesNovas.push({
                        id: "notif_" + Date.now() + "_badge008",
                        titulo: "🏆 Conquista: Pacotinhos!",
                        texto: "Você abriu 30 pacotes de cartas!\nRecompensas: 50 XP e 50 Moedas.",
                        lida: false,
                        data: new Date().toISOString()
                    });
                }

                let pacoteMissoes = dadosJogador.missoesDiarias || {};
                const hoje = obterGameDay();
                let atualizouMissao = false;
                let msgMissaoProgresso = "";

                if (pacoteMissoes.dataReset === hoje && pacoteMissoes.lista) {
                    pacoteMissoes.lista.forEach(m => {
                        if (m.id === "abrir_pacote" && m.progresso < m.meta) {
                            m.progresso++;
                            atualizouMissao = true;
                            msgMissaoProgresso = `🎯 Progresso: ${m.desc}`;
                        }
                    });
                }

                let xpAtual = dadosJogador.xp || 0;
                let nivelAtual = dadosJogador.nivel || 1;
                let subiuNivel = false;
                let msgLevelUp = "";
                let bonusXp = ganhouBadge ? 50 : 0;
                let bonusMoedas = ganhouBadge ? 50 : 0;
                let novoXp = xpAtual + bonusXp;
                let pacotesBasicosGanhos = 0;
                let pacotesPremiumGanhos = 0;

                let xpMaximo = calcularXPMaximo(nivelAtual);
                while (novoXp >= xpMaximo && nivelAtual < 30) {
                    novoXp -= xpMaximo;
                    nivelAtual++;
                    subiuNivel = true;
                    bonusMoedas += 30;
                    pacotesBasicosGanhos++;

                    let textoRecompensaNotif = "1 Pacote Básico e 30 Moedas";
                    if (nivelAtual === 10 || nivelAtual === 20 || nivelAtual === 30) {
                        pacotesPremiumGanhos++;
                        textoRecompensaNotif = "1 Pacote Básico, 1 Pacote Premium e 30 Moedas";
                        msgLevelUp = `🎉 LEVEL UP! Nível ${nivelAtual} alcançado!<br><span class="text-xs">Recompensas: 1 Pacote Básico, 1 Pacote Premium e 30 <img src="moedas.png" class="inline w-4 h-4 ml-0.5 align-text-bottom"></span>`;
                    } else {
                        msgLevelUp = `🎉 LEVEL UP! Nível ${nivelAtual} alcançado!<br><span class="text-xs">Recompensas: 1 Pacote Básico e 30 <img src="moedas.png" class="inline w-4 h-4 ml-0.5 align-text-bottom"></span>`;
                    }

                    notificacoesNovas.push({
                        id: "notif_" + Date.now() + "_nivel" + nivelAtual,
                        titulo: `🎉 Level Up: Nível ${nivelAtual}`,
                        texto: `Parabéns! Você alcançou o Nível ${nivelAtual}.\nRecompensas recebidas: ${textoRecompensaNotif}.`,
                        lida: false,
                        data: new Date().toISOString()
                    });
                    xpMaximo = calcularXPMaximo(nivelAtual);
                }

                let deltaBasico = (campo === 'pacoteBasico' ? -1 : 0) + pacotesBasicosGanhos;
                let deltaPremium = (campo === 'pacotePremium' ? -1 : 0) + pacotesPremiumGanhos;
                let deltaGratis = (campo === 'pacoteGratis' ? -1 : 0);
                let deltaExpansao = (campo === 'pacoteExpansao' ? -1 : 0);

                let updates = {
                    "estatisticas.pacotesAbertos": increment(1),
                    "estatisticas.totalCartas": increment(5),
                    "badges": badgesJogador,
                    "xp": novoXp,
                    "nivel": nivelAtual,
                    "moedas": increment(bonusMoedas)
                };

                if (deltaBasico !== 0) updates["inventario.pacoteBasico"] = increment(deltaBasico);
                if (deltaPremium !== 0) updates["inventario.pacotePremium"] = increment(deltaPremium);
                if (deltaGratis !== 0) updates["inventario.pacoteGratis"] = increment(deltaGratis);
                if (deltaExpansao !== 0) updates["inventario.pacoteExpansao"] = increment(deltaExpansao);

                // Agrupa e conta as cartas repetidas do mesmo pacote
                let contagemCartas = {};
                cartasSorteadaTemp.forEach(id => {
                    contagemCartas[id] = (contagemCartas[id] || 0) + 1;
                });

                // Envia a instrução para o banco com o incremento exato (1, 2, 3...)
                for (let id in contagemCartas) {
                    updates[`colecao.${id}`] = increment(contagemCartas[id]);
                }

                if (atualizouMissao) updates.missoesDiarias = pacoteMissoes;
                if (notificacoesNovas.length > 0) updates.notificacoes = arrayUnion(...notificacoesNovas);

                await updateDoc(dbUserRef, updates);
                document.getElementById('modal-abrir-pacote').classList.add('hidden');
                carregarInventario();

                let delay = 500;
                if (atualizouMissao) {
                    setTimeout(() => window.mostrarToast(msgMissaoProgresso), delay);
                    delay += 1000;
                }
                if (ganhouBadge) {
                    setTimeout(() => window.mostrarToast(`🏆 NOVA CONQUISTA!<br><span class="text-xs font-normal">Badge: Pacotinhos! (Abriu 30 pacotes).</span><br><span class="text-sm">Recompensa: +50 XP e +50 <img src="moedas.png" class="inline w-4 h-4 align-text-bottom"></span>`), delay);
                    delay += 1500;
                }
                if (subiuNivel) {
                    setTimeout(() => window.mostrarToast(msgLevelUp), delay);
                }

                abrindoPacote = false;

            } catch (e) {
                console.error(e);
                window.mostrarToast("Erro ao guardar as cartas no banco.");
                document.getElementById('btn-guardar-colecao').classList.remove('hidden'); 
                abrindoPacote = false;
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUserUid = user.uid;
                dbUserRef = doc(db, "users", currentUserUid);
                carregarInventario();
            } else {
                window.location.href = "index.html";
            }
        });
    </script>
    <script>
        let tempoInativo = 0;
        
        // Se o jogador mexer o rato, tocar no ecrã ou carregar numa tecla, o tempo zera
        const resetarTempo = () => tempoInativo = 0;
        window.addEventListener('mousemove', resetarTempo);
        window.addEventListener('touchstart', resetarTempo);
        window.addEventListener('keydown', resetarTempo);

        // A cada 1 minuto (60000 milissegundos), o contador soma
        setInterval(() => {
            tempoInativo += 60000;
            // Se atingir 30 minutos (1.800.000 ms), redireciona para o menu
            if (tempoInativo >= 1800000) {
                window.location.href = 'menu.html';
            }
        }, 60000);
    </script>
</body>
</html>
