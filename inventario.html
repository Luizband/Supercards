<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supercards - Inventário</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-image: url('fundotela.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        #toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            width: 90%;
            max-width: 350px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast-msg {
            background: #dca3e8;
            color: #7a32a8;
            border: 3px solid #7a32a8;
            padding: 12px 20px;
            border-radius: 9999px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.3);
            text-align: center;
            font-weight: 900;
            font-size: 0.85rem;
            animation: slideDown 0.3s ease-out;
            pointer-events: auto;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="h-[100dvh] p-4 flex justify-center overflow-hidden">

    <div id="toast-container"></div>

    <div class="w-full max-w-sm flex flex-col h-full relative">
        
        <header class="flex items-center gap-4 mt-4 mb-4 w-full">
            <div class="relative flex-shrink-0">
                <div class="bg-[#dca3e8] w-24 h-24 rounded-full flex items-center justify-center text-[#7a32a8] font-black text-xl shadow-lg border-2 border-[#bc7bd4] relative overflow-hidden">
                    <span id="texto-sem-foto">FOTO</span>
                    <img id="img-perfil-global" src="" class="hidden w-full h-full object-cover absolute inset-0">
                </div>
                <div class="absolute -bottom-2 left-1/2 transform -translate-x-1/2 bg-[#bc7bd4] w-8 h-8 rounded-full flex items-center justify-center shadow-md border-2 border-[#dca3e8] z-30">
                    <span id="player-level" class="text-[#7a32a8] font-black text-sm">--</span>
                </div>
            </div>

            <div class="flex flex-col flex-grow gap-2 justify-center">
                <div class="flex items-center gap-2 w-full">
                    <div class="bg-[#dca3e8] rounded-full px-3 py-2 flex items-center justify-center shadow-md flex-grow overflow-hidden">
                        <span id="player-name" class="text-[#7a32a8] font-black text-base tracking-wide uppercase truncate max-w-[130px]">JOGADOR</span>
                    </div>
                    <div class="bg-[#dca3e8] rounded-full px-3 py-2 flex items-center justify-center gap-1 shadow-md flex-shrink-0">
                        <span id="player-coins" class="text-[#7a32a8] font-black text-sm">0</span>
                        <img src="moedas.png" class="w-4 h-4 object-contain">
                    </div>
                </div>
                <div class="flex flex-col items-center mt-1 w-full">
                    <div class="w-full bg-transparent border border-[#dca3e8] rounded-full h-3 overflow-hidden shadow-inner">
                        <div id="barra-xp" class="bg-[#dca3e8] h-full transition-all duration-500" style="width: 0%;"></div>
                    </div>
                    <span id="texto-xp" class="text-[#dca3e8] text-[10px] font-bold mt-1">0/0 xp</span>
                </div>
            </div>
        </header>

        <main class="bg-[#dca3e8] rounded-[2rem] flex flex-col flex-grow p-5 shadow-xl overflow-hidden mb-16 relative border-2 border-[#bc7bd4]">
            <h1 class="text-[#7a32a8] font-black text-xl text-center mb-6 drop-shadow-sm uppercase">Meus Pacotes</h1>
            
            <div class="flex flex-col gap-4">
                
                <div class="bg-[#bc7bd4] rounded-2xl p-4 flex items-center gap-4 shadow-md border border-[#7a32a8]/30">
                    <div class="w-16 h-20 bg-gray-800 rounded-lg flex-shrink-0 flex items-center justify-center shadow-inner overflow-hidden">
                        <span class="text-white text-xs font-bold">BÁSICO</span>
                    </div>
                    <div class="flex flex-col flex-grow">
                        <span class="text-[#7a32a8] font-black text-sm uppercase">Pacote Básico</span>
                        <span class="text-[#7a32a8] font-bold text-[10px] mb-2">Contém 3 Cartas Aleatórias</span>
                        <div class="flex items-center justify-between mt-auto">
                            <span class="bg-[#7a32a8] text-white px-3 py-1 rounded-full text-[10px] font-black shadow-inner">
                                QTD: <span id="qtd-basico">0</span>
                            </span>
                            <button onclick="window.mostrarToast('Abrir pacotes será no próximo passo!')" class="bg-[#4ade80] hover:bg-[#22c55e] text-[#7a32a8] font-black text-[10px] px-4 py-1.5 rounded-full shadow-md uppercase transition-transform hover:scale-105 border border-[#22c55e]">
                                ABRIR
                            </button>
                        </div>
                    </div>
                </div>

                <div class="bg-[#bc7bd4] rounded-2xl p-4 flex items-center gap-4 shadow-md border border-[#7a32a8]/30">
                    <div class="w-16 h-20 bg-yellow-600 rounded-lg flex-shrink-0 flex items-center justify-center shadow-inner overflow-hidden">
                        <span class="text-white text-[10px] font-black">PREMIUM</span>
                    </div>
                    <div class="flex flex-col flex-grow">
                        <span class="text-[#7a32a8] font-black text-sm uppercase">Pacote Premium</span>
                        <span class="text-[#7a32a8] font-bold text-[10px] mb-2">Contém 5 Cartas (+ Raras)</span>
                        <div class="flex items-center justify-between mt-auto">
                            <span class="bg-[#7a32a8] text-white px-3 py-1 rounded-full text-[10px] font-black shadow-inner">
                                QTD: <span id="qtd-premium">0</span>
                            </span>
                            <button onclick="window.mostrarToast('Abrir pacotes será no próximo passo!')" class="bg-[#4ade80] hover:bg-[#22c55e] text-[#7a32a8] font-black text-[10px] px-4 py-1.5 rounded-full shadow-md uppercase transition-transform hover:scale-105 border border-[#22c55e]">
                                ABRIR
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </main>

        <footer class="mt-auto flex justify-center pb-2 z-10 absolute bottom-4 left-0 w-full pointer-events-none">
            <button onclick="window.location.href='menu.html'" class="bg-[#7a32a8] hover:bg-purple-600 text-white font-black text-sm py-2 px-10 rounded-full shadow-lg transition-transform hover:-translate-y-1 pointer-events-auto border-2 border-[#dca3e8]">
                retornar
            </button>
        </footer>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCU3lFTgfrDMaD9jwR7X7ivYPmGQh4VE1g",
          authDomain: "supercards-tcg.firebaseapp.com",
          projectId: "supercards-tcg",
          storageBucket: "supercards-tcg.firebasestorage.app",
          messagingSenderId: "862316380615",
          appId: "1:862316380615:web:b3f28056ebc967673999e2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.mostrarToast = function(mensagem) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast-msg';
            toast.innerHTML = mensagem;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s ease';
                setTimeout(() => toast.remove(), 500); 
            }, 3000);
        };

        function calcularXPMaximo(nivel) {
            if (nivel >= 1 && nivel <= 5) return 200;
            if (nivel >= 6 && nivel <= 15) return 750;
            if (nivel >= 16 && nivel <= 25) return 1600;
            return 3000;
        }

        function atualizarVisualBarraXP(xpAtual, nivelAtual) {
            const xpMaximo = calcularXPMaximo(nivelAtual);
            const porcentagem = Math.min((xpAtual / xpMaximo) * 100, 100);
            document.getElementById('player-level').innerText = nivelAtual; 
            document.getElementById('texto-xp').innerText = `${xpAtual}/${xpMaximo} xp`;
            document.getElementById('barra-xp').style.width = `${porcentagem}%`;
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('player-name').innerText = user.displayName?.toUpperCase() || "JOGADOR";
                
                const docRef = doc(db, "users", user.uid);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const dados = docSnap.data();
                    
                    document.getElementById('player-coins').innerText = dados.moedas || 0;
                    atualizarVisualBarraXP(dados.xp || 0, dados.nivel || 1);
                    
                    if (dados.fotoPerfil) {
                        const img = document.getElementById('img-perfil-global');
                        img.src = dados.fotoPerfil; 
                        img.classList.remove('hidden');
                        document.getElementById('texto-sem-foto').classList.add('hidden');
                    }

                    // Preenche a quantidade de pacotes do Inventário
                    const inventario = dados.inventario || {};
                    document.getElementById('qtd-basico').innerText = inventario.pacoteBasico || 0;
                    document.getElementById('qtd-premium').innerText = inventario.pacotePremium || 0;
                }
            } else {
                window.location.href = "index.html";
            }
        });
    </script>
</body>
</html>
