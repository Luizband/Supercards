<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supercards - Em Manutenção</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col items-center justify-center p-6 text-center">
    
    <div class="bg-gray-800 p-8 rounded-3xl border-4 border-[#bc7bd4] shadow-[0_0_40px_rgba(188,123,212,0.3)] max-w-sm w-full flex flex-col items-center">
        <span class="text-7xl mb-6 animate-pulse">🛠️</span>
        <h1 class="text-[#dca3e8] font-black text-2xl uppercase tracking-widest mb-4">Manutenção</h1>
        
        <p class="text-gray-300 font-bold text-sm mb-8">
            Nossos servidores estão passando por uma atualização neste momento. Estamos preparando novidades ou corrigindo problemas!
            <br><br>
            Tente entrar novamente daqui a pouco.
        </p>
        
        <button onclick="window.location.href='index.html'" class="w-full bg-[#7a32a8] hover:bg-purple-600 py-4 rounded-full font-black uppercase tracking-widest transition-colors shadow-lg border-2 border-[#bc7bd4]">
            Tentar Reconectar
        </button>
    </div>

</body>
</html>
