<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supercards - Menu Principal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-image: url('fundotela.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        #toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            width: 90%;
            max-width: 350px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast-msg {
            background: #dca3e8;
            color: #7a32a8;
            border: 3px solid #7a32a8;
            padding: 12px 20px;
            border-radius: 9999px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.3);
            text-align: center;
            font-weight: 900;
            font-size: 0.85rem;
            animation: slideDown 0.3s ease-out;
            pointer-events: auto;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="h-[100dvh] p-4 flex justify-center overflow-hidden">

    <div id="toast-container"></div>

    <div class="w-full max-w-sm flex flex-col h-full relative">
        
        <!-- CABEÇALHO (Ajustado para não espremer no celular) -->
        <header class="flex items-center gap-3 mt-4 mb-8 w-full">
            
            <!-- FOTO E NÍVEL (Esquerda) -->
            <div class="relative flex-shrink-0">
                <!-- Círculo da foto com tamanho otimizado para celular -->
                <div class="bg-[#dca3e8] w-20 h-20 rounded-full flex items-center justify-center text-[#7a32a8] font-black text-xl shadow-lg border-2 border-[#bc7bd4] overflow-hidden relative">
                    <span id="texto-sem-foto" class="text-sm">FOTO</span>
                    <img id="img-perfil-global" src="" class="hidden w-full h-full object-cover absolute inset-0">
                </div>
                
                <!-- NÍVEL -->
                <div class="absolute -bottom-2 left-1/2 transform -translate-x-1/2 bg-[#bc7bd4] w-7 h-7 rounded-full flex items-center justify-center shadow-md border-2 border-[#dca3e8] z-30">
                    <span id="player-level" class="text-[#7a32a8] font-black text-xs">--</span>
                </div>
            </div>

            <!-- DIREITA: MOEDAS, MENU, NOME E XP -->
            <div class="flex flex-col flex-grow gap-2.5 justify-center overflow-hidden">
                
                <!-- LINHA 1: Moedas e Botões -->
                <div class="flex items-center gap-1.5 w-full">
                    <!-- MOEDAS -->
                    <div class="bg-[#dca3e8] rounded-full px-3 py-1.5 flex items-center justify-center gap-1 shadow-md flex-shrink-0">
                        <span id="player-coins" class="text-[#7a32a8] font-black text-sm">...</span>
                        <img src="moedas.png" class="w-4 h-4 object-contain">
                    </div>
                    
                    <!-- BOTÕES DE NAVEGAÇÃO -->
                    <nav class="bg-[#dca3e8] rounded-full flex justify-between items-center px-2 py-1 shadow-md flex-grow">
                        <button onclick="window.location.href='perfil.html'" class="bg-[#7a32a8] hover:bg-purple-600 transition-colors rounded-full flex items-center justify-center w-7 h-7 shadow-sm">
                            <img src="perfil.png" alt="Perfil" class="w-3.5 h-3.5 object-contain">
                        </button>
                        
                        <button onclick="window.location.href='shop.html'" class="bg-[#7a32a8] hover:bg-purple-600 transition-colors rounded-full flex items-center justify-center w-7 h-7 shadow-sm">
                            <img src="shop.png" alt="Shop" class="w-3.5 h-3.5 object-contain">
                        </button>
                        
                        <button onclick="window.location.href='missoes.html'" class="bg-[#7a32a8] hover:bg-purple-600 transition-colors rounded-full flex items-center justify-center w-7 h-7 shadow-sm">
                            <img src="missao.png" alt="Missões" class="w-3.5 h-3.5 object-contain">
                        </button>
                        
                        <div class="relative flex items-center">
                            <button id="btn-config" class="bg-[#7a32a8] hover:bg-purple-600 transition-colors rounded-full flex items-center justify-center w-7 h-7 shadow-sm">
                                <img src="config.png" alt="Configurações" class="w-3.5 h-3.5 object-contain">
                            </button>
                            <div id="dropdown-config" class="hidden absolute right-0 top-10 w-32 bg-[#bc7bd4] border-2 border-[#7a32a8] rounded-xl shadow-2xl overflow-hidden z-50">
                                <button id="btn-sair" class="w-full px-4 py-2 text-white font-bold text-sm hover:bg-[#7a32a8] transition-colors flex items-center justify-between">
                                    Sair <span>🚪</span>
                                </button>
                            </div>
                        </div>
                    </nav>
                </div>
                
                <!-- LINHA 2: Nome e XP -->
                <div class="flex items-center gap-1.5 w-full">
                    <!-- NOME -->
                    <div class="bg-[#dca3e8] rounded-full px-2 py-1 flex items-center justify-center shadow-md w-1/2 h-7 overflow-hidden flex-shrink-0">
                        <span id="player-name" class="text-[#7a32a8] font-black text-[10px] uppercase truncate text-center w-full">...</span>
                    </div>
                    
                    <!-- BARRA DE XP -->
                    <div class="flex flex-col items-center flex-grow w-1/2">
                        <div class="w-full bg-transparent border border-[#dca3e8] rounded-full h-2.5 overflow-hidden shadow-inner">
                            <div id="player-barra-xp" class="bg-[#dca3e8] h-full transition-all duration-500" style="width: 0%;"></div>
                        </div>
                        <!-- Corrigida a cor do texto do XP para o roxo claro -->
                        <span id="player-texto-xp" class="text-[#dca3e8] text-[9px] font-bold mt-1">0/0 xp</span>
                    </div>
                </div>
                
            </div>
        </header>

        <main class="grid grid-cols-2 gap-x-4 gap-y-8 flex-grow content-center mb-4">
            
            <div onclick="window.acionarGatilhoMissao('abrir_colecao', 'colecao.html')" class="flex flex-col items-center group cursor-pointer">
                <span class="text-[#dca3e8] font-black text-lg mb-1 drop-shadow-md">Coleção</span>
                <div class="bg-[#dca3e8] w-[80%] aspect-square rounded-[24px] flex items-center justify-center p-4 shadow-lg hover:scale-105 transition-transform border-4 border-transparent hover:border-[#8b3dff]/50">
                    <img src="colecao.png" alt="Coleção" class="w-full h-full object-contain drop-shadow-lg">
                </div>
            </div>

            <div onclick="window.location.href='inventario.html'" class="flex flex-col items-center group cursor-pointer">
                <span class="text-[#dca3e8] font-black text-lg mb-1 drop-shadow-md">Inventário</span>
                <div class="bg-[#dca3e8] w-[80%] aspect-square rounded-[24px] flex items-center justify-center p-4 shadow-lg hover:scale-105 transition-transform border-4 border-transparent hover:border-[#8b3dff]/50">
                    <img src="inventario.png" alt="Inventário" class="w-full h-full object-contain drop-shadow-lg">
                </div>
            </div>

            <div onclick="window.acionarGatilhoMissao('abrir_trocas', 'troca.html')" class="flex flex-col items-center group cursor-pointer">
                <span class="text-[#dca3e8] font-black text-lg mb-1 drop-shadow-md">Trocas</span>
                <div class="bg-[#dca3e8] w-[80%] aspect-square rounded-[24px] flex items-center justify-center p-4 shadow-lg hover:scale-105 transition-transform border-4 border-transparent hover:border-[#8b3dff]/50">
                    <img src="troca.png" alt="Trocas" class="w-full h-full object-contain drop-shadow-lg">
                </div>
            </div>

            <div onclick="window.acionarGatilhoMissao('batalhar', '#')" class="flex flex-col items-center group cursor-pointer">
                <span class="text-[#dca3e8] font-black text-lg mb-1 drop-shadow-md">Batalha</span>
                <div class="bg-[#dca3e8] w-[80%] aspect-square rounded-[24px] flex items-center justify-center p-4 shadow-lg hover:scale-105 transition-transform border-4 border-transparent hover:border-[#8b3dff]/50">
                    <img src="vs.png" alt="Batalha" class="w-full h-full object-contain drop-shadow-lg">
                </div>
            </div>
        </main>

        <footer class="mt-auto flex justify-center pb-2">
            <div class="bg-[#dca3e8] rounded-full flex p-1.5 gap-2 shadow-lg w-full max-w-[280px]">
                <button onclick="window.location.href='notificacoes.html'" class="relative flex-1 bg-[#7a32a8] text-white text-xs font-bold py-2 rounded-full hover:bg-purple-600 transition-colors">
                    Notificações
                    <span id="indicador-notif" class="hidden absolute -top-1 -right-1 flex h-3 w-3">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-3 w-3 bg-red-600 border border-white"></span>
                    </span>
                </button>
                <button class="flex-1 bg-[#7a32a8] text-white text-xs font-bold py-2 rounded-full hover:bg-purple-600 transition-colors">Amigos</button>
            </div>
        </footer>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, increment, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCU3lFTgfrDMaD9jwR7X7ivYPmGQh4VE1g",
          authDomain: "supercards-tcg.firebaseapp.com",
          projectId: "supercards-tcg",
          storageBucket: "supercards-tcg.firebasestorage.app",
          messagingSenderId: "862316380615",
          appId: "1:862316380615:web:b3f28056ebc967673999e2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const btnConfig = document.getElementById('btn-config');
        const dropdownConfig = document.getElementById('dropdown-config');

        btnConfig.addEventListener('click', () => { dropdownConfig.classList.toggle('hidden'); });
        
        document.addEventListener('click', (event) => {
            if (!btnConfig.contains(event.target) && !dropdownConfig.contains(event.target)) {
                dropdownConfig.classList.add('hidden');
            }
        });

        document.getElementById('btn-sair').addEventListener('click', () => {
            signOut(auth).catch((error) => console.error("Erro ao sair: ", error));
        });

        window.mostrarToast = function(mensagem) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast-msg';
            toast.innerHTML = mensagem;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s ease';
                setTimeout(() => toast.remove(), 500); 
            }, 3000);
        };

        function obterGameDay(offsetDias = 0) {
            let d = new Date();
            if (d.getHours() < 6) d.setDate(d.getDate() - 1);
            d.setDate(d.getDate() + offsetDias);
            return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
        }

        function calcularXPMaximo(nivel) {
            if (nivel >= 1 && nivel <= 5) return 200;
            if (nivel >= 6 && nivel <= 15) return 750;
            if (nivel >= 16 && nivel <= 25) return 1600;
            return 3000;
        }

        // --- SISTEMA INTELIGENTE DE GATILHOS DE MISSÃO ---
        window.acionarGatilhoMissao = async function(missaoId, redirectUrl) {
            let atrasoRedirect = 0;

            if (redirectUrl === '#') {
                window.mostrarToast("⚔️ Modo Batalha em desenvolvimento!");
            }

            if (auth.currentUser) {
                try {
                    const ref = doc(db, "users", auth.currentUser.uid);
                    const snap = await getDoc(ref);
                    
                    if (snap.exists()) {
                        let dados = snap.data();
                        let pacoteMissoes = dados.missoesDiarias || {};
                        const hoje = obterGameDay();

                        if (pacoteMissoes.dataReset === hoje && pacoteMissoes.lista) {
                            let atualizou = false;
                            
                            pacoteMissoes.lista.forEach(m => {
                                if (m.id === missaoId && m.progresso < m.meta) {
                                    m.progresso++;
                                    atualizou = true;
                                    window.mostrarToast(`🎯 Progresso: ${m.desc}`);
                                    atrasoRedirect = 1200; 
                                }
                            });

                            if (atualizou) {
                                await setDoc(ref, { missoesDiarias: pacoteMissoes }, { merge: true });
                            }
                        }
                    }
                } catch(e) {
                    console.error("Erro no gatilho da missão:", e);
                }
            }

            if (redirectUrl && redirectUrl !== '#') {
                if (atrasoRedirect > 0) {
                    setTimeout(() => window.location.href = redirectUrl, atrasoRedirect);
                } else {
                    window.location.href = redirectUrl; 
                }
            }
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('player-name').innerText = user.displayName?.toUpperCase() || "JOGADOR";

                const docRef = doc(db, "users", user.uid);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const dados = docSnap.data();
                    
                    const hoje = obterGameDay(0);
                    const ontem = obterGameDay(-1);
                    
                    let ultimoLogin = dados.ultimoLogin || "";
                    let diasSeguidos = dados.estatisticas?.diasSeguidos || 0;
                    
                    let atualizouLogin = false;
                    let docAtualizacao = {};
                    let notificacoesNovas = [];
                    
                    let temNotifNaoLida = (dados.notificacoes || []).some(n => n.lida === false);

                    if (ultimoLogin !== hoje) {
                        atualizouLogin = true;
                        if (ultimoLogin === ontem) {
                            diasSeguidos += 1; 
                        } else {
                            diasSeguidos = 1; 
                        }
                        docAtualizacao.ultimoLogin = hoje;
                        docAtualizacao.estatisticas = { diasSeguidos: diasSeguidos }; 
                    }

                    let badgesJogador = dados.badges || {};
                    let ganhouBadge = false;
                    let bonusXp = 0;
                    let bonusMoedas = 0;

                    if (diasSeguidos >= 20 && !badgesJogador["badge-003"]) {
                        badgesJogador["badge-003"] = true;
                        ganhouBadge = false; 
                        bonusXp += 50;
                        bonusMoedas += 50;

                        notificacoesNovas.push({
                            id: "notif_" + Date.now() + "_badge003",
                            titulo: "🏆 Conquista: Jogador Viciado",
                            texto: "Você logou 20 dias seguidos!\nRecompensas: 50 XP e 50 Moedas.",
                            lida: false,
                            data: new Date().toISOString()
                        });
                    }

                    let nivelAtual = dados.nivel || 1;
                    let xpAtual = dados.xp || 0;
                    let subiuNivel = false;
                    let msgLevelUpPopup = "";
                    let novoXp = xpAtual;

                    if (ganhouBadge) {
                        novoXp = xpAtual + bonusXp;
                        let xpMaximo = calcularXPMaximo(nivelAtual);
                        let pacotesBasicos = 0;
                        let pacotesPremium = 0;

                        if (novoXp >= xpMaximo && nivelAtual < 30) {
                            novoXp -= xpMaximo;
                            nivelAtual++;
                            subiuNivel = true;
                            bonusMoedas += 30;
                            pacotesBasicos++;
                            
                            let textoRecompensaNotif = "1 Pacote Básico e 30 Moedas";

                            if (nivelAtual === 10 || nivelAtual === 20 || nivelAtual === 30) {
                                pacotesPremium++;
                                msgLevelUpPopup = `🎉 LEVEL UP! Nível ${nivelAtual} alcançado!<br><span class="text-xs">Recompensas: 1 Pacote Básico, 1 Pacote Premium e 30 <img src="moedas.png" class="inline w-4 h-4 ml-0.5 align-text-bottom"></span>`;
                                textoRecompensaNotif = "1 Pacote Básico, 1 Pacote Premium e 30 Moedas";
                            } else {
                                msgLevelUpPopup = `🎉 LEVEL UP! Nível ${nivelAtual} alcançado!<br><span class="text-xs">Recompensas: 1 Pacote Básico e 30 <img src="moedas.png" class="inline w-4 h-4 ml-0.5 align-text-bottom"></span>`;
                            }

                            notificacoesNovas.push({
                                id: "notif_" + Date.now() + "_nivel" + nivelAtual,
                                titulo: `🎉 Level Up: Nível ${nivelAtual}`,
                                texto: `Parabéns! Você alcançou o Nível ${nivelAtual}.\nRecompensas recebidas: ${textoRecompensaNotif}.`,
                                lida: false,
                                data: new Date().toISOString()
                            });
                        }

                        docAtualizacao.badges = badgesJogador;
                        docAtualizacao.xp = novoXp;
                        docAtualizacao.nivel = nivelAtual;
                        docAtualizacao.moedas = increment(bonusMoedas);
                        
                        let invUpdates = {};
                        if (pacotesBasicos > 0) invUpdates.pacoteBasico = increment(pacotesBasicos);
                        if (pacotesPremium > 0) invUpdates.pacotePremium = increment(pacotesPremium);
                        if (Object.keys(invUpdates).length > 0) docAtualizacao.inventario = invUpdates;
                    }

                    if (notificacoesNovas.length > 0) {
                        docAtualizacao.notificacoes = arrayUnion(...notificacoesNovas);
                        temNotifNaoLida = true;
                    }

                    if (atualizouLogin || ganhouBadge) {
                        await setDoc(docRef, docAtualizacao, { merge: true });
                    }

                    document.getElementById('player-coins').innerText = (dados.moedas || 0) + bonusMoedas;
                    document.getElementById('player-level').innerText = nivelAtual;
                    
                    const indicador = document.getElementById('indicador-notif');
                    if (temNotifNaoLida) {
                        indicador.classList.remove('hidden');
                    } else {
                        indicador.classList.add('hidden');
                    }

                    // --- ATUALIZA A FOTO DE PERFIL GLOBAL ---
                    if (dados.fotoPerfil) {
                        const imgElement = document.getElementById('img-perfil-global');
                        if (imgElement) {
                            imgElement.src = dados.fotoPerfil;
                            imgElement.classList.remove('hidden');
                            document.getElementById('texto-sem-foto').classList.add('hidden');
                        }
                    }

                    // --- ATUALIZA A BARRA DE XP NO MENU ---
                    let finalXp = ganhouBadge ? novoXp : xpAtual;
                    let maxXp = calcularXPMaximo(nivelAtual);
                    let porcentagem = Math.min((finalXp / maxXp) * 100, 100);
                    
                    const barra = document.getElementById('player-barra-xp');
                    const textoXp = document.getElementById('player-texto-xp');
                    if(barra) barra.style.width = `${porcentagem}%`;
                    if(textoXp) textoXp.innerText = `${finalXp}/${maxXp} xp`;

                    if (ganhouBadge) {
                        setTimeout(() => window.mostrarToast(`🏆 NOVA CONQUISTA!<br><span class="text-xs font-normal">Badge: Jogador Viciado.</span><br><span class="text-sm">Recompensa: +50 XP e +50 <img src="moedas.png" class="inline w-4 h-4 align-text-bottom"></span>`), 500);
                    }
                    if (subiuNivel) {
                        setTimeout(() => window.mostrarToast(msgLevelUpPopup), 1000);
                    }

                } else {
                    const hoje = obterGameDay(0);
                    await setDoc(docRef, {
                        ultimoLogin: hoje,
                        estatisticas: { diasSeguidos: 1 },
                        moedas: 0,
                        nivel: 1,
                        xp: 0
                    }, { merge: true });
                    
                    document.getElementById('player-coins').innerText = "0";
                    document.getElementById('player-level').innerText = "1";
                }
            } else {
                window.location.href = "index.html";
            }
        });
    </script>
</body>
</html>
