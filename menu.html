<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supercards - Menu Principal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-image: url('fundotela.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    </style>
</head>
<body class="h-[100dvh] p-4 flex justify-center overflow-hidden">

    <div class="w-full max-w-sm flex flex-col h-full relative">
        
        <header class="flex items-center mb-6 mt-2 gap-3">
            
            <div class="relative flex-shrink-0">
                <div class="bg-[#dca3e8] w-20 h-20 rounded-full flex items-center justify-center text-[#7a32a8] font-bold shadow-lg">
                    foto
                </div>
                <div id="player-level" class="absolute -bottom-2 left-1/2 transform -translate-x-1/2 bg-[#bc7bd4] text-black font-black px-3 py-0.5 rounded-full shadow-md text-sm border border-[#dca3e8]/50">
                    ...
                </div>
            </div>

            <div class="flex flex-col flex-grow gap-2">
                
                <nav class="bg-[#dca3e8] rounded-full flex justify-between items-center px-2 py-1.5 shadow-md">
                    <button onclick="window.location.href='perfil.html'" class="bg-[#7a32a8] text-white text-[11px] font-bold px-4 py-1.5 rounded-full hover:bg-purple-600 transition-colors">
                        PERFIL
                    </button>
                    
                    <button onclick="window.location.href='shop.html'" class="bg-[#7a32a8] hover:bg-purple-600 transition-colors rounded-full flex items-center justify-center w-8 h-8 shadow-sm">
                        <img src="shop.png" alt="Shop" class="w-4 h-4 object-contain">
                    </button>
                    
                    <button class="bg-[#7a32a8] hover:bg-purple-600 transition-colors rounded-full flex items-center justify-center w-8 h-8 shadow-sm">
                        <img src="missao.png" alt="Missões" class="w-4 h-4 object-contain">
                    </button>
                    
                    <div class="relative flex items-center">
                        <button id="btn-config" class="bg-[#7a32a8] hover:bg-purple-600 transition-colors rounded-full flex items-center justify-center w-8 h-8 shadow-sm">
                            <img src="config.png" alt="Configurações" class="w-4 h-4 object-contain">
                        </button>

                        <div id="dropdown-config" class="hidden absolute right-0 top-10 w-32 bg-[#bc7bd4] border-2 border-[#7a32a8] rounded-xl shadow-2xl overflow-hidden z-50">
                            <button id="btn-sair" class="w-full px-4 py-2 text-white font-bold text-sm hover:bg-[#7a32a8] transition-colors flex items-center justify-between">
                                Sair
                                <span>🚪</span>
                            </button>
                        </div>
                    </div>
                </nav>

                <div class="flex gap-2">
                    <div id="player-name" class="bg-[#dca3e8] rounded-full flex-grow text-[#7a32a8] font-bold text-xs py-1.5 flex items-center justify-center shadow-md px-2 truncate">
                        Carregando...
                    </div>
                    
                    <div class="bg-[#dca3e8] rounded-full px-3 py-1.5 flex items-center justify-center gap-1 shadow-md">
                        <span id="player-coins" class="text-black font-black text-xs">...</span>
                        <img src="moedas.png" alt="Moedas" class="w-4 h-4 object-contain drop-shadow-sm">
                    </div>
                </div>

            </div>
        </header>

        <main class="grid grid-cols-2 gap-x-4 gap-y-4 flex-grow content-center mb-4">
            <div onclick="window.location.href='colecao.html'" class="flex flex-col items-center group cursor-pointer">
                <span class="text-[#dca3e8] font-black text-lg mb-1 drop-shadow-md">Coleção</span>
                <div class="bg-[#dca3e8] w-[80%] aspect-square rounded-[24px] flex items-center justify-center p-4 shadow-lg hover:scale-105 transition-transform border-4 border-transparent hover:border-[#8b3dff]/50">
                    <img src="colecao.png" alt="Coleção" class="w-full h-full object-contain drop-shadow-lg">
                </div>
            </div>

            <div onclick="window.location.href='inventario.html'" class="flex flex-col items-center group cursor-pointer">
                <span class="text-[#dca3e8] font-black text-lg mb-1 drop-shadow-md">Inventário</span>
                <div class="bg-[#dca3e8] w-[80%] aspect-square rounded-[24px] flex items-center justify-center p-4 shadow-lg hover:scale-105 transition-transform border-4 border-transparent hover:border-[#8b3dff]/50">
                    <img src="inventario.png" alt="Inventário" class="w-full h-full object-contain drop-shadow-lg">
                </div>
            </div>

            <div class="flex flex-col items-center group cursor-pointer">
                <span class="text-[#dca3e8] font-black text-lg mb-1 drop-shadow-md">Trocas</span>
                <div class="bg-[#dca3e8] w-[80%] aspect-square rounded-[24px] flex items-center justify-center p-4 shadow-lg hover:scale-105 transition-transform border-4 border-transparent hover:border-[#8b3dff]/50">
                    <img src="troca.png" alt="Trocas" class="w-full h-full object-contain drop-shadow-lg">
                </div>
            </div>

            <div class="flex flex-col items-center group cursor-pointer">
                <span class="text-[#dca3e8] font-black text-lg mb-1 drop-shadow-md">Batalha</span>
                <div class="bg-[#dca3e8] w-[80%] aspect-square rounded-[24px] flex items-center justify-center p-4 shadow-lg hover:scale-105 transition-transform border-4 border-transparent hover:border-[#8b3dff]/50">
                    <img src="vs.png" alt="Batalha" class="w-full h-full object-contain drop-shadow-lg">
                </div>
            </div>
        </main>

        <footer class="mt-auto flex justify-center pb-2">
            <div class="bg-[#dca3e8] rounded-full flex p-1.5 gap-2 shadow-lg w-full max-w-[280px]">
                <button onclick="window.location.href='notificacoes.html'" class="flex-1 bg-[#7a32a8] text-white text-xs font-bold py-2 rounded-full hover:bg-purple-600 transition-colors">Notificações</button>
                <button class="flex-1 bg-[#7a32a8] text-white text-xs font-bold py-2 rounded-full hover:bg-purple-600 transition-colors">AMIGOS</button>
            </div>
        </footer>

        <!-- MODAL DE ALERTA EM FILA -->
        <div id="modal-alerta-custom" class="hidden fixed inset-0 bg-black/80 z-[100] flex items-center justify-center p-4 backdrop-blur-sm">
            <div class="bg-[#dca3e8] border-4 border-[#7a32a8] rounded-2xl p-6 max-w-xs w-full text-center shadow-2xl">
                <h2 class="text-[#7a32a8] font-black text-xl mb-4">Aviso</h2>
                <p id="mensagem-alerta-custom" class="text-black font-bold mb-6 text-sm leading-relaxed">Mensagem aqui</p>
                <button id="btn-fechar-alerta-custom" class="bg-[#7a32a8] hover:bg-purple-600 text-white font-black py-2 px-8 rounded-full shadow-md transition-transform hover:scale-105">
                    OK
                </button>
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCU3lFTgfrDMaD9jwR7X7ivYPmGQh4VE1g",
          authDomain: "supercards-tcg.firebaseapp.com",
          projectId: "supercards-tcg",
          storageBucket: "supercards-tcg.firebasestorage.app",
          messagingSenderId: "862316380615",
          appId: "1:862316380615:web:b3f28056ebc967673999e2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- CONTROLES DA INTERFACE ---
        const btnConfig = document.getElementById('btn-config');
        const dropdownConfig = document.getElementById('dropdown-config');

        btnConfig.addEventListener('click', () => { dropdownConfig.classList.toggle('hidden'); });
        
        document.addEventListener('click', (event) => {
            if (!btnConfig.contains(event.target) && !dropdownConfig.contains(event.target)) {
                dropdownConfig.classList.add('hidden');
            }
        });

        document.getElementById('btn-sair').addEventListener('click', () => {
            signOut(auth).catch((error) => console.error("Erro ao sair: ", error));
        });

        // --- SISTEMA DE ALERTAS EM FILA ---
        let filaAlertas = [];
        let alertaAberto = false;
        const modalAlerta = document.getElementById('modal-alerta-custom');
        const msgAlertaCustom = document.getElementById('mensagem-alerta-custom');

        function mostrarAlerta(mensagem) {
            filaAlertas.push(mensagem);
            processarFilaAlertas();
        }

        function processarFilaAlertas() {
            if (alertaAberto || filaAlertas.length === 0) return;
            alertaAberto = true;
            // Trocado innerText por innerHTML para poder renderizar a imagem da moeda!
            msgAlertaCustom.innerHTML = filaAlertas[0]; 
            modalAlerta.classList.remove('hidden');
        }

        document.getElementById('btn-fechar-alerta-custom').addEventListener('click', () => {
            modalAlerta.classList.add('hidden');
            filaAlertas.shift(); 
            alertaAberto = false;
            setTimeout(processarFilaAlertas, 300); 
        });

        // --- FUNÇÕES DE DATA ---
        function obterGameDay(offsetDias = 0) {
            let d = new Date();
            if (d.getHours() < 6) d.setDate(d.getDate() - 1);
            d.setDate(d.getDate() + offsetDias);
            return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
        }

        function calcularXPMaximo(nivel) {
            if (nivel >= 1 && nivel <= 5) return 200;
            if (nivel >= 6 && nivel <= 15) return 750;
            if (nivel >= 16 && nivel <= 25) return 1600;
            return 3000;
        }

        // --- RADAR DE LOGIN & LÓGICA DE DIAS SEGUIDOS ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('player-name').innerText = user.displayName?.toUpperCase() || "JOGADOR";

                const docRef = doc(db, "users", user.uid);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const dados = docSnap.data();
                    
                    const hoje = obterGameDay(0);
                    const ontem = obterGameDay(-1);
                    
                    let ultimoLogin = dados.ultimoLogin || "";
                    let diasSeguidos = dados.estatisticas?.diasSeguidos || 0;
                    
                    let atualizouLogin = false;
                    let docAtualizacao = {};

                    if (ultimoLogin !== hoje) {
                        atualizouLogin = true;
                        if (ultimoLogin === ontem) {
                            diasSeguidos += 1; 
                        } else {
                            diasSeguidos = 1; 
                        }
                        docAtualizacao.ultimoLogin = hoje;
                        docAtualizacao.estatisticas = { diasSeguidos: diasSeguidos }; 
                    }

                    let badgesJogador = dados.badges || {};
                    let ganhouBadge = false;
                    let bonusXp = 0;
                    let bonusMoedas = 0;

                    if (diasSeguidos >= 20 && !badgesJogador["badge-003"]) {
                        badgesJogador["badge-003"] = true;
                        ganhouBadge = true;
                        bonusXp += 50;
                        bonusMoedas += 50;
                    }

                    let nivelAtual = dados.nivel || 1;
                    let xpAtual = dados.xp || 0;
                    let subiuNivel = false;
                    let msgLevelUp = "";

                    if (ganhouBadge) {
                        let novoXp = xpAtual + bonusXp;
                        let xpMaximo = calcularXPMaximo(nivelAtual);
                        let pacotesBasicos = 0;
                        let pacotesPremium = 0;

                        if (novoXp >= xpMaximo && nivelAtual < 30) {
                            novoXp -= xpMaximo;
                            nivelAtual++;
                            subiuNivel = true;
                            bonusMoedas += 30;
                            pacotesBasicos++;
                            
                            if (nivelAtual === 10 || nivelAtual === 20 || nivelAtual === 30) {
                                pacotesPremium++;
                                msgLevelUp = `🎉 LEVEL UP! Nível ${nivelAtual} alcançado!<br><span class="text-xs">Recompensas: 1 Pacote Básico, 1 Pacote Premium e 30 <img src="moedas.png" class="inline w-4 h-4 ml-0.5 align-text-bottom"></span>`;
                            } else {
                                msgLevelUp = `🎉 LEVEL UP! Nível ${nivelAtual} alcançado!<br><span class="text-xs">Recompensas: 1 Pacote Básico e 30 <img src="moedas.png" class="inline w-4 h-4 ml-0.5 align-text-bottom"></span>`;
                            }
                        }

                        docAtualizacao.badges = badgesJogador;
                        docAtualizacao.xp = novoXp;
                        docAtualizacao.nivel = nivelAtual;
                        docAtualizacao.moedas = increment(bonusMoedas);
                        
                        let invUpdates = {};
                        if (pacotesBasicos > 0) invUpdates.pacoteBasico = increment(pacotesBasicos);
                        if (pacotesPremium > 0) invUpdates.pacotePremium = increment(pacotesPremium);
                        if (Object.keys(invUpdates).length > 0) docAtualizacao.inventario = invUpdates;
                    }

                    if (atualizouLogin || ganhouBadge) {
                        await setDoc(docRef, docAtualizacao, { merge: true });
                    }

                    document.getElementById('player-coins').innerText = (dados.moedas || 0) + bonusMoedas;
                    document.getElementById('player-level').innerText = nivelAtual;

                    // 5. DISPARA ALERTAS (Agora formatados com HTML e a Imagem da Moeda)
                    if (ganhouBadge) {
                        mostrarAlerta(`🏆 NOVA CONQUISTA!<br><span class="text-xs font-normal">Badge: Jogador Viciado (Logou 20 dias seguidos).</span><br><span class="text-sm">Recompensa: +50 XP e +50 <img src="moedas.png" class="inline w-4 h-4 align-text-bottom"></span>`);
                    }
                    if (subiuNivel) {
                        mostrarAlerta(msgLevelUp);
                    }

                } else {
                    const hoje = obterGameDay(0);
                    await setDoc(docRef, {
                        ultimoLogin: hoje,
                        estatisticas: { diasSeguidos: 1 },
                        moedas: 0,
                        nivel: 1,
                        xp: 0
                    }, { merge: true });
                    
                    document.getElementById('player-coins').innerText = "0";
                    document.getElementById('player-level').innerText = "1";
                }
            } else {
                window.location.href = "index.html";
            }
        });
    </script>
</body>
</html>
