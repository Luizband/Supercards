<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supercards - Notificações</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-image: url('fundotela.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-[100dvh] p-4 flex justify-center overflow-hidden">

    <div class="w-full max-w-sm flex flex-col h-full relative gap-4">
        
        <!-- CABEÇALHO -->
        <header class="relative flex items-center justify-center mt-4 mb-2 min-h-[40px]">
            <button onclick="window.location.href='menu.html'" class="absolute left-0 bg-[#dca3e8] hover:bg-[#bc7bd4] transition-colors rounded-full flex items-center justify-center w-10 h-10 shadow-md text-[#7a32a8] font-black text-xl z-50">
                ←
            </button>
            <h1 class="text-white font-black text-xl drop-shadow-md text-center px-12 leading-tight">CAIXA DE ENTRADA</h1>
        </header>

        <!-- LISTA DE NOTIFICAÇÕES -->
        <main class="flex flex-col flex-grow bg-[#dca3e8]/90 backdrop-blur-sm rounded-[2rem] p-4 shadow-xl overflow-hidden mb-4 border-2 border-[#bc7bd4]">
            
            <div id="lista-notificacoes" class="flex flex-col gap-3 overflow-y-auto no-scrollbar h-full pb-2">
                <!-- As mensagens serão injetadas aqui -->
            </div>

            <!-- MENSAGEM DE CAIXA VAZIA -->
            <div id="mensagem-vazia" class="hidden flex-col items-center justify-center h-full text-center opacity-70">
                <span class="text-[#7a32a8] text-4xl mb-2">📭</span>
                <p class="text-[#7a32a8] font-black text-sm uppercase">Caixa Vazia</p>
                <p class="text-[#7a32a8] font-bold text-xs mt-1">Você não tem novas mensagens.</p>
            </div>

        </main>

        <!-- MODAL DE LEITURA DA MENSAGEM -->
        <div id="modal-leitura" class="hidden fixed inset-0 bg-black/80 z-[100] flex items-center justify-center p-4 backdrop-blur-sm">
            <div class="bg-[#dca3e8] border-4 border-[#7a32a8] rounded-2xl p-6 max-w-xs w-full shadow-2xl flex flex-col max-h-[80vh]">
                
                <h2 id="modal-titulo" class="text-[#7a32a8] font-black text-lg mb-2 leading-tight">Título da Mensagem</h2>
                <span id="modal-data" class="text-gray-600 font-bold text-[10px] mb-4 border-b border-[#bc7bd4] pb-2">00/00/0000</span>
                
                <div class="overflow-y-auto no-scrollbar mb-6 flex-grow">
                    <p id="modal-texto" class="text-black font-bold text-sm leading-relaxed whitespace-pre-wrap">Conteúdo da mensagem aqui.</p>
                </div>
                
                <!-- BOTOES DE AÇÃO (EXCLUIR E FECHAR) -->
                <div class="flex gap-2 mt-auto">
                    <button id="btn-excluir-leitura" class="bg-red-600 hover:bg-red-700 text-white font-black py-3 px-6 rounded-full shadow-md transition-transform hover:scale-105 flex items-center justify-center">
                        🗑️
                    </button>
                    <button id="btn-fechar-leitura" class="bg-[#7a32a8] hover:bg-purple-600 text-white font-black py-3 flex-grow rounded-full shadow-md transition-transform hover:scale-105">
                        FECHAR
                    </button>
                </div>

            </div>
        </div>

    </div>

    <!-- SCRIPT DO FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCU3lFTgfrDMaD9jwR7X7ivYPmGQh4VE1g",
          authDomain: "supercards-tcg.firebaseapp.com",
          projectId: "supercards-tcg",
          storageBucket: "supercards-tcg.firebasestorage.app",
          messagingSenderId: "862316380615",
          appId: "1:862316380615:web:b3f28056ebc967673999e2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const listaContainer = document.getElementById('lista-notificacoes');
        const msgVazia = document.getElementById('mensagem-vazia');
        
        // Elementos do Modal
        const modalLeitura = document.getElementById('modal-leitura');
        const mTitulo = document.getElementById('modal-titulo');
        const mData = document.getElementById('modal-data');
        const mTexto = document.getElementById('modal-texto');
        const btnFechar = document.getElementById('btn-fechar-leitura');
        const btnExcluir = document.getElementById('btn-excluir-leitura'); // NOVO BOTAO

        let notificacoesJogador = [];
        let dbUserRef = null;
        let indiceMensagemAberta = null; // Guarda qual mensagem estamos lendo

        // Formata a data
        function formatarData(dataString) {
            const d = new Date(dataString);
            return d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }

        function renderizarLista() {
            listaContainer.innerHTML = "";
            
            if (notificacoesJogador.length === 0) {
                msgVazia.classList.remove('hidden');
                msgVazia.classList.add('flex');
                return;
            } else {
                msgVazia.classList.add('hidden');
                msgVazia.classList.remove('flex');
            }

            notificacoesJogador.forEach((notif, index) => {
                const item = document.createElement('div');
                const bgClass = notif.lida ? 'bg-white/50 border-[#bc7bd4]' : 'bg-[#7a32a8] border-[#7a32a8]';
                const titleClass = notif.lida ? 'text-[#7a32a8]' : 'text-white';
                const dateClass = notif.lida ? 'text-[#7a32a8]/70' : 'text-white/70';
                const icon = notif.lida ? '📩' : '📫';

                item.className = `${bgClass} border-2 rounded-xl p-3 flex items-center gap-3 cursor-pointer shadow-sm transform transition-transform active:scale-95`;
                
                item.innerHTML = `
                    <div class="text-2xl">${icon}</div>
                    <div class="flex flex-col flex-grow overflow-hidden">
                        <span class="${titleClass} font-black text-sm truncate">${notif.titulo}</span>
                        <span class="${dateClass} font-bold text-[10px]">${formatarData(notif.data)}</span>
                    </div>
                    ${!notif.lida ? '<div class="w-3 h-3 bg-[#ffd700] rounded-full shadow-md mr-1 flex-shrink-0"></div>' : ''}
                `;

                item.addEventListener('click', () => abrirMensagem(index));
                listaContainer.appendChild(item);
            });
        }

        async function abrirMensagem(index) {
            const notif = notificacoesJogador[index];
            indiceMensagemAberta = index; // Registra qual mensagem está aberta
            
            mTitulo.innerText = notif.titulo;
            mData.innerText = formatarData(notif.data);
            mTexto.innerHTML = notif.texto.replace(/<img[^>]*>/g, match => match); 
            
            modalLeitura.classList.remove('hidden');

            if (!notif.lida) {
                notificacoesJogador[index].lida = true;
                renderizarLista(); 
                
                try {
                    await setDoc(dbUserRef, { notificacoes: notificacoesJogador }, { merge: true });
                } catch (error) {
                    console.error("Erro ao atualizar status de leitura:", error);
                }
            }
        }

        // --- SISTEMA DE EXCLUSÃO DE MENSAGEM ---
        btnExcluir.addEventListener('click', async () => {
            if (indiceMensagemAberta !== null) {
                // 1. Remove 1 item a partir do índice aberto
                notificacoesJogador.splice(indiceMensagemAberta, 1); 
                
                // 2. Fecha o modal e atualiza a tela
                modalLeitura.classList.add('hidden');
                renderizarLista();
                indiceMensagemAberta = null;
                
                // 3. Salva a nova lista (sem a mensagem deletada) no Firebase
                try {
                    await setDoc(dbUserRef, { notificacoes: notificacoesJogador }, { merge: true });
                } catch (error) {
                    console.error("Erro ao deletar mensagem:", error);
                }
            }
        });

        btnFechar.addEventListener('click', () => {
            modalLeitura.classList.add('hidden');
            indiceMensagemAberta = null;
        });

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                dbUserRef = doc(db, "users", user.uid);
                const snap = await getDoc(dbUserRef);
                
                if (snap.exists()) {
                    const dados = snap.data();
                    notificacoesJogador = (dados.notificacoes || []).sort((a, b) => new Date(b.data) - new Date(a.data));
                    renderizarLista();
                }
            } else {
                window.location.href = "index.html";
            }
        });
    </script>
</body>
</html>
