<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supercards - Perfil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-image: url('fundotela.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* CSS do Toast adicionado para as mensagens de Upload */
        #toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            width: 90%;
            max-width: 350px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast-msg {
            background: #dca3e8;
            color: #7a32a8;
            border: 3px solid #7a32a8;
            padding: 12px 20px;
            border-radius: 9999px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.3);
            text-align: center;
            font-weight: 900;
            font-size: 0.85rem;
            animation: slideDown 0.3s ease-out;
            pointer-events: auto;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="h-[100dvh] p-4 flex justify-center overflow-hidden">

    <div id="toast-container"></div>

    <div class="w-full max-w-sm flex flex-col h-full relative gap-4">
        
        <!-- SEÇÃO SUPERIOR: FOTO, NOME E XP -->
        <header class="flex items-center gap-4 mt-4">
            
            <!-- Foto e Moedas (Esquerda) -->
            <div class="flex flex-col items-center relative">
                
                <!-- ÁREA DA FOTO CLICÁVEL -->
                <div class="relative group cursor-pointer" onclick="document.getElementById('input-foto').click()">
                    <!-- O Círculo com overflow-hidden para a imagem ficar redonda -->
                    <div class="bg-[#dca3e8] w-24 h-24 rounded-full flex items-center justify-center text-[#7a32a8] font-black text-xl shadow-lg border-2 border-[#bc7bd4] overflow-hidden">
                        <span id="texto-sem-foto">FOTO</span>
                        <img id="img-perfil" src="" class="hidden w-full h-full object-cover absolute inset-0">
                    </div>
                    
                    <!-- Overlay escuro e ícone de câmera ao passar o mouse / clicar -->
                    <div class="absolute inset-0 bg-black/50 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity z-10">
                        <span class="text-white font-black text-[10px] text-center drop-shadow-md">MUDAR</span>
                    </div>
                    <div class="absolute bottom-1 right-0 bg-[#22c55e] w-7 h-7 rounded-full border-2 border-[#dca3e8] flex items-center justify-center shadow-md text-xs z-20">
                        📷
                    </div>
                </div>

                <!-- Input invisível para abrir a galeria/câmera -->
                <input type="file" id="input-foto" accept="image/*" class="hidden">

                <!-- Pílula de moedas sobreposta -->
                <div class="absolute -bottom-3 bg-[#dca3e8] rounded-full px-3 py-1 flex items-center justify-center gap-1 shadow-md border-2 border-[#bc7bd4] z-30">
                    <span id="perfil-moedas" class="text-black font-black text-xs">0</span>
                    <img src="moedas.png" class="w-3 h-3 object-contain">
                </div>
            </div>

            <!-- Informações do Jogador (Direita) -->
            <div class="flex flex-col flex-grow gap-2">
                <div class="bg-[#dca3e8] rounded-full px-4 py-2 flex items-center justify-center shadow-md">
                    <span id="perfil-nome" class="text-[#7a32a8] font-black text-sm tracking-wide uppercase truncate max-w-[150px]">JOGADOR</span>
                </div>
                
                <div class="flex flex-col items-center mt-1">
                    <div class="bg-[#dca3e8] rounded-full px-5 py-1 mb-1 shadow-sm">
                        <span id="perfil-nivel" class="text-black font-black text-xs">Nível --</span>
                    </div>
                    
                    <div class="w-full bg-transparent border border-[#dca3e8] rounded-full h-3 overflow-hidden shadow-inner">
                        <div id="perfil-barra-xp" class="bg-[#dca3e8] h-full transition-all duration-500" style="width: 0%;"></div>
                    </div>
                    <span id="perfil-texto-xp" class="text-white text-[10px] font-bold mt-1">0/0 xp</span>
                </div>
            </div>
        </header>

        <!-- CAIXA DE BADGES -->
        <main class="flex flex-col gap-4 flex-grow overflow-y-auto no-scrollbar pb-16 mt-2">
            
            <div class="bg-[#dca3e8] rounded-[2rem] p-5 shadow-xl">
                <h2 class="text-[#7a32a8] font-black text-xl text-center mb-4 uppercase drop-shadow-sm">Badges</h2>
                
                <div id="grid-badges" class="grid grid-cols-3 gap-4 place-items-start">
                    <!-- As Badges serão injetadas aqui pelo JS -->
                </div>
                
                <p id="mensagem-sem-badges" class="text-center text-[#7a32a8]/70 font-bold text-sm hidden">
                    Nenhuma badge conquistada ainda.
                </p>
            </div>

            <!-- CAIXA DE DADOS ESTATÍSTICOS -->
            <div class="bg-[#dca3e8] rounded-[2rem] p-5 shadow-xl">
                <h2 class="text-[#7a32a8] font-black text-lg text-center mb-3 uppercase drop-shadow-sm">Dados Estatísticos</h2>
                
                <ul class="text-black font-bold text-xs space-y-2">
                    <li class="flex justify-between border-b border-[#bc7bd4] pb-1">
                        <span>Pacotes Abertos:</span> <span id="stat-pacotes">0</span>
                    </li>
                    <li class="flex justify-between border-b border-[#bc7bd4] pb-1">
                        <span>Cartas na Coleção:</span> <span id="stat-cartas">0</span>
                    </li>
                    <li class="flex justify-between border-b border-[#bc7bd4] pb-1">
                        <span>Cartas Recicladas:</span> <span id="stat-recicladas">0</span>
                    </li>
                    <li class="flex justify-between border-b border-[#bc7bd4] pb-1">
                        <span>Batalhas Vencidas:</span> <span id="stat-batalhas">0</span>
                    </li>
                    <li class="flex justify-between">
                        <span>Trocas Feitas:</span> <span id="stat-trocas">0</span>
                    </li>
                </ul>
            </div>

        </main>

        <!-- BOTÃO RETORNAR -->
        <footer class="absolute bottom-4 left-0 w-full flex justify-center z-10">
            <button onclick="window.location.href='menu.html'" class="bg-[#7a32a8] hover:bg-purple-600 text-white font-black py-3 px-12 rounded-full shadow-lg transition-transform hover:-translate-y-1 border-2 border-[#dca3e8]">
                RETORNAR
            </button>
        </footer>

    </div>

    <!-- SCRIPT DO FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        // IMPORTAÇÃO DO STORAGE PARA A FOTO
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";
        
        import { INFO_BADGES } from './badges.js';

        const firebaseConfig = {
          apiKey: "AIzaSyCU3lFTgfrDMaD9jwR7X7ivYPmGQh4VE1g",
          authDomain: "supercards-tcg.firebaseapp.com",
          projectId: "supercards-tcg",
          storageBucket: "supercards-tcg.firebasestorage.app",
          messagingSenderId: "862316380615",
          appId: "1:862316380615:web:b3f28056ebc967673999e2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app); // INICIALIZA O STORAGE

        let currentUserUid = null;

        window.mostrarToast = function(mensagem) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast-msg';
            toast.innerHTML = mensagem;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s ease';
                setTimeout(() => toast.remove(), 500); 
            }, 3000);
        };

        function calcularXPMaximo(nivel) {
            if (nivel >= 1 && nivel <= 5) return 200;
            if (nivel >= 6 && nivel <= 15) return 750;
            if (nivel >= 16 && nivel <= 25) return 1600;
            return 3000;
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserUid = user.uid; // Salva o ID para o upload da foto
                const docRef = doc(db, "users", user.uid);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const dados = docSnap.data();
                    
                    // Preenche o Cabeçalho
                    document.getElementById('perfil-nome').innerText = user.displayName?.toUpperCase() || "JOGADOR";
                    document.getElementById('perfil-moedas').innerText = dados.moedas || 0;
                    
                    const nivel = dados.nivel || 1;
                    const xpAtual = dados.xp || 0;
                    const xpMaximo = calcularXPMaximo(nivel);
                    const porcentagem = Math.min((xpAtual / xpMaximo) * 100, 100);

                    document.getElementById('perfil-nivel').innerText = `Nível ${nivel}`;
                    document.getElementById('perfil-texto-xp').innerText = `${xpAtual}/${xpMaximo} xp`;
                    document.getElementById('perfil-barra-xp').style.width = `${porcentagem}%`;

                    // LÓGICA DE EXIBIR A FOTO SE ELA EXISTIR NO BANCO
                    if (dados.fotoPerfil) {
                        document.getElementById('img-perfil').src = dados.fotoPerfil;
                        document.getElementById('img-perfil').classList.remove('hidden');
                        document.getElementById('texto-sem-foto').classList.add('hidden');
                    }

                    // Preenche as Estatísticas
                    const stats = dados.estatisticas || {};
                    document.getElementById('stat-pacotes').innerText = stats.pacotesAbertos || 0;
                    document.getElementById('stat-cartas').innerText = stats.totalCartas || 0;
                    document.getElementById('stat-recicladas').innerText = stats.cartasRecicladas || 0;
                    document.getElementById('stat-batalhas').innerText = stats.batalhasVencidas || 0;
                    document.getElementById('stat-trocas').innerText = stats.trocasFeitas || 0;

                    // Preenche as Badges
                    const gridBadges = document.getElementById('grid-badges');
                    const msgSemBadges = document.getElementById('mensagem-sem-badges');
                    
                    const badgesConquistadas = dados.badges || {}; 
                    const chavesBadges = Object.keys(badgesConquistadas);

                    if (chavesBadges.length === 0) {
                        msgSemBadges.classList.remove('hidden');
                    } else {
                        chavesBadges.forEach(badgeId => {
                            const info = INFO_BADGES[badgeId];
                            if (info) {
                                const div = document.createElement('div');
                                div.className = "flex flex-col items-center text-center cursor-pointer transform hover:scale-110 transition-transform";
                                div.innerHTML = `
                                    <img src="${info.imagem}" alt="${info.nome}" class="w-16 h-16 object-contain drop-shadow-md mb-1">
                                    <span class="text-[#7a32a8] font-black text-[9px] leading-tight">${info.nome}</span>
                                `;
                                
                                div.addEventListener('click', () => alert(info.descricao));
                                
                                gridBadges.appendChild(div);
                            }
                        });
                    }
                }
            } else {
                window.location.href = "index.html";
            }
        });

        // --- SISTEMA DE UPLOAD DE FOTO ---
        const inputFoto = document.getElementById('input-foto');
        
        inputFoto.addEventListener('change', async (event) => {
            const arquivo = event.target.files[0];
            if (!arquivo) return;

            window.mostrarToast("Fazendo upload da foto... ⏳");
            document.getElementById('texto-sem-foto').innerText = "⏳";
            document.getElementById('texto-sem-foto').classList.remove('hidden');
            document.getElementById('img-perfil').classList.add('hidden');

            try {
                // Salva a imagem na pasta 'fotos_perfil' com o nome sendo a ID do usuário
                const storageRef = ref(storage, `fotos_perfil/${currentUserUid}`);
                
                await uploadBytes(storageRef, arquivo);
                const linkFoto = await getDownloadURL(storageRef);

                // Salva a URL no banco de dados Firestore
                await setDoc(doc(db, "users", currentUserUid), { fotoPerfil: linkFoto }, { merge: true });

                // Atualiza a interface
                document.getElementById('img-perfil').src = linkFoto;
                document.getElementById('img-perfil').classList.remove('hidden');
                document.getElementById('texto-sem-foto').classList.add('hidden');
                
                window.mostrarToast("📸 Foto atualizada com sucesso!");

            } catch (error) {
                console.error("Erro no upload:", error);
                window.mostrarToast("Erro ao enviar a imagem.");
                document.getElementById('texto-sem-foto').innerText = "FOTO";
            }
        });
    </script>
</body>
</html>
