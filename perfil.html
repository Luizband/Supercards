<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supercards - Perfil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-image: url('fundotela.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        #toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            width: 90%;
            max-width: 350px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast-msg {
            background: #dca3e8;
            color: #7a32a8;
            border: 3px solid #7a32a8;
            padding: 12px 20px;
            border-radius: 9999px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.3);
            text-align: center;
            font-weight: 900;
            font-size: 0.85rem;
            animation: slideDown 0.3s ease-out;
            pointer-events: auto;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="h-[100dvh] p-4 flex justify-center overflow-hidden">

    <div id="toast-container"></div>

    <div class="w-full max-w-sm flex flex-col h-full relative gap-4">
        
        <header class="flex items-center gap-4 mt-4">
            
            <div class="flex flex-col items-center relative">
                
                <!-- ÁREA DA FOTO CLICÁVEL -->
                <div class="relative group cursor-pointer" onclick="document.getElementById('modal-avatares').classList.remove('hidden')">
                    
                    <!-- CÍRCULO CORRIGIDO: relative e rounded-full na img -->
                    <div class="bg-[#dca3e8] w-24 h-24 rounded-full flex items-center justify-center text-[#7a32a8] font-black text-xl shadow-lg border-2 border-[#bc7bd4] relative">
                        <span id="texto-sem-foto">FOTO</span>
                        <img id="img-perfil" src="" class="hidden w-full h-full object-cover rounded-full absolute inset-0">
                    </div>
                    
                    <div class="absolute inset-0 bg-black/50 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity z-10 pointer-events-none">
                        <span class="text-white font-black text-[10px] text-center drop-shadow-md">MUDAR</span>
                    </div>
                    
                    <!-- CANETA CINZA MINIMALISTA SEM FUNDO -->
                    <div class="absolute bottom-0 -right-1 z-20 pointer-events-none">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-300 drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                        </svg>
                    </div>
                </div>

                <div class="absolute -bottom-3 bg-[#dca3e8] rounded-full px-3 py-1 flex items-center justify-center gap-1 shadow-md border-2 border-[#bc7bd4] z-30">
                    <span id="perfil-moedas" class="text-black font-black text-xs">0</span>
                    <img src="moedas.png" class="w-3 h-3 object-contain">
                </div>
            </div>

            <div class="flex flex-col flex-grow gap-2">
                <div class="bg-[#dca3e8] rounded-full px-4 py-2 flex items-center justify-center shadow-md">
                    <span id="perfil-nome" class="text-[#7a32a8] font-black text-sm tracking-wide uppercase truncate max-w-[150px]">JOGADOR</span>
                </div>
                
                <div class="flex flex-col items-center mt-1">
                    <div class="bg-[#dca3e8] rounded-full px-5 py-1 mb-1 shadow-sm">
                        <span id="perfil-nivel" class="text-black font-black text-xs">Nível --</span>
                    </div>
                    
                    <div class="w-full bg-transparent border border-[#dca3e8] rounded-full h-3 overflow-hidden shadow-inner">
                        <div id="perfil-barra-xp" class="bg-[#dca3e8] h-full transition-all duration-500" style="width: 0%;"></div>
                    </div>
                    <span id="perfil-texto-xp" class="text-white text-[10px] font-bold mt-1">0/0 xp</span>
                </div>
            </div>
        </header>

        <main class="flex flex-col gap-4 flex-grow overflow-y-auto no-scrollbar pb-16 mt-2">
            
            <div class="bg-[#dca3e8] rounded-[2rem] p-5 shadow-xl">
                <h2 class="text-[#7a32a8] font-black text-xl text-center mb-4 uppercase drop-shadow-sm">Badges</h2>
                
                <div id="grid-badges" class="grid grid-cols-3 gap-4 place-items-start">
                </div>
                
                <p id="mensagem-sem-badges" class="text-center text-[#7a32a8]/70 font-bold text-sm hidden">
                    Nenhuma badge conquistada ainda.
                </p>
            </div>

            <div class="bg-[#dca3e8] rounded-[2rem] p-5 shadow-xl">
                <h2 class="text-[#7a32a8] font-black text-lg text-center mb-3 uppercase drop-shadow-sm">Dados Estatísticos</h2>
                
                <ul class="text-black font-bold text-xs space-y-2">
                    <li class="flex justify-between border-b border-[#bc7bd4] pb-1">
                        <span>Pacotes Abertos:</span> <span id="stat-pacotes">0</span>
                    </li>
                    <li class="flex justify-between border-b border-[#bc7bd4] pb-1">
                        <span>Cartas na Coleção:</span> <span id="stat-cartas">0</span>
                    </li>
                    <li class="flex justify-between border-b border-[#bc7bd4] pb-1">
                        <span>Cartas Recicladas:</span> <span id="stat-recicladas">0</span>
                    </li>
                    <li class="flex justify-between border-b border-[#bc7bd4] pb-1">
                        <span>Batalhas Vencidas:</span> <span id="stat-batalhas">0</span>
                    </li>
                    <li class="flex justify-between">
                        <span>Trocas Feitas:</span> <span id="stat-trocas">0</span>
                    </li>
                </ul>
            </div>

        </main>

        <footer class="absolute bottom-4 left-0 w-full flex justify-center z-10">
            <button onclick="window.location.href='menu.html'" class="bg-[#7a32a8] hover:bg-purple-600 text-white font-black py-3 px-12 rounded-full shadow-lg transition-transform hover:-translate-y-1 border-2 border-[#dca3e8]">
                RETORNAR
            </button>
        </footer>

        <div id="modal-avatares" class="hidden fixed inset-0 bg-black/80 z-[100] flex items-center justify-center p-4 backdrop-blur-sm">
            <div class="bg-[#dca3e8] border-4 border-[#7a32a8] rounded-2xl p-6 max-w-xs w-full shadow-2xl relative">
                <h2 class="text-[#7a32a8] font-black text-lg mb-4 text-center uppercase">Escolha seu Avatar</h2>
                
                <div class="grid grid-cols-4 gap-3 max-h-[50vh] overflow-y-auto no-scrollbar pb-2">
                    <button onclick="window.salvarAvatar('avatares/avatar1.png')" class="hover:scale-110 transition-transform"><img src="avatares/avatar1.png" class="rounded-full w-full aspect-square object-cover shadow-md border-2 border-transparent hover:border-[#7a32a8]"></button>
                    <button onclick="window.salvarAvatar('avatares/avatar2.png')" class="hover:scale-110 transition-transform"><img src="avatares/avatar2.png" class="rounded-full w-full aspect-square object-cover shadow-md border-2 border-transparent hover:border-[#7a32a8]"></button>
                    <button onclick="window.salvarAvatar('avatares/avatar3.png')" class="hover:scale-110 transition-transform"><img src="avatares/avatar3.png" class="rounded-full w-full aspect-square object-cover shadow-md border-2 border-transparent hover:border-[#7a32a8]"></button>
                    <button onclick="window.salvarAvatar('avatares/avatar4.png')" class="hover:scale-110 transition-transform"><img src="avatares/avatar4.png" class="rounded-full w-full aspect-square object-cover shadow-md border-2 border-transparent hover:border-[#7a32a8]"></button>
                    <button onclick="window.salvarAvatar('avatares/avatar5.png')" class="hover:scale-110 transition-transform"><img src="avatares/avatar5.png" class="rounded-full w-full aspect-square object-cover shadow-md border-2 border-transparent hover:border-[#7a32a8]"></button>
                    <button onclick="window.salvarAvatar('avatares/avatar6.png')" class="hover:scale-110 transition-transform"><img src="avatares/avatar6.png" class="rounded-full w-full aspect-square object-cover shadow-md border-2 border-transparent hover:border-[#7a32a8]"></button>
                    <button onclick="window.salvarAvatar('avatares/avatar7.png')" class="hover:scale-110 transition-transform"><img src="avatares/avatar7.png" class="rounded-full w-full aspect-square object-cover shadow-md border-2 border-transparent hover:border-[#7a32a8]"></button>
                    <button onclick="window.salvarAvatar('avatares/avatar8.png')" class="hover:scale-110 transition-transform"><img src="avatares/avatar8.png" class="rounded-full w-full aspect-square object-cover shadow-md border-2 border-transparent hover:border-[#7a32a8]"></button>
                    <button onclick="window.salvarAvatar('avatares/avatar9.png')" class="hover:scale-110 transition-transform"><img src="avatares/avatar9.png" class="rounded-full w-full aspect-square object-cover shadow-md border-2 border-transparent hover:border-[#7a32a8]"></button>
                    <button onclick="window.salvarAvatar('avatares/avatar10.png')" class="hover:scale-110 transition-transform"><img src="avatares/avatar10.png" class="rounded-full w-full aspect-square object-cover shadow-md border-2 border-transparent hover:border-[#7a32a8]"></button>
                </div>
                
                <button onclick="document.getElementById('modal-avatares').classList.add('hidden')" class="w-full mt-6 bg-[#7a32a8] hover:bg-purple-600 transition-colors text-white font-black py-3 rounded-full shadow-md">FECHAR</button>
            </div>
        </div>

    </div>

    <!-- SCRIPT DO FIREBASE (Sem Storage) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        
        import { INFO_BADGES } from './badges.js';

        const firebaseConfig = {
          apiKey: "AIzaSyCU3lFTgfrDMaD9jwR7X7ivYPmGQh4VE1g",
          authDomain: "supercards-tcg.firebaseapp.com",
          projectId: "supercards-tcg",
          storageBucket: "supercards-tcg.firebasestorage.app",
          messagingSenderId: "862316380615",
          appId: "1:862316380615:web:b3f28056ebc967673999e2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserUid = null;

        window.mostrarToast = function(mensagem) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast-msg';
            toast.innerHTML = mensagem;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s ease';
                setTimeout(() => toast.remove(), 500); 
            }, 3000);
        };

        function calcularXPMaximo(nivel) {
            if (nivel >= 1 && nivel <= 5) return 200;
            if (nivel >= 6 && nivel <= 15) return 750;
            if (nivel >= 16 && nivel <= 25) return 1600;
            return 3000;
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserUid = user.uid; 
                const docRef = doc(db, "users", user.uid);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const dados = docSnap.data();
                    
                    document.getElementById('perfil-nome').innerText = user.displayName?.toUpperCase() || "JOGADOR";
                    document.getElementById('perfil-moedas').innerText = dados.moedas || 0;
                    
                    const nivel = dados.nivel || 1;
                    const xpAtual = dados.xp || 0;
                    const xpMaximo = calcularXPMaximo(nivel);
                    const porcentagem = Math.min((xpAtual / xpMaximo) * 100, 100);

                    document.getElementById('perfil-nivel').innerText = `Nível ${nivel}`;
                    document.getElementById('perfil-texto-xp').innerText = `${xpAtual}/${xpMaximo} xp`;
                    document.getElementById('perfil-barra-xp').style.width = `${porcentagem}%`;

                    if (dados.fotoPerfil) {
                        document.getElementById('img-perfil').src = dados.fotoPerfil;
                        document.getElementById('img-perfil').classList.remove('hidden');
                        document.getElementById('texto-sem-foto').classList.add('hidden');
                    }

                    const stats = dados.estatisticas || {};
                    document.getElementById('stat-pacotes').innerText = stats.pacotesAbertos || 0;
                    document.getElementById('stat-cartas').innerText = stats.totalCartas || 0;
                    document.getElementById('stat-recicladas').innerText = stats.cartasRecicladas || 0;
                    document.getElementById('stat-batalhas').innerText = stats.batalhasVencidas || 0;
                    document.getElementById('stat-trocas').innerText = stats.trocasFeitas || 0;

                    const gridBadges = document.getElementById('grid-badges');
                    const msgSemBadges = document.getElementById('mensagem-sem-badges');
                    
                    const badgesConquistadas = dados.badges || {}; 
                    const chavesBadges = Object.keys(badgesConquistadas);

                    if (chavesBadges.length === 0) {
                        msgSemBadges.classList.remove('hidden');
                    } else {
                        chavesBadges.forEach(badgeId => {
                            const info = INFO_BADGES[badgeId];
                            if (info) {
                                const div = document.createElement('div');
                                div.className = "flex flex-col items-center text-center cursor-pointer transform hover:scale-110 transition-transform";
                                div.innerHTML = `
                                    <img src="${info.imagem}" alt="${info.nome}" class="w-16 h-16 object-contain drop-shadow-md mb-1">
                                    <span class="text-[#7a32a8] font-black text-[9px] leading-tight">${info.nome}</span>
                                `;
                                
                                div.addEventListener('click', () => alert(info.descricao));
                                
                                gridBadges.appendChild(div);
                            }
                        });
                    }
                }
            } else {
                window.location.href = "index.html";
            }
        });

        window.salvarAvatar = async function(caminhoAvatar) {
            if (!currentUserUid) return;

            document.getElementById('modal-avatares').classList.add('hidden');
            window.mostrarToast("Salvando avatar... ⏳");

            try {
                await setDoc(doc(db, "users", currentUserUid), { fotoPerfil: caminhoAvatar }, { merge: true });

                document.getElementById('img-perfil').src = caminhoAvatar;
                document.getElementById('img-perfil').classList.remove('hidden');
                document.getElementById('texto-sem-foto').classList.add('hidden');
                
                window.mostrarToast("📸 Avatar atualizado com sucesso!");

            } catch (error) {
                console.error("Erro ao salvar avatar:", error);
                window.mostrarToast("Erro ao salvar o avatar.");
            }
        };
    </script>
</body>
</html>
