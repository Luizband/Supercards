<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supercards - Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-image: url('fundotela.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        #toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            width: 90%;
            max-width: 350px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast-msg {
            background: #dca3e8;
            color: #7a32a8;
            border: 3px solid #7a32a8;
            padding: 12px 20px;
            border-radius: 9999px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.3);
            text-align: center;
            font-weight: 900;
            font-size: 0.85rem;
            animation: slideDown 0.3s ease-out;
            pointer-events: auto;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="h-[100dvh] p-4 flex justify-center overflow-hidden">

    <div id="toast-container"></div>

    <div class="w-full max-w-sm flex flex-col h-full relative">
        
        <header class="flex justify-between items-center mb-6 mt-2">
            <button onclick="window.location.href='menu.html'" class="bg-[#dca3e8] hover:bg-[#bc7bd4] transition-colors rounded-full flex items-center justify-center w-10 h-10 shadow-md text-[#7a32a8] font-black text-xl z-50">
                ←
            </button>
            <h1 class="text-white font-black text-2xl drop-shadow-md relative z-50">LOJA</h1>
            <div class="bg-[#dca3e8] rounded-full px-3 py-1.5 flex items-center justify-center gap-1 shadow-md">
                <span id="player-coins" class="text-black font-black text-sm">0</span>
                <img src="moedas.png" alt="Moedas" class="w-5 h-5 object-contain drop-shadow-sm pointer-events-none">
            </div>
        </header>

        <div id="mensagem-alerta" class="hidden w-full p-3 mb-4 text-center text-sm font-bold rounded-lg shadow-lg z-[100] relative"></div>

        <main class="flex flex-col flex-grow gap-4 overflow-y-auto pb-20 no-scrollbar">
            
            <!-- PACOTE GRÁTIS -->
            <div onclick="window.resgatarBonus()" class="flex-shrink-0 bg-gradient-to-br from-[#bc7bd4] to-[#7a32a8] rounded-3xl p-4 shadow-xl border-2 border-[#dca3e8] flex flex-col items-center relative overflow-hidden cursor-pointer transform active:scale-95 transition-transform z-10 w-full">
                <button onclick="window.abrirInfo(event, 'gratis')" class="absolute top-3 right-3 w-7 h-7 bg-white/30 hover:bg-white text-[#7a32a8] rounded-full font-black text-sm shadow-md z-20 flex items-center justify-center transition-colors">i</button>
                <h2 class="text-white font-black text-xl mb-1 drop-shadow-md pointer-events-none">Bônus Diário</h2>
                <p class="text-[#7a32a8] bg-[#dca3e8] px-3 py-0.5 rounded-full text-xs font-black mb-2 shadow-sm pointer-events-none">1 Pacote Básico Grátis</p>
                <img src="pacotegratis.png" alt="Pacote Diário" class="w-20 h-28 object-contain drop-shadow-2xl pointer-events-none mb-3">
                <div id="status-bonus" class="bg-[#22c55e] text-white font-black py-2 w-full text-center rounded-full shadow-md pointer-events-none text-sm">
                    PEGAR PACOTE
                </div>
            </div>

            <!-- PACOTE BÁSICO -->
            <div class="flex-shrink-0 relative bg-[#dca3e8]/90 backdrop-blur-sm rounded-3xl p-4 shadow-lg flex items-center gap-4 border border-[#dca3e8]/50">
                <button onclick="window.abrirInfo(event, 'basico')" class="absolute top-3 right-3 w-6 h-6 bg-white/60 hover:bg-white text-[#7a32a8] rounded-full font-black text-xs shadow-sm z-20 flex items-center justify-center transition-colors">i</button>
                <img src="pacote1.png" class="w-16 h-24 object-contain drop-shadow-lg pointer-events-none">
                <div class="flex flex-col flex-grow">
                    <h2 class="text-[#7a32a8] font-black text-lg leading-tight pointer-events-none pr-6">Pacote Básico</h2>
                    <p class="text-gray-700 text-xs font-bold mb-2 pointer-events-none">5 Cartas Aleatórias, somente da Starter Pack</p>
                    <button onclick="window.iniciarCompra('basico', 100)" class="bg-gray-700 hover:bg-gray-600 text-white font-black py-2 px-4 rounded-xl shadow-md transform active:scale-95 flex items-center justify-center gap-1 z-50 relative cursor-pointer">
                        100 <img src="moedas.png" class="w-4 h-4 pointer-events-none">
                    </button>
                </div>
            </div>

            <!-- PACOTE PREMIUM -->
            <div class="flex-shrink-0 relative bg-gradient-to-r from-[#ffd700]/80 to-[#ffaa00]/80 backdrop-blur-sm rounded-3xl p-4 shadow-lg flex items-center gap-4 border border-[#ffd700]">
                <button onclick="window.abrirInfo(event, 'premium')" class="absolute top-3 right-3 w-6 h-6 bg-white/60 hover:bg-white text-[#996600] rounded-full font-black text-xs shadow-sm z-20 flex items-center justify-center transition-colors">i</button>
                <img src="pacote2.png" class="w-16 h-24 object-contain drop-shadow-lg pointer-events-none">
                <div class="flex flex-col flex-grow">
                    <h2 class="text-[#996600] font-black text-lg leading-tight pointer-events-none pr-6">Pacote Premium</h2>
                    <p class="text-[#805500] text-[10px] font-bold mb-2 leading-tight pointer-events-none">Garante 1 Rara ou superior, somente da Starter Pack</p>
                    <button onclick="window.iniciarCompra('premium', 300)" class="bg-[#996600] hover:bg-[#805500] text-white font-black py-2 px-4 rounded-xl shadow-md transform active:scale-95 flex items-center justify-center gap-1 z-50 relative cursor-pointer">
                        300 <img src="moedas.png" class="w-4 h-4 pointer-events-none">
                    </button>
                </div>
            </div>

            <!-- NOVO PACOTE EXPANSÃO -->
            <div class="flex-shrink-0 relative bg-gradient-to-r from-[#5a189a] to-[#240046] backdrop-blur-sm rounded-3xl p-4 shadow-[0_0_20px_rgba(157,78,221,0.5)] flex items-center gap-4 border-2 border-[#c77dff] overflow-hidden">
                <div class="absolute inset-0 bg-white/5 mix-blend-overlay pointer-events-none animate-pulse"></div>
                <button onclick="window.abrirInfo(event, 'expansao')" class="absolute top-3 right-3 w-6 h-6 bg-white/20 hover:bg-white text-[#c77dff] rounded-full font-black text-xs shadow-sm z-20 flex items-center justify-center transition-colors">i</button>
                <img src="pacote-exp1.png" class="w-20 h-28 object-contain drop-shadow-[0_0_15px_rgba(255,255,255,0.2)] pointer-events-none relative z-10">
                <div class="flex flex-col flex-grow relative z-10">
                    <span class="bg-[#c77dff] text-white text-[9px] font-black px-2 py-0.5 rounded-full self-start mb-1 shadow-sm uppercase tracking-widest">Nova Expansão</span>
                    <h2 class="text-[#e0aaff] font-black text-lg leading-tight pointer-events-none drop-shadow-md pr-6">Para Onde Iremos</h2>
                    <p class="text-gray-300 text-[10px] font-bold mb-3 leading-tight pointer-events-none">Apenas cartas da expansão</p>
                    <button onclick="window.iniciarCompra('expansao', 150)" class="bg-[#c77dff] hover:bg-[#9d4edd] text-white font-black py-2.5 px-4 rounded-xl shadow-[0_4px_10px_rgba(199,125,255,0.4)] transform active:scale-95 flex items-center justify-center gap-1 z-50 relative cursor-pointer border border-[#e0aaff]">
                        150 <img src="moedas.png" class="w-4 h-4 pointer-events-none">
                    </button>
                </div>
            </div>

        </main>
        
    </div>

    <div id="modal-info" class="hidden fixed inset-0 bg-black/80 z-[110] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-[#dca3e8] border-4 border-[#7a32a8] rounded-2xl p-6 max-w-sm w-full shadow-2xl relative">
            <button onclick="document.getElementById('modal-info').classList.add('hidden')" class="absolute top-2 right-4 text-[#7a32a8] font-black text-2xl hover:text-red-600 transition-colors cursor-pointer">&times;</button>
            <h2 class="text-[#7a32a8] font-black text-xl mb-3 uppercase border-b-2 border-[#bc7bd4] pb-2" id="info-titulo">Título</h2>
            <p class="text-[#4a1c6a] font-bold text-sm leading-relaxed" id="info-texto">Texto da informação.</p>
        </div>
    </div>

    <div id="modal-confirmacao" class="hidden fixed inset-0 bg-black/80 z-[100] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-[#dca3e8] border-4 border-[#7a32a8] rounded-2xl p-6 max-w-xs w-full text-center shadow-2xl">
            <h2 class="text-[#7a32a8] font-black text-xl mb-4" id="texto-confirmacao">Confirmar compra?</h2>
            <div class="flex justify-center gap-4 mt-6">
                <button id="btn-confirmar-nao" onclick="window.cancelarCompra()" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-6 rounded-full shadow-md">NÃO</button>
                <button id="btn-confirmar-sim" onclick="window.confirmarCompra()" class="bg-[#22c55e] hover:bg-[#16a34a] text-white font-black py-2 px-6 rounded-full shadow-md">SIM</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCU3lFTgfrDMaD9jwR7X7ivYPmGQh4VE1g",
          authDomain: "supercards-tcg.firebaseapp.com",
          projectId: "supercards-tcg",
          storageBucket: "supercards-tcg.firebasestorage.app",
          messagingSenderId: "862316380615",
          appId: "1:862316380615:web:b3f28056ebc967673999e2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.saldoMoedas = 0;
        window.pacotePendente = null;
        window.precoPendente = 0;

        const msgAlerta = document.getElementById('mensagem-alerta');
        
        window.mostrarMensagem = function(texto, tipo) {
            msgAlerta.textContent = texto;
            msgAlerta.classList.remove('hidden', 'bg-red-500', 'bg-green-500', 'bg-yellow-500', 'text-white', 'text-black');
            if (tipo === 'erro') msgAlerta.classList.add('bg-red-500', 'text-white');
            if (tipo === 'sucesso') msgAlerta.classList.add('bg-green-500', 'text-white');
            if (tipo === 'aviso') msgAlerta.classList.add('bg-yellow-500', 'text-black');
            setTimeout(() => msgAlerta.classList.add('hidden'), 4000); 
        };

        window.mostrarToast = function(mensagem) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast-msg';
            toast.innerHTML = mensagem;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s ease';
                setTimeout(() => toast.remove(), 500); 
            }, 3000);
        };

        window.obterGameDay = function() {
            let agora = new Date();
            if (agora.getHours() < 6) agora.setDate(agora.getDate() - 1);
            return `${agora.getFullYear()}-${agora.getMonth() + 1}-${agora.getDate()}`;
        };

        window.abrirInfo = function(event, tipo) {
            event.stopPropagation(); 
            let titulo = "";
            let texto = "";

            if (tipo === 'gratis') {
                titulo = "Bônus Diário";
                texto = "Sorteia 5 cartas de <b>todas</b> as coleções lançadas no jogo até hoje (Mistura Starter Pack e Para Onde Iremos.).";
            } else if (tipo === 'basico') {
                titulo = "Pacote Básico";
                texto = "Sorteia 5 cartas pertencentes exclusivamente à coleção base <b>Starter Pack 2026</b> (Cartas 001 a 052).";
            } else if (tipo === 'premium') {
                titulo = "Pacote Premium";
                texto = "Sorteia 5 cartas da coleção <b>Starter Pack 2026</b>. Garantindo ao menos uma carta rara ou superior";
            } else if (tipo === 'expansao') {
                titulo = "Para Onde Iremos";
                texto = "Sorteia 5 cartas pertencentes exclusivamente à nova expansão <b>Para Onde Iremos</b> (Cartas 053 a 093), com maiores chances de obter raridades superiores.";
            }

            document.getElementById('info-titulo').innerText = titulo;
            document.getElementById('info-texto').innerHTML = texto;
            document.getElementById('modal-info').classList.remove('hidden');
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const ref = doc(db, "users", user.uid);
                const snap = await getDoc(ref);
                if (snap.exists()) {
                    window.saldoMoedas = snap.data().moedas || 0;
                    document.getElementById('player-coins').innerText = window.saldoMoedas;
                    const hoje = window.obterGameDay();
                    if (snap.data().ultimoResgateDiario === hoje) {
                        const statusDiv = document.getElementById('status-bonus');
                        statusDiv.innerText = "JÁ PEGOU HOJE";
                        statusDiv.classList.replace('bg-[#22c55e]', 'bg-gray-500');
                    }
                }
            } else {
                window.location.href = "index.html";
            }
        });

        window.resgatarBonus = async function() {
            const statusDiv = document.getElementById('status-bonus');
            if (statusDiv.innerText === "JÁ PEGOU HOJE" || statusDiv.innerText === "PROCESSANDO...") {
                window.mostrarMensagem("Você já pegou hoje ou a transação está em andamento!", "aviso");
                return;
            }
            if (!auth.currentUser) return;
            
            statusDiv.innerText = "PROCESSANDO...";
            statusDiv.classList.replace('bg-[#22c55e]', 'bg-yellow-500');
            
            try {
                const uid = auth.currentUser.uid;
                const ref = doc(db, "users", uid);
                const snap = await getDoc(ref);
                let dados = snap.exists() ? snap.data() : {};
                const hoje = window.obterGameDay();
                
                if (dados.ultimoResgateDiario === hoje) {
                    window.mostrarMensagem("Você já pegou o bônus hoje!", "aviso");
                    statusDiv.innerText = "JÁ PEGOU HOJE";
                    statusDiv.classList.replace('bg-yellow-500', 'bg-gray-500');
                    return;
                }
                
                await updateDoc(ref, {
                    "inventario.pacoteGratis": increment(1),
                    ultimoResgateDiario: hoje
                });
                
                window.mostrarMensagem("🎁 PACOTE RESGATADO COM SUCESSO!", "sucesso");
                statusDiv.innerText = "JÁ PEGOU HOJE";
                statusDiv.classList.replace('bg-yellow-500', 'bg-gray-500');
                
            } catch (error) {
                console.error(error);
                window.mostrarMensagem("Falha na conexão.", "erro");
                statusDiv.innerText = "PEGAR PACOTE";
                statusDiv.classList.replace('bg-yellow-500', 'bg-[#22c55e]');
            }
        };

        window.iniciarCompra = function(tipo, preco) {
            if (window.saldoMoedas < preco) {
                window.mostrarMensagem("Você não tem moedas suficientes!", "erro");
                return;
            }
            window.pacotePendente = tipo;
            window.precoPendente = preco;
            document.getElementById('texto-confirmacao').innerText = `Comprar por ${preco} moedas?`;
            document.getElementById('modal-confirmacao').classList.remove('hidden');
        };

        window.cancelarCompra = function() {
            document.getElementById('modal-confirmacao').classList.add('hidden');
            window.pacotePendente = null;
        };

        window.confirmarCompra = async function() {
            const btnSim = document.getElementById('btn-confirmar-sim');
            const btnNao = document.getElementById('btn-confirmar-nao');
            
            // TRAVA DE SEGURANÇA 1: Desativa o botão no milissegundo do clique
            btnSim.disabled = true;
            btnNao.disabled = true;
            btnSim.innerText = "⏳...";

            if (!window.pacotePendente || !auth.currentUser) {
                document.getElementById('modal-confirmacao').classList.add('hidden');
                btnSim.disabled = false; btnNao.disabled = false; btnSim.innerText = "SIM";
                return;
            }
            
            try {
                const ref = doc(db, "users", auth.currentUser.uid);
                
                // Mapeia qual pacote foi selecionado
                let pacoteCampo = '';
                if (window.pacotePendente === 'basico') pacoteCampo = 'pacoteBasico';
                else if (window.pacotePendente === 'premium') pacoteCampo = 'pacotePremium';
                else if (window.pacotePendente === 'expansao') pacoteCampo = 'pacoteExpansao';
                
                const precoGasto = window.precoPendente;
                
                const snap = await getDoc(ref);
                const dados = snap.exists() ? snap.data() : {};

                // TRAVA DE SEGURANÇA 2: Checa no servidor se o jogador realmente tem saldo na hora da cobrança
                if ((dados.moedas || 0) < precoGasto) {
                    window.mostrarMensagem("Erro: Saldo insuficiente no servidor!", "erro");
                    document.getElementById('modal-confirmacao').classList.add('hidden');
                    return;
                }
                
                let moedasGastas = (dados.estatisticas?.moedasGastas || 0) + precoGasto;
                let badgesJogador = dados.badges || {};
                
                let ganhouBadge = false;
                let bonusXp = 0;
                let bonusMoedas = 0;
                let notificacoesNovas = []; 

                if (moedasGastas >= 3000 && !badgesJogador["badge-007"]) {
                    badgesJogador["badge-007"] = true;
                    ganhouBadge = true;
                    bonusXp += 50;
                    bonusMoedas += 50;
                    
                    notificacoesNovas.push({
                        id: "notif_" + Date.now() + "_badge007",
                        titulo: "🏆 Conquista: Consumidor compulsivo",
                        texto: "Você gastou 3000 moedas na loja!\nRecompensas: 50 XP e 50 Moedas.",
                        lida: false,
                        data: new Date().toISOString()
                    });
                }

                let pacoteMissoes = dados.missoesDiarias || {};
                const hoje = window.obterGameDay();
                let atualizouMissao = false;
                let msgMissaoProgresso = "";

                if (pacoteMissoes.dataReset === hoje && pacoteMissoes.lista) {
                    pacoteMissoes.lista.forEach(m => {
                        if (m.id === "comprar" && m.progresso < m.meta) {
                            m.progresso++;
                            atualizouMissao = true;
                            msgMissaoProgresso = `🎯 Progresso: ${m.desc}`;
                        }
                    });
                }
                
                let nivelAtual = dados.nivel || 1;
                let xpAtual = dados.xp || 0;
                let novoXp = xpAtual + bonusXp;
                let subiuNivel = false;
                let pacotesBasicosGanhos = 0;
                let pacotesPremiumGanhos = 0;
                let msgLevelUpPopup = "";
                let textoRecompensaNotificacao = "";
                
                function calcularXPMaximo(nivel) {
                    if (nivel >= 1 && nivel <= 5) return 200;
                    if (nivel >= 6 && nivel <= 15) return 750;
                    if (nivel >= 16 && nivel <= 25) return 1600;
                    return 3000;
                }
                
                let xpMaximo = calcularXPMaximo(nivelAtual);
                
                while (novoXp >= xpMaximo && nivelAtual < 30) {
                    novoXp -= xpMaximo;
                    nivelAtual++;
                    subiuNivel = true;
                    bonusMoedas += 30; 
                    pacotesBasicosGanhos++;
                    
                    if (nivelAtual === 10 || nivelAtual === 20 || nivelAtual === 30) {
                        pacotesPremiumGanhos++;
                        msgLevelUpPopup = `🎉 LEVEL UP! Nível ${nivelAtual} alcançado!<br><span class="text-xs">Recompensas: 1 Pacote Básico, 1 Pacote Premium e 30 <img src="moedas.png" class="inline w-4 h-4 ml-0.5 align-text-bottom"></span>`;
                        textoRecompensaNotificacao = "1 Pacote Básico, 1 Pacote Premium e 30 Moedas";
                    } else {
                        msgLevelUpPopup = `🎉 LEVEL UP! Nível ${nivelAtual} alcançado!<br><span class="text-xs">Recompensas: 1 Pacote Básico e 30 <img src="moedas.png" class="inline w-4 h-4 ml-0.5 align-text-bottom"></span>`;
                        textoRecompensaNotificacao = "1 Pacote Básico e 30 Moedas";
                    }
                    
                    notificacoesNovas.push({
                        id: "notif_" + Date.now() + "_nivel" + nivelAtual,
                        titulo: `🎉 Level Up: Nível ${nivelAtual}`,
                        texto: `Parabéns! Você alcançou o Nível ${nivelAtual}.\nRecompensas recebidas: ${textoRecompensaNotificacao}.`,
                        lida: false,
                        data: new Date().toISOString()
                    });

                    xpMaximo = calcularXPMaximo(nivelAtual);
                }
                
                let deltaBasico = (pacoteCampo === 'pacoteBasico') ? 1 : 0;
                let deltaPremium = (pacoteCampo === 'pacotePremium') ? 1 : 0;
                let deltaExpansao = (pacoteCampo === 'pacoteExpansao') ? 1 : 0;
                
                deltaBasico += pacotesBasicosGanhos;
                deltaPremium += pacotesPremiumGanhos;
                
                let pacoteAtualizacao = {
                    moedas: increment(-precoGasto + bonusMoedas),
                    "estatisticas.moedasGastas": increment(precoGasto),
                    badges: badgesJogador,
                    xp: novoXp,
                    nivel: nivelAtual
                };

                // Adiciona os pacotes corretos
                if (deltaBasico > 0) pacoteAtualizacao["inventario.pacoteBasico"] = increment(deltaBasico);
                if (deltaPremium > 0) pacoteAtualizacao["inventario.pacotePremium"] = increment(deltaPremium);
                if (deltaExpansao > 0) pacoteAtualizacao["inventario.pacoteExpansao"] = increment(deltaExpansao);

                if (atualizouMissao) {
                    pacoteAtualizacao.missoesDiarias = pacoteMissoes;
                }

                if (notificacoesNovas.length > 0) {
                    pacoteAtualizacao.notificacoes = arrayUnion(...notificacoesNovas);
                }
                
                await updateDoc(ref, pacoteAtualizacao);
                
                // Atualiza o saldo perfeitamente no front-end
                window.saldoMoedas = (dados.moedas || 0) - precoGasto + bonusMoedas;
                document.getElementById('player-coins').innerText = window.saldoMoedas;
                window.mostrarMensagem("Compra realizada com sucesso!", "sucesso");
                
                let tempoAtraso = 500;
                if (atualizouMissao) {
                    setTimeout(() => window.mostrarToast(msgMissaoProgresso), tempoAtraso);
                    tempoAtraso += 500;
                }
                if (ganhouBadge) {
                    setTimeout(() => window.mostrarToast(`🏆 NOVA CONQUISTA!<br><span class="text-xs font-normal">Badge: Consumidor compulsivo.</span><br><span class="text-sm">Recompensa: +50 XP e +50 <img src="moedas.png" class="inline w-4 h-4 align-text-bottom"></span>`), tempoAtraso);
                    tempoAtraso += 500;
                }
                if (subiuNivel) {
                    setTimeout(() => window.mostrarToast(msgLevelUpPopup), tempoAtraso);
                }
                
            } catch (e) {
                console.error(e);
                window.mostrarMensagem("Erro ao processar compra.", "erro");
            } finally {
                // Libera tudo no final da operação (dando certo ou errado)
                document.getElementById('modal-confirmacao').classList.add('hidden');
                btnSim.disabled = false;
                btnNao.disabled = false;
                btnSim.innerText = "SIM";
                window.pacotePendente = null;
            }
        };
    </script>
    <script>
        let tempoInativo = 0;
        
        // Se o jogador mexer o rato, tocar no ecrã ou carregar numa tecla, o tempo zera
        const resetarTempo = () => tempoInativo = 0;
        window.addEventListener('mousemove', resetarTempo);
        window.addEventListener('touchstart', resetarTempo);
        window.addEventListener('keydown', resetarTempo);

        // A cada 1 minuto (60000 milissegundos), o contador soma
        setInterval(() => {
            tempoInativo += 60000;
            // Se atingir 30 minutos (1.800.000 ms), redireciona para o menu
            if (tempoInativo >= 1800000) {
                window.location.href = 'menu.html';
            }
        }, 60000);
    </script>
</body>
</html>
