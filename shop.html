<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supercards - Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-image: url('fundotela.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-[100dvh] p-4 flex justify-center overflow-hidden">

    <div class="w-full max-w-sm flex flex-col h-full relative">
        
        <header class="flex justify-between items-center mb-6 mt-2">
            <button onclick="window.location.href='menu.html'" class="bg-[#dca3e8] hover:bg-[#bc7bd4] transition-colors rounded-full flex items-center justify-center w-10 h-10 shadow-md text-[#7a32a8] font-black text-xl z-50">
                ←
            </button>
            <h1 onclick="window.ativarCheat()" class="text-white font-black text-2xl drop-shadow-md cursor-pointer relative z-50">LOJA</h1>
            <div class="bg-[#dca3e8] rounded-full px-3 py-1.5 flex items-center justify-center gap-1 shadow-md">
                <span id="player-coins" class="text-black font-black text-sm">0</span>
                <img src="moedas.png" alt="Moedas" class="w-5 h-5 object-contain drop-shadow-sm pointer-events-none">
            </div>
        </header>

        <div id="mensagem-alerta" class="hidden w-full p-3 mb-4 text-center text-sm font-bold rounded-lg shadow-lg z-[100] relative"></div>

        <main class="flex flex-col flex-grow gap-4 overflow-y-auto pb-4 no-scrollbar">
            
            <div class="bg-gradient-to-br from-[#bc7bd4] to-[#7a32a8] rounded-3xl p-4 shadow-xl border-2 border-[#dca3e8] flex flex-col items-center relative overflow-hidden">
                <h2 class="text-white font-black text-xl mb-1 drop-shadow-md pointer-events-none">Bônus Diário</h2>
                <p class="text-[#7a32a8] bg-[#dca3e8] px-3 py-0.5 rounded-full text-xs font-black mb-3 shadow-sm pointer-events-none">1 Pacote Básico Grátis</p>
                <img src="pacote1.png" alt="Pacote Diário" class="w-24 h-32 object-contain drop-shadow-2xl pointer-events-none">
                
                <button id="btn-bonus-diario" onclick="window.resgatarBonus()" class="mt-4 bg-[#22c55e] hover:bg-[#16a34a] text-white font-black py-4 px-10 rounded-full shadow-2xl transform active:scale-95 z-50 relative pointer-events-auto cursor-pointer">
                    PEGAR PACOTE
                </button>
            </div>

            <div class="bg-[#dca3e8]/90 backdrop-blur-sm rounded-3xl p-4 shadow-lg flex items-center gap-4 border border-[#dca3e8]/50">
                <img src="pacote1.png" class="w-20 h-28 object-contain drop-shadow-lg pointer-events-none">
                <div class="flex flex-col flex-grow">
                    <h2 class="text-[#7a32a8] font-black text-lg leading-tight pointer-events-none">Pacote Básico</h2>
                    <p class="text-gray-700 text-xs font-bold mb-2 pointer-events-none">5 Cartas Aleatórias</p>
                    <button onclick="window.iniciarCompra('basico', 100)" class="bg-gray-700 hover:bg-gray-600 text-white font-black py-2 px-4 rounded-xl shadow-md transform active:scale-95 flex items-center justify-center gap-1 z-50 relative cursor-pointer">
                        100 <img src="moedas.png" class="w-4 h-4 pointer-events-none">
                    </button>
                </div>
            </div>

            <div class="bg-gradient-to-r from-[#ffd700]/80 to-[#ffaa00]/80 backdrop-blur-sm rounded-3xl p-4 shadow-lg flex items-center gap-4 border border-[#ffd700]">
                <img src="pacote2.png" class="w-20 h-28 object-contain drop-shadow-lg pointer-events-none">
                <div class="flex flex-col flex-grow">
                    <h2 class="text-[#996600] font-black text-lg leading-tight pointer-events-none">Pacote Premium</h2>
                    <p class="text-[#805500] text-[10px] font-bold mb-2 leading-tight pointer-events-none">Garante 1 Rara ou superior</p>
                    <button onclick="window.iniciarCompra('premium', 300)" class="bg-[#996600] hover:bg-[#805500] text-white font-black py-2 px-4 rounded-xl shadow-md transform active:scale-95 flex items-center justify-center gap-1 z-50 relative cursor-pointer">
                        300 <img src="moedas.png" class="w-4 h-4 pointer-events-none">
                    </button>
                </div>
            </div>
        </main>
    </div>

    <div id="modal-confirmacao" class="hidden fixed inset-0 bg-black/80 z-[100] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-[#dca3e8] border-4 border-[#7a32a8] rounded-2xl p-6 max-w-xs w-full text-center shadow-2xl">
            <h2 class="text-[#7a32a8] font-black text-xl mb-4" id="texto-confirmacao">Confirmar compra?</h2>
            <div class="flex justify-center gap-4 mt-6">
                <button onclick="window.cancelarCompra()" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-6 rounded-full shadow-md">NÃO</button>
                <button onclick="window.confirmarCompra()" class="bg-[#22c55e] hover:bg-[#16a34a] text-white font-black py-2 px-6 rounded-full shadow-md">SIM</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCU3lFTgfrDMaD9jwR7X7ivYPmGQh4VE1g",
          authDomain: "supercards-tcg.firebaseapp.com",
          projectId: "supercards-tcg",
          storageBucket: "supercards-tcg.firebasestorage.app",
          messagingSenderId: "862316380615",
          appId: "1:862316380615:web:b3f28056ebc967673999e2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Transformamos as variáveis em Globais para o HTML conseguir ler
        window.saldoMoedas = 0;
        window.pacotePendente = null;
        window.precoPendente = 0;

        const msgAlerta = document.getElementById('mensagem-alerta');
        
        window.mostrarMensagem = function(texto, tipo) {
            msgAlerta.textContent = texto;
            msgAlerta.classList.remove('hidden', 'bg-red-500', 'bg-green-500', 'bg-yellow-500', 'text-white', 'text-black');
            
            if (tipo === 'erro') msgAlerta.classList.add('bg-red-500', 'text-white');
            if (tipo === 'sucesso') msgAlerta.classList.add('bg-green-500', 'text-white');
            if (tipo === 'aviso') msgAlerta.classList.add('bg-yellow-500', 'text-black');
            
            setTimeout(() => msgAlerta.classList.add('hidden'), 4000); 
        };

        window.obterGameDay = function() {
            let agora = new Date();
            if (agora.getHours() < 6) agora.setDate(agora.getDate() - 1);
            return `${agora.getFullYear()}-${agora.getMonth() + 1}-${agora.getDate()}`;
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const ref = doc(db, "users", user.uid);
                const snap = await getDoc(ref);
                if (snap.exists()) {
                    window.saldoMoedas = snap.data().moedas || 0;
                    document.getElementById('player-coins').innerText = window.saldoMoedas;
                    
                    // Verifica o bônus no carregamento
                    const hoje = window.obterGameDay();
                    if (snap.data().ultimoResgateDiario === hoje) {
                        document.getElementById('btn-bonus-diario').innerText = "JÁ PEGOU HOJE";
                    }
                }
            } else {
                window.location.href = "index.html";
            }
        });

        // ----------------------------------------------------
        // LÓGICA DO BÔNUS DIÁRIO (Conexão Direta e Bruta)
        // ----------------------------------------------------
        window.resgatarBonus = async function() {
            const btn = document.getElementById('btn-bonus-diario');
            
            // Verificação Rápida
            if (btn.innerText === "JÁ PEGOU HOJE" || btn.innerText === "PROCESSANDO...") {
                window.mostrarMensagem("Você já pegou hoje ou a transação está em andamento!", "aviso");
                return;
            }

            if (!auth.currentUser) {
                window.mostrarMensagem("Aguarde a conexão...", "erro");
                return;
            }
            
            // FEEDBACK VISUAL INSTANTÂNEO PARA PROVAR QUE CLICOU
            btn.innerText = "PROCESSANDO...";
            
            try {
                const uid = auth.currentUser.uid;
                const ref = doc(db, "users", uid);
                
                // Vai no banco na mesma hora
                const snap = await getDoc(ref);
                let dados = snap.exists() ? snap.data() : {};
                const hoje = window.obterGameDay();
                
                if (dados.ultimoResgateDiario === hoje) {
                    window.mostrarMensagem("Você já pegou o bônus hoje!", "aviso");
                    btn.innerText = "JÁ PEGOU HOJE";
                    return;
                }
                
                // Força a inserção no banco
                await setDoc(ref, {
                    inventario: { pacoteBasico: increment(1) },
                    ultimoResgateDiario: hoje
                }, { merge: true });
                
                window.mostrarMensagem("🎁 PACOTE RESGATADO COM SUCESSO!", "sucesso");
                btn.innerText = "JÁ PEGOU HOJE";
                
            } catch (error) {
                console.error(error);
                window.mostrarMensagem("Falha na conexão.", "erro");
                btn.innerText = "TENTAR DE NOVO";
            }
        };

        // ----------------------------------------------------
        // LÓGICA DE COMPRA DOS PACOTES
        // ----------------------------------------------------
        window.iniciarCompra = function(tipo, preco) {
            if (window.saldoMoedas < preco) {
                window.mostrarMensagem("Você não tem moedas suficientes!", "erro");
                return;
            }
            window.pacotePendente = tipo;
            window.precoPendente = preco;
            document.getElementById('texto-confirmacao').innerText = `Comprar por ${preco} moedas?`;
            document.getElementById('modal-confirmacao').classList.remove('hidden');
        };

        window.cancelarCompra = function() {
            document.getElementById('modal-confirmacao').classList.add('hidden');
            window.pacotePendente = null;
        };

        window.confirmarCompra = async function() {
            document.getElementById('modal-confirmacao').classList.add('hidden');
            if (!window.pacotePendente || !auth.currentUser) return;
            
            try {
                const ref = doc(db, "users", auth.currentUser.uid);
                const pacoteCampo = window.pacotePendente === 'basico' ? 'pacoteBasico' : 'pacotePremium';
                
                await setDoc(ref, {
                    moedas: increment(-window.precoPendente),
                    inventario: { [pacoteCampo]: increment(1) }
                }, { merge: true });
                
                window.saldoMoedas -= window.precoPendente;
                document.getElementById('player-coins').innerText = window.saldoMoedas;
                window.mostrarMensagem("Compra realizada com sucesso!", "sucesso");
                
            } catch (e) {
                console.error(e);
                window.mostrarMensagem("Erro ao processar compra.", "erro");
            }
            window.pacotePendente = null;
        };

        // ----------------------------------------------------
        // CHEAT DE DESENVOLVEDOR (Clicar na palavra "LOJA")
        // ----------------------------------------------------
        window.ativarCheat = async function() {
            if (!auth.currentUser) return;
            try {
                const ref = doc(db, "users", auth.currentUser.uid);
                await setDoc(ref, { 
                    moedas: increment(1000),
                    ultimoResgateDiario: "" // Limpa a data de hoje!
                }, { merge: true });
                
                window.saldoMoedas += 1000;
                document.getElementById('player-coins').innerText = window.saldoMoedas;
                
                // Destrava o botão na força bruta para você testar
                document.getElementById('btn-bonus-diario').innerText = "PEGAR PACOTE";
                
                window.mostrarMensagem("DEV: +1000 Moedas e Relógio Resetado!", "sucesso");
            } catch (e) {
                console.error(e);
                window.mostrarMensagem("Erro no cheat.", "erro");
            }
        };
    </script>
</body>
</html>
