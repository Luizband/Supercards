<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supercards - Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-image: url('fundotela.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-[100dvh] p-4 flex justify-center overflow-hidden">

    <div class="w-full max-w-sm flex flex-col h-full relative">
        
        <header class="flex justify-between items-center mb-6 mt-2">
            <button onclick="window.location.href='menu.html'" class="bg-[#dca3e8] hover:bg-[#bc7bd4] transition-colors rounded-full flex items-center justify-center w-10 h-10 shadow-md text-[#7a32a8] font-black text-xl">
                ←
            </button>
            <h1 id="dev-moedas" class="text-white font-black text-2xl drop-shadow-md cursor-pointer">LOJA</h1>
            <div class="bg-[#dca3e8] rounded-full px-3 py-1.5 flex items-center justify-center gap-1 shadow-md">
                <span id="player-coins" class="text-black font-black text-sm">0</span>
                <img src="moedas.png" alt="Moedas" class="w-5 h-5 object-contain drop-shadow-sm">
            </div>
        </header>

        <div id="mensagem-alerta" class="hidden w-full p-3 mb-4 text-center text-sm font-bold rounded-lg shadow-lg z-50"></div>

        <main class="flex flex-col flex-grow gap-4 overflow-y-auto pb-4 no-scrollbar">
            
            <!-- BÔNUS DIÁRIO -->
            <div class="bg-gradient-to-br from-[#bc7bd4] to-[#7a32a8] rounded-3xl p-4 shadow-xl border-2 border-[#dca3e8] flex flex-col items-center relative overflow-hidden">
                <h2 class="text-white font-black text-xl mb-1 drop-shadow-md z-10">Bônus Diário</h2>
                <p class="text-[#7a32a8] bg-[#dca3e8] px-3 py-0.5 rounded-full text-xs font-black mb-3 z-10 shadow-sm">1 Pacote Básico Grátis</p>
                <img src="pacote1.png" alt="Pacote Diário" class="w-24 h-32 object-contain drop-shadow-2xl z-10">
                <!-- Botão Simplificado: Sempre verde e clicável -->
                <button id="btn-novo-bonus" class="mt-4 bg-[#22c55e] hover:bg-[#16a34a] text-white font-black py-3 px-10 rounded-full shadow-lg transition-transform hover:-translate-y-1 z-10">
                    PEGAR PACOTE
                </button>
            </div>

            <!-- PACOTE BÁSICO -->
            <div class="bg-[#dca3e8]/90 backdrop-blur-sm rounded-3xl p-4 shadow-lg flex items-center gap-4 border border-[#dca3e8]/50">
                <img src="pacote1.png" alt="Pacote Básico" class="w-20 h-28 object-contain drop-shadow-lg">
                <div class="flex flex-col flex-grow">
                    <h2 class="text-[#7a32a8] font-black text-lg leading-tight">Pacote Básico</h2>
                    <p class="text-gray-700 text-xs font-bold mb-2">5 Cartas Aleatórias</p>
                    <button id="btn-comprar-basico" class="bg-gray-700 hover:bg-gray-600 text-white font-black py-2 px-4 rounded-xl shadow-md transition-transform hover:-translate-y-1 flex items-center justify-center gap-1">
                        100 <img src="moedas.png" class="w-4 h-4">
                    </button>
                </div>
            </div>

            <!-- PACOTE PREMIUM -->
            <div class="bg-gradient-to-r from-[#ffd700]/80 to-[#ffaa00]/80 backdrop-blur-sm rounded-3xl p-4 shadow-lg flex items-center gap-4 border border-[#ffd700]">
                <img src="pacote2.png" alt="Pacote Premium" class="w-20 h-28 object-contain drop-shadow-lg">
                <div class="flex flex-col flex-grow">
                    <h2 class="text-[#996600] font-black text-lg leading-tight">Pacote Premium</h2>
                    <p class="text-[#805500] text-[10px] font-bold mb-2 leading-tight">Garante 1 Rara ou superior</p>
                    <button id="btn-comprar-premium" class="bg-[#996600] hover:bg-[#805500] text-white font-black py-2 px-4 rounded-xl shadow-md transition-transform hover:-translate-y-1 flex items-center justify-center gap-1">
                        300 <img src="moedas.png" class="w-4 h-4">
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL DE COMPRA -->
    <div id="modal-confirmacao" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-[#dca3e8] border-4 border-[#7a32a8] rounded-2xl p-6 max-w-xs w-full text-center shadow-2xl">
            <h2 class="text-[#7a32a8] font-black text-xl mb-4" id="texto-confirmacao">Confirmar compra?</h2>
            <div class="flex justify-center gap-4 mt-6">
                <button id="btn-cancelar-compra" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-6 rounded-full shadow-md transition-transform hover:scale-105">NÃO</button>
                <button id="btn-confirmar-compra" class="bg-[#22c55e] hover:bg-[#16a34a] text-white font-black py-2 px-6 rounded-full shadow-md transition-transform hover:scale-105">SIM</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCU3lFTgfrDMaD9jwR7X7ivYPmGQh4VE1g",
          authDomain: "supercards-tcg.firebaseapp.com",
          projectId: "supercards-tcg",
          storageBucket: "supercards-tcg.firebasestorage.app",
          messagingSenderId: "862316380615",
          appId: "1:862316380615:web:b3f28056ebc967673999e2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let saldoMoedas = 0;
        let dbUserRef = null;

        const msgAlerta = document.getElementById('mensagem-alerta');
        
        function mostrarMensagem(texto, tipo) {
            msgAlerta.textContent = texto;
            msgAlerta.classList.remove('hidden', 'bg-red-500', 'bg-green-500', 'bg-yellow-500', 'text-white', 'text-black');
            
            if (tipo === 'erro') msgAlerta.classList.add('bg-red-500', 'text-white');
            if (tipo === 'sucesso') msgAlerta.classList.add('bg-green-500', 'text-white');
            if (tipo === 'aviso') msgAlerta.classList.add('bg-yellow-500', 'text-black');
            
            setTimeout(() => msgAlerta.classList.add('hidden'), 4000); 
        }

        function obterGameDay() {
            let agora = new Date();
            // Reseta às 06:00 da manhã
            if (agora.getHours() < 6) agora.setDate(agora.getDate() - 1);
            return `${agora.getFullYear()}-${agora.getMonth() + 1}-${agora.getDate()}`;
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                dbUserRef = doc(db, "users", user.uid);
                const docSnap = await getDoc(dbUserRef);
                
                if (docSnap.exists()) {
                    saldoMoedas = docSnap.data().moedas || 0;
                    document.getElementById('player-coins').innerText = saldoMoedas;
                }
            } else {
                window.location.href = "index.html";
            }
        });

        // ----------------------------------------------------
        // NOVA LÓGICA DO BÔNUS DIÁRIO (Simples e Direta)
        // ----------------------------------------------------
        const btnNovoBonus = document.getElementById('btn-novo-bonus');

        btnNovoBonus.addEventListener('click', async () => {
            if (!dbUserRef) {
                mostrarMensagem("Aguarde a conexão com o servidor...", "erro");
                return;
            }

            // Efeito visual imediato de carregamento
            btnNovoBonus.innerText = "PROCESSANDO...";
            btnNovoBonus.disabled = true;

            try {
                // Lê o banco na hora do clique
                const docSnap = await getDoc(dbUserRef);
                let ultimoResgate = "";
                
                if (docSnap.exists()) {
                    ultimoResgate = docSnap.data().ultimoResgateDiario || "";
                }

                const dataDeHoje = obterGameDay();

                // Verifica a trava
                if (ultimoResgate === dataDeHoje) {
                    mostrarMensagem("Você já pegou seu pacote hoje! Volte amanhã.", "aviso");
                } else {
                    // Entrega o pacote
                    await setDoc(dbUserRef, {
                        inventario: { pacoteBasico: increment(1) },
                        ultimoResgateDiario: dataDeHoje
                    }, { merge: true });
                    
                    mostrarMensagem("🎁 PACOTE RESGATADO COM SUCESSO!", "sucesso");
                }
            } catch (error) {
                mostrarMensagem("Falha na conexão.", "erro");
                console.error(error);
            }

            // Devolve o botão ao normal após 1 segundo
            setTimeout(() => {
                btnNovoBonus.innerText = "PEGAR PACOTE";
                btnNovoBonus.disabled = false;
            }, 1000);
        });

        // LÓGICA DO MODAL DE COMPRA (Inalterada)
        let pacotePendente = null;
        let precoPendente = 0;
        const modalConfirmacao = document.getElementById('modal-confirmacao');

        async function comprarPacote(tipo, preco) {
            if (saldoMoedas < preco) {
                mostrarMensagem(`Você não tem moedas suficientes!`, "erro");
                return;
            }
            pacotePendente = tipo;
            precoPendente = preco;
            document.getElementById('texto-confirmacao').innerText = `Comprar por ${preco} moedas?`;
            modalConfirmacao.classList.remove('hidden');
        }

        document.getElementById('btn-cancelar-compra').addEventListener('click', () => {
            modalConfirmacao.classList.add('hidden');
            pacotePendente = null;
        });

        document.getElementById('btn-confirmar-compra').addEventListener('click', async () => {
            modalConfirmacao.classList.add('hidden');
            if (!pacotePendente || !dbUserRef) return;
            
            try {
                const pacoteCampo = pacotePendente === 'basico' ? 'pacoteBasico' : 'pacotePremium';
                await setDoc(dbUserRef, {
                    moedas: increment(-precoPendente),
                    inventario: { [pacoteCampo]: increment(1) }
                }, { merge: true });
                
                saldoMoedas -= precoPendente;
                document.getElementById('player-coins').innerText = saldoMoedas;
                mostrarMensagem("Compra realizada com sucesso!", "sucesso");
            } catch (e) {
                mostrarMensagem("Erro ao processar compra.", "erro");
            }
            pacotePendente = null;
        });
        
        document.getElementById('btn-comprar-basico').addEventListener('click', () => comprarPacote('basico', 100));
        document.getElementById('btn-comprar-premium').addEventListener('click', () => comprarPacote('premium', 300));

        // CHEAT DE DESENVOLVEDOR 
        document.getElementById('dev-moedas').addEventListener('click', async () => {
            if (!dbUserRef) return;
            try {
                await setDoc(dbUserRef, { 
                    moedas: increment(1000),
                    ultimoResgateDiario: "" 
                }, { merge: true });
                
                saldoMoedas += 1000;
                document.getElementById('player-coins').innerText = saldoMoedas;
                
                mostrarMensagem("DEV: +1000 Moedas e Relógio Resetado!", "sucesso");
            } catch (e) {
                mostrarMensagem("Erro no cheat.", "erro");
            }
        });
    </script>
</body>
</html>
