<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supercards - Trocas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-image: url('fundotela.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        #toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            width: 90%;
            max-width: 350px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast-msg {
            background: #dca3e8;
            color: #7a32a8;
            border: 3px solid #7a32a8;
            padding: 12px 20px;
            border-radius: 9999px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.3);
            text-align: center;
            font-weight: 900;
            font-size: 0.85rem;
            animation: slideDown 0.3s ease-out;
            pointer-events: auto;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Estilo para amigo selecionado na lista */
        .amigo-selecionado {
            background-color: #bc7bd4 !important;
            color: #000 !important;
            border: 2px solid #7a32a8;
        }
    </style>
</head>
<body class="h-[100dvh] p-4 flex justify-center overflow-hidden">

    <div id="toast-container"></div>

    <div class="w-full max-w-sm flex flex-col h-full relative">
        
        <!-- CABEÇALHO -->
        <header class="flex items-center gap-4 mt-4 mb-2 w-full">
            <div class="relative flex-shrink-0">
                <div class="bg-[#dca3e8] w-24 h-24 rounded-full flex items-center justify-center text-[#7a32a8] font-black text-xl shadow-lg border-2 border-[#bc7bd4] relative overflow-hidden">
                    <span id="texto-sem-foto">FOTO</span>
                    <img id="img-perfil-global" src="" class="hidden w-full h-full object-cover absolute inset-0">
                </div>
                <div class="absolute -bottom-2 left-1/2 transform -translate-x-1/2 bg-[#bc7bd4] w-8 h-8 rounded-full flex items-center justify-center shadow-md border-2 border-[#dca3e8] z-30">
                    <span id="player-level" class="text-[#7a32a8] font-black text-sm">--</span>
                </div>
            </div>

            <div class="flex flex-col flex-grow gap-2 justify-center">
                <div class="flex items-center gap-2 w-full">
                    <div class="bg-[#dca3e8] rounded-full px-3 py-2 flex items-center justify-center shadow-md flex-grow overflow-hidden">
                        <span id="player-name" class="text-[#7a32a8] font-black text-base tracking-wide uppercase truncate max-w-[130px]">JOGADOR</span>
                    </div>
                    <div class="bg-[#dca3e8] rounded-full px-3 py-2 flex items-center justify-center gap-1 shadow-md flex-shrink-0">
                        <span id="player-fragmentos" class="text-[#7a32a8] font-black text-sm">0</span>
                        <img src="fragmento.png" class="w-4 h-4 object-contain">
                    </div>
                </div>
                <div class="flex flex-col items-center mt-1 w-full">
                    <div class="w-full bg-transparent border border-[#dca3e8] rounded-full h-3 overflow-hidden shadow-inner">
                        <div id="barra-xp" class="bg-[#dca3e8] h-full transition-all duration-500" style="width: 0%;"></div>
                    </div>
                    <span id="texto-xp" class="text-[#dca3e8] text-[10px] font-bold mt-1">0/0 xp</span>
                </div>
            </div>
        </header>

        <h1 class="text-[#dca3e8] font-black text-xl text-center mb-2 drop-shadow-md uppercase">TROCAS</h1>

        <main class="flex flex-col gap-3 flex-grow overflow-hidden pb-16">
            
            <!-- LINHA SUPERIOR -->
            <div class="grid grid-cols-2 gap-3 h-[45%]">
                
                <!-- Caixa: Selecionar Amigo -->
                <div class="bg-[#dca3e8] rounded-3xl p-3 flex flex-col shadow-xl border-2 border-[#bc7bd4]">
                    <span class="text-[#7a32a8] font-black text-[10px] text-center mb-3 uppercase leading-tight tracking-wider">sELECIONAR UM<br>AMIGO</span>
                    
                    <!-- ID adicionado aqui para o JS injetar os jogadores -->
                    <div id="lista-amigos" class="flex flex-col gap-2 flex-grow overflow-y-auto no-scrollbar mb-3 px-1">
                        <span class="text-xs text-center text-[#7a32a8] mt-2">Buscando...</span>
                    </div>
                    
                    <!-- ID adicionado ao botão de Enviar -->
                    <button id="btn-enviar-convite" class="bg-[#7a32a8] hover:bg-purple-600 text-white font-black text-[10px] uppercase py-2 w-full rounded-full shadow-md transition-all hover:-translate-y-0.5 mt-auto border border-[#bc7bd4]/30">
                        ENVIAR CONVITE
                    </button>
                </div>
                
                <!-- Caixa: Convites -->
                <div class="bg-[#dca3e8] rounded-3xl p-3 flex flex-col shadow-xl border-2 border-[#bc7bd4]">
                    <span class="text-[#7a32a8] font-black text-[11px] text-center mb-3 leading-tight tracking-wide">Convites</span>
                    
                    <!-- ID adicionado aqui para o JS escutar os convites -->
                    <div id="lista-convites" class="flex flex-col gap-2 flex-grow overflow-y-auto no-scrollbar mb-3 px-1">
                        <span class="text-[10px] text-center text-[#7a32a8] mt-2 font-bold">Nenhum convite pendente.</span>
                    </div>
                    
                    <!-- ID adicionado ao botão de Aceitar -->
                    <button id="btn-aceitar-convite" class="bg-[#7a32a8] hover:bg-purple-600 text-white font-black text-[10px] uppercase py-2 w-full rounded-full shadow-md transition-all hover:-translate-y-0.5 mt-auto border border-[#bc7bd4]/30 opacity-50 cursor-not-allowed">
                        Aceitar
                    </button>
                </div>
            </div>

            <!-- LINHA INFERIOR: Mesa da Carta -->
            <div class="bg-[#dca3e8] rounded-3xl p-4 flex flex-col items-center shadow-xl border-2 border-[#bc7bd4] h-[55%] justify-between">
                <div class="flex w-full justify-around items-center flex-grow mb-1">
                    <div class="flex flex-col items-center gap-2">
                        <span class="text-[#7a32a8] font-black text-[12px] uppercase tracking-wide">ENVIAR:</span>
                        <div class="w-[4.5rem] h-24 bg-gray-800 rounded-lg shadow-inner border-2 border-dashed border-[#7a32a8] flex items-center justify-center cursor-pointer hover:border-solid transition-colors relative">
                            <span class="text-[#bc7bd4] text-3xl font-bold">+</span>
                        </div>
                    </div>
                    <div class="flex flex-col items-center gap-2">
                        <span class="text-[#7a32a8] font-black text-[12px] tracking-wide">Receber:</span>
                        <div class="w-[4.5rem] h-24 bg-gray-800 rounded-lg shadow-inner border-2 border-[#bc7bd4] flex items-center justify-center opacity-70 relative">
                            <span class="text-[#bc7bd4] text-[9px] font-black text-center px-1">Aguardando...</span>
                        </div>
                    </div>
                </div>
                
                <button id="btn-efetivar-troca" class="bg-[#bc7bd4] text-[#7a32a8] font-black text-[12px] py-1.5 px-8 rounded-full shadow-md mt-2 opacity-60 cursor-not-allowed flex items-center justify-center gap-2 border border-[#7a32a8]/20">
                    trocar <span class="font-normal text-[11px] flex items-center gap-0.5">-- <img src="fragmento.png" class="w-3.5 h-3.5 object-contain"></span>
                </button>
            </div>
        </main>

        <!-- BOTÃO VOLTAR -->
        <footer class="mt-auto flex justify-center pb-2 z-10 absolute bottom-4 left-0 w-full pointer-events-none">
            <button onclick="window.location.href='menu.html'" class="bg-[#7a32a8] hover:bg-purple-600 text-white font-black text-sm py-2 px-10 rounded-full shadow-lg transition-transform hover:-translate-y-1 pointer-events-auto border-2 border-[#dca3e8]">
                retornar
            </button>
        </footer>

    </div>

    <!-- SCRIPT DO FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, query, where, getDocs, addDoc, onSnapshot, serverTimestamp, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        
        const firebaseConfig = {
          apiKey: "AIzaSyCU3lFTgfrDMaD9jwR7X7ivYPmGQh4VE1g",
          authDomain: "supercards-tcg.firebaseapp.com",
          projectId: "supercards-tcg",
          storageBucket: "supercards-tcg.firebasestorage.app",
          messagingSenderId: "862316380615",
          appId: "1:862316380615:web:b3f28056ebc967673999e2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserUid = null;
        let currentUserName = "JOGADOR";
        let amigoSelecionadoId = null;
        let amigoSelecionadoNome = null;
        let conviteSelecionadoId = null; // Para quando você receber um convite e clicar nele

        window.mostrarToast = function(mensagem) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast-msg';
            toast.innerHTML = mensagem;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s ease';
                setTimeout(() => toast.remove(), 500); 
            }, 3000);
        };

        function calcularXPMaximo(nivel) {
            if (nivel >= 1 && nivel <= 5) return 200;
            if (nivel >= 6 && nivel <= 15) return 750;
            if (nivel >= 16 && nivel <= 25) return 1600;
            return 3000;
        }

        function atualizarVisualBarraXP(xpAtual, nivelAtual) {
            const xpMaximo = calcularXPMaximo(nivelAtual);
            const porcentagem = Math.min((xpAtual / xpMaximo) * 100, 100);
            document.getElementById('player-level').innerText = nivelAtual; 
            document.getElementById('texto-xp').innerText = `${xpAtual}/${xpMaximo} xp`;
            document.getElementById('barra-xp').style.width = `${porcentagem}%`;
        }

        // --- SISTEMA DE LISTAR AMIGOS ---
        async function carregarListaAmigos() {
            const lista = document.getElementById('lista-amigos');
            try {
                // Busca todos os usuários cadastrados
                const usersRef = collection(db, "users");
                const snap = await getDocs(usersRef);
                lista.innerHTML = '';
                
                let temAlguem = false;

                snap.forEach(docSnap => {
                    if(docSnap.id !== currentUserUid) {
                        temAlguem = true;
                        const dados = docSnap.data();
                        const nomeAmigo = (dados.nomeDisplay || "JOGADOR").toUpperCase();
                        
                        const divAmigo = document.createElement('div');
                        divAmigo.className = "bg-[#7a32a8] text-white text-[10px] py-2 px-3 rounded-full cursor-pointer text-center font-black tracking-wider transition-all shadow-sm";
                        divAmigo.innerText = nomeAmigo;
                        
                        // Lógica de seleção visual
                        divAmigo.addEventListener('click', () => {
                            // Tira a seleção de todos
                            Array.from(lista.children).forEach(el => el.classList.remove('amigo-selecionado'));
                            // Aplica seleção neste
                            divAmigo.classList.add('amigo-selecionado');
                            amigoSelecionadoId = docSnap.id;
                            amigoSelecionadoNome = nomeAmigo;
                        });
                        
                        lista.appendChild(divAmigo);
                    }
                });

                if(!temAlguem) {
                    lista.innerHTML = '<span class="text-[10px] text-center text-[#7a32a8] mt-2 font-bold">Nenhum jogador encontrado.</span>';
                }

            } catch(e) {
                console.error(e);
                lista.innerHTML = '<span class="text-xs text-center text-red-600 mt-2">Erro ao carregar.</span>';
            }
        }

        // --- SISTEMA DE ENVIAR CONVITE ---
        document.getElementById('btn-enviar-convite').addEventListener('click', async () => {
            if (!amigoSelecionadoId) {
                return window.mostrarToast("Você precisa selecionar um amigo na lista primeiro!");
            }

            try {
                const trocasRef = collection(db, "trocas");
                
                // Cria o documento oficial da troca
                await addDoc(trocasRef, {
                    remetenteId: currentUserUid,
                    remetenteNome: currentUserName,
                    destinatarioId: amigoSelecionadoId,
                    destinatarioNome: amigoSelecionadoNome,
                    status: 'convite_pendente',
                    cartaRemetente: null,
                    cartaDestinatario: null,
                    pagoRemetente: false,
                    pagoDestinatario: false,
                    dataCriacao: serverTimestamp()
                });

                window.mostrarToast(`Convite enviado para ${amigoSelecionadoNome}!`);
                
                // Reseta a seleção visual
                amigoSelecionadoId = null;
                amigoSelecionadoNome = null;
                Array.from(document.getElementById('lista-amigos').children).forEach(el => el.classList.remove('amigo-selecionado'));
                
            } catch (error) {
                console.error("Erro ao enviar convite:", error);
                window.mostrarToast("Erro ao enviar o convite.");
            }
        });

        // --- SISTEMA DE ESCUTAR CONVITES RECEBIDOS EM TEMPO REAL ---
        function escutarConvitesRecebidos() {
            const q = query(collection(db, "trocas"), 
                            where("destinatarioId", "==", currentUserUid), 
                            where("status", "==", "convite_pendente"));
            
            onSnapshot(q, (snapshot) => {
                const lista = document.getElementById('lista-convites');
                lista.innerHTML = '';
                
                if(snapshot.empty) {
                    lista.innerHTML = '<span class="text-[10px] text-center text-[#7a32a8] mt-2 font-bold">Nenhum convite pendente.</span>';
                    document.getElementById('btn-aceitar-convite').classList.add('opacity-50', 'cursor-not-allowed');
                    conviteSelecionadoId = null;
                    return;
                }

                snapshot.forEach(docSnap => {
                    const convite = docSnap.data();
                    const divConvite = document.createElement('div');
                    
                    divConvite.className = "bg-[#7a32a8] text-white text-[10px] py-2 px-3 rounded-full cursor-pointer text-center font-black tracking-wider transition-all shadow-sm animate-pulse";
                    divConvite.innerText = `${convite.remetenteNome}`; // Mostra o nome de quem te enviou
                    
                    divConvite.addEventListener('click', () => {
                        Array.from(lista.children).forEach(el => el.classList.remove('amigo-selecionado'));
                        divConvite.classList.remove('animate-pulse'); // Para de piscar ao clicar
                        divConvite.classList.add('amigo-selecionado');
                        
                        conviteSelecionadoId = docSnap.id;
                        document.getElementById('btn-aceitar-convite').classList.remove('opacity-50', 'cursor-not-allowed');
                    });
                    
                    lista.appendChild(divConvite);
                });
            });
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserUid = user.uid;
                currentUserName = user.displayName?.toUpperCase() || "JOGADOR";
                
                document.getElementById('player-name').innerText = currentUserName;
                
                const docRef = doc(db, "users", user.uid);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const dados = docSnap.data();
                    
                    // Garante que o nome do usuário está salvo no banco para a lista puxar
                    if(!dados.nomeDisplay || dados.nomeDisplay !== currentUserName) {
                        await setDoc(docRef, { nomeDisplay: currentUserName }, { merge: true });
                    }

                    document.getElementById('player-fragmentos').innerText = dados.fragmentos || 0;
                    atualizarVisualBarraXP(dados.xp || 0, dados.nivel || 1);
                    
                    if (dados.fotoPerfil) {
                        const imgElement = document.getElementById('img-perfil-global');
                        if (imgElement) {
                            imgElement.src = dados.fotoPerfil;
                            imgElement.classList.remove('hidden');
                            document.getElementById('texto-sem-foto').classList.add('hidden');
                        }
                    }
                }

                // Inicia as funções da mesa de troca
                carregarListaAmigos();
                escutarConvitesRecebidos();
                
            } else {
                window.location.href = "index.html";
            }
        });
    </script>
</body>
</html>
