<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supercards - Trocas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-image: url('fundotela.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        #toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            width: 90%;
            max-width: 350px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast-msg {
            background: #dca3e8;
            color: #7a32a8;
            border: 3px solid #7a32a8;
            padding: 12px 20px;
            border-radius: 9999px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.3);
            text-align: center;
            font-weight: 900;
            font-size: 0.85rem;
            animation: slideDown 0.3s ease-out;
            pointer-events: auto;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .amigo-selecionado {
            background-color: #22c55e !important; 
            color: #7a32a8 !important;
            border: 2px solid #7a32a8 !important;
            transform: scale(1.03);
        }
    </style>
</head>
<body class="h-[100dvh] p-4 flex justify-center overflow-hidden">

    <div id="toast-container"></div>

    <div class="w-full max-w-sm flex flex-col h-full relative">
        
        <!-- CABEÇALHO PADRÃO -->
        <header class="flex items-center gap-4 mt-4 mb-2 w-full">
            <div class="relative flex-shrink-0">
                <div class="bg-[#dca3e8] w-24 h-24 rounded-full flex items-center justify-center text-[#7a32a8] font-black text-xl shadow-lg border-2 border-[#bc7bd4] relative overflow-hidden">
                    <span id="texto-sem-foto">FOTO</span>
                    <img id="img-perfil-global" src="" class="hidden w-full h-full object-cover absolute inset-0">
                </div>
                <div class="absolute -bottom-2 left-1/2 transform -translate-x-1/2 bg-[#bc7bd4] w-8 h-8 rounded-full flex items-center justify-center shadow-md border-2 border-[#dca3e8] z-30">
                    <span id="player-level" class="text-[#7a32a8] font-black text-sm">--</span>
                </div>
            </div>

            <div class="flex flex-col flex-grow gap-2 justify-center">
                <div class="flex items-center gap-2 w-full">
                    <div class="bg-[#dca3e8] rounded-full px-3 py-2 flex items-center justify-center shadow-md flex-grow overflow-hidden">
                        <span id="player-name" class="text-[#7a32a8] font-black text-base tracking-wide uppercase truncate max-w-[130px]">JOGADOR</span>
                    </div>
                    <div class="bg-[#dca3e8] rounded-full px-3 py-2 flex items-center justify-center gap-1 shadow-md flex-shrink-0">
                        <span id="player-fragmentos" class="text-[#7a32a8] font-black text-sm">0</span>
                        <img src="fragmento.png" class="w-4 h-4 object-contain">
                    </div>
                </div>
                <div class="flex flex-col items-center mt-1 w-full">
                    <div class="w-full bg-transparent border border-[#dca3e8] rounded-full h-3 overflow-hidden shadow-inner">
                        <div id="barra-xp" class="bg-[#dca3e8] h-full transition-all duration-500" style="width: 0%;"></div>
                    </div>
                    <span id="texto-xp" class="text-[#dca3e8] text-[10px] font-bold mt-1">0/0 xp</span>
                </div>
            </div>
        </header>

        <!-- TÍTULO E BOTÃO DE CONVITES -->
        <h1 class="text-[#dca3e8] font-black text-xl text-center mb-3 mt-2 drop-shadow-md uppercase flex items-center justify-center gap-2">
            TROCAS
        </h1>

        <div class="flex justify-center w-full mb-4 z-10 relative">
            <button onclick="abrirModalTrocas()" class="bg-[#dca3e8] hover:bg-[#bc7bd4] text-[#7a32a8] font-black text-xs py-2.5 px-6 rounded-full shadow-md border-2 border-[#bc7bd4] uppercase tracking-wide transition-transform hover:scale-105 flex items-center gap-2">
                <span>🔍 Nova Troca / Convites</span>
                <span id="notificacao-convite" class="hidden flex h-3 w-3 relative">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3 bg-red-600 border border-white"></span>
                </span>
            </button>
        </div>

        <!-- MESA LIVRE DE TROCA -->
        <main class="flex flex-col gap-3 flex-grow overflow-hidden pb-24">
            
            <div class="bg-[#dca3e8] rounded-3xl p-5 flex flex-col items-center shadow-xl border-2 border-[#bc7bd4] flex-grow justify-center relative">
                <span id="status-troca" class="text-[#7a32a8] font-black text-xs uppercase tracking-widest absolute top-5 text-center w-full">MESA LIVRE</span>

                <div class="flex w-full justify-around items-center flex-grow mb-2 mt-8">
                    <div class="flex flex-col items-center gap-3">
                        <span class="text-[#7a32a8] font-black text-[13px] uppercase tracking-wider">ENVIAR:</span>
                        <div id="slot-enviar" class="w-20 h-28 bg-gray-800 rounded-lg shadow-inner border-[3px] border-dashed border-[#7a32a8] flex items-center justify-center cursor-pointer hover:border-solid transition-all relative overflow-hidden">
                            <span id="icone-mais" class="text-[#bc7bd4] text-4xl font-bold">+</span>
                            <img id="img-minha-carta" src="" class="hidden w-full h-full object-cover">
                        </div>
                    </div>
                    
                    <div class="flex flex-col items-center gap-3">
                        <span class="text-[#7a32a8] font-black text-[13px] tracking-wider uppercase">Receber:</span>
                        <div id="slot-receber" class="w-20 h-28 bg-gray-800 rounded-lg shadow-inner border-[3px] border-[#bc7bd4] flex items-center justify-center opacity-70 relative overflow-hidden">
                            <span id="texto-aguardando" class="text-[#bc7bd4] text-[10px] font-black text-center px-1">Aguardando...</span>
                            <img id="img-carta-amigo" src="" class="hidden w-full h-full object-cover">
                        </div>
                    </div>
                </div>
                
                <button id="btn-efetivar-troca" class="bg-[#bc7bd4] text-[#7a32a8] font-black text-sm py-2 px-10 rounded-full shadow-md mt-4 opacity-50 cursor-not-allowed flex items-center justify-center gap-2 border border-[#7a32a8]/20 transition-all">
                    TROCAR <span id="custo-troca" class="font-normal text-xs flex items-center gap-0.5 ml-1">-- <img src="fragmento.png" class="w-4 h-4 object-contain"></span>
                </button>
            </div>
        </main>

        <!-- RODAPÉ -->
        <footer class="mt-auto flex justify-center pb-2 z-10 absolute bottom-10 left-0 w-full pointer-events-none">
            <button onclick="window.location.href='menu.html'" class="bg-[#7a32a8] hover:bg-purple-600 text-white font-black text-sm py-2.5 px-12 rounded-full shadow-lg transition-transform hover:-translate-y-1 pointer-events-auto border-2 border-[#dca3e8] uppercase tracking-widest">
                RETORNAR
            </button>
        </footer>

        <!-- ================= MODAL: NOVA TROCA E CONVITES ================= -->
        <div id="modal-trocas" class="hidden fixed inset-0 bg-black/90 z-[100] flex flex-col items-center justify-center p-4 backdrop-blur-md pointer-events-auto">
            <div class="bg-[#dca3e8] border-4 border-[#7a32a8] rounded-2xl p-5 w-full max-w-sm shadow-2xl flex flex-col h-[85%] max-h-[600px] relative">
                <button onclick="fecharModalTrocas()" class="absolute top-2 right-4 text-[#7a32a8] font-black text-xl hover:text-purple-600 transition-colors">X</button>
                
                <h2 class="text-[#7a32a8] font-black text-lg text-center uppercase tracking-wider mb-4 mt-2">Convidar para Troca</h2>

                <!-- Busca e Envio -->
                <input type="text" id="input-busca-amigo" placeholder="Buscar jogador..." class="mb-3 w-full bg-[#bc7bd4] text-[#7a32a8] placeholder-[#7a32a8]/70 font-black text-xs rounded-full px-4 py-2.5 outline-none border-2 border-[#7a32a8]/30 focus:border-[#7a32a8] transition-colors shadow-inner flex-shrink-0 text-center uppercase">
                
                <div id="lista-amigos" class="flex flex-col gap-2 overflow-y-auto no-scrollbar flex-grow mb-3 bg-white/30 rounded-xl p-2 border border-[#7a32a8]/20 min-h-[120px]">
                    <span class="text-[#7a32a8] text-[10px] font-bold text-center mt-2">Pesquise o nome do jogador.</span>
                </div>
                
                <button id="btn-enviar-convite" class="bg-[#7a32a8] hover:bg-purple-600 text-white font-black text-[11px] uppercase py-3 w-full rounded-full shadow-md transition-all hover:-translate-y-0.5 mb-5 border border-[#bc7bd4]/30 flex-shrink-0">
                    ENVIAR CONVITE DE TROCA
                </button>

                <!-- Divisor -->
                <div class="w-full h-px bg-[#7a32a8]/30 mb-5 flex-shrink-0"></div>

                <!-- Convites Recebidos -->
                <h2 class="text-[#7a32a8] font-black text-sm text-center uppercase tracking-wider mb-2">Convites Recebidos</h2>
                
                <div id="lista-convites" class="flex flex-col gap-2 overflow-y-auto no-scrollbar h-[25%] min-h-[100px] bg-white/30 rounded-xl p-2 border border-[#7a32a8]/20 mb-3">
                    <span class="text-[#7a32a8] text-[10px] font-bold text-center mt-2">Nenhum convite pendente.</span>
                </div>

                <div class="flex gap-2 w-full flex-shrink-0 mt-auto">
                    <button id="btn-recusar-convite" class="bg-red-500 hover:bg-red-600 text-white font-black text-xs uppercase py-2.5 px-4 rounded-full shadow-md transition-all border border-red-700/30 opacity-50 cursor-not-allowed">
                        X
                    </button>
                    <button id="btn-aceitar-convite" class="bg-[#7a32a8] hover:bg-purple-600 text-white font-black text-xs uppercase py-2.5 flex-grow rounded-full shadow-md transition-all border border-[#bc7bd4]/30 opacity-50 cursor-not-allowed tracking-widest">
                        ACEITAR E ABRIR MESA
                    </button>
                </div>
            </div>
        </div>

        <!-- ================= MODAL: ESCOLHA DA CARTA ================= -->
        <div id="modal-selecao-carta" class="hidden fixed inset-0 bg-black/80 z-[100] flex flex-col items-center justify-center p-4 backdrop-blur-sm">
            <div class="bg-[#dca3e8] border-4 border-[#7a32a8] rounded-2xl p-4 w-full max-w-sm shadow-2xl flex flex-col h-[70%]">
                <h2 class="text-[#7a32a8] font-black text-lg mb-0.5 text-center uppercase">Escolha sua Carta</h2>
                <p class="text-center text-[10px] text-[#7a32a8] font-bold mb-4">MOSTRANDO APENAS CARTAS REPETIDAS (+1 CÓPIA)</p>
                
                <div id="grid-cartas-modal" class="grid grid-cols-3 gap-3 overflow-y-auto no-scrollbar flex-grow pb-2 content-start">
                </div>
                
                <button onclick="document.getElementById('modal-selecao-carta').classList.add('hidden')" class="w-full mt-4 bg-red-500 hover:bg-red-600 text-white font-black py-3 rounded-full shadow-md transition-transform hover:scale-105 uppercase text-xs tracking-wider">
                    Cancelar
                </button>
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, query, where, getDocs, addDoc, updateDoc, deleteDoc, onSnapshot, serverTimestamp, orderBy, limit, startAt, endAt, increment, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        
        import { INFO_CARTAS } from './cartas.js';

        const firebaseConfig = {
          apiKey: "AIzaSyCU3lFTgfrDMaD9jwR7X7ivYPmGQh4VE1g",
          authDomain: "supercards-tcg.firebaseapp.com",
          projectId: "supercards-tcg",
          storageBucket: "supercards-tcg.firebasestorage.app",
          messagingSenderId: "862316380615",
          appId: "1:862316380615:web:b3f28056ebc967673999e2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const CUSTOS_TROCA = { 'Comum': 10, 'Rara': 40, 'Lendária': 100, 'Épica': 200 };

        let currentUserUid = null;
        let currentUserName = "JOGADOR";
        let minhaColecao = {}; 

        let amigoSelecionadoId = null;
        let amigoSelecionadoNome = null;
        let conviteSelecionadoId = null;

        let trocaAtivaId = null;
        let souRemetente = false;
        let escutadorTroca = null;
        let trocaProcessada = false; 

        window.mostrarToast = function(mensagem) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast-msg';
            toast.innerHTML = mensagem;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s ease';
                setTimeout(() => toast.remove(), 500); 
            }, 3000);
        };

        function obterGameDay() {
            let agora = new Date();
            if (agora.getHours() < 6) agora.setDate(agora.getDate() - 1);
            return `${agora.getFullYear()}-${agora.getMonth() + 1}-${agora.getDate()}`;
        }

        function calcularXPMaximo(nivel) {
            if (nivel >= 1 && nivel <= 5) return 200;
            if (nivel >= 6 && nivel <= 15) return 750;
            if (nivel >= 16 && nivel <= 25) return 1600;
            return 3000;
        }

        function atualizarVisualBarraXP(xpAtual, nivelAtual) {
            const xpMaximo = calcularXPMaximo(nivelAtual);
            const porcentagem = Math.min((xpAtual / xpMaximo) * 100, 100);
            document.getElementById('player-level').innerText = nivelAtual; 
            document.getElementById('texto-xp').innerText = `${xpAtual}/${xpMaximo} xp`;
            document.getElementById('barra-xp').style.width = `${porcentagem}%`;
        }

        function calcularCusto(id1, id2) {
            if (!id1 || !id2) return null;
            const r1 = INFO_CARTAS[id1].raridade;
            const r2 = INFO_CARTAS[id2].raridade;
            return Math.max(CUSTOS_TROCA[r1] || 10, CUSTOS_TROCA[r2] || 10);
        }

        // ==========================================
        // MODAL DE TROCAS (NOVO)
        // ==========================================
        window.abrirModalTrocas = function() {
            document.getElementById('modal-trocas').classList.remove('hidden');
        };

        window.fecharModalTrocas = function() {
            document.getElementById('modal-trocas').classList.add('hidden');
        };

       // --- SISTEMA DE LISTAR E BUSCAR AMIGOS ---
        async function carregarListaAmigos(termoBusca = "") {
            const lista = document.getElementById('lista-amigos');
            lista.innerHTML = '<span class="text-[10px] text-center text-[#7a32a8] mt-2 font-bold animate-pulse">Buscando...</span>';
            
            try {
                const usersRef = collection(db, "users");
                const q = query(usersRef, limit(50));
                const snap = await getDocs(q);

                lista.innerHTML = '';
                let temAlguem = false;
                const termoNormalizado = termoBusca.toLowerCase().trim();

                snap.forEach(docSnap => {
                    if(docSnap.id !== currentUserUid) {
                        const dados = docSnap.data();
                        // Lê o campo 'nome' correto do seu banco
                        const nomeDb = dados.nome || dados.nomeDisplay || "JOGADOR";
                        
                        // Faz a checagem flexível ignorando maiúsculas
                        if (nomeDb.toLowerCase().includes(termoNormalizado) || termoNormalizado === "") {
                            temAlguem = true;
                            const nomeAmigo = nomeDb.toUpperCase();
                            const divAmigo = document.createElement('div');
                            divAmigo.className = "bg-[#4ade80] text-[#7a32a8] border-2 border-[#22c55e] text-[10px] py-2.5 px-3 rounded-full cursor-pointer text-center font-black tracking-wider transition-all shadow-sm flex-shrink-0";
                            divAmigo.innerText = nomeAmigo;
                            
                            divAmigo.addEventListener('click', () => {
                                Array.from(lista.children).forEach(el => el.classList.remove('amigo-selecionado'));
                                divAmigo.classList.add('amigo-selecionado');
                                amigoSelecionadoId = docSnap.id;
                                amigoSelecionadoNome = nomeAmigo;
                            });
                            lista.appendChild(divAmigo);
                        }
                    }
                });

                if(!temAlguem) lista.innerHTML = '<span class="text-[10px] text-center text-[#7a32a8] mt-2 font-bold">Nenhum jogador encontrado.</span>';
            } catch(e) {
                console.error(e);
            }
        }

        document.getElementById('input-busca-amigo').addEventListener('input', (event) => carregarListaAmigos(event.target.value));

        // --- BLOQUEIOS E BOTÕES DE CONVITE ---
        document.getElementById('btn-enviar-convite').addEventListener('click', async () => {
            if (trocaAtivaId) {
                window.fecharModalTrocas();
                return window.mostrarToast("❌ Você já possui uma troca ativa na mesa!");
            }
            if (!amigoSelecionadoId) return window.mostrarToast("Selecione um amigo na lista primeiro!");

            try {
                await addDoc(collection(db, "trocas"), {
                    remetenteId: currentUserUid,
                    remetenteNome: currentUserName,
                    destinatarioId: amigoSelecionadoId,
                    destinatarioNome: amigoSelecionadoNome,
                    participantes: [currentUserUid, amigoSelecionadoId], 
                    status: 'convite_pendente',
                    cartaRemetente: null,
                    cartaDestinatario: null,
                    pagoRemetente: false,
                    pagoDestinatario: false,
                    dataCriacao: serverTimestamp()
                });

                // INJETA A NOTIFICAÇÃO NA CAIXA DE ENTRADA DO AMIGO
                await updateDoc(doc(db, "users", amigoSelecionadoId), {
                    notificacoes: arrayUnion({
                        id: "notif_convite_troca_" + Date.now(),
                        titulo: "🔄 Convite de Troca",
                        texto: `${currentUserName} quer trocar cartas com você! Vá até a mesa de trocas para aceitar ou recusar.`,
                        lida: false,
                        data: new Date().toISOString()
                    })
                });

                window.mostrarToast(`Convite enviado para ${amigoSelecionadoNome}!`);
                amigoSelecionadoId = null;
                amigoSelecionadoNome = null;
                document.getElementById('input-busca-amigo').value = "";
                document.getElementById('lista-amigos').innerHTML = '<span class="text-[#7a32a8] text-[10px] font-bold text-center mt-2">Pesquise o nome do jogador.</span>';
                
                window.fecharModalTrocas(); // Fecha após enviar o convite

            } catch (error) {
                console.error("Erro ao enviar:", error);
            }
        });

        function escutarConvitesRecebidos() {
            const q = query(collection(db, "trocas"), where("destinatarioId", "==", currentUserUid), where("status", "==", "convite_pendente"));
            
            onSnapshot(q, (snapshot) => {
                const lista = document.getElementById('lista-convites');
                const ping = document.getElementById('notificacao-convite');
                lista.innerHTML = '';
                
                if(snapshot.empty) {
                    lista.innerHTML = '<span class="text-[10px] text-center text-[#7a32a8] mt-2 font-bold">Nenhum convite pendente.</span>';
                    document.getElementById('btn-aceitar-convite').classList.add('opacity-50', 'cursor-not-allowed');
                    document.getElementById('btn-recusar-convite').classList.add('opacity-50', 'cursor-not-allowed');
                    conviteSelecionadoId = null;
                    ping.classList.add('hidden'); // Esconde a bolinha
                    return;
                }

                ping.classList.remove('hidden'); // Mostra a bolinha vermelha no botão principal

                snapshot.forEach(docSnap => {
                    const divConvite = document.createElement('div');
                    divConvite.className = "bg-[#4ade80] text-[#7a32a8] border-2 border-[#22c55e] text-[10px] py-2.5 px-3 rounded-full cursor-pointer text-center font-black tracking-wider transition-all shadow-sm animate-pulse flex-shrink-0";
                    divConvite.innerText = `Convite de: ${docSnap.data().remetenteNome}`; 
                    
                    divConvite.addEventListener('click', () => {
                        Array.from(lista.children).forEach(el => el.classList.remove('amigo-selecionado'));
                        divConvite.classList.remove('animate-pulse'); 
                        divConvite.classList.add('amigo-selecionado');
                        
                        conviteSelecionadoId = docSnap.id;
                        document.getElementById('btn-aceitar-convite').classList.remove('opacity-50', 'cursor-not-allowed');
                        document.getElementById('btn-recusar-convite').classList.remove('opacity-50', 'cursor-not-allowed');
                    });
                    lista.appendChild(divConvite);
                });
            });
        }

        // --- ACEITAR E RECUSAR CONVITES ---
        document.getElementById('btn-recusar-convite').addEventListener('click', async () => {
            if (!conviteSelecionadoId) return;
            try {
                await deleteDoc(doc(db, "trocas", conviteSelecionadoId));
                window.mostrarToast("Convite recusado.");
                conviteSelecionadoId = null;
            } catch (e) { console.error(e); }
        });

        document.getElementById('btn-aceitar-convite').addEventListener('click', async () => {
            if (trocaAtivaId) {
                window.fecharModalTrocas();
                return window.mostrarToast("❌ Você já possui uma troca ativa na mesa!");
            }
            if (!conviteSelecionadoId) return;

            try {
                await updateDoc(doc(db, "trocas", conviteSelecionadoId), { status: 'escolhendo_cartas' });
                trocaAtivaId = conviteSelecionadoId;
                souRemetente = false; 
                trocaProcessada = false;
                escutarMesaTroca(trocaAtivaId);
                
                window.mostrarToast("✅ Troca iniciada! Selecione sua carta na mesa.");
                conviteSelecionadoId = null;
                
                window.fecharModalTrocas(); // Fecha o modal e revela a mesa
            } catch (e) { console.error(e); }
        });

        // --- MESA DE TROCA E EFETIVAÇÃO ---
        function escutarMesaTroca(idDaTroca) {
            if (escutadorTroca) escutadorTroca(); 
            
            document.getElementById('status-troca').innerText = "ESCOLHENDO CARTAS...";

            escutadorTroca = onSnapshot(doc(db, "trocas", idDaTroca), async (docSnap) => {
                if (!docSnap.exists()) {
                    resetarMesa(); // Limpa a tela automaticamente se o documento foi deletado
                    return;
                }
                
                const troca = docSnap.data();
                const minhaCarta = souRemetente ? troca.cartaRemetente : troca.cartaDestinatario;
                const cartaAmigo = souRemetente ? troca.cartaDestinatario : troca.cartaRemetente;
                
                const jaPaguei = souRemetente ? troca.pagoRemetente : troca.pagoDestinatario;
                const amigoPagou = souRemetente ? troca.pagoDestinatario : troca.pagoRemetente;

                if (minhaCarta) {
                    document.getElementById('icone-mais').classList.add('hidden');
                    document.getElementById('img-minha-carta').src = INFO_CARTAS[minhaCarta].imagem;
                    document.getElementById('img-minha-carta').classList.remove('hidden');
                }

                if (cartaAmigo) {
                    document.getElementById('texto-aguardando').classList.add('hidden');
                    document.getElementById('img-carta-amigo').src = INFO_CARTAS[cartaAmigo].imagem;
                    document.getElementById('img-carta-amigo').classList.remove('hidden');
                } else {
                    document.getElementById('texto-aguardando').innerText = `${souRemetente ? troca.destinatarioNome : troca.remetenteNome} escolhendo...`;
                }

                // Quando as duas cartas estão na mesa
                if (minhaCarta && cartaAmigo) {
                    const custo = calcularCusto(minhaCarta, cartaAmigo);
                    document.getElementById('status-troca').innerText = "CARTAS SELECIONADAS!";
                    
                    const btn = document.getElementById('btn-efetivar-troca');
                    
                    if (!jaPaguei) {
                        btn.className = "bg-[#4ade80] text-[#7a32a8] border-2 border-[#22c55e] font-black text-sm py-2 px-10 rounded-full shadow-md mt-4 flex items-center justify-center gap-2 transition-all hover:scale-105 cursor-pointer uppercase tracking-widest";
                        btn.innerHTML = `TROCAR <span id="custo-troca" class="font-normal text-xs flex items-center gap-0.5 ml-1">${custo} <img src="fragmento.png" class="w-4 h-4 object-contain"></span>`;
                    } else if (!amigoPagou) {
                        btn.className = "bg-[#bc7bd4] text-[#7a32a8] font-black text-sm py-2 px-10 rounded-full shadow-md mt-4 opacity-50 cursor-not-allowed flex items-center justify-center border-2 border-[#7a32a8]/20 transition-all uppercase tracking-widest";
                        btn.innerText = "Aguardando amigo...";
                    }

                    // Somente processa se os DOIS confirmaram o pagamento
                    if (jaPaguei && amigoPagou && !trocaProcessada) {
                        trocaProcessada = true;
                        document.getElementById('status-troca').innerText = "TROCA CONCLUÍDA!";
                        await finalizarTrocaLocal(idDaTroca, minhaCarta, cartaAmigo, custo);
                    }
                }
            });
        }

        // Lógica do Clique em TROCAR
        document.getElementById('btn-efetivar-troca').addEventListener('click', async () => {
            if (!trocaAtivaId) return;
            
            const btn = document.getElementById('btn-efetivar-troca');
            if (btn.classList.contains('cursor-not-allowed')) return;

            const custoTexto = document.getElementById('custo-troca').innerText;
            const custo = parseInt(custoTexto) || 0;

            const userSnap = await getDoc(doc(db, "users", currentUserUid));
            const fragmentos = userSnap.data().fragmentos || 0;

            if (fragmentos < custo) {
                return window.mostrarToast("❌ Você não tem fragmentos suficientes!");
            }

            btn.classList.add('opacity-50', 'cursor-not-allowed');
            btn.innerHTML = "Processando... ⏳";

            try {
                // Debita os fragmentos localmente
                await updateDoc(doc(db, "users", currentUserUid), {
                    fragmentos: increment(-custo)
                });

                // Avisa a mesa que você pagou
                const campoPago = souRemetente ? 'pagoRemetente' : 'pagoDestinatario';
                await updateDoc(doc(db, "trocas", trocaAtivaId), {
                    [campoPago]: true
                });

                window.mostrarToast("Aguardando o amigo confirmar...");
                document.getElementById('player-fragmentos').innerText = fragmentos - custo;
            } catch(e) {
                console.error(e);
                window.mostrarToast("Erro ao processar pagamento.");
            }
        });

        // O CÉREBRO DA TROCA: Função que realiza a entrega da carta e confere badges/missões
        async function finalizarTrocaLocal(idTroca, cartaDada, cartaRecebida, custo) {
            try {
                const userRef = doc(db, "users", currentUserUid);
                const userSnap = await getDoc(userRef);
                let dados = userSnap.exists() ? userSnap.data() : {};

                let badgesJogador = dados.badges || {};
                let notificacoesNovas = [];
                let ganhouBadgeTroca = false;
                let ganhouBadgeColecao = false;
                let qtdBadgesColecao = 0;

                // 1. Simula a coleção localmente para ver se ganha badge
                let colecao = dados.colecao || {};
                colecao[cartaDada] = (colecao[cartaDada] || 0) - 1;
                colecao[cartaRecebida] = (colecao[cartaRecebida] || 0) + 1;
                let trocasFeitas = (dados.estatisticas?.trocasFeitas || 0) + 1;

                // 2. Checagem da Badge de Troca
                if (trocasFeitas >= 20 && !badgesJogador["badge-004"]) {
                    badgesJogador["badge-004"] = true;
                    ganhouBadgeTroca = true;
                    notificacoesNovas.push({
                        id: "notif_" + Date.now() + "_badge004",
                        titulo: "🏆 Conquista: Troca Troca",
                        texto: "Você fez 20 trocas ao todo!\nRecompensas: 50 XP e 50 Moedas.",
                        lida: false,
                        data: new Date().toISOString()
                    });
                }

                // 3. Checagem de Badges de Coleção
                if (!badgesJogador["badge-001"]) {
                    let temTodas = true;
                    for (let i = 1; i <= 52; i++) {
                        let id = String(i).padStart(3, '0');
                        if (!colecao[id] || colecao[id] <= 0) { temTodas = false; break; }
                    }
                    if (temTodas) { badgesJogador["badge-001"] = true; ganhouBadgeColecao = true; qtdBadgesColecao++; }
                }
                if (!badgesJogador["badge-002"]) {
                    if (colecao["020"] > 0 && colecao["036"] > 0 && colecao["045"] > 0) {
                        badgesJogador["badge-002"] = true; ganhouBadgeColecao = true; qtdBadgesColecao++;
                    }
                }
                if (!badgesJogador["badge-009"]) {
                    if (colecao["009"] > 0 && colecao["027"] > 0) {
                        badgesJogador["badge-009"] = true; ganhouBadgeColecao = true; qtdBadgesColecao++;
                    }
                }

                if (ganhouBadgeColecao) {
                    notificacoesNovas.push({
                        id: "notif_" + Date.now() + "_badgescolecao",
                        titulo: "🏆 Conquistas de Coleção",
                        texto: `Você completou coleções e ganhou ${qtdBadgesColecao} badge(s)!\nRecompensas: ${50 * qtdBadgesColecao} XP e ${50 * qtdBadgesColecao} Moedas.`,
                        lida: false,
                        data: new Date().toISOString()
                    });
                }

                // 4. Checagem da Missão Diária
                let pacoteMissoes = dados.missoesDiarias || {};
                const hoje = obterGameDay();
                let atualizouMissao = false;
                let msgMissaoProgresso = "";

                if (pacoteMissoes.dataReset === hoje && pacoteMissoes.lista) {
                    pacoteMissoes.lista.forEach(m => {
                        if (m.id === "troca" && m.progresso < m.meta) {
                            m.progresso++;
                            atualizouMissao = true;
                            msgMissaoProgresso = `🎯 Progresso: ${m.desc}`;
                        }
                    });
                }

                // 5. XP e Level Up
                let xpAtual = dados.xp || 0;
                let nivelAtual = dados.nivel || 1;
                let subiuNivel = false;
                let msgLevelUp = "";
                let bonusXp = (ganhouBadgeTroca ? 50 : 0) + (ganhouBadgeColecao ? 50 * qtdBadgesColecao : 0);
                let bonusMoedas = (ganhouBadgeTroca ? 50 : 0) + (ganhouBadgeColecao ? 50 * qtdBadgesColecao : 0);
                let novoXp = xpAtual + bonusXp;
                let pacotesBasicosGanhos = 0;
                let pacotesPremiumGanhos = 0;

                let xpMaximo = calcularXPMaximo(nivelAtual);
                while (novoXp >= xpMaximo && nivelAtual < 30) {
                    novoXp -= xpMaximo;
                    nivelAtual++;
                    subiuNivel = true;
                    bonusMoedas += 30;
                    pacotesBasicosGanhos++;

                    let textoRecompensaNotif = "1 Pacote Básico e 30 Moedas";
                    if (nivelAtual === 10 || nivelAtual === 20 || nivelAtual === 30) {
                        pacotesPremiumGanhos++;
                        textoRecompensaNotif = "1 Pacote Básico, 1 Pacote Premium e 30 Moedas";
                        msgLevelUp = `🎉 LEVEL UP! Nível ${nivelAtual} alcançado!<br><span class="text-xs">Recompensas: 1 Pacote Básico, 1 Pacote Premium e 30 <img src="moedas.png" class="inline w-4 h-4 ml-0.5 align-text-bottom"></span>`;
                    } else {
                        msgLevelUp = `🎉 LEVEL UP! Nível ${nivelAtual} alcançado!<br><span class="text-xs">Recompensas: 1 Pacote Básico e 30 <img src="moedas.png" class="inline w-4 h-4 ml-0.5 align-text-bottom"></span>`;
                    }

                    notificacoesNovas.push({
                        id: "notif_" + Date.now() + "_nivel" + nivelAtual,
                        titulo: `🎉 Level Up: Nível ${nivelAtual}`,
                        texto: `Parabéns! Você alcançou o Nível ${nivelAtual}.\nRecompensas recebidas: ${textoRecompensaNotif}.`,
                        lida: false,
                        data: new Date().toISOString()
                    });
                    xpMaximo = calcularXPMaximo(nivelAtual);
                }

                // 6. Envia Atualizações para o Firestore
                let updates = {
                    [`colecao.${cartaDada}`]: increment(-1),
                    [`colecao.${cartaRecebida}`]: increment(1),
                    "estatisticas.trocasFeitas": increment(1),
                    "badges": badgesJogador,
                    "xp": novoXp,
                    "nivel": nivelAtual,
                    "moedas": increment(bonusMoedas)
                };

                if (pacotesBasicosGanhos > 0) updates["inventario.pacoteBasico"] = increment(pacotesBasicosGanhos);
                if (pacotesPremiumGanhos > 0) updates["inventario.pacotePremium"] = increment(pacotesPremiumGanhos);
                if (atualizouMissao) updates.missoesDiarias = pacoteMissoes;
                if (notificacoesNovas.length > 0) updates.notificacoes = arrayUnion(...notificacoesNovas);

                await updateDoc(userRef, updates);
                
                // Recarrega coleção no JS para a tela não bugar depois
                minhaColecao[cartaDada] = (minhaColecao[cartaDada] || 0) - 1;
                minhaColecao[cartaRecebida] = (minhaColecao[cartaRecebida] || 0) + 1;

                window.mostrarToast(`✨ Troca concluída com sucesso!<br><span class="text-xs">Você recebeu a carta ${cartaRecebida}</span>`);
                
                // Cascata de Toasts
                let delay = 1500;
                if (atualizouMissao) {
                    setTimeout(() => window.mostrarToast(msgMissaoProgresso), delay);
                    delay += 1500;
                }
                if (ganhouBadgeTroca) {
                    setTimeout(() => window.mostrarToast(`🏆 NOVA CONQUISTA!<br><span class="text-xs font-normal">Badge: Troca Troca (20 trocas).</span><br><span class="text-sm">Recompensa: +50 XP e +50 <img src="moedas.png" class="inline w-4 h-4 align-text-bottom"></span>`), delay);
                    delay += 1500;
                }
                if (ganhouBadgeColecao) {
                    setTimeout(() => window.mostrarToast(`🏆 NOVA CONQUISTA!<br><span class="text-xs font-normal">Você ganhou ${qtdBadgesColecao} badge(s) de coleção.</span><br><span class="text-sm">Recompensa: +${50*qtdBadgesColecao} XP e +${50*qtdBadgesColecao} <img src="moedas.png" class="inline w-4 h-4 align-text-bottom"></span>`), delay);
                    delay += 1500;
                }
                if (subiuNivel) {
                    setTimeout(() => window.mostrarToast(msgLevelUp), delay);
                }

                // O REMETENTE limpa a mesa do servidor após 3 segundos
                if (souRemetente) {
                    setTimeout(async () => {
                        await deleteDoc(doc(db, "trocas", idTroca));
                    }, 3000);
                }
            } catch (e) {
                console.error(e);
            }
        }

        function resetarMesa() {
            trocaAtivaId = null;
            trocaProcessada = false;
            document.getElementById('status-troca').innerText = "MESA LIVRE";
            document.getElementById('icone-mais').classList.remove('hidden');
            
            document.getElementById('img-minha-carta').src = "";
            document.getElementById('img-minha-carta').classList.add('hidden');
            
            document.getElementById('texto-aguardando').innerText = "Aguardando...";
            document.getElementById('texto-aguardando').classList.remove('hidden');
            
            document.getElementById('img-carta-amigo').src = "";
            document.getElementById('img-carta-amigo').classList.add('hidden');
            
            const btn = document.getElementById('btn-efetivar-troca');
            btn.innerHTML = `TROCAR <span id="custo-troca" class="font-normal text-xs flex items-center gap-0.5 ml-1">-- <img src="fragmento.png" class="w-4 h-4 object-contain"></span>`;
            btn.className = "bg-[#bc7bd4] text-[#7a32a8] font-black text-sm py-2 px-10 rounded-full shadow-md mt-4 opacity-50 cursor-not-allowed flex items-center justify-center gap-2 border border-[#7a32a8]/20 transition-all uppercase tracking-widest";
        }

        // --- SISTEMA DO MODAL DE CARTAS ---
        document.getElementById('slot-enviar').addEventListener('click', () => {
            if (!trocaAtivaId) return window.mostrarToast("⚠️ Você precisa enviar ou aceitar um convite primeiro!");
            
            const gridModal = document.getElementById('grid-cartas-modal');
            gridModal.innerHTML = '';
            let temRepetida = false;

            Object.keys(minhaColecao).forEach(id => {
                if (minhaColecao[id] > 1) {
                    temRepetida = true;
                    const info = INFO_CARTAS[id];
                    
                    const div = document.createElement('div');
                    div.className = "flex flex-col items-center cursor-pointer transform hover:scale-105 transition-all";
                    div.innerHTML = `
                        <div class="w-full aspect-[2.5/3.5] bg-gray-800 rounded-md overflow-hidden border-2 border-transparent hover:border-[#7a32a8]">
                            <img src="${info.imagem}" class="w-full h-full object-cover">
                        </div>
                        <span class="bg-[#7a32a8] text-white text-[9px] font-black px-2 py-0.5 rounded-full -mt-2 z-10 border border-[#dca3e8]">
                            ${minhaColecao[id]} CÓPIAS
                        </span>
                    `;
                    
                    div.addEventListener('click', async () => {
                        const campoDb = souRemetente ? 'cartaRemetente' : 'cartaDestinatario';
                        await updateDoc(doc(db, "trocas", trocaAtivaId), { [campoDb]: id });
                        document.getElementById('modal-selecao-carta').classList.add('hidden');
                    });
                    
                    gridModal.appendChild(div);
                }
            });

            if (!temRepetida) {
                gridModal.innerHTML = '<span class="text-xs text-[#7a32a8] font-black col-span-3 text-center mt-4">Você não tem nenhuma carta repetida!</span>';
            }
            
            document.getElementById('modal-selecao-carta').classList.remove('hidden');
        });

        // --- BOOT DO JOGADOR ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserUid = user.uid;
                currentUserName = user.displayName?.toUpperCase() || "JOGADOR";
                document.getElementById('player-name').innerText = currentUserName;
                
                const docSnap = await getDoc(doc(db, "users", user.uid));
                if (docSnap.exists()) {
                    const dados = docSnap.data();
                    minhaColecao = dados.colecao || {}; 
                    
                    document.getElementById('player-fragmentos').innerText = dados.fragmentos || 0;
                    atualizarVisualBarraXP(dados.xp || 0, dados.nivel || 1);
                    
                    if (dados.fotoPerfil) {
                        const img = document.getElementById('img-perfil-global');
                        img.src = dados.fotoPerfil; img.classList.remove('hidden');
                        document.getElementById('texto-sem-foto').classList.add('hidden');
                    }
                }

                const qTrocaAberta = query(collection(db, "trocas"), where("participantes", "array-contains", currentUserUid));
                const snapAberta = await getDocs(qTrocaAberta);
                
                snapAberta.forEach(d => {
                    const status = d.data().status;
                    if (status === 'escolhendo_cartas' || status === 'aguardando_pagamentos') {
                        trocaAtivaId = d.id;
                        souRemetente = (d.data().remetenteId === currentUserUid);
                        escutarMesaTroca(trocaAtivaId);
                    }
                });

                escutarConvitesRecebidos(); // Escuta passivamente para ativar o ping
            } else {
                window.location.href = "index.html";
            }
        });
    </script>
