<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supercards - Trocas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-image: url('fundotela.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        #toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            width: 90%;
            max-width: 350px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast-msg {
            background: #dca3e8;
            color: #7a32a8;
            border: 3px solid #7a32a8;
            padding: 12px 20px;
            border-radius: 9999px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.3);
            text-align: center;
            font-weight: 900;
            font-size: 0.85rem;
            animation: slideDown 0.3s ease-out;
            pointer-events: auto;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .amigo-selecionado {
            background-color: #22c55e !important; 
            color: #7a32a8 !important;
            border: 2px solid #7a32a8 !important;
            transform: scale(1.03);
        }
    </style>
</head>
<body class="h-[100dvh] p-4 flex justify-center overflow-hidden">

    <div id="toast-container"></div>

    <div class="w-full max-w-sm flex flex-col h-full relative">
        
        <!-- CABEÇALHO -->
        <header class="flex items-center gap-4 mt-4 mb-2 w-full">
            <div class="relative flex-shrink-0">
                <div class="bg-[#dca3e8] w-24 h-24 rounded-full flex items-center justify-center text-[#7a32a8] font-black text-xl shadow-lg border-2 border-[#bc7bd4] relative overflow-hidden">
                    <span id="texto-sem-foto">FOTO</span>
                    <img id="img-perfil-global" src="" class="hidden w-full h-full object-cover absolute inset-0">
                </div>
                <div class="absolute -bottom-2 left-1/2 transform -translate-x-1/2 bg-[#bc7bd4] w-8 h-8 rounded-full flex items-center justify-center shadow-md border-2 border-[#dca3e8] z-30">
                    <span id="player-level" class="text-[#7a32a8] font-black text-sm">--</span>
                </div>
            </div>

            <div class="flex flex-col flex-grow gap-2 justify-center">
                <div class="flex items-center gap-2 w-full">
                    <div class="bg-[#dca3e8] rounded-full px-3 py-2 flex items-center justify-center shadow-md flex-grow overflow-hidden">
                        <span id="player-name" class="text-[#7a32a8] font-black text-base tracking-wide uppercase truncate max-w-[130px]">JOGADOR</span>
                    </div>
                    <div class="bg-[#dca3e8] rounded-full px-3 py-2 flex items-center justify-center gap-1 shadow-md flex-shrink-0">
                        <span id="player-fragmentos" class="text-[#7a32a8] font-black text-sm">0</span>
                        <img src="fragmento.png" class="w-4 h-4 object-contain">
                    </div>
                </div>
                <div class="flex flex-col items-center mt-1 w-full">
                    <div class="w-full bg-transparent border border-[#dca3e8] rounded-full h-3 overflow-hidden shadow-inner">
                        <div id="barra-xp" class="bg-[#dca3e8] h-full transition-all duration-500" style="width: 0%;"></div>
                    </div>
                    <span id="texto-xp" class="text-[#dca3e8] text-[10px] font-bold mt-1">0/0 xp</span>
                </div>
            </div>
        </header>

        <h1 class="text-[#dca3e8] font-black text-xl text-center mb-2 drop-shadow-md uppercase flex items-center justify-center gap-2">
            TROCAS
        </h1>

        <main class="flex flex-col gap-3 flex-grow overflow-hidden pb-16">
            
            <!-- LINHA SUPERIOR -->
            <div class="grid grid-cols-2 gap-3 h-[45%]">
                
                <!-- Caixa: Selecionar Amigo -->
                <div class="bg-[#dca3e8] rounded-3xl p-3 flex flex-col shadow-xl border-2 border-[#bc7bd4]">
                    <span class="text-[#7a32a8] font-black text-[10px] text-center mb-2 uppercase leading-tight tracking-wider">sELECIONAR UM<br>AMIGO</span>
                    <input type="text" id="input-busca-amigo" placeholder="Buscar jogador..." class="mb-2 w-full bg-[#bc7bd4] text-[#7a32a8] placeholder-[#7a32a8]/70 font-black text-[9px] rounded-full px-3 py-1.5 outline-none border border-[#7a32a8]/30 focus:border-[#7a32a8] transition-colors shadow-inner flex-shrink-0">
                    <div id="lista-amigos" class="flex flex-col gap-2 flex-grow overflow-y-auto no-scrollbar mb-3 px-1"></div>
                    <button id="btn-enviar-convite" class="bg-[#7a32a8] hover:bg-purple-600 text-white font-black text-[10px] uppercase py-2 w-full rounded-full shadow-md transition-all hover:-translate-y-0.5 mt-auto border border-[#bc7bd4]/30 flex-shrink-0">
                        ENVIAR CONVITE
                    </button>
                </div>
                
                <!-- Caixa: Convites -->
                <div class="bg-[#dca3e8] rounded-3xl p-3 flex flex-col shadow-xl border-2 border-[#bc7bd4]">
                    <span class="text-[#7a32a8] font-black text-[11px] text-center mb-3 leading-tight tracking-wide">Convites</span>
                    <div id="lista-convites" class="flex flex-col gap-2 flex-grow overflow-y-auto no-scrollbar mb-3 px-1">
                        <span class="text-[10px] text-center text-[#7a32a8] mt-2 font-bold">Nenhum convite.</span>
                    </div>
                    
                    <div class="flex gap-2 w-full mt-auto flex-shrink-0">
                        <button id="btn-recusar-convite" class="bg-red-500 hover:bg-red-600 text-white font-black text-[10px] uppercase py-2 px-3 rounded-full shadow-md transition-all border border-red-700/30 opacity-50 cursor-not-allowed">
                            X
                        </button>
                        <button id="btn-aceitar-convite" class="bg-[#7a32a8] hover:bg-purple-600 text-white font-black text-[10px] uppercase py-2 flex-grow rounded-full shadow-md transition-all border border-[#bc7bd4]/30 opacity-50 cursor-not-allowed">
                            Aceitar
                        </button>
                    </div>
                </div>
            </div>

            <!-- LINHA INFERIOR: Mesa da Carta -->
            <div class="bg-[#dca3e8] rounded-3xl p-4 flex flex-col items-center shadow-xl border-2 border-[#bc7bd4] h-[55%] justify-between relative">
                
                <!-- Status da Troca -->
                <span id="status-troca" class="text-[#7a32a8] font-black text-[9px] uppercase tracking-wider absolute top-3 text-center w-full">MESA LIVRE</span>

                <div class="flex w-full justify-around items-center flex-grow mb-1 mt-4">
                    <!-- Slot ENVIAR (Sua Carta) -->
                    <div class="flex flex-col items-center gap-2">
                        <span class="text-[#7a32a8] font-black text-[12px] uppercase tracking-wide">ENVIAR:</span>
                        <div id="slot-enviar" class="w-[4.5rem] h-24 bg-gray-800 rounded-lg shadow-inner border-2 border-dashed border-[#7a32a8] flex items-center justify-center cursor-pointer hover:border-solid transition-all relative overflow-hidden">
                            <span id="icone-mais" class="text-[#bc7bd4] text-3xl font-bold">+</span>
                            <img id="img-minha-carta" src="" class="hidden w-full h-full object-cover">
                        </div>
                    </div>
                    
                    <!-- Slot Receber (Carta do Amigo) -->
                    <div class="flex flex-col items-center gap-2">
                        <span class="text-[#7a32a8] font-black text-[12px] tracking-wide">Receber:</span>
                        <div id="slot-receber" class="w-[4.5rem] h-24 bg-gray-800 rounded-lg shadow-inner border-2 border-[#bc7bd4] flex items-center justify-center opacity-70 relative overflow-hidden">
                            <span id="texto-aguardando" class="text-[#bc7bd4] text-[9px] font-black text-center px-1">Aguardando...</span>
                            <img id="img-carta-amigo" src="" class="hidden w-full h-full object-cover">
                        </div>
                    </div>
                </div>
                
                <button id="btn-efetivar-troca" class="bg-[#bc7bd4] text-[#7a32a8] font-black text-[12px] py-1.5 px-8 rounded-full shadow-md mt-2 opacity-50 cursor-not-allowed flex items-center justify-center gap-2 border border-[#7a32a8]/20 transition-all">
                    trocar <span id="custo-troca" class="font-normal text-[11px] flex items-center gap-0.5">-- <img src="fragmento.png" class="w-3.5 h-3.5 object-contain"></span>
                </button>
            </div>
        </main>

        <footer class="mt-auto flex justify-center pb-2 z-10 absolute bottom-4 left-0 w-full pointer-events-none">
            <button onclick="window.location.href='menu.html'" class="bg-[#7a32a8] hover:bg-purple-600 text-white font-black text-sm py-2 px-10 rounded-full shadow-lg transition-transform hover:-translate-y-1 pointer-events-auto border-2 border-[#dca3e8]">
                retornar
            </button>
        </footer>

        <!-- MODAL DE SELEÇÃO DE CARTA (Invisível até clicar no +) -->
        <div id="modal-selecao-carta" class="hidden fixed inset-0 bg-black/80 z-[100] flex flex-col items-center justify-center p-4 backdrop-blur-sm">
            <div class="bg-[#dca3e8] border-4 border-[#7a32a8] rounded-2xl p-4 w-full max-w-sm shadow-2xl flex flex-col h-[70%]">
                <h2 class="text-[#7a32a8] font-black text-lg mb-0.5 text-center uppercase">Escolha sua Carta</h2>
                <p class="text-center text-[10px] text-[#7a32a8] font-bold mb-4">MOSTRANDO APENAS CARTAS REPETIDAS (+1 CÓPIA)</p>
                
                <div id="grid-cartas-modal" class="grid grid-cols-3 gap-3 overflow-y-auto no-scrollbar flex-grow pb-2 content-start">
                    <!-- Cartas Repetidas Entram Aqui -->
                </div>
                
                <button onclick="document.getElementById('modal-selecao-carta').classList.add('hidden')" class="w-full mt-4 bg-red-500 hover:bg-red-600 text-white font-black py-2.5 rounded-full shadow-md transition-transform hover:scale-105 uppercase text-xs">
                    Cancelar
                </button>
            </div>
        </div>

    </div>

    <!-- SCRIPT DO FIREBASE E LÓGICA DA TROCA -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, query, where, getDocs, addDoc, updateDoc, deleteDoc, onSnapshot, serverTimestamp, orderBy, limit, startAt, endAt } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        
        // Importa o banco de cartas e raridades
        import { INFO_CARTAS } from './cartas.js';

        const firebaseConfig = {
          apiKey: "AIzaSyCU3lFTgfrDMaD9jwR7X7ivYPmGQh4VE1g",
          authDomain: "supercards-tcg.firebaseapp.com",
          projectId: "supercards-tcg",
          storageBucket: "supercards-tcg.firebasestorage.app",
          messagingSenderId: "862316380615",
          appId: "1:862316380615:web:b3f28056ebc967673999e2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Custos definidos por você
        const CUSTOS_TROCA = {
            'Comum': 10,
            'Rara': 40,
            'Lendária': 100,
            'Épica': 200
        };

        let currentUserUid = null;
        let currentUserName = "JOGADOR";
        let minhaColecao = {}; // Vai guardar as cópias para o modal

        let amigoSelecionadoId = null;
        let amigoSelecionadoNome = null;
        let conviteSelecionadoId = null;

        // Variáveis da Troca Ativa
        let trocaAtivaId = null;
        let souRemetente = false;
        let escutadorTroca = null;

        window.mostrarToast = function(mensagem) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast-msg';
            toast.innerHTML = mensagem;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s ease';
                setTimeout(() => toast.remove(), 500); 
            }, 3000);
        };

        // --- FUNÇÕES DE STATUS DO JOGADOR RECUPERADAS ---
        function calcularXPMaximo(nivel) {
            if (nivel >= 1 && nivel <= 5) return 200;
            if (nivel >= 6 && nivel <= 15) return 750;
            if (nivel >= 16 && nivel <= 25) return 1600;
            return 3000;
        }

        function atualizarVisualBarraXP(xpAtual, nivelAtual) {
            const xpMaximo = calcularXPMaximo(nivelAtual);
            const porcentagem = Math.min((xpAtual / xpMaximo) * 100, 100);
            document.getElementById('player-level').innerText = nivelAtual; 
            document.getElementById('texto-xp').innerText = `${xpAtual}/${xpMaximo} xp`;
            document.getElementById('barra-xp').style.width = `${porcentagem}%`;
        }

        function calcularCusto(id1, id2) {
            if (!id1 || !id2) return null;
            const r1 = INFO_CARTAS[id1].raridade;
            const r2 = INFO_CARTAS[id2].raridade;
            return Math.max(CUSTOS_TROCA[r1] || 10, CUSTOS_TROCA[r2] || 10);
        }

        // --- SISTEMA DE LISTAR E BUSCAR AMIGOS ---
        async function carregarListaAmigos(termoBusca = "") {
            const lista = document.getElementById('lista-amigos');
            lista.innerHTML = '<span class="text-[10px] text-center text-[#7a32a8] mt-2 font-bold">Buscando...</span>';
            
            try {
                const usersRef = collection(db, "users");
                let q = termoBusca.trim() === "" 
                    ? query(usersRef, limit(15)) 
                    : query(usersRef, orderBy("nomeDisplay"), startAt(termoBusca.toUpperCase()), endAt(termoBusca.toUpperCase() + "\uf8ff"), limit(15));

                const snap = await getDocs(q);
                lista.innerHTML = '';
                let temAlguem = false;

                snap.forEach(docSnap => {
                    if(docSnap.id !== currentUserUid) {
                        temAlguem = true;
                        const nomeAmigo = (docSnap.data().nomeDisplay || "JOGADOR").toUpperCase();
                        const divAmigo = document.createElement('div');
                        divAmigo.className = "bg-[#4ade80] text-[#7a32a8] border border-[#22c55e] text-[10px] py-2 px-3 rounded-full cursor-pointer text-center font-black tracking-wider transition-all shadow-sm flex-shrink-0";
                        divAmigo.innerText = nomeAmigo;
                        
                        divAmigo.addEventListener('click', () => {
                            Array.from(lista.children).forEach(el => el.classList.remove('amigo-selecionado'));
                            divAmigo.classList.add('amigo-selecionado');
                            amigoSelecionadoId = docSnap.id;
                            amigoSelecionadoNome = nomeAmigo;
                        });
                        lista.appendChild(divAmigo);
                    }
                });

                if(!temAlguem) lista.innerHTML = '<span class="text-[10px] text-center text-[#7a32a8] mt-2 font-bold">Nenhum jogador encontrado.</span>';
            } catch(e) {
                console.error(e);
            }
        }

        document.getElementById('input-busca-amigo').addEventListener('input', (event) => carregarListaAmigos(event.target.value));

        // --- BLOQUEIOS E BOTÕES DE CONVITE ---
        document.getElementById('btn-enviar-convite').addEventListener('click', async () => {
            if (trocaAtivaId) return window.mostrarToast("❌ Você já possui uma troca em andamento!");
            if (!amigoSelecionadoId) return window.mostrarToast("Selecione um amigo na lista primeiro!");

            try {
                await addDoc(collection(db, "trocas"), {
                    remetenteId: currentUserUid,
                    remetenteNome: currentUserName,
                    destinatarioId: amigoSelecionadoId,
                    destinatarioNome: amigoSelecionadoNome,
                    participantes: [currentUserUid, amigoSelecionadoId], // Array mágico pra busca
                    status: 'convite_pendente',
                    cartaRemetente: null,
                    cartaDestinatario: null,
                    pagoRemetente: false,
                    pagoDestinatario: false,
                    dataCriacao: serverTimestamp()
                });

                window.mostrarToast(`Convite enviado para ${amigoSelecionadoNome}!`);
                amigoSelecionadoId = null;
                amigoSelecionadoNome = null;
                Array.from(document.getElementById('lista-amigos').children).forEach(el => el.classList.remove('amigo-selecionado'));
            } catch (error) {
                console.error("Erro ao enviar:", error);
            }
        });

        function escutarConvitesRecebidos() {
            const q = query(collection(db, "trocas"), where("destinatarioId", "==", currentUserUid), where("status", "==", "convite_pendente"));
            
            onSnapshot(q, (snapshot) => {
                const lista = document.getElementById('lista-convites');
                lista.innerHTML = '';
                
                if(snapshot.empty) {
                    lista.innerHTML = '<span class="text-[10px] text-center text-[#7a32a8] mt-2 font-bold">Nenhum convite.</span>';
                    document.getElementById('btn-aceitar-convite').classList.add('opacity-50', 'cursor-not-allowed');
                    document.getElementById('btn-recusar-convite').classList.add('opacity-50', 'cursor-not-allowed');
                    conviteSelecionadoId = null;
                    return;
                }

                snapshot.forEach(docSnap => {
                    const divConvite = document.createElement('div');
                    divConvite.className = "bg-[#4ade80] text-[#7a32a8] border border-[#22c55e] text-[10px] py-2 px-3 rounded-full cursor-pointer text-center font-black tracking-wider transition-all shadow-sm animate-pulse flex-shrink-0";
                    divConvite.innerText = `${docSnap.data().remetenteNome}`; 
                    
                    divConvite.addEventListener('click', () => {
                        Array.from(lista.children).forEach(el => el.classList.remove('amigo-selecionado'));
                        divConvite.classList.remove('animate-pulse'); 
                        divConvite.classList.add('amigo-selecionado');
                        
                        conviteSelecionadoId = docSnap.id;
                        document.getElementById('btn-aceitar-convite').classList.remove('opacity-50', 'cursor-not-allowed');
                        document.getElementById('btn-recusar-convite').classList.remove('opacity-50', 'cursor-not-allowed');
                    });
                    lista.appendChild(divConvite);
                });
            });
        }

        // --- ACEITAR E RECUSAR CONVITES ---
        document.getElementById('btn-recusar-convite').addEventListener('click', async () => {
            if (!conviteSelecionadoId) return;
            try {
                await deleteDoc(doc(db, "trocas", conviteSelecionadoId));
                window.mostrarToast("Convite recusado.");
                conviteSelecionadoId = null;
            } catch (e) { console.error(e); }
        });

        document.getElementById('btn-aceitar-convite').addEventListener('click', async () => {
            if (trocaAtivaId) return window.mostrarToast("❌ Você já possui uma troca em andamento!");
            if (!conviteSelecionadoId) return;

            try {
                await updateDoc(doc(db, "trocas", conviteSelecionadoId), { status: 'escolhendo_cartas' });
                
                // Configura as variáveis globais
                trocaAtivaId = conviteSelecionadoId;
                souRemetente = false; // Se eu aceitei, eu sou o destinatário
                escutarMesaTroca(trocaAtivaId);
                
                window.mostrarToast("✅ Troca iniciada! Selecione sua carta.");
                conviteSelecionadoId = null;
            } catch (e) { console.error(e); }
        });

        // --- MESA DE TROCA (TEMPO REAL E CÁLCULO) ---
        function escutarMesaTroca(idDaTroca) {
            if (escutadorTroca) escutadorTroca(); // Cancela o anterior se tiver
            
            document.getElementById('status-troca').innerText = "ESCOLHENDO CARTAS...";

            escutadorTroca = onSnapshot(doc(db, "trocas", idDaTroca), (docSnap) => {
                if (!docSnap.exists()) {
                    resetarMesa();
                    return;
                }
                
                const troca = docSnap.data();
                
                const minhaCarta = souRemetente ? troca.cartaRemetente : troca.cartaDestinatario;
                const cartaAmigo = souRemetente ? troca.cartaDestinatario : troca.cartaRemetente;

                // Atualiza Slot Enviar (Minha)
                if (minhaCarta) {
                    document.getElementById('icone-mais').classList.add('hidden');
                    document.getElementById('img-minha-carta').src = INFO_CARTAS[minhaCarta].imagem;
                    document.getElementById('img-minha-carta').classList.remove('hidden');
                }

                // Atualiza Slot Receber (Amigo)
                if (cartaAmigo) {
                    document.getElementById('texto-aguardando').classList.add('hidden');
                    document.getElementById('img-carta-amigo').src = INFO_CARTAS[cartaAmigo].imagem;
                    document.getElementById('img-carta-amigo').classList.remove('hidden');
                } else {
                    document.getElementById('texto-aguardando').innerText = `${souRemetente ? troca.destinatarioNome : troca.remetenteNome} escolhendo...`;
                }

                // Calcula o custo se os dois escolheram
                if (minhaCarta && cartaAmigo) {
                    const custo = calcularCusto(minhaCarta, cartaAmigo);
                    document.getElementById('custo-troca').innerHTML = `${custo} <img src="fragmento.png" class="w-3.5 h-3.5 object-contain">`;
                    
                    document.getElementById('btn-efetivar-troca').classList.remove('opacity-50', 'cursor-not-allowed', 'bg-[#bc7bd4]');
                    document.getElementById('btn-efetivar-troca').classList.add('bg-[#7a32a8]', 'text-white', 'hover:scale-105');
                    document.getElementById('status-troca').innerText = "CARTAS SELECIONADAS!";
                }
            });
        }

        function resetarMesa() {
            trocaAtivaId = null;
            document.getElementById('status-troca').innerText = "MESA LIVRE";
            document.getElementById('icone-mais').classList.remove('hidden');
            document.getElementById('img-minha-carta').classList.add('hidden');
            document.getElementById('texto-aguardando').innerText = "Aguardando...";
            document.getElementById('texto-aguardando').classList.remove('hidden');
            document.getElementById('img-carta-amigo').classList.add('hidden');
            
            document.getElementById('custo-troca').innerHTML = `-- <img src="fragmento.png" class="w-3.5 h-3.5 object-contain">`;
            document.getElementById('btn-efetivar-troca').className = "bg-[#bc7bd4] text-[#7a32a8] font-black text-[12px] py-1.5 px-8 rounded-full shadow-md mt-2 opacity-50 cursor-not-allowed flex items-center justify-center gap-2 border border-[#7a32a8]/20 transition-all";
        }

        // --- SISTEMA DO MODAL DE CARTAS ---
        document.getElementById('slot-enviar').addEventListener('click', () => {
            if (!trocaAtivaId) return window.mostrarToast("⚠️ Você precisa enviar ou aceitar um convite primeiro!");
            
            const gridModal = document.getElementById('grid-cartas-modal');
            gridModal.innerHTML = '';
            let temRepetida = false;

            Object.keys(minhaColecao).forEach(id => {
                if (minhaColecao[id] > 1) {
                    temRepetida = true;
                    const info = INFO_CARTAS[id];
                    
                    const div = document.createElement('div');
                    div.className = "flex flex-col items-center cursor-pointer transform hover:scale-105 transition-all";
                    div.innerHTML = `
                        <div class="w-full aspect-[2.5/3.5] bg-gray-800 rounded-md overflow-hidden border-2 border-transparent hover:border-[#7a32a8]">
                            <img src="${info.imagem}" class="w-full h-full object-cover">
                        </div>
                        <span class="bg-[#7a32a8] text-white text-[9px] font-black px-2 py-0.5 rounded-full -mt-2 z-10 border border-[#dca3e8]">
                            ${minhaColecao[id]} CÓPIAS
                        </span>
                    `;
                    
                    div.addEventListener('click', async () => {
                        const campoDb = souRemetente ? 'cartaRemetente' : 'cartaDestinatario';
                        await updateDoc(doc(db, "trocas", trocaAtivaId), { [campoDb]: id });
                        document.getElementById('modal-selecao-carta').classList.add('hidden');
                    });
                    
                    gridModal.appendChild(div);
                }
            });

            if (!temRepetida) {
                gridModal.innerHTML = '<span class="text-xs text-[#7a32a8] font-black col-span-3 text-center mt-4">Você não tem nenhuma carta repetida!</span>';
            }
            
            document.getElementById('modal-selecao-carta').classList.remove('hidden');
        });

        // --- BOOT DO JOGADOR ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserUid = user.uid;
                currentUserName = user.displayName?.toUpperCase() || "JOGADOR";
                document.getElementById('player-name').innerText = currentUserName;
                
                const docSnap = await getDoc(doc(db, "users", user.uid));
                if (docSnap.exists()) {
                    const dados = docSnap.data();
                    minhaColecao = dados.colecao || {}; 
                    
                    document.getElementById('player-fragmentos').innerText = dados.fragmentos || 0;
                    atualizarVisualBarraXP(dados.xp || 0, dados.nivel || 1); // <-- XP CORRIGIDO E FUNCIONANDO
                    
                    if (dados.fotoPerfil) {
                        const img = document.getElementById('img-perfil-global');
                        img.src = dados.fotoPerfil; img.classList.remove('hidden');
                        document.getElementById('texto-sem-foto').classList.add('hidden');
                    }
                }

                const qTrocaAberta = query(collection(db, "trocas"), where("participantes", "array-contains", currentUserUid));
                const snapAberta = await getDocs(qTrocaAberta);
                
                snapAberta.forEach(d => {
                    const status = d.data().status;
                    if (status === 'escolhendo_cartas' || status === 'aguardando_pagamentos') {
                        trocaAtivaId = d.id;
                        souRemetente = (d.data().remetenteId === currentUserUid);
                        escutarMesaTroca(trocaAtivaId);
                    }
                });

                carregarListaAmigos();
                escutarConvitesRecebidos();
            } else {
                window.location.href = "index.html";
            }
        });
    </script>
</body>
</html>
